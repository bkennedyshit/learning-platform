<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 6; fill: var(--background-secondary, #161b22); transition: all 0.2s; cursor: pointer; }
    .box:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); transform: translateY(-2px); }
    .react-color { stroke: #61dafb; stroke-width: 2; animation: float 3s infinite ease-in-out; }
    .vue-color { stroke: #42b883; stroke-width: 2; animation: float 3.2s infinite ease-in-out 0.2s; }
    .svelte-color { stroke: #ff3e00; stroke-width: 2; animation: float 3.4s infinite ease-in-out 0.4s; }
    .solid-color { stroke: #4f88c6; stroke-width: 2; animation: float 3.6s infinite ease-in-out 0.6s; }
    .flow-arrow { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; marker-end: url(#fw-arrow); }
    .section-box { stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 8; fill: none; stroke-dasharray: 4,3; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>
  <defs>
    <marker id="fw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" class="title" text-anchor="middle">Frontend Framework Reactivity Models</text>

  <!-- React -->
  <rect x="15" y="45" width="160" height="160" class="box react-color"/>
  <text x="95" y="68" class="label" text-anchor="middle" font-weight="bold" fill="#61dafb">React</text>
  <text x="95" y="85" class="sublabel" text-anchor="middle">Virtual DOM Diffing</text>
  <text x="30" y="105" class="sublabel">State changes →</text>
  <text x="30" y="118" class="sublabel">Re-render component →</text>
  <text x="30" y="131" class="sublabel">Diff VDOM trees →</text>
  <text x="30" y="144" class="sublabel">Patch real DOM</text>
  <rect x="30" y="155" width="130" height="20" rx="3" fill="none" stroke="#61dafb" stroke-width="1"/>
  <text x="95" y="169" class="sublabel" text-anchor="middle" fill="#61dafb">Overhead: diffing</text>
  <text x="95" y="192" class="sublabel" text-anchor="middle">Bundle: ~45KB</text>

  <!-- Vue -->
  <rect x="185" y="45" width="160" height="160" class="box vue-color"/>
  <text x="265" y="68" class="label" text-anchor="middle" font-weight="bold" fill="#42b883">Vue 3</text>
  <text x="265" y="85" class="sublabel" text-anchor="middle">Proxy-Based Signals</text>
  <text x="200" y="105" class="sublabel">Reactive refs →</text>
  <text x="200" y="118" class="sublabel">Track dependencies →</text>
  <text x="200" y="131" class="sublabel">Notify watchers →</text>
  <text x="200" y="144" class="sublabel">Update specific nodes</text>
  <rect x="200" y="155" width="130" height="20" rx="3" fill="none" stroke="#42b883" stroke-width="1"/>
  <text x="265" y="169" class="sublabel" text-anchor="middle" fill="#42b883">Fine-grained</text>
  <text x="265" y="192" class="sublabel" text-anchor="middle">Bundle: ~33KB</text>

  <!-- Svelte -->
  <rect x="355" y="45" width="160" height="160" class="box svelte-color"/>
  <text x="435" y="68" class="label" text-anchor="middle" font-weight="bold" fill="#ff3e00">Svelte 5</text>
  <text x="435" y="85" class="sublabel" text-anchor="middle">Compile-Time Runes</text>
  <text x="370" y="105" class="sublabel">$state() runes →</text>
  <text x="370" y="118" class="sublabel">Compiler analyzes →</text>
  <text x="370" y="131" class="sublabel">Generates update code →</text>
  <text x="370" y="144" class="sublabel">Direct DOM mutations</text>
  <rect x="370" y="155" width="130" height="20" rx="3" fill="none" stroke="#ff3e00" stroke-width="1"/>
  <text x="435" y="169" class="sublabel" text-anchor="middle" fill="#ff3e00">No runtime overhead</text>
  <text x="435" y="192" class="sublabel" text-anchor="middle">Bundle: ~2KB + output</text>

  <!-- Solid -->
  <rect x="525" y="45" width="160" height="160" class="box solid-color"/>
  <text x="605" y="68" class="label" text-anchor="middle" font-weight="bold" fill="#4f88c6">Solid</text>
  <text x="605" y="85" class="sublabel" text-anchor="middle">Fine-Grained Signals</text>
  <text x="540" y="105" class="sublabel">createSignal() →</text>
  <text x="540" y="118" class="sublabel">Track reads →</text>
  <text x="540" y="131" class="sublabel">Signal changes →</text>
  <text x="540" y="144" class="sublabel">Only bound nodes update</text>
  <rect x="540" y="155" width="130" height="20" rx="3" fill="none" stroke="#4f88c6" stroke-width="1"/>
  <text x="605" y="169" class="sublabel" text-anchor="middle" fill="#4f88c6">Surgical updates</text>
  <text x="605" y="192" class="sublabel" text-anchor="middle">Bundle: ~7KB</text>

  <!-- Convergence: Signals -->
  <rect x="100" y="225" width="500" height="70" class="section-box"/>
  <text x="350" y="245" class="label" text-anchor="middle" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">🔄 The Signals Convergence (2024–2026)</text>
  <text x="350" y="265" class="sublabel" text-anchor="middle">All frameworks converging on reactive primitives that track dependencies automatically</text>
  <text x="350" y="280" class="sublabel" text-anchor="middle">TC39 Proposal: native Signal primitive may become part of JavaScript itself</text>

  <!-- Decision guide -->
  <text x="350" y="320" class="label" text-anchor="middle" font-weight="bold">When to Choose</text>

  <rect x="15" y="330" width="160" height="45" class="box"/>
  <text x="95" y="348" class="sublabel" text-anchor="middle" font-weight="bold">React</text>
  <text x="95" y="363" class="sublabel" text-anchor="middle">Max ecosystem + hiring</text>

  <rect x="185" y="330" width="160" height="45" class="box"/>
  <text x="265" y="348" class="sublabel" text-anchor="middle" font-weight="bold">Vue</text>
  <text x="265" y="363" class="sublabel" text-anchor="middle">Progressive + structured</text>

  <rect x="355" y="330" width="160" height="45" class="box"/>
  <text x="435" y="348" class="sublabel" text-anchor="middle" font-weight="bold">Svelte</text>
  <text x="435" y="363" class="sublabel" text-anchor="middle">Smallest bundle + DX</text>

  <rect x="525" y="330" width="160" height="45" class="box"/>
  <text x="605" y="348" class="sublabel" text-anchor="middle" font-weight="bold">Solid</text>
  <text x="605" y="363" class="sublabel" text-anchor="middle">Best perf + React-like</text>

  <text x="350" y="393" class="sublabel" text-anchor="middle">See [[Track 08 App Architectures]] for deep dives into each framework</text>
</svg>
