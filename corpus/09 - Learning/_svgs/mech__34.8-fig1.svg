<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);transition: fill 0.2s ease;}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;transition:all 0.3s ease;}
    .box:hover{stroke:var(--interactive-accent,#58a6ff);fill:rgba(88,166,255,0.02);filter:drop-shadow(0 0 4px rgba(88,166,255,0.15));}
    .accent{fill:none;stroke:var(--interactive-accent,#58a6ff);stroke-width:1.5;}
    
    /* Continuous pipeline signal flow */
    @keyframes flow {
      to { stroke-dashoffset: -20; }
    }
    .signal-flow {
      stroke-dasharray: 5 4;
      animation: flow 2.5s linear infinite;
    }
    
    /* Interactive block hover glows */
    .block {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .block:hover {
      fill: rgba(88,166,255,0.05) !important;
      stroke: var(--interactive-accent,#58a6ff) !important;
      stroke-width: 1.8px !important;
      filter: drop-shadow(0 0 4px var(--interactive-accent,#58a6ff));
    }
    
    /* Sequential signal loop highlight */
    @keyframes step-pulse {
      0%, 100% { fill: rgba(88,166,255,0.04); stroke: var(--interactive-accent,#58a6ff); }
      15%, 45% { fill: rgba(255,217,61,0.15); stroke: #ffd93d; filter: drop-shadow(0 0 4px #ffd93d); }
      60% { fill: rgba(88,166,255,0.04); stroke: var(--interactive-accent,#58a6ff); }
    }
    .step-e { transition: all 0.3s ease; cursor: pointer; }
    .step-e:hover { filter: brightness(1.4) drop-shadow(0 0 5px var(--interactive-accent,#58a6ff)) !important; stroke-width: 1.8px !important; }
    .step-e1 { animation: step-pulse 12s infinite; }
    .step-e2 { animation: step-pulse 12s infinite 2s; }
    .step-e3 { animation: step-pulse 12s infinite 4s; }
    .step-e4 { animation: step-pulse 12s infinite 6s; }
    .step-e5 { animation: step-pulse 12s infinite 8s; }
    .step-e6 { animation: step-pulse 12s infinite 10s; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 2 L8 5 L0 8z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>
  <text x="360" y="22" class="title" text-anchor="middle">34.8 — Mechatronics &amp; CAD-to-Fabrication Pipeline: System Design &amp; Signal Flow</text>
  
  <!-- Left: CAD Design -->
  <g class="block">
    <rect x="20" y="35" width="200" height="205" fill="var(--background-secondary,#161b22)" stroke="var(--text-muted,#8b949e)" stroke-width="1" rx="4"/>
    <text x="120" y="52" class="label" text-anchor="middle" font-weight="bold">1. Mechanical CAD (FreeCAD)</text>
  </g>
  <text x="30" y="70" class="sub" font-weight="bold">• Parameters spreadsheet</text>
  <text x="30" y="82" class="sub">• DFM check (tolerances, radii)</text>
  <text x="30" y="94" class="sub">• Assembly constraint solver</text>
  <text x="30" y="106" class="sub">• Technical drawing (TechDraw)</text>
  <text x="30" y="122" class="sub" font-weight="bold">Export Formats:</text>
  <text x="30" y="134" class="mono">.STEP — 3D solid (neutral CAD)</text>
  <text x="30" y="146" class="mono">.STL/.3MF — Mesh (3D prints)</text>
  <text x="30" y="158" class="mono">.DXF — 2D vector (laser, waterjet)</text>
  <text x="30" y="170" class="mono">.SVG — 2D vector web graphics</text>
  <text x="30" y="184" class="sub" font-weight="bold">Topological naming check:</text>
  <text x="30" y="196" class="sub">Are sketches attached to planes?</text>
  <text x="30" y="208" class="sub">Are variables central?</text>
  <text x="30" y="220" class="sub">Are fillets/chamfers last?</text>
  
  <!-- Connecting flow 1 (Continuous animated flow) -->
  <line x1="220" y1="130" x2="255" y2="130" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.5" class="signal-flow" marker-end="url(#arr)"/>
  
  <!-- Middle: Fabrication CAM -->
  <g class="block">
    <rect x="255" y="35" width="210" height="205" fill="var(--background-secondary,#161b22)" stroke="var(--text-muted,#8b949e)" stroke-width="1" rx="4"/>
    <text x="360" y="52" class="label" text-anchor="middle" font-weight="bold">2. Digital Fabrication (CAM)</text>
  </g>
  <text x="265" y="70" class="sub" font-weight="bold">CAM Toolpaths:</text>
  <text x="265" y="82" class="sub">• Slicing (PrusaSlicer/Bambu)</text>
  <text x="265" y="94" class="sub">• Milling (Path WB / Fusion CAM)</text>
  <text x="265" y="106" class="sub">• Laser nesting (LightBurn)</text>
  <text x="265" y="122" class="sub" font-weight="bold">Post-Processor Dialects:</text>
  <text x="265" y="134" class="mono">Marlin/Klipper — 3D prints</text>
  <text x="265" y="146" class="mono">GRBL — small CNC, laser cutters</text>
  <text x="265" y="158" class="mono">LinuxCNC — large custom mills</text>
  <text x="265" y="170" class="mono">Fanuc / Haas — industrial standard</text>
  <text x="265" y="184" class="sub" font-weight="bold">Safety &amp; Simulation:</text>
  <text x="265" y="196" class="sub">Dry run Z-offset above bed.</text>
  <text x="265" y="208" class="sub">Verify tools lengths in offsets.</text>
  <text x="265" y="220" class="sub">CAMotics verification pass.</text>
  
  <!-- Connecting flow 2 (Continuous animated flow) -->
  <line x1="465" y1="130" x2="500" y2="130" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.5" class="signal-flow" marker-end="url(#arr)"/>
  
  <!-- Right: Mechatronics Assembly -->
  <g class="block">
    <rect x="500" y="35" width="200" height="205" fill="var(--background-secondary,#161b22)" stroke="var(--text-muted,#8b949e)" stroke-width="1" rx="4"/>
    <text x="600" y="52" class="label" text-anchor="middle" font-weight="bold">3. Physical Mechatronics</text>
  </g>
  <text x="510" y="70" class="sub" font-weight="bold">Actuators &amp; Control:</text>
  <text x="510" y="82" class="sub">• NEMA steppers (17/23) + TMC</text>
  <text x="510" y="94" class="sub">• DC motors + encoders (PID)</text>
  <text x="510" y="106" class="sub">• Brushless gimbal + FOC</text>
  <text x="510" y="122" class="sub" font-weight="bold">Sensors:</text>
  <text x="510" y="134" class="mono">Limit switches — homing</text>
  <text x="510" y="146" class="mono">IMU (MPU6050) — orientation</text>
  <text x="510" y="158" class="mono">Hall effect / optical encoders</text>
  <text x="510" y="170" class="mono">ToF / ultrasonic rangefinders</text>
  <text x="510" y="184" class="sub" font-weight="bold">Power &amp; EMI Isolation:</text>
  <text x="510" y="196" class="sub">Separate logic vs power rails.</text>
  <text x="510" y="208" class="sub">Flyback diodes on coils.</text>
  <text x="510" y="220" class="sub">Optocouplers protect MCU.</text>
  
  <!-- Bottom: Mechatronic Control Loop -->
  <rect x="20" y="255" width="680" height="150" class="box" rx="4"/>
  <text x="360" y="273" class="label" text-anchor="middle" font-weight="bold">Closed-Loop Mechatronic Control &amp; Signal Pipeline (PID)</text>
  
  <!-- Control loop steps (Interactive sequential pulse) -->
  <rect x="35" y="283" width="95" height="35" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="3" class="step-e step-e1"/>
  <text x="82" y="300" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">1. Setpoint (SP)</text>
  <text x="82" y="312" class="sub" text-anchor="middle">Desired state</text>
  
  <rect x="145" y="283" width="95" height="35" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="3" class="step-e step-e2"/>
  <text x="192" y="300" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">2. Comparator</text>
  <text x="192" y="312" class="sub" text-anchor="middle">Error e(t) = SP - PV</text>
  
  <rect x="255" y="283" width="95" height="35" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="3" class="step-e step-e3"/>
  <text x="302" y="300" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">3. PID Controller</text>
  <text x="302" y="312" class="sub" text-anchor="middle">P · I · D math calc</text>
  
  <rect x="365" y="283" width="95" height="35" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="3" class="step-e step-e4"/>
  <text x="412" y="300" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">4. Actuation</text>
  <text x="412" y="312" class="sub" text-anchor="middle">PWM to H-Bridge/FET</text>
  
  <rect x="475" y="283" width="95" height="35" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="3" class="step-e step-e5"/>
  <text x="522" y="300" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">5. Physical Sys</text>
  <text x="522" y="312" class="sub" text-anchor="middle">Motor / linkage rotates</text>
  
  <rect x="585" y="283" width="100" height="35" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="3" class="step-e step-e6"/>
  <text x="635" y="300" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">6. Sensor (PV)</text>
  <text x="635" y="312" class="sub" text-anchor="middle">Encoder feedback</text>
  
  <line x1="130" y1="300" x2="145" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="240" y1="300" x2="255" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="350" y1="300" x2="365" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="460" y1="300" x2="475" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="570" y1="300" x2="475" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="0" /> <!-- spacer -->
  <line x1="570" y1="300" x2="585" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  
  <!-- Closed loop feedback line -->
  <path d="M635 318 L635 340 L82 340 L82 318" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="336" class="sub" text-anchor="middle" style="fill:var(--interactive-accent,#58a6ff); font-weight:bold;">FEEDBACK LOOP (Process Value - PV)</text>
  
  <text x="360" y="356" class="sub" text-anchor="middle">PID Tuning: increase Kp for rise speed → increase Kd to dampen overshoot → increase Ki to eliminate steady-state offsets.</text>
  <text x="360" y="370" class="sub" text-anchor="middle">EMI reduction: Twist stepper wire pairs (A+/A-, B+/B-) and shield signal wires. Keep high-current paths separate from microprocessor grounds.</text>
  <text x="360" y="384" class="sub" text-anchor="middle">Safety critical: Hardware emergency stop (E-stop) should physically cut motor power lines, not just alert microcontrollers!</text>
  <text x="360" y="398" class="sub" text-anchor="middle">Firmware options: Klipper (klipper3d.org) · RepRapFirmware · GRBL (github.com/gnea/grbl) · Custom C++/Arduino</text>
</svg>
