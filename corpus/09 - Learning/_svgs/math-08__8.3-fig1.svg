<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="dyn-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .dyn-axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .dyn-worldline { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; fill: none; }
    .dyn-tangent { stroke: var(--text-accent, #79c0ff); stroke-width: 2; fill: none; marker-end: url(#dyn-arrow); }
    .dyn-force { stroke: #ff6b6b; stroke-width: 2.5; fill: none; marker-end: url(#dyn-arrow); }
    .dyn-label { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .dyn-math { font-family: 'Latin Modern Math', serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-style: italic; }
    .dyn-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    .dyn-dot { fill: var(--text-accent, #79c0ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .dyn-grid { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.3; }
    
    /* Animations */
    .dyn-worldline { stroke-dasharray: 600; stroke-dashoffset: 600; animation: traceCurve 4s infinite ease-in-out; }
    @keyframes traceCurve { 0% { stroke-dashoffset: 600; } 60%, 100% { stroke-dashoffset: 0; } }
    .dyn-force { animation: pulseForce 2s infinite alternate; }
    @keyframes pulseForce { 
      from { filter: drop-shadow(0 0 2px #ff6b6b); } 
      to { filter: drop-shadow(0 0 8px #ff6b6b); } 
    }
    .dyn-tangent { animation: pulseTangent 2s infinite alternate; }
    @keyframes pulseTangent { 
      from { filter: drop-shadow(0 0 2px var(--text-accent, #79c0ff)); } 
      to { filter: drop-shadow(0 0 8px var(--text-accent, #79c0ff)); } 
    }
  </style>

  <!-- Grid -->
  <g class="dyn-grid">
    <line x1="80" y1="50" x2="80" y2="350"/><line x1="160" y1="50" x2="160" y2="350"/>
    <line x1="240" y1="50" x2="240" y2="350"/><line x1="320" y1="50" x2="320" y2="350"/>
    <line x1="400" y1="50" x2="400" y2="350"/>
    <line x1="40" y1="100" x2="450" y2="100"/><line x1="40" y1="150" x2="450" y2="150"/>
    <line x1="40" y1="200" x2="450" y2="200"/><line x1="40" y1="250" x2="450" y2="250"/>
    <line x1="40" y1="300" x2="450" y2="300"/>
  </g>

  <!-- Axes -->
  <line x1="40" y1="350" x2="40" y2="30" class="dyn-axis" marker-end="url(#dyn-arrow)"/>
  <line x1="40" y1="350" x2="460" y2="350" class="dyn-axis" marker-end="url(#dyn-arrow)"/>
  <text x="50" y="25" class="dyn-label">ct</text>
  <text x="465" y="355" class="dyn-label">x</text>

  <!-- Accelerating worldline (hyperbolic motion) -->
  <path d="M 120 340 C 130 280 160 200 220 140 C 280 80 350 60 420 55" class="dyn-worldline"/>
  
  <!-- Tangent vector (4-velocity) at midpoint -->
  <circle cx="220" cy="140" r="4" class="dyn-dot"/>
  <line x1="220" y1="140" x2="260" y2="80" class="dyn-tangent"/>
  <text x="268" y="75" class="dyn-label" fill="var(--text-accent, #79c0ff)">U^μ (4-velocity)</text>

  <!-- 4-force (perpendicular to U) -->
  <line x1="220" y1="140" x2="290" y2="160" class="dyn-force"/>
  <text x="295" y="165" class="dyn-label" fill="#ff6b6b">f^μ (4-force)</text>

  <!-- Orthogonality indicator -->
  <rect x="228" y="138" width="8" height="8" fill="none" stroke="var(--text-muted, #8b949e)" stroke-width="1" transform="rotate(-25, 228, 138)"/>

  <!-- Formula boxes -->
  <rect x="470" y="50" width="120" height="140" class="dyn-box"/>
  <text x="530" y="75" class="dyn-math" text-anchor="middle">f^μ = dp^μ/dτ</text>
  <text x="530" y="105" class="dyn-math" text-anchor="middle">f_μ U^μ = 0</text>
  <text x="530" y="135" class="dyn-math" text-anchor="middle">p^μ = mU^μ</text>
  <text x="530" y="165" class="dyn-math" text-anchor="middle">f^μ = ma^μ</text>

  <!-- Proper time ticks along worldline -->
  <circle cx="145" cy="290" r="3" class="dyn-dot"/><text x="150" y="295" class="dyn-label" font-size="10">τ₁</text>
  <circle cx="175" cy="220" r="3" class="dyn-dot"/><text x="180" y="225" class="dyn-label" font-size="10">τ₂</text>
  <circle cx="220" cy="140" r="3" class="dyn-dot"/><text x="205" y="135" class="dyn-label" font-size="10">τ₃</text>
  <circle cx="310" cy="80" r="3" class="dyn-dot"/><text x="315" y="85" class="dyn-label" font-size="10">τ₄</text>
</svg>