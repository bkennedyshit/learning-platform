<svg viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:650px;height:auto;">
  <defs>
    <marker id="att-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .att-inertial { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
    .att-body { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .att-omega { stroke: var(--text-accent, #79c0ff); stroke-width: 2.5; fill: none; }
    .att-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .att-accent { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .att-sc { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 2; }
    .att-panel { fill: var(--interactive-accent, #58a6ff); opacity: 0.2; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; }
    .att-angle { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; fill: none; }
    .att-omega { animation: spin 4s linear infinite; transform-origin: 325px 225px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <!-- Inertial frame axes -->
  <line x1="100" y1="350" x2="250" y2="350" class="att-inertial" marker-end="url(#att-arrow)"/>
  <line x1="100" y1="350" x2="100" y2="200" class="att-inertial" marker-end="url(#att-arrow)"/>
  <line x1="100" y1="350" x2="40" y2="400" class="att-inertial" marker-end="url(#att-arrow)"/>
  <text x="255" y="355" class="att-label">X (inertial)</text>
  <text x="100" y="190" class="att-label" text-anchor="middle">Z (inertial)</text>
  <text x="30" y="410" class="att-label">Y</text>

  <!-- Spacecraft body (box) -->
  <rect x="280" y="180" width="90" height="90" rx="4" class="att-sc"/>
  <!-- Solar panels -->
  <rect x="200" y="210" width="80" height="20" rx="2" class="att-panel"/>
  <rect x="370" y="210" width="80" height="20" rx="2" class="att-panel"/>

  <!-- Body frame axes -->
  <line x1="325" y1="225" x2="475" y2="200" class="att-body" marker-end="url(#att-arrow)"/>
  <text x="480" y="195" class="att-accent">x_b</text>
  <line x1="325" y1="225" x2="325" y2="100" class="att-body" marker-end="url(#att-arrow)"/>
  <text x="330" y="90" class="att-accent">z_b</text>
  <line x1="325" y1="225" x2="270" y2="290" class="att-body" marker-end="url(#att-arrow)"/>
  <text x="255" y="300" class="att-accent">y_b</text>

  <!-- Angular velocity vector -->
  <line x1="325" y1="225" x2="380" y2="130" class="att-omega" marker-end="url(#att-arrow)"/>
  <text x="385" y="125" class="att-label" fill="var(--text-accent, #79c0ff)" font-weight="bold">ω</text>

  <!-- Euler angle arcs -->
  <path d="M 160 350 A 60 60 0 0 0 180 310" class="att-angle"/>
  <text x="175" y="325" class="att-label" fill="var(--text-accent, #79c0ff)">ψ (yaw)</text>

  <path d="M 325 180 A 30 30 0 0 0 345 165" class="att-angle"/>
  <text x="350" y="160" class="att-label" fill="var(--text-accent, #79c0ff)">θ (pitch)</text>

  <path d="M 400 200 A 25 25 0 0 0 410 215" class="att-angle"/>
  <text x="415" y="220" class="att-label" fill="var(--text-accent, #79c0ff)">φ (roll)</text>

  <!-- Info box -->
  <rect x="430" y="300" width="210" height="140" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="535" y="320" class="att-accent" text-anchor="middle">Euler's Equations</text>
  <text x="440" y="342" class="att-label">I₁ω̇₁ = (I₂−I₃)ω₂ω₃ + M₁</text>
  <text x="440" y="362" class="att-label">I₂ω̇₂ = (I₃−I₁)ω₃ω₁ + M₂</text>
  <text x="440" y="382" class="att-label">I₃ω̇₃ = (I₁−I₂)ω₁ω₂ + M₃</text>
  <text x="440" y="410" class="att-label">Quaternion: q̇ = ½q⊗ω</text>
  <text x="440" y="430" class="att-label">||q|| = 1 (unit constraint)</text>
</svg>