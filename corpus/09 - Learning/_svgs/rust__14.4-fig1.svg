<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .box { fill: none; stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; }
    .box-ok { fill: none; stroke: #2ecc71; stroke-width: 2; rx: 6; }
    .box-err { fill: none; stroke: #e74c3c; stroke-width: 2; rx: 6; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .label-bold { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .arrow-ok { stroke: #2ecc71; stroke-width: 2; fill: none; marker-end: url(#arr-ok); }
    .arrow-err { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arr-err); }
    .decision { fill: none; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2ecc71"/>
    </marker>
    <marker id="arr-err" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <text x="300" y="22" class="title" text-anchor="middle">Error Handling: The Railway Pattern</text>

  <!-- Happy path -->
  <text x="50" y="55" class="label" fill="#2ecc71" font-weight="bold">Ok Track →</text>
  <rect x="120" y="40" width="90" height="30" class="box-ok"/>
  <text x="165" y="60" class="label-bold" text-anchor="middle">read_file?</text>
  <line x1="210" y1="55" x2="240" y2="55" class="arrow-ok"/>
  <rect x="240" y="40" width="90" height="30" class="box-ok"/>
  <text x="285" y="60" class="label-bold" text-anchor="middle">parse?</text>
  <line x1="330" y1="55" x2="360" y2="55" class="arrow-ok"/>
  <rect x="360" y="40" width="90" height="30" class="box-ok"/>
  <text x="405" y="60" class="label-bold" text-anchor="middle">validate?</text>
  <line x1="450" y1="55" x2="480" y2="55" class="arrow-ok"/>
  <rect x="480" y="40" width="80" height="30" class="box-ok"/>
  <text x="520" y="60" class="label-bold" text-anchor="middle">Ok(T)</text>

  <!-- Error diversions -->
  <line x1="165" y1="70" x2="165" y2="110" class="arrow-err"/>
  <line x1="285" y1="70" x2="285" y2="110" class="arrow-err"/>
  <line x1="405" y1="70" x2="405" y2="110" class="arrow-err"/>

  <text x="50" y="130" class="label" fill="#e74c3c" font-weight="bold">Err Track →</text>
  <rect x="120" y="115" width="430" height="30" class="box-err"/>
  <text x="335" y="135" class="label-bold" text-anchor="middle">Err(E) — early return via ? operator</text>

  <!-- Decision tree -->
  <text x="300" y="175" class="title" text-anchor="middle">When to Use What</text>

  <!-- Diamond: Can it fail? -->
  <polygon points="300,190 380,220 300,250 220,220" class="decision"/>
  <text x="300" y="224" class="label-bold" text-anchor="middle">Can it fail?</text>

  <text x="195" y="215" class="label">No</text>
  <line x1="220" y1="220" x2="150" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="1.5"/>
  <rect x="60" y="207" width="90" height="26" class="box"/>
  <text x="105" y="224" class="label" text-anchor="middle">Return T</text>

  <text x="305" y="260" class="label">Yes</text>
  <line x1="300" y1="250" x2="300" y2="270" stroke="var(--text-muted, #8b949e)" stroke-width="1.5"/>

  <!-- Diamond: Absence or Error? -->
  <polygon points="300,270 370,295 300,320 230,295" class="decision"/>
  <text x="300" y="299" class="label-bold" text-anchor="middle">Absence?</text>

  <text x="205" y="290" class="label">Yes</text>
  <line x1="230" y1="295" x2="150" y2="295" stroke="var(--text-muted, #8b949e)" stroke-width="1.5"/>
  <rect x="60" y="282" width="90" height="26" class="box"/>
  <text x="105" y="299" class="label" text-anchor="middle">Option&lt;T&gt;</text>

  <text x="375" y="290" class="label">No (error)</text>
  <line x1="370" y1="295" x2="430" y2="295" stroke="var(--text-muted, #8b949e)" stroke-width="1.5"/>
  <rect x="430" y="282" width="130" height="26" class="box"/>
  <text x="495" y="299" class="label" text-anchor="middle">Result&lt;T, E&gt;</text>

  <!-- Bottom labels -->
  <text x="105" y="330" class="label" text-anchor="middle" fill="var(--text-muted, #8b949e)">Library: thiserror</text>
  <text x="495" y="330" class="label" text-anchor="middle" fill="var(--text-muted, #8b949e)">App: anyhow</text>
</svg>
