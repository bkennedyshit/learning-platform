<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--text-normal, #c9d1d9); }
    .box   { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .stage { fill: var(--interactive-accent, #58a6ff); opacity: 0.18; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; }
    .reg   { fill: #51cf66; opacity: 0.18; stroke: #51cf66; stroke-width: 1; }
    .asm   { fill: #ffd93d; opacity: 0.16; stroke: #ffd93d; stroke-width: 1; }
    .call  { fill: #cc5de8; opacity: 0.16; stroke: #cc5de8; stroke-width: 1; }
    .err   { fill: #ff6b6b; opacity: 0.18; stroke: #ff6b6b; stroke-width: 1; }
    .arr   { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .arrhi { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="p6-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="p6-ahi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">Code Generation Pipeline — IR → Register Allocation → Assembly (Chapter 29.6)</text>

  <!-- Pipeline row -->
  <rect x="18"  y="38" width="100" height="40" rx="4" class="stage"/>
  <text x="68"  y="55" class="label" text-anchor="middle" font-weight="bold">LLVM IR</text>
  <text x="68"  y="69" class="small" text-anchor="middle">SSA · typed</text>

  <line x1="118" y1="58" x2="138" y2="58" class="arrhi" marker-end="url(#p6-ahi)"/>

  <rect x="138" y="38" width="116" height="40" rx="4" class="stage"/>
  <text x="196" y="55" class="label" text-anchor="middle" font-weight="bold">Instruction Sel.</text>
  <text x="196" y="69" class="small" text-anchor="middle">IR → target instrs</text>

  <line x1="254" y1="58" x2="274" y2="58" class="arrhi" marker-end="url(#p6-ahi)"/>

  <rect x="274" y="38" width="116" height="40" rx="4" class="reg"/>
  <text x="332" y="55" class="label" text-anchor="middle" font-weight="bold">Reg Allocation</text>
  <text x="332" y="69" class="small" text-anchor="middle">vregs → phys regs</text>

  <line x1="390" y1="58" x2="410" y2="58" class="arrhi" marker-end="url(#p6-ahi)"/>

  <rect x="410" y="38" width="116" height="40" rx="4" class="asm"/>
  <text x="468" y="55" class="label" text-anchor="middle" font-weight="bold">Instruction Sched.</text>
  <text x="468" y="69" class="small" text-anchor="middle">reorder for pipeline</text>

  <line x1="526" y1="58" x2="546" y2="58" class="arrhi" marker-end="url(#p6-ahi)"/>

  <rect x="546" y="38" width="100" height="40" rx="4" class="asm"/>
  <text x="596" y="55" class="label" text-anchor="middle" font-weight="bold">Assembly</text>
  <text x="596" y="69" class="small" text-anchor="middle">x86-64 / ARM64</text>

  <line x1="646" y1="58" x2="666" y2="58" class="arrhi" marker-end="url(#p6-ahi)"/>

  <rect x="666" y="38" width="36" height="40" rx="4" class="stage"/>
  <text x="684" y="62" class="small" text-anchor="middle">ELF</text>

  <!-- Register allocation: graph colouring -->
  <rect x="18" y="94" width="320" height="186" rx="5" class="box"/>
  <text x="178" y="114" class="label" text-anchor="middle" font-weight="bold">Register Allocation — Graph Colouring</text>
  <text x="178" y="128" class="small" text-anchor="middle">virtual regs = nodes · live-at-same-time = edge · colours = physical regs</text>

  <!-- interference graph nodes -->
  <!-- t1 -->
  <circle cx="80"  cy="196" r="22" class="reg" stroke="#51cf66" stroke-width="1.5"/>
  <text x="80"  cy="200" y="196" class="small" text-anchor="middle">t1</text>
  <text x="80"  y="208" class="small" text-anchor="middle">rax</text>

  <!-- t2 -->
  <circle cx="178" cy="164" r="22" class="reg" stroke="#51cf66" stroke-width="1.5"/>
  <text x="178" y="164" class="small" text-anchor="middle">t2</text>
  <text x="178" y="176" class="small" text-anchor="middle">rbx</text>

  <!-- t3 -->
  <circle cx="280" cy="196" r="22" class="err" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="280" y="196" class="small" text-anchor="middle">t3</text>
  <text x="280" y="208" class="small" text-anchor="middle">spill!</text>

  <!-- t4 -->
  <circle cx="178" cy="238" r="22" class="stage" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="178" y="238" class="small" text-anchor="middle">t4</text>
  <text x="178" y="250" class="small" text-anchor="middle">rcx</text>

  <!-- edges -->
  <line x1="100" y1="186" x2="157" y2="174" class="arr"/>
  <line x1="200" y1="174" x2="258" y2="186" class="arr"/>
  <line x1="100" y1="206" x2="157" y2="230" class="arr"/>
  <line x1="200" y1="230" x2="258" y2="206" class="arr"/>
  <line x1="178" y1="186" x2="178" y2="216" class="arr"/>

  <text x="178" y="275" class="small" text-anchor="middle">k-colouring with k = # physical registers</text>
  <text x="178" y="289" class="small" text-anchor="middle">spill = evict to stack when colours exhausted</text>

  <!-- Calling conventions -->
  <rect x="352" y="94" width="350" height="186" rx="5" class="box"/>
  <text x="527" y="114" class="label" text-anchor="middle" font-weight="bold">Calling Convention (x86-64 System V)</text>

  <rect x="362" y="124" width="330" height="146" rx="3" class="call"/>
  <text x="527" y="142" class="small" text-anchor="middle">Integer args 1-6:   rdi rsi rdx rcx r8 r9</text>
  <text x="527" y="157" class="small" text-anchor="middle">Float args 1-8:     xmm0 – xmm7</text>
  <text x="527" y="172" class="small" text-anchor="middle">Return value:       rax (int) / xmm0 (float)</text>
  <text x="527" y="187" class="small" text-anchor="middle">Caller-saved (scratch): rcx rdx r8-r11</text>
  <text x="527" y="202" class="small" text-anchor="middle">Callee-saved (preserved): rbx rbp r12-r15</text>
  <text x="527" y="221" class="small" text-anchor="middle">Stack: 16-byte aligned before CALL</text>
  <text x="527" y="236" class="small" text-anchor="middle">Red zone: 128 bytes below rsp (leaf fns)</text>
  <text x="527" y="254" class="small" text-anchor="middle">Windows differs: rcx rdx r8 r9 · shadow space</text>

  <!-- BOTTOM: x86 assembly example -->
  <rect x="18" y="296" width="684" height="110" rx="5" class="box"/>
  <text x="360" y="316" class="label" text-anchor="middle" font-weight="bold">Generated x86-64 Assembly for  int add(int x, int y) { return x + y; }</text>

  <rect x="30"  y="326" width="316" height="72" rx="3" class="asm"/>
  <text x="42"  y="344" class="mono">add:                    # function label</text>
  <text x="42"  y="358" class="mono">  lea  eax, [rdi + rsi]  # x(edi) + y(esi)</text>
  <text x="42"  y="372" class="mono">  ret                   # return via eax</text>
  <text x="42"  y="388" class="mono">  # 3 instructions total (optimised)</text>

  <rect x="360" y="326" width="330" height="72" rx="3" class="stage"/>
  <text x="380" y="344" class="small">rdi = first int arg (x)</text>
  <text x="380" y="358" class="small">rsi = second int arg (y)</text>
  <text x="380" y="372" class="small">eax = return value (low 32 bits of rax)</text>
  <text x="380" y="386" class="small">lea avoids flags; used instead of add when result only</text>
</svg>
