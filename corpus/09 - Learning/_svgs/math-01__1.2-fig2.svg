<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .axis     { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .grid     { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.35; }
    .curve    { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.8; fill: none; }
    .secant   { stroke: var(--text-accent, #79c0ff); stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
    .tangent  { stroke: var(--text-accent, #79c0ff); stroke-width: 2.6; fill: none; }
    .ref      { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .pt       { fill: var(--text-accent, #79c0ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.2; }
    .label    { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .math     { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 14px; fill: var(--text-normal, #c9d1d9); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>

  <g class="grid">
    <line x1="60"  y1="40"  x2="60"  y2="330"/>
    <line x1="160" y1="40"  x2="160" y2="330"/>
    <line x1="260" y1="40"  x2="260" y2="330"/>
    <line x1="360" y1="40"  x2="360" y2="330"/>
    <line x1="460" y1="40"  x2="460" y2="330"/>
    <line x1="560" y1="40"  x2="560" y2="330"/>
    <line x1="60"  y1="80"  x2="560" y2="80"/>
    <line x1="60"  y1="160" x2="560" y2="160"/>
    <line x1="60"  y1="240" x2="560" y2="240"/>
  </g>

  <line x1="40"  y1="330" x2="580" y2="330" class="axis" marker-end="url(#m-arrow)"/>
  <line x1="60"  y1="355" x2="60"  y2="30"  class="axis" marker-end="url(#m-arrow)"/>
  <text x="585" y="334" class="label">x</text>
  <text x="48"  y="28"  class="label">y</text>

  <!-- Curve y = f(x) -->
  <path class="curve" d="M 80 280 C 180 220, 260 50, 340 90 S 480 240, 540 100"/>

  <!-- Endpoints (a, f(a)) and (b, f(b)) -->
  <circle cx="80"  cy="280" r="5" class="pt"/>
  <circle cx="540" cy="100" r="5" class="pt"/>
  <text x="80"  y="305" class="math" text-anchor="middle">(a, f(a))</text>
  <text x="540" y="92"  class="math" text-anchor="middle">(b, f(b))</text>

  <!-- Secant line -->
  <line x1="50" y1="298" x2="565" y2="93" class="secant"/>
  <text x="280" y="220" class="label" fill="var(--text-accent, #79c0ff)">secant: slope = (f(b)−f(a))/(b−a)</text>

  <!-- Interior MVT point c (parallel tangent) -->
  <!-- Curve has slope -dy/dx ~ same as secant somewhere near x=270 -->
  <circle cx="270" cy="148" r="5" class="pt"/>
  <text x="280" y="143" class="math">(c, f(c))</text>
  <line x1="60"  y1="252" x2="500" y2="78"  class="tangent"/>
  <text x="380" y="125" class="label" fill="var(--text-accent, #79c0ff)">tangent at c (parallel)</text>

  <!-- Drop guides -->
  <line x1="270" y1="148" x2="270" y2="330" class="ref"/>
  <line x1="80"  y1="280" x2="80"  y2="330" class="ref"/>
  <line x1="540" y1="100" x2="540" y2="330" class="ref"/>
  <text x="270" y="346" class="math" text-anchor="middle">c</text>
  <text x="80"  y="346" class="math" text-anchor="middle">a</text>
  <text x="540" y="346" class="math" text-anchor="middle">b</text>

  <!-- Equation box -->
  <rect x="370" y="245" width="200" height="60" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="470" y="270" class="label" text-anchor="middle" font-weight="bold">∃ c ∈ (a, b):</text>
  <text x="470" y="290" class="label" text-anchor="middle">f′(c) = (f(b) − f(a)) / (b − a)</text>
</svg>