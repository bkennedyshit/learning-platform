<svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <style>
    .pax { stroke:var(--text-muted, #8b949e); stroke-width:1; fill:none; stroke-dasharray:3 2; }
    .pv1 { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none; }
    .pv2 { stroke:var(--text-accent, #79c0ff); stroke-width:2.5; fill:none; }
    .pv3 { stroke:var(--text-normal, #c9d1d9); stroke-width:2; fill:none; }
    .pfg { fill:var(--interactive-accent, #58a6ff); opacity:0.1; stroke:var(--interactive-accent, #58a6ff); stroke-width:0.8; }
    .plb { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--text-normal, #c9d1d9); }
    .plc { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
  </style>
  <defs>
    <marker id="pda" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="pdb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
    <marker id="pdc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- Origin at (120, 200) -->
  <!-- a=(3,0,0)→(240,200), b=(1,2,0)→(170,160), c=(0,1,2)→projected→(140,140) -->
  <!-- Use isometric projection: x+→right, y+→up-left, z+→up-right (approx) -->
  <!-- a col: 3 units right → (120+120, 200)=(240,200) -->
  <!-- b col: scale(50): (50, -80) offset → (170,120) -->
  <!-- c col: scale(50): (-30, -90) offset → (90,110) -->
  <!-- Bottom face: O, A, A+B, B = (120,200),(240,200),(290,120),(170,120) -->
  <polygon points="120,200 240,200 290,120 170,120" class="pfg"/>
  <!-- Left face: O, B, B+C, C = (120,200),(170,120),(140,30),(90,110) -->
  <polygon points="120,200 170,120 140,30 90,110" fill="var(--text-accent, #79c0ff)" opacity="0.08"
           stroke="var(--text-accent, #79c0ff)" stroke-width="0.8">
    <animate attributeName="points" values="120,200 170,120 170,120 120,200; 120,200 170,120 140,30 90,110; 120,200 170,120 140,30 90,110; 120,200 170,120 170,120 120,200" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
  </polygon>
  <!-- Right face: A, A+B, A+B+C, A+C = (240,200),(290,120),(260,30),(210,110) -->
  <polygon points="240,200 290,120 260,30 210,110" fill="var(--background-secondary, #161b22)"
           stroke="var(--text-muted, #8b949e)" stroke-width="0.8" opacity="0.7">
    <animate attributeName="points" values="240,200 290,120 290,120 240,200; 240,200 290,120 260,30 210,110; 240,200 290,120 260,30 210,110; 240,200 290,120 290,120 240,200" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
  </polygon>
  <!-- Edges -->
  <line x1="120" y1="200" x2="240" y2="200" class="pv1" marker-end="url(#pda)"/>
  <line x1="120" y1="200" x2="170" y2="120" class="pv2" marker-end="url(#pdb)"/>
  <line x1="120" y1="200" x2="90"  y2="110" class="pv3" marker-end="url(#pdc)">
    <animate attributeName="x2" values="120; 90; 90; 120" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="200; 110; 110; 200" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
  </line>
  <!-- Labels -->
  <text x="248" y="197" class="plc">a</text>
  <text x="174" y="117" fill="var(--text-accent, #79c0ff)" class="plb">b</text>
  <text x="78"  y="107" class="plb">
    <animate attributeName="x" values="108; 78; 78; 108" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y" values="197; 107; 107; 197" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    c
  </text>
  <!-- Volume formula -->
  <rect x="310" y="60" width="195" height="80" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="407" y="85"  class="plb" text-anchor="middle" font-weight="bold">Signed Volume</text>
  <text x="407" y="108" class="plb" text-anchor="middle" font-family="monospace">V = |det[a|b|c]|</text>
  <text x="407" y="128" class="plc" text-anchor="middle">= |det A|</text>
  <text x="280" y="250" class="plb" text-anchor="middle">det = 0 iff the three vectors are coplanar</text>
</svg>