<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <defs>
    <marker id="pw-arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <style>
    .pw-flow  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none;
                marker-end: url(#pw-arr); opacity: 0.7; }
    .pw-wheel { stroke: var(--text-accent, #79c0ff); stroke-width: 2.5; fill: none; }
    .pw-hub   { fill: var(--text-accent, #79c0ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .pw-blade { stroke: var(--text-accent, #79c0ff); stroke-width: 3; fill: none; }
    .pw-spin  { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; fill: none;
                stroke-dasharray: 4 3; }
    .pw-label { font-family: Inter, system-ui, sans-serif; font-size: 12px;
                fill: var(--text-normal, #c9d1d9); }
    .pw-title { font-family: Inter, system-ui, sans-serif; font-size: 13px;
                fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .pw-axis  { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.2; fill: none; }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Axes -->
  <line x1="30" y1="310" x2="490" y2="310" class="pw-axis"/>
  <line x1="50" y1="330" x2="50"  y2="20"  class="pw-axis"/>
  <text x="494" y="314" class="pw-label">x</text>
  <text x="43"  y="18"  class="pw-label">y</text>
  <!-- Horizontal velocity streamlines (rotation field, approximated as local horizontal) -->
  <!-- Upper rows flow left (y>0: v_x = -y < 0) -->
  <line x1="120" y1="100" x2="80"  y2="100" class="pw-flow"/>
  <line x1="240" y1="100" x2="200" y2="100" class="pw-flow"/>
  <line x1="360" y1="100" x2="320" y2="100" class="pw-flow"/>
  <line x1="480" y1="100" x2="440" y2="100" class="pw-flow"/>
  <!-- Middle flow (y near 0, small speed) -->
  <line x1="120" y1="190" x2="102" y2="190" class="pw-flow"/>
  <line x1="360" y1="190" x2="342" y2="190" class="pw-flow"/>
  <!-- Lower rows flow right (y<0: v_x = -y > 0) -->
  <line x1="80"  y1="270" x2="120" y2="270" class="pw-flow"/>
  <line x1="200" y1="270" x2="240" y2="270" class="pw-flow"/>
  <line x1="320" y1="270" x2="360" y2="270" class="pw-flow"/>
  <line x1="440" y1="270" x2="480" y2="270" class="pw-flow"/>
  <!-- Paddle wheel centered at (260, 185) -->
  <circle cx="260" cy="185" r="38" class="pw-wheel"/>
  <!-- Blades (4 paddles at 45° increments) -->
  <line x1="260" y1="185" x2="260" y2="147" class="pw-blade"/>
  <line x1="260" y1="185" x2="287" y2="212" class="pw-blade"/>
  <line x1="260" y1="185" x2="260" y2="223" class="pw-blade"/>
  <line x1="260" y1="185" x2="233" y2="158" class="pw-blade"/>
  <!-- Hub -->
  <circle cx="260" cy="185" r="7" class="pw-hub"/>
  <!-- Spin arrow (counterclockwise arc) -->
  <path d="M 280 160 A 30 30 0 0 1 280 210" class="pw-spin" marker-end="url(#pw-arr)"/>
  <!-- Labels -->
  <text x="305" y="175" class="pw-label">↺ spins CCW</text>
  <text x="305" y="192" class="pw-label">curl = 2</text>
  <text x="100" y="92"  class="pw-label" fill="var(--interactive-accent, #58a6ff)">faster (y&gt;0)</text>
  <text x="100" y="282" class="pw-label" fill="var(--interactive-accent, #58a6ff)">faster (y&lt;0)</text>
  <text x="260" y="348" class="pw-title" text-anchor="middle">Curl: paddle-wheel spins when flow speed differs across its diameter</text>
</svg>