<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .gpu-box { fill: var(--interactive-accent, #58a6ff); opacity: 0.12; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 5; transition: all 0.2s; cursor: pointer; }
    .gpu-box:hover { opacity: 0.25; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .node-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 8; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; font-weight: bold; }
    .detail { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .nccl-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; stroke-dasharray: 6,3; }
    .section { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
  </style>

  <text x="350" y="20" class="title">Distributed Training — Data Parallel &amp; Model Parallel Strategies</text>

  <!-- Node 0 -->
  <rect x="30" y="45" width="310" height="140" class="node-box"/>
  <text x="185" y="65" class="section">Node 0 (Server 1)</text>
  <rect x="45" y="75" width="65" height="45" class="gpu-box"/><text x="77" y="95" class="label">GPU 0</text><text x="77" y="112" class="detail">Shard 0</text>
  <rect x="120" y="75" width="65" height="45" class="gpu-box"/><text x="152" y="95" class="label">GPU 1</text><text x="152" y="112" class="detail">Shard 1</text>
  <rect x="195" y="75" width="65" height="45" class="gpu-box"/><text x="227" y="95" class="label">GPU 2</text><text x="227" y="112" class="detail">Shard 2</text>
  <rect x="270" y="75" width="65" height="45" class="gpu-box"/><text x="302" y="95" class="label">GPU 3</text><text x="302" y="112" class="detail">Shard 3</text>
  <text x="185" y="145" class="detail">NVLink: 900 GB/s between GPUs</text>
  <text x="185" y="160" class="detail">AllReduce via NCCL ring</text>

  <!-- Node 1 -->
  <rect x="360" y="45" width="310" height="140" class="node-box"/>
  <text x="515" y="65" class="section">Node 1 (Server 2)</text>
  <rect x="375" y="75" width="65" height="45" class="gpu-box"/><text x="407" y="95" class="label">GPU 4</text><text x="407" y="112" class="detail">Shard 4</text>
  <rect x="450" y="75" width="65" height="45" class="gpu-box"/><text x="482" y="95" class="label">GPU 5</text><text x="482" y="112" class="detail">Shard 5</text>
  <rect x="525" y="75" width="65" height="45" class="gpu-box"/><text x="557" y="95" class="label">GPU 6</text><text x="557" y="112" class="detail">Shard 6</text>
  <rect x="600" y="75" width="65" height="45" class="gpu-box"/><text x="632" y="95" class="label">GPU 7</text><text x="632" y="112" class="detail">Shard 7</text>
  <text x="515" y="145" class="detail">NVLink: 900 GB/s between GPUs</text>
  <text x="515" y="160" class="detail">AllReduce via NCCL ring</text>

  <!-- Inter-node connection -->
  <line x1="340" y1="115" x2="360" y2="115" class="nccl-line"/>
  <text x="350" y="105" class="detail" text-anchor="middle">InfiniBand</text>
  <text x="350" y="130" class="detail" text-anchor="middle">400 Gb/s</text>

  <!-- Parallelism strategies -->
  <rect x="30" y="210" width="200" height="80" class="node-box"/>
  <text x="130" y="230" class="label">Data Parallel (DDP)</text>
  <text x="130" y="250" class="detail">Same model on each GPU</text>
  <text x="130" y="265" class="detail">Different data batches</text>
  <text x="130" y="280" class="detail">AllReduce gradients</text>

  <rect x="250" y="210" width="200" height="80" class="node-box"/>
  <text x="350" y="230" class="label">FSDP / ZeRO</text>
  <text x="350" y="250" class="detail">Shard params + grads + optim</text>
  <text x="350" y="265" class="detail">AllGather for forward</text>
  <text x="350" y="280" class="detail">ReduceScatter for backward</text>

  <rect x="470" y="210" width="200" height="80" class="node-box"/>
  <text x="570" y="230" class="label">Tensor Parallel (TP)</text>
  <text x="570" y="250" class="detail">Split layers across GPUs</text>
  <text x="570" y="265" class="detail">AllReduce activations</text>
  <text x="570" y="280" class="detail">For very large layers</text>

  <!-- Scale indicator -->
  <rect x="30" y="310" width="640" height="55" rx="6" fill="none" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="350" y="330" class="section">Scale Reference (LLM Training)</text>
  <text x="350" y="350" class="detail">GPT-3 (175B): 1024 A100s, 34 days, ~$4.6M compute cost</text>
  <text x="350" y="365" class="detail">LLaMA-70B: 2048 A100s, 21 days | Your first model: 1-8 GPUs, hours</text>
</svg>
