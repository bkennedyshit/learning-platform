<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .pos-loop { stroke: #4dabf7; stroke-width: 2.5; fill: none; opacity: 0.8; }
    .neg-loop { stroke: #ff6b6b; stroke-width: 2.5; fill: none; opacity: 0.8; }
    .node { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 2; rx: 8; transition: all 0.3s; cursor: pointer; }
    .node:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 6px var(--interactive-accent, #58a6ff)); }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; font-weight: bold; }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .pos-text { fill: #4dabf7; }
    .neg-text { fill: #ff6b6b; }
    .sign { font-family: Inter, system-ui, sans-serif; font-size: 28px; font-weight: bold; text-anchor: middle; }
    
    /* Dynamic pulsing for the loop signs */
    @keyframes pulse-fast {
      0%, 100% { transform: scale(1); fill-opacity: 0.8; }
      50% { transform: scale(1.3); fill-opacity: 1; filter: drop-shadow(0 0 4px #4dabf7); }
    }
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); fill-opacity: 0.7; }
      50% { transform: scale(1.15); fill-opacity: 1; filter: drop-shadow(0 0 3px #ff6b6b); }
    }
    .pos-pulse {
      animation: pulse-fast 1.2s ease-in-out infinite;
      transform-origin: 55px 190px;
    }
    .neg-pulse {
      animation: pulse-slow 2.4s ease-in-out infinite;
      transform-origin: 405px 190px;
    }
    
    .node-group { transition: transform 0.3s ease; }
    .node-group:hover { transform: translateY(-2px); }
  </style>
  <defs>
    <marker id="fb-arrow-pos" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4dabf7"/>
    </marker>
    <marker id="fb-arrow-neg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- Left: Positive Feedback Loop -->
  <text x="175" y="25" class="title pos-text">Positive Feedback (Amplifying)</text>
  <text x="175" y="45" class="sublabel">"The rich get richer" — destabilizing snowball</text>

  <g class="node-group">
    <rect x="110" y="70" width="130" height="45" class="node"/>
    <text x="175" y="92" class="label">Player Leads</text>
    <text x="175" y="106" class="sublabel">More resources</text>
  </g>

  <g class="node-group">
    <rect x="110" y="180" width="130" height="45" class="node"/>
    <text x="175" y="202" class="label">Gains Power</text>
    <text x="175" y="216" class="sublabel">Better gear/XP</text>
  </g>

  <g class="node-group">
    <rect x="110" y="290" width="130" height="45" class="node"/>
    <text x="175" y="312" class="label">Wins More</text>
    <text x="175" y="326" class="sublabel">Snowball effect</text>
  </g>

  <!-- Positive Loop Paths -->
  <path d="M 245 92 Q 280 135 245 202" class="pos-loop" marker-end="url(#fb-arrow-pos)"/>
  <path d="M 245 202 Q 280 245 245 312" class="pos-loop" marker-end="url(#fb-arrow-pos)"/>
  <path d="M 110 312 Q 60 200 110 92" class="pos-loop" marker-end="url(#fb-arrow-pos)"/>
  
  <!-- Active Flow Particles (Positive = Fast, Runaway) -->
  <circle r="4" fill="#4dabf7" filter="drop-shadow(0 0 3px #4dabf7)">
    <animateMotion path="M 245 92 Q 280 135 245 202" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#4dabf7" filter="drop-shadow(0 0 3px #4dabf7)">
    <animateMotion path="M 245 202 Q 280 245 245 312" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#4dabf7" filter="drop-shadow(0 0 3px #4dabf7)">
    <animateMotion path="M 110 312 Q 60 200 110 92" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <text x="55" y="195" class="sign pos-text pos-pulse">+</text>

  <!-- Right: Negative Feedback Loop -->
  <text x="525" y="25" class="title neg-text">Negative Feedback (Stabilizing)</text>
  <text x="525" y="45" class="sublabel">"Rubber-banding" — self-correcting balance</text>

  <g class="node-group">
    <rect x="460" y="70" width="130" height="45" class="node"/>
    <text x="525" y="92" class="label">Player Leads</text>
    <text x="525" y="106" class="sublabel">Ahead in race</text>
  </g>

  <g class="node-group">
    <rect x="460" y="180" width="130" height="45" class="node"/>
    <text x="525" y="202" class="label">Harder Challenge</text>
    <text x="525" y="216" class="sublabel">Blue shells, scaling</text>
  </g>

  <g class="node-group">
    <rect x="460" y="290" width="130" height="45" class="node"/>
    <text x="525" y="312" class="label">Lead Shrinks</text>
    <text x="525" y="326" class="sublabel">Equilibrium restored</text>
  </g>

  <!-- Negative Loop Paths -->
  <path d="M 595 92 Q 630 135 595 202" class="neg-loop" marker-end="url(#fb-arrow-neg)"/>
  <path d="M 595 202 Q 630 245 595 312" class="neg-loop" marker-end="url(#fb-arrow-neg)"/>
  <path d="M 460 312 Q 410 200 460 92" class="neg-loop" marker-end="url(#fb-arrow-neg)"/>
  
  <!-- Active Flow Particles (Negative = Slow, Damped) -->
  <circle r="4" fill="#ff6b6b" filter="drop-shadow(0 0 3px #ff6b6b)">
    <animateMotion path="M 595 92 Q 630 135 595 202" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#ff6b6b" filter="drop-shadow(0 0 3px #ff6b6b)">
    <animateMotion path="M 595 202 Q 630 245 595 312" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#ff6b6b" filter="drop-shadow(0 0 3px #ff6b6b)">
    <animateMotion path="M 460 312 Q 410 200 460 92" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <text x="405" y="195" class="sign neg-text neg-pulse">−</text>

  <!-- Bottom examples -->
  <text x="175" y="365" class="sublabel">Ex: Monopoly, Civilization snowball</text>
  <text x="525" y="365" class="sublabel">Ex: Mario Kart, Hades heat system</text>
</svg>
