<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--text-normal, #c9d1d9); }
    .box   { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .opt   { fill: var(--interactive-accent, #58a6ff); opacity: 0.18; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; }
    .fold  { fill: #51cf66; opacity: 0.20; stroke: #51cf66; stroke-width: 1; }
    .dce   { fill: #ffd93d; opacity: 0.18; stroke: #ffd93d; stroke-width: 1; }
    .inline { fill: #cc5de8; opacity: 0.18; stroke: #cc5de8; stroke-width: 1; }
    .loop  { fill: #ff6b6b; opacity: 0.16; stroke: #ff6b6b; stroke-width: 1; }
    .arr   { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .arrhi { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="p7-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="p7-ahi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">Optimization Passes — Constant Folding, DCE, Inlining &amp; Loop Opts (Chapter 29.7)</text>

  <!-- TOP: optimization pipeline -->
  <rect x="18" y="36" width="684" height="54" rx="5" class="box"/>
  <text x="360" y="54" class="label" text-anchor="middle" font-weight="bold">LLVM Pass Pipeline  (-O2)</text>

  <rect x="28"  y="62" width="80" height="20" rx="3" class="fold"/>
  <text x="68"  y="76" class="small" text-anchor="middle">mem2reg</text>

  <line x1="108" y1="72" x2="120" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="120" y="62" width="80" height="20" rx="3" class="fold"/>
  <text x="160" y="76" class="small" text-anchor="middle">instcombine</text>

  <line x1="200" y1="72" x2="212" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="212" y="62" width="68" height="20" rx="3" class="dce"/>
  <text x="246" y="76" class="small" text-anchor="middle">simplifycfg</text>

  <line x1="280" y1="72" x2="292" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="292" y="62" width="80" height="20" rx="3" class="inline"/>
  <text x="332" y="76" class="small" text-anchor="middle">inline</text>

  <line x1="372" y1="72" x2="384" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="384" y="62" width="80" height="20" rx="3" class="loop"/>
  <text x="424" y="76" class="small" text-anchor="middle">loop-rotate</text>

  <line x1="464" y1="72" x2="476" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="476" y="62" width="80" height="20" rx="3" class="loop"/>
  <text x="516" y="76" class="small" text-anchor="middle">loop-vectorize</text>

  <line x1="556" y1="72" x2="568" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="568" y="62" width="80" height="20" rx="3" class="fold"/>
  <text x="608" y="76" class="small" text-anchor="middle">GVN / LICM</text>

  <line x1="648" y1="72" x2="660" y2="72" class="arr" marker-end="url(#p7-arr)"/>

  <rect x="660" y="62" width="34" height="20" rx="3" class="opt"/>
  <text x="677" y="76" class="small" text-anchor="middle">…</text>

  <!-- BOTTOM FOUR panels -->
  <!-- Constant Folding -->
  <rect x="18" y="108" width="162" height="292" rx="5" class="box"/>
  <text x="99" y="128" class="label" text-anchor="middle" font-weight="bold">Constant Folding</text>

  <rect x="28" y="136" width="142" height="110" rx="3" class="fold"/>
  <text x="36" y="153" class="mono">// before</text>
  <text x="36" y="167" class="mono">x = 2 * 3</text>
  <text x="36" y="181" class="mono">y = x + 0</text>
  <text x="36" y="195" class="mono">z = y * 1</text>
  <line x1="28" y1="202" x2="170" y2="202" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="36" y="217" class="mono">// after</text>
  <text x="36" y="231" class="mono">z = 6</text>
  <text x="36" y="245" class="mono">// 3 ops → 1 const</text>

  <text x="99" y="268" class="small" text-anchor="middle">identity laws:</text>
  <text x="99" y="281" class="small" text-anchor="middle">x+0=x · x*1=x</text>
  <text x="99" y="294" class="small" text-anchor="middle">x*0=0 · x-x=0</text>
  <text x="99" y="310" class="small" text-anchor="middle">compute at compile</text>
  <text x="99" y="323" class="small" text-anchor="middle">time if all operands</text>
  <text x="99" y="336" class="small" text-anchor="middle">are known constants</text>
  <text x="99" y="352" class="small" text-anchor="middle">LLVM: instcombine</text>
  <text x="99" y="366" class="small" text-anchor="middle">handles thousands</text>
  <text x="99" y="380" class="small" text-anchor="middle">of these patterns</text>

  <!-- Dead Code Elimination -->
  <rect x="194" y="108" width="162" height="292" rx="5" class="box"/>
  <text x="275" y="128" class="label" text-anchor="middle" font-weight="bold">Dead Code Elim.</text>

  <rect x="204" y="136" width="142" height="110" rx="3" class="dce"/>
  <text x="212" y="153" class="mono">// unreachable</text>
  <text x="212" y="167" class="mono">if (false) {</text>
  <text x="212" y="181" class="mono">  do_thing()  //</text>
  <text x="212" y="195" class="mono">}            // dead</text>
  <line x1="204" y1="202" x2="346" y2="202" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="212" y="217" class="mono">// unused var</text>
  <text x="212" y="231" class="mono">x = expensiveFn()</text>
  <text x="212" y="245" class="mono">// x never read → DCE</text>

  <text x="275" y="268" class="small" text-anchor="middle">liveness analysis:</text>
  <text x="275" y="281" class="small" text-anchor="middle">a var is live if it</text>
  <text x="275" y="294" class="small" text-anchor="middle">might be read later.</text>
  <text x="275" y="310" class="small" text-anchor="middle">Dead = never live.</text>
  <text x="275" y="326" class="small" text-anchor="middle">CFG reachability:</text>
  <text x="275" y="340" class="small" text-anchor="middle">blocks not on any</text>
  <text x="275" y="354" class="small" text-anchor="middle">path from entry =</text>
  <text x="275" y="368" class="small" text-anchor="middle">unreachable → drop.</text>
  <text x="275" y="384" class="small" text-anchor="middle">simplifycfg in LLVM</text>

  <!-- Inlining -->
  <rect x="370" y="108" width="162" height="292" rx="5" class="box"/>
  <text x="451" y="128" class="label" text-anchor="middle" font-weight="bold">Function Inlining</text>

  <rect x="380" y="136" width="142" height="110" rx="3" class="inline"/>
  <text x="388" y="153" class="mono">// call site</text>
  <text x="388" y="167" class="mono">result = add(3, 4)</text>
  <text x="388" y="181" class="mono">// inlined:</text>
  <text x="388" y="195" class="mono">result = 3 + 4  // 7</text>
  <line x1="380" y1="202" x2="522" y2="202" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="388" y="218" class="mono">// after CF too:</text>
  <text x="388" y="232" class="mono">result = 7</text>
  <text x="388" y="246" class="mono">// call overhead 0</text>

  <text x="451" y="268" class="small" text-anchor="middle">heuristic: inline if</text>
  <text x="451" y="281" class="small" text-anchor="middle">callee is small OR</text>
  <text x="451" y="294" class="small" text-anchor="middle">call is hot (PGO).</text>
  <text x="451" y="310" class="small" text-anchor="middle">Enables further opts:</text>
  <text x="451" y="323" class="small" text-anchor="middle">CF, DCE, CSE after</text>
  <text x="451" y="336" class="small" text-anchor="middle">body is exposed.</text>
  <text x="451" y="352" class="small" text-anchor="middle">Risk: code explosion</text>
  <text x="451" y="366" class="small" text-anchor="middle">icache thrash on</text>
  <text x="451" y="380" class="small" text-anchor="middle">over-inlining</text>

  <!-- Loop Optimizations -->
  <rect x="546" y="108" width="156" height="292" rx="5" class="box"/>
  <text x="624" y="128" class="label" text-anchor="middle" font-weight="bold">Loop Optimizations</text>

  <rect x="556" y="136" width="136" height="170" rx="3" class="loop"/>
  <text x="564" y="153" class="small" font-weight="bold">LICM (hoist):</text>
  <text x="564" y="166" class="mono">// before</text>
  <text x="564" y="180" class="mono">for i in 0..n:</text>
  <text x="564" y="194" class="mono">  x = a * b  // inv</text>
  <text x="564" y="208" class="mono">// after LICM</text>
  <text x="564" y="222" class="mono">x = a * b</text>
  <text x="564" y="236" class="mono">for i in 0..n: ...</text>
  <line x1="556" y1="243" x2="692" y2="243" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="564" y="258" class="small" font-weight="bold">Loop unroll:</text>
  <text x="564" y="272" class="small">replicate body N×</text>
  <text x="564" y="285" class="small">reduces branch cost</text>
  <text x="564" y="299" class="small">enables vectorization</text>

  <text x="624" y="320" class="small" text-anchor="middle">Vectorization:</text>
  <text x="624" y="334" class="small" text-anchor="middle">4× float add →</text>
  <text x="624" y="348" class="small" text-anchor="middle">single SIMD addps</text>
  <text x="624" y="364" class="small" text-anchor="middle">(SSE/AVX/NEON)</text>
  <text x="624" y="380" class="small" text-anchor="middle">LLVM: loop-vectorize</text>
  <text x="624" y="394" class="small" text-anchor="middle">SLP vectorize</text>
</svg>
