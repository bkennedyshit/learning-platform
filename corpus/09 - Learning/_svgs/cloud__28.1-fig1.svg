<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title    { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label    { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .col      { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    .gpurow   { fill: #c084fc; opacity: 0.14; stroke: #c084fc; stroke-width: 1.4; rx: 5; }
    .hyper    { fill: #ff6b6b; opacity: 0.14; stroke: #ff6b6b; stroke-width: 1.4; rx: 5; }
    .dev      { fill: var(--interactive-accent, #58a6ff); opacity: 0.16; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 5; }
    .bare     { fill: #51cf66; opacity: 0.14; stroke: #51cf66; stroke-width: 1.4; rx: 5; }
    .pill     { fill: var(--background-primary, #0d1117); stroke: var(--text-muted, #8b949e); stroke-width: 0.8; rx: 4; }
    .pill-indie { fill: var(--background-primary, #0d1117); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.6; rx: 4; }
    .arrow      { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .arrow-indie{ stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.8; fill: none; }
    .footer-strip { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 0.8; rx: 4; }
  </style>
  <defs>
    <marker id="arrCloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
    <marker id="arrIndie" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">The Cloud Provider Landscape — 2026</text>

  <!-- TOP ROW: GPU Clouds -->
  <rect x="20" y="38" width="680" height="58" class="gpurow"/>
  <text x="30" y="56" class="label" font-weight="bold">GPU Clouds</text>
  <text x="30" y="70" class="sublabel">Training + inference, hourly rentals, serverless GPU</text>

  <rect x="160" y="62" width="92" height="26" class="pill"/>
  <text x="206" y="79" class="label" text-anchor="middle">RunPod</text>
  <rect x="262" y="62" width="92" height="26" class="pill"/>
  <text x="308" y="79" class="label" text-anchor="middle">Modal</text>
  <rect x="364" y="62" width="92" height="26" class="pill"/>
  <text x="410" y="79" class="label" text-anchor="middle">Lambda Labs</text>
  <rect x="466" y="62" width="92" height="26" class="pill"/>
  <text x="512" y="79" class="label" text-anchor="middle">Vast.ai</text>
  <rect x="568" y="62" width="92" height="26" class="pill"/>
  <text x="614" y="79" class="label" text-anchor="middle">Replicate</text>

  <!-- THREE COLUMNS -->

  <!-- Column 1: Hyperscalers -->
  <rect x="20" y="110" width="215" height="220" class="col"/>
  <rect x="32" y="122" width="191" height="28" class="hyper"/>
  <text x="127" y="141" class="label" text-anchor="middle" font-weight="bold">Hyperscalers</text>

  <rect x="40" y="160" width="175" height="32" class="pill"/>
  <text x="127" y="177" class="label" text-anchor="middle">AWS</text>
  <text x="127" y="189" class="sublabel" text-anchor="middle">EC2 · S3 · RDS · Lambda · the standard</text>

  <rect x="40" y="200" width="175" height="32" class="pill"/>
  <text x="127" y="217" class="label" text-anchor="middle">GCP</text>
  <text x="127" y="229" class="sublabel" text-anchor="middle">BigQuery · GKE · Cloud Run · data/ML</text>

  <rect x="40" y="240" width="175" height="32" class="pill"/>
  <text x="127" y="257" class="label" text-anchor="middle">Azure</text>
  <text x="127" y="269" class="sublabel" text-anchor="middle">Entra · AKS · enterprise &amp; M365 fit</text>

  <text x="127" y="295" class="sublabel" text-anchor="middle">Largest service catalogs.</text>
  <text x="127" y="308" class="sublabel" text-anchor="middle">Egress &amp; managed-svc pricing</text>
  <text x="127" y="320" class="sublabel" text-anchor="middle">dominate the bill.</text>

  <!-- Column 2: Developer Clouds (the Indie lane) -->
  <rect x="245" y="110" width="230" height="220" class="col"/>
  <rect x="257" y="122" width="206" height="28" class="dev"/>
  <text x="360" y="141" class="label" text-anchor="middle" font-weight="bold">Developer Clouds — Indie Path</text>

  <rect x="265" y="160" width="190" height="32" class="pill-indie"/>
  <text x="360" y="177" class="label" text-anchor="middle">Cloudflare</text>
  <text x="360" y="189" class="sublabel" text-anchor="middle">Workers · D1 · R2 · KV · Queues</text>

  <rect x="265" y="200" width="93" height="28" class="pill-indie"/>
  <text x="311" y="218" class="label" text-anchor="middle">Fly.io</text>
  <rect x="362" y="200" width="93" height="28" class="pill-indie"/>
  <text x="408" y="218" class="label" text-anchor="middle">Railway</text>

  <rect x="265" y="232" width="93" height="28" class="pill"/>
  <text x="311" y="250" class="label" text-anchor="middle">Render</text>
  <rect x="362" y="232" width="93" height="28" class="pill"/>
  <text x="408" y="250" class="label" text-anchor="middle">Vercel</text>

  <rect x="265" y="264" width="93" height="28" class="pill"/>
  <text x="311" y="282" class="label" text-anchor="middle">Netlify</text>
  <rect x="362" y="264" width="93" height="28" class="pill"/>
  <text x="408" y="282" class="label" text-anchor="middle">DigitalOcean</text>

  <text x="360" y="308" class="sublabel" text-anchor="middle">Heroku-class PaaS · edge runtimes</text>
  <text x="360" y="320" class="sublabel" text-anchor="middle">Generous free tiers · git-push deploys</text>

  <!-- Column 3: Bare-Metal-ish -->
  <rect x="485" y="110" width="215" height="220" class="col"/>
  <rect x="497" y="122" width="191" height="28" class="bare"/>
  <text x="592" y="141" class="label" text-anchor="middle" font-weight="bold">Bare-Metal-ish</text>

  <rect x="505" y="160" width="175" height="32" class="pill"/>
  <text x="592" y="177" class="label" text-anchor="middle">Hetzner</text>
  <text x="592" y="189" class="sublabel" text-anchor="middle">DE · 20TB egress · best $/vCPU</text>

  <rect x="505" y="200" width="175" height="32" class="pill"/>
  <text x="592" y="217" class="label" text-anchor="middle">OVH</text>
  <text x="592" y="229" class="sublabel" text-anchor="middle">FR · sovereign · bare-metal pools</text>

  <rect x="505" y="240" width="175" height="32" class="pill"/>
  <text x="592" y="257" class="label" text-anchor="middle">Scaleway</text>
  <text x="592" y="269" class="sublabel" text-anchor="middle">FR · ARM · GPU · serverless</text>

  <text x="592" y="295" class="sublabel" text-anchor="middle">Compute-heavy &amp; egress-heavy</text>
  <text x="592" y="308" class="sublabel" text-anchor="middle">workloads frequently 3–5×</text>
  <text x="592" y="320" class="sublabel" text-anchor="middle">cheaper than the hyperscalers.</text>

  <!-- Indie path arrow row + alternative -->
  <line x1="127" y1="335" x2="265" y2="335" class="arrow-indie" marker-end="url(#arrIndie)"/>
  <text x="196" y="332" class="sublabel" text-anchor="middle" fill="var(--interactive-accent, #58a6ff)">start small / hyperscaler-free</text>

  <line x1="455" y1="335" x2="592" y2="335" class="arrow" marker-end="url(#arrCloud)"/>
  <text x="523" y="332" class="sublabel" text-anchor="middle">scale-out · egress-heavy → Hetzner / OVH</text>

  <!-- Indie path callout -->
  <rect x="20" y="345" width="680" height="32" class="footer-strip"/>
  <text x="30" y="362" class="label" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">Indie path:</text>
  <text x="100" y="362" class="label">Cloudflare Workers + D1 + R2 + Queues</text>
  <text x="350" y="362" class="sublabel">— or —</text>
  <text x="400" y="362" class="label">Supabase (Postgres + Auth + Storage) + Fly.io / Railway</text>
  <text x="690" y="362" class="sublabel" text-anchor="end">≤ $200/mo for first 1k users</text>

  <!-- Bottom TCO strip -->
  <rect x="20" y="385" width="680" height="26" class="footer-strip"/>
  <text x="360" y="402" class="sublabel" text-anchor="middle">On-demand list prices differ ~5% across hyperscalers — discount strategy (spot · CUDs · savings plans) + egress fees + managed-service markup dominate TCO.</text>
</svg>
