<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: var(--text-normal, #c9d1d9); }
    .box   { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .boxhi { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; }
    .rule  { fill: var(--interactive-accent, #58a6ff); opacity: 0.15; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; }
    .term  { fill: #51cf66; opacity: 0.20; stroke: #51cf66; stroke-width: 1; }
    .nonterm { fill: #ffd93d; opacity: 0.18; stroke: #ffd93d; stroke-width: 1; }
    .arr   { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .arrhi { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.6; fill: none; }
    .pratt { fill: #cc5de8; opacity: 0.18; stroke: #cc5de8; stroke-width: 1; }
  </style>
  <defs>
    <marker id="p2-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="p2-ahi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">Parsers &amp; Grammars — BNF, Recursive Descent, and Pratt Parsing (Chapter 29.2)</text>

  <!-- LEFT: Grammar rules -->
  <rect x="18" y="36" width="220" height="200" rx="5" class="box"/>
  <text x="128" y="56" class="label" text-anchor="middle" font-weight="bold">BNF Grammar (arithmetic)</text>

  <rect x="30" y="65" width="196" height="162" rx="3" class="rule"/>
  <text x="38" y="82"  class="mono">expr   → expr '+' term</text>
  <text x="38" y="97"  class="mono">       | expr '-' term</text>
  <text x="38" y="112" class="mono">       | term</text>
  <text x="38" y="132" class="mono">term   → term '*' factor</text>
  <text x="38" y="147" class="mono">       | term '/' factor</text>
  <text x="38" y="162" class="mono">       | factor</text>
  <text x="38" y="182" class="mono">factor → '(' expr ')'</text>
  <text x="38" y="197" class="mono">       | NUMBER</text>
  <text x="38" y="212" class="mono">       | IDENT</text>

  <!-- MIDDLE: Recursive descent stack -->
  <rect x="252" y="36" width="210" height="200" rx="5" class="box"/>
  <text x="357" y="56" class="label" text-anchor="middle" font-weight="bold">Recursive Descent Parse</text>
  <text x="357" y="70" class="small" text-anchor="middle">parsing:  3 + 4 * 2</text>

  <!-- call stack boxes -->
  <rect x="262" y="80"  width="190" height="24" rx="3" class="nonterm"/>
  <text x="357" y="97"  class="mono" text-anchor="middle">parse_expr()</text>

  <rect x="272" y="110" width="170" height="24" rx="3" class="nonterm"/>
  <text x="357" y="127" class="mono" text-anchor="middle">parse_term()   ← left</text>

  <rect x="282" y="140" width="150" height="24" rx="3" class="term"/>
  <text x="357" y="157" class="mono" text-anchor="middle">parse_factor() → 3</text>

  <text x="357" y="180" class="small" text-anchor="middle">sees '+'  → consume, recurse right</text>

  <rect x="272" y="188" width="170" height="24" rx="3" class="nonterm"/>
  <text x="357" y="205" class="mono" text-anchor="middle">parse_term()   ← right</text>

  <rect x="282" y="218" width="150" height="24" rx="3" class="term"/>
  <text x="357" y="227" class="mono" text-anchor="middle">4 * 2  (higher prec)</text>

  <!-- RIGHT: Pratt parser table -->
  <rect x="476" y="36" width="226" height="200" rx="5" class="box"/>
  <text x="589" y="56" class="label" text-anchor="middle" font-weight="bold">Pratt Parser — Binding Power</text>

  <rect x="488" y="65" width="202" height="162" rx="3" class="pratt"/>
  <text x="589" y="82"  class="small" text-anchor="middle">Token     nud / led    BP(left)</text>
  <line x1="488" y1="86" x2="690" y2="86" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="589" y="100" class="mono" text-anchor="middle">NUMBER    nud→ literal   —</text>
  <text x="589" y="115" class="mono" text-anchor="middle">IDENT     nud→ name      —</text>
  <text x="589" y="130" class="mono" text-anchor="middle">'+'       led→ binop    10</text>
  <text x="589" y="145" class="mono" text-anchor="middle">'-'       led→ binop    10</text>
  <text x="589" y="160" class="mono" text-anchor="middle">'*'       led→ binop    20</text>
  <text x="589" y="175" class="mono" text-anchor="middle">'/'       led→ binop    20</text>
  <text x="589" y="190" class="mono" text-anchor="middle">'**'      led→ binop    30  (R)</text>
  <text x="589" y="205" class="mono" text-anchor="middle">'('       nud→ grouped   —</text>
  <text x="589" y="220" class="small" text-anchor="middle">Higher BP = tighter binding</text>

  <!-- BOTTOM: parse tree for 3 + 4*2 -->
  <rect x="18" y="252" width="684" height="152" rx="5" class="box"/>
  <text x="360" y="272" class="label" text-anchor="middle" font-weight="bold">Parse Tree vs AST for  3 + 4 * 2</text>

  <!-- Parse tree (left half) -->
  <text x="180" y="292" class="small" text-anchor="middle">Concrete Parse Tree</text>

  <!-- root -->
  <rect x="148" y="302" width="64" height="24" rx="3" class="nonterm"/>
  <text x="180" y="319" class="mono" text-anchor="middle">expr</text>

  <!-- left child -->
  <rect x="80"  y="336" width="64" height="24" rx="3" class="nonterm"/>
  <text x="112" y="353" class="mono" text-anchor="middle">term</text>
  <line x1="148" y1="314" x2="112" y2="336" class="arr" marker-end="url(#p2-arr)"/>

  <!-- '+' leaf -->
  <rect x="148" y="336" width="40" height="24" rx="3" class="term"/>
  <text x="168" y="353" class="mono" text-anchor="middle">'+'</text>
  <line x1="175" y1="326" x2="168" y2="336" class="arr" marker-end="url(#p2-arr)"/>

  <!-- right child: term → term * factor -->
  <rect x="202" y="336" width="64" height="24" rx="3" class="nonterm"/>
  <text x="234" y="353" class="mono" text-anchor="middle">term</text>
  <line x1="205" y1="314" x2="234" y2="336" class="arr" marker-end="url(#p2-arr)"/>

  <!-- leaf 3 -->
  <rect x="68"  y="372" width="40" height="24" rx="3" class="term"/>
  <text x="88"  y="389" class="mono" text-anchor="middle">3</text>
  <line x1="100" y1="360" x2="88" y2="372" class="arr" marker-end="url(#p2-arr)"/>

  <!-- 4 * 2 leaves -->
  <rect x="188" y="372" width="32" height="24" rx="3" class="term"/>
  <text x="204" y="389" class="mono" text-anchor="middle">4</text>
  <line x1="218" y1="360" x2="204" y2="372" class="arr" marker-end="url(#p2-arr)"/>

  <rect x="226" y="372" width="28" height="24" rx="3" class="term"/>
  <text x="240" y="389" class="mono" text-anchor="middle">'*'</text>
  <line x1="234" y1="360" x2="240" y2="372" class="arr" marker-end="url(#p2-arr)"/>

  <rect x="260" y="372" width="32" height="24" rx="3" class="term"/>
  <text x="276" y="389" class="mono" text-anchor="middle">2</text>
  <line x1="252" y1="360" x2="276" y2="372" class="arr" marker-end="url(#p2-arr)"/>

  <!-- vs separator -->
  <line x1="360" y1="262" x2="360" y2="404" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="360" y="290" class="small" text-anchor="middle">vs</text>

  <!-- AST (right half) -->
  <text x="540" y="292" class="small" text-anchor="middle">Abstract Syntax Tree (AST)</text>

  <rect x="510" y="302" width="60" height="24" rx="3" class="boxhi"/>
  <text x="540" y="319" class="mono" text-anchor="middle">BinOp +</text>

  <rect x="448" y="340" width="64" height="24" rx="3" class="term"/>
  <text x="480" y="357" class="mono" text-anchor="middle">Num(3)</text>
  <line x1="510" y1="314" x2="480" y2="340" class="arrhi" marker-end="url(#p2-ahi)"/>

  <rect x="556" y="340" width="68" height="24" rx="3" class="boxhi"/>
  <text x="590" y="357" class="mono" text-anchor="middle">BinOp *</text>
  <line x1="570" y1="314" x2="590" y2="340" class="arrhi" marker-end="url(#p2-ahi)"/>

  <rect x="524" y="376" width="64" height="24" rx="3" class="term"/>
  <text x="556" y="393" class="mono" text-anchor="middle">Num(4)</text>
  <line x1="574" y1="364" x2="556" y2="376" class="arrhi" marker-end="url(#p2-ahi)"/>

  <rect x="614" y="376" width="64" height="24" rx="3" class="term"/>
  <text x="646" y="393" class="mono" text-anchor="middle">Num(2)</text>
  <line x1="606" y1="364" x2="646" y2="376" class="arrhi" marker-end="url(#p2-ahi)"/>
</svg>
