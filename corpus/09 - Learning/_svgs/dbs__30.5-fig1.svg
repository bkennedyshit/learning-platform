<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, monospace; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box    { fill: var(--background-secondary,#161b22); stroke: var(--text-muted,#8b949e); stroke-width:1.2; }
    .wal    { fill: #1a2a3a; stroke: var(--interactive-accent,#58a6ff); stroke-width:1.8; }
    .wal-entry { fill: #1e2d3d; stroke: var(--interactive-accent,#58a6ff); stroke-width:1; }
    .redo   { fill: #1a3a1a; stroke: #51cf66; stroke-width: 1.5; }
    .undo   { fill: #3a1a1a; stroke: #ff6b6b; stroke-width: 1.5; }
    .cp     { fill: #3a2a1a; stroke: #ffd93d; stroke-width: 1.5; }
    .arr    { stroke: var(--text-muted,#8b949e); stroke-width: 1.2; fill: none; }
    .acc    { stroke: var(--interactive-accent,#58a6ff); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="dbs5-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="dbs5-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#51cf66"/>
    </marker>
    <marker id="dbs5-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#ff6b6b"/>
    </marker>
    <marker id="dbs5-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#ffd93d"/>
    </marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">Write-Ahead Log (WAL) &amp; ARIES Recovery Algorithm</text>

  <!-- WAL physical layout -->
  <rect x="18" y="30" width="684" height="72" class="wal" rx="6"/>
  <text x="360" y="48" class="label" text-anchor="middle" font-weight="bold">WAL — append-only sequential log on disk (durability guarantee)</text>

  <rect x="30"  y="56" width="76" height="36" class="wal-entry" rx="3"/>
  <text x="68"  y="70" class="small" text-anchor="middle" fill="#58a6ff">LSN 100</text>
  <text x="68"  y="82" class="mono" text-anchor="middle">BEGIN T1</text>

  <rect x="112" y="56" width="96" height="36" class="wal-entry" rx="3"/>
  <text x="160" y="70" class="small" text-anchor="middle" fill="#58a6ff">LSN 101</text>
  <text x="160" y="82" class="mono" text-anchor="middle">T1 UPDATE row5</text>

  <rect x="214" y="56" width="96" height="36" class="wal-entry" rx="3"/>
  <text x="262" y="70" class="small" text-anchor="middle" fill="#58a6ff">LSN 102</text>
  <text x="262" y="82" class="mono" text-anchor="middle">BEGIN T2</text>

  <rect x="316" y="56" width="96" height="36" class="wal-entry" rx="3"/>
  <text x="364" y="70" class="small" text-anchor="middle" fill="#ffd93d">LSN 103</text>
  <text x="364" y="82" class="mono" text-anchor="middle">CHECKPOINT</text>

  <rect x="418" y="56" width="96" height="36" class="wal-entry" rx="3"/>
  <text x="466" y="70" class="small" text-anchor="middle" fill="#58a6ff">LSN 104</text>
  <text x="466" y="82" class="mono" text-anchor="middle">T2 UPDATE row3</text>

  <rect x="520" y="56" width="96" height="36" class="wal-entry" rx="3"/>
  <text x="568" y="70" class="small" text-anchor="middle" fill="#51cf66">LSN 105</text>
  <text x="568" y="82" class="mono" text-anchor="middle">T1 COMMIT</text>

  <rect x="622" y="56" width="72" height="36" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="658" y="70" class="small" text-anchor="middle" fill="#ff6b6b">CRASH</text>
  <text x="658" y="82" class="mono" text-anchor="middle">T2 in-flight</text>

  <!-- ARIES three phases -->
  <rect x="18" y="116" width="684" height="136" class="box" rx="6"/>
  <text x="360" y="134" class="label" text-anchor="middle" font-weight="bold">ARIES Recovery — Three Phases (after crash)</text>

  <rect x="30"  y="142" width="200" height="100" class="cp" rx="4"/>
  <text x="130" y="160" class="label" text-anchor="middle" fill="#ffd93d">Phase 1: Analysis</text>
  <text x="38"  y="178" class="small">Start at last CHECKPOINT LSN 103</text>
  <text x="38"  y="194" class="small">Scan forward to crash point</text>
  <text x="38"  y="210" class="small">Build: dirty-page table (DPT)</text>
  <text x="38"  y="226" class="small">       active transaction table (ATT)</text>
  <text x="38"  y="238" class="small">→ Know what to redo / undo</text>

  <rect x="242" y="142" width="200" height="100" class="redo" rx="4"/>
  <text x="342" y="160" class="label" text-anchor="middle" fill="#51cf66">Phase 2: Redo</text>
  <text x="250" y="178" class="small">Replay ALL log records from</text>
  <text x="250" y="194" class="small">earliest LSN in DPT forward</text>
  <text x="250" y="210" class="small">Restore buffer pool to state</text>
  <text x="250" y="226" class="small">at crash (including losers)</text>
  <text x="250" y="238" class="small">→ "Redo everything"</text>

  <rect x="454" y="142" width="240" height="100" class="undo" rx="4"/>
  <text x="574" y="160" class="label" text-anchor="middle" fill="#ff6b6b">Phase 3: Undo</text>
  <text x="462" y="178" class="small">Reverse uncommitted txns (T2)</text>
  <text x="462" y="194" class="small">Walk log backward, apply CLR</text>
  <text x="462" y="210" class="small">(Compensation Log Records) so</text>
  <text x="462" y="226" class="small">undo is itself idempotent</text>
  <text x="462" y="238" class="small">→ Atomicity restored</text>

  <!-- WAL write-ahead rule -->
  <rect x="18" y="264" width="340" height="56" fill="#1a2030" stroke="#ffd93d" stroke-width="1.5" rx="6"/>
  <text x="188" y="280" class="label" text-anchor="middle" fill="#ffd93d" font-weight="bold">The WAL Rule (Force-Log-at-Commit)</text>
  <text x="28"  y="298" class="small">1. Log record for a page MUST reach disk before the page itself.</text>
  <text x="28"  y="310" class="small">2. All log records for a txn MUST reach disk before COMMIT ack.</text>

  <!-- Group commit / fsync -->
  <rect x="372" y="264" width="330" height="56" fill="#1a2030" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.5" rx="6"/>
  <text x="537" y="280" class="label" text-anchor="middle" fill="#58a6ff" font-weight="bold">Group Commit — Batching fsync()</text>
  <text x="382" y="298" class="small">Naive: 1 fsync per commit → ~7 ms HDD latency = 143 TPS ceiling</text>
  <text x="382" y="310" class="small">Group commit: batch 100s of txns into one fsync → 10 000+ TPS</text>

  <!-- bottom note -->
  <text x="360" y="342" class="small" text-anchor="middle">PostgreSQL: WAL file = pg_wal/. LSN = 8-byte monotone counter. wal_sync_method = fdatasync (default Linux).</text>
  <text x="360" y="358" class="small" text-anchor="middle">synchronous_commit = off trades durability for throughput (risk: lose last ~wal_writer_delay ms of commits).</text>
  <text x="360" y="378" class="small" text-anchor="middle">ARIES paper: Mohan et al. 1992 — IBM Research. CMU 15-445 Lec 20 (Andy Pavlo). DDIA Ch. 7 "The trouble with transactions".</text>
  <text x="360" y="396" class="small" text-anchor="middle">LSN = Log Sequence Number · CLR = Compensation Log Record · DPT = Dirty Page Table · ATT = Active Transaction Table</text>
</svg>
