<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .level-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.3s; cursor: pointer; }
    .level-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .check { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: #22c55e; text-anchor: middle; }
    .cross { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: #ef4444; text-anchor: middle; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .header { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); font-weight: bold; text-anchor: middle; }
    .grid-line { stroke: var(--text-muted, #8b949e); stroke-width: 0.5; opacity: 0.4; }
    .perf-bar { fill: var(--interactive-accent, #58a6ff); opacity: 0.6; rx: 2; }
  </style>

  <text x="350" y="25" class="title">Isolation Levels — Anomaly Prevention Matrix</text>

  <!-- Column headers -->
  <text x="100" y="55" class="header">ISOLATION LEVEL</text>
  <text x="270" y="55" class="header">Dirty Read</text>
  <text x="370" y="55" class="header">Non-Repeat</text>
  <text x="470" y="55" class="header">Phantom</text>
  <text x="560" y="55" class="header">Write Skew</text>
  <text x="650" y="55" class="header">Perf</text>

  <!-- Grid lines -->
  <line x1="30" y1="65" x2="690" y2="65" class="grid-line"/>
  <line x1="30" y1="115" x2="690" y2="115" class="grid-line"/>
  <line x1="30" y1="165" x2="690" y2="165" class="grid-line"/>
  <line x1="30" y1="215" x2="690" y2="215" class="grid-line"/>

  <!-- READ UNCOMMITTED -->
  <rect x="20" y="72" width="160" height="35" class="level-box"/>
  <text x="100" y="94" class="label">READ UNCOMMITTED</text>
  <text x="270" y="94" class="cross">✗ possible</text>
  <text x="370" y="94" class="cross">✗ possible</text>
  <text x="470" y="94" class="cross">✗ possible</text>
  <text x="560" y="94" class="cross">✗ possible</text>
  <rect x="625" y="82" width="50" height="12" class="perf-bar"/>

  <!-- READ COMMITTED -->
  <rect x="20" y="122" width="160" height="35" class="level-box"/>
  <text x="100" y="144" class="label">READ COMMITTED</text>
  <text x="270" y="144" class="check">✓ prevented</text>
  <text x="370" y="144" class="cross">✗ possible</text>
  <text x="470" y="144" class="cross">✗ possible</text>
  <text x="560" y="144" class="cross">✗ possible</text>
  <rect x="625" y="132" width="42" height="12" class="perf-bar"/>

  <!-- REPEATABLE READ -->
  <rect x="20" y="172" width="160" height="35" class="level-box"/>
  <text x="100" y="194" class="label">REPEATABLE READ</text>
  <text x="270" y="194" class="check">✓ prevented</text>
  <text x="370" y="194" class="check">✓ prevented</text>
  <text x="470" y="194" class="check">✓ (in PG)</text>
  <text x="560" y="194" class="cross">✗ possible</text>
  <rect x="625" y="182" width="32" height="12" class="perf-bar"/>

  <!-- SERIALIZABLE -->
  <rect x="20" y="222" width="160" height="35" class="level-box" style="stroke: var(--interactive-accent, #58a6ff)"/>
  <text x="100" y="244" class="label">SERIALIZABLE</text>
  <text x="270" y="244" class="check">✓ prevented</text>
  <text x="370" y="244" class="check">✓ prevented</text>
  <text x="470" y="244" class="check">✓ prevented</text>
  <text x="560" y="244" class="check">✓ prevented</text>
  <rect x="625" y="232" width="20" height="12" class="perf-bar"/>

  <!-- Legend -->
  <text x="350" y="290" class="header">PostgreSQL default: READ COMMITTED | Strongest: SERIALIZABLE (requires retry logic)</text>
  <text x="650" y="290" class="header">← speed</text>
</svg>
