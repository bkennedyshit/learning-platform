<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />

  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">OBSERVABILITY: LOGS, METRICS, TRACES</text>

  <!-- Applications -->
  <rect x="50" y="70" width="120" height="160" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="110" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Application</text>
  
  <text x="110" y="130" font-family="sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">GenAI Calls</text>
  <text x="110" y="160" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">HTTP Handler</text>
  <text x="110" y="190" font-family="sans-serif" font-size="12" fill="#a3e635" text-anchor="middle">DB Queries</text>

  <!-- OTel Collector -->
  <g transform="translate(350, 150)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#334155" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">OTel</text>
    <text x="0" y="20" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Collector</text>
  </g>

  <!-- Streams -->
  <path d="M 170 120 L 310 140" stroke="#f472b6" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite" />
  </path>
  <path d="M 170 150 L 310 150" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite" />
  </path>
  <path d="M 170 180 L 310 160" stroke="#a3e635" stroke-width="2" fill="none" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite" />
  </path>

  <!-- Backends -->
  <rect x="550" y="60" width="140" height="40" rx="4" fill="#1e293b" stroke="#f472b6" stroke-width="2" />
  <text x="620" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Logs (Loki)</text>

  <rect x="550" y="130" width="140" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="620" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Metrics (Prometheus)</text>

  <rect x="550" y="200" width="140" height="40" rx="4" fill="#1e293b" stroke="#a3e635" stroke-width="2" />
  <text x="620" y="225" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Traces (Tempo)</text>

  <path d="M 390 140 L 540 80" stroke="#f472b6" stroke-width="2" fill="none" />
  <circle cx="0" cy="0" r="4" fill="#f472b6" filter="url(#glow)">
    <animateMotion path="M 390 140 L 540 80" dur="1s" repeatCount="indefinite" />
  </circle>

  <path d="M 390 150 L 540 150" stroke="#38bdf8" stroke-width="2" fill="none" />
  <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 390 150 L 540 150" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <path d="M 390 160 L 540 220" stroke="#a3e635" stroke-width="2" fill="none" />
  <circle cx="0" cy="0" r="4" fill="#a3e635" filter="url(#glow)">
    <animateMotion path="M 390 160 L 540 220" dur="1.4s" repeatCount="indefinite" />
  </circle>
</svg>
