<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 24px; fill: #ffffff; }
      .text-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 18px; fill: #ffffff; }
      .text-sub { font-family: 'Inter', sans-serif; font-size: 14px; fill: #a0aec0; }
      .circle { fill-opacity: 0.2; stroke-width: 4; }
      .circle-c { fill: #4299e1; stroke: #4299e1; }
      .circle-a { fill: #48bb78; stroke: #48bb78; }
      .circle-p { fill: #ed8936; stroke: #ed8936; }
      .intersect-text { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 16px; fill: #ffffff; }
      .bg { fill: #1a202c; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="12"/>
  
  <text x="400" y="50" text-anchor="middle" class="text-title">CAP Theorem</text>
  
  <!-- C Circle -->
  <g transform="translate(400, 230)">
    <circle cx="-80" cy="-40" r="120" class="circle circle-c">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- A Circle -->
    <circle cx="80" cy="-40" r="120" class="circle circle-a">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" begin="1.33s" repeatCount="indefinite" />
    </circle>
    <!-- P Circle -->
    <circle cx="0" cy="80" r="120" class="circle circle-p">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" begin="2.66s" repeatCount="indefinite" />
    </circle>
    
    <!-- Labels -->
    <text x="-120" y="-100" text-anchor="middle" class="text-label">Consistency</text>
    <text x="120" y="-100" text-anchor="middle" class="text-label">Availability</text>
    <text x="0" y="150" text-anchor="middle" class="text-label">Partition Tolerance</text>
    
    <!-- Intersections -->
    <text x="0" y="-80" text-anchor="middle" class="intersect-text">CA</text>
    <text x="0" y="-60" text-anchor="middle" class="text-sub">(Illusion)</text>
    
    <text x="-70" y="40" text-anchor="middle" class="intersect-text">CP</text>
    <text x="-70" y="60" text-anchor="middle" class="text-sub">Spanner, etcd</text>

    <text x="70" y="40" text-anchor="middle" class="intersect-text">AP</text>
    <text x="70" y="60" text-anchor="middle" class="text-sub">Dynamo, Cassandra</text>
  </g>
  
  <!-- Network animation at the bottom -->
  <g transform="translate(150, 420)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" class="text-label" font-size="14">Node 1</text>
    
    <rect x="440" y="0" width="60" height="40" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <text x="470" y="25" text-anchor="middle" class="text-label" font-size="14">Node 2</text>
    
    <!-- Link -->
    <line x1="60" y1="20" x2="440" y2="20" stroke="#a0aec0" stroke-width="4" stroke-dasharray="10 5">
      <animate attributeName="stroke" values="#a0aec0;#e53e3e;#a0aec0" dur="5s" repeatCount="indefinite"/>
    </line>
    <!-- Partition symbol -->
    <g transform="translate(250, 20)">
      <circle cx="0" cy="0" r="15" fill="#e53e3e" opacity="0">
         <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" class="text-label" font-size="16" opacity="0">
         <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
         X
      </text>
    </g>
  </g>
</svg>
