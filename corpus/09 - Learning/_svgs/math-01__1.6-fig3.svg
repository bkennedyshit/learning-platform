<svg viewBox="0 0 580 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:580px;height:auto;">
  <defs>
    <marker id="li-arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="li-tan" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
  </defs>
  <style>
    .li-axis  { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.3; fill: none; }
    .li-curve { stroke: var(--text-normal, #c9d1d9); stroke-width: 2.5; fill: none; }
    .li-field { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.4; fill: none;
                marker-end: url(#li-arr); }
    .li-tan   { stroke: var(--text-accent, #79c0ff); stroke-width: 2; fill: none;
                marker-end: url(#li-tan); }
    .li-dot   { fill: var(--text-normal, #c9d1d9); }
    .li-label { font-family: Inter, system-ui, sans-serif; font-size: 12px;
                fill: var(--text-normal, #c9d1d9); }
    .li-title { font-family: Inter, system-ui, sans-serif; font-size: 13px;
                fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .li-dot-accent { fill: var(--interactive-accent, #58a6ff); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Axes -->
  <line x1="40" y1="290" x2="540" y2="290" class="li-axis"/>
  <line x1="60" y1="310" x2="60"  y2="30"  class="li-axis"/>
  <text x="545" y="294" class="li-label">x</text>
  <text x="52"  y="28"  class="li-label">y</text>
  <!-- Curve C: a smooth S-curve from left to right -->
  <path d="M 80 240 C 150 240, 180 80, 280 80 S 420 200, 520 160"
        class="li-curve"/>
  <!-- Endpoint dots -->
  <circle cx="80"  cy="240" r="5" class="li-dot"/>
  <circle cx="520" cy="160" r="5" class="li-dot"/>
  <text x="68"  y="258" class="li-label">A</text>
  <text x="525" y="158" class="li-label">B</text>
  <!-- Field vectors (uniform horizontal-ish field pointing upper-right) -->
  <line x1="100" y1="200" x2="130" y2="178" class="li-field"/>
  <line x1="160" y1="150" x2="190" y2="128" class="li-field"/>
  <line x1="240" y1="110" x2="270" y2="88"  class="li-field"/>
  <line x1="320" y1="120" x2="350" y2="98"  class="li-field"/>
  <line x1="400" y1="160" x2="430" y2="138" class="li-field"/>
  <line x1="470" y1="175" x2="500" y2="153" class="li-field"/>
  <!-- Tangent vectors on the curve (approximated) -->
  <line x1="120" y1="200" x2="155" y2="160" class="li-tan"/>
  <line x1="200" y1="90"  x2="240" y2="82"  class="li-tan"/>
  <line x1="340" y1="100" x2="380" y2="118" class="li-tan"/>
  <line x1="460" y1="178" x2="495" y2="170" class="li-tan"/>
  <!-- Labels -->
  <text x="135" y="148" class="li-label" fill="var(--text-accent, #79c0ff)">r′(t)</text>
  <text x="195" y="72"  class="li-label" fill="var(--interactive-accent, #58a6ff)">F</text>
  <text x="260" y="310" class="li-title" text-anchor="middle">∫_C F·dr = ∫_a^b F(r(t))·r′(t) dt</text>
</svg>