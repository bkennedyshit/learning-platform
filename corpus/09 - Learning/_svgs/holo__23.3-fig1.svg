<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 3px #00f0ff); opacity: 0.8; }
      50% { filter: drop-shadow(0 0 8px #00f0ff); opacity: 1; }
    }
    @keyframes pulse-glow-pink {
      0%, 100% { filter: drop-shadow(0 0 3px #ff007f); opacity: 0.8; }
      50% { filter: drop-shadow(0 0 8px #ff007f); opacity: 1; }
    }
    @keyframes flow-forward {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flow-backward {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 24; }
    }
    @keyframes slide-signal-fwd {
      0% { cx: 200; cy: 150; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 520; cy: 150; opacity: 0; }
    }
    @keyframes slide-signal-bwd {
      0% { cx: 520; cy: 290; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 200; cy: 290; opacity: 0; }
    }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 18px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .subtitle { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #30363d); stroke-width: 1.5; rx: 8; }
    .math { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ffd700; }
    
    /* Interactive and Animated elements */
    .fwd-path { stroke: #00f0ff; stroke-width: 2; fill: none; stroke-dasharray: 6, 4; animation: flow-forward 1.5s linear infinite; }
    .bwd-path { stroke: #ff007f; stroke-width: 2; fill: none; stroke-dasharray: 6, 4; animation: flow-backward 1.5s linear infinite; }
    .fwd-pulse { fill: #00f0ff; filter: url(#glow-cyan-thick); animation: slide-signal-fwd 2s linear infinite; }
    .bwd-pulse { fill: #ff007f; filter: url(#glow-pink-thick); animation: slide-signal-bwd 2s linear infinite; }
    
    /* Planes styling */
    .plane-box { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 6; }
    .cgh-pixel { stroke: none; }
    .target-pixel { fill: #39ff14; }
  </style>

  <defs>
    <!-- Cyan glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan-thick" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Pink glow -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink-thick" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Green glow for target -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Marker arrows -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#ff007f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" class="title" text-anchor="middle">Gerchberg-Saxton (GS) Phase Retrieval Loop</text>
  <text x="360" y="48" class="subtitle" text-anchor="middle">The classical iterative algorithm to solve for the phase-only mask of a target intensity</text>

  <!-- Main Background box -->
  <rect x="20" y="65" width="680" height="350" class="box"/>

  <!-- Left: Hologram Plane (SLM) -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="140" height="260" class="plane-box"/>
    <text x="70" y="24" class="label" text-anchor="middle">Hologram Plane</text>
    <text x="70" y="38" class="sublabel" text-anchor="middle">(Phase-Only SLM)</text>

    <!-- Mini phase grid illustration -->
    <g transform="translate(30, 55)">
      <!-- Render a beautiful pseudo phase mask -->
      <rect x="0" y="0" width="16" height="16" class="cgh-pixel" fill="#3a0ca3" opacity="0.6"/>
      <rect x="16" y="0" width="16" height="16" class="cgh-pixel" fill="#7209b7" opacity="0.8"/>
      <rect x="32" y="0" width="16" height="16" class="cgh-pixel" fill="#f72585" opacity="0.9"/>
      <rect x="48" y="0" width="16" height="16" class="cgh-pixel" fill="#3f37c9" opacity="0.7"/>
      <rect x="64" y="0" width="16" height="16" class="cgh-pixel" fill="#48cae4" opacity="0.5"/>

      <rect x="0" y="16" width="16" height="16" class="cgh-pixel" fill="#f72585" opacity="0.9"/>
      <rect x="16" y="16" width="16" height="16" class="cgh-pixel" fill="#3a0ca3" opacity="0.5"/>
      <rect x="32" y="16" width="16" height="16" class="cgh-pixel" fill="#4361ee" opacity="0.8"/>
      <rect x="48" y="16" width="16" height="16" class="cgh-pixel" fill="#7209b7" opacity="0.7"/>
      <rect x="64" y="16" width="16" height="16" class="cgh-pixel" fill="#48cae4" opacity="0.6"/>

      <rect x="0" y="32" width="16" height="16" class="cgh-pixel" fill="#4cc9f0" opacity="0.5"/>
      <rect x="16" y="32" width="16" height="16" class="cgh-pixel" fill="#3f37c9" opacity="0.7"/>
      <rect x="32" y="32" width="16" height="16" class="cgh-pixel" fill="#7209b7" opacity="0.9"/>
      <rect x="48" y="32" width="16" height="16" class="cgh-pixel" fill="#f72585" opacity="0.8"/>
      <rect x="64" y="32" width="16" height="16" class="cgh-pixel" fill="#3a0ca3" opacity="0.6"/>

      <rect x="0" y="48" width="16" height="16" class="cgh-pixel" fill="#3a0ca3" opacity="0.7"/>
      <rect x="16" y="48" width="16" height="16" class="cgh-pixel" fill="#f72585" opacity="0.8"/>
      <rect x="32" y="48" width="16" height="16" class="cgh-pixel" fill="#48cae4" opacity="0.6"/>
      <rect x="48" y="48" width="16" height="16" class="cgh-pixel" fill="#4361ee" opacity="0.9"/>
      <rect x="64" y="48" width="16" height="16" class="cgh-pixel" fill="#7209b7" opacity="0.5"/>

      <rect x="0" y="64" width="16" height="16" class="cgh-pixel" fill="#48cae4" opacity="0.6"/>
      <rect x="16" y="64" width="16" height="16" class="cgh-pixel" fill="#4cc9f0" opacity="0.4"/>
      <rect x="32" y="64" width="16" height="16" class="cgh-pixel" fill="#3a0ca3" opacity="0.7"/>
      <rect x="48" y="64" width="16" height="16" class="cgh-pixel" fill="#7209b7" opacity="0.9"/>
      <rect x="64" y="64" width="16" height="16" class="cgh-pixel" fill="#f72585" opacity="0.8"/>

      <rect x="0" y="0" width="80" height="80" fill="none" stroke="#58a6ff" stroke-width="1.5" rx="3"/>
    </g>
    <text x="70" y="150" class="sublabel" text-anchor="middle">Quantized Phase Map</text>

    <!-- Constraint Box -->
    <rect x="10" y="170" width="120" height="80" fill="#1f242c" stroke="#30363d" stroke-width="1" rx="4"/>
    <text x="70" y="188" class="sublabel" text-anchor="middle" font-weight="bold" fill="#ff007f">SLM Constraint</text>
    <text x="70" y="204" class="sublabel" text-anchor="middle">Force Amplitude = 1</text>
    <text x="70" y="218" class="sublabel" text-anchor="middle">Keep active phase</text>
    <text x="70" y="238" class="math" text-anchor="middle">A(x,y) &amp;leftarrow; 1</text>
  </g>

  <!-- CENTER PATHS: Loop Propagation -->
  
  <!-- FORWARD PATH: FFT (Top half) -->
  <path d="M 190 150 L 530 150" class="fwd-path" marker-end="url(#arrCyan)" />
  <!-- Wave graphic moving forward -->
  <path d="M 280 150 Q 290 135 300 150 T 320 150" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <path d="M 390 150 Q 400 135 410 150 T 430 150" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="360" y="130" class="label" fill="#00f0ff" text-anchor="middle">1. Forward Propagation (FFT / ASM)</text>
  <text x="360" y="144" class="math" fill="#00f0ff" text-anchor="middle">U_img = Propagate{ U_holo }</text>

  <!-- BACKWARD PATH: iFFT (Bottom half) -->
  <path d="M 530 290 L 190 290" class="bwd-path" marker-start="url(#arrPink)" />
  <!-- Wave graphic moving backward -->
  <path d="M 280 290 Q 290 305 300 290 T 320 290" fill="none" stroke="#ff007f" stroke-width="1.5" filter="url(#glow-pink)"/>
  <path d="M 390 290 Q 400 305 410 290 T 430 290" fill="none" stroke="#ff007f" stroke-width="1.5" filter="url(#glow-pink)"/>
  <text x="360" y="322" class="label" fill="#ff007f" text-anchor="middle">3. Backward Propagation (iFFT / ASM)</text>
  <text x="360" y="308" class="math" fill="#ff007f" text-anchor="middle">U_holo = Propagate{ U_img, -z }</text>

  <!-- Animated Flying Pulses along paths -->
  <circle cx="200" cy="150" r="5" class="fwd-pulse"/>
  <circle cx="520" cy="290" r="5" class="bwd-pulse"/>


  <!-- Right: Image Plane (Reconstruction) -->
  <g transform="translate(540, 90)">
    <rect x="0" y="0" width="140" height="260" class="plane-box"/>
    <text x="70" y="24" class="label" text-anchor="middle">Reconstructed Plane</text>
    <text x="70" y="38" class="sublabel" text-anchor="middle">(Image plane)</text>

    <!-- Target image placeholder: glowing green "H" for holography -->
    <g transform="translate(45, 55)" filter="url(#glow-green)">
      <!-- Render an "H" with pixels -->
      <!-- Left post -->
      <rect x="0" y="0" width="12" height="12" class="target-pixel" />
      <rect x="0" y="12" width="12" height="12" class="target-pixel" />
      <rect x="0" y="24" width="12" height="12" class="target-pixel" />
      <rect x="0" y="36" width="12" height="12" class="target-pixel" />
      <rect x="0" y="48" width="12" height="12" class="target-pixel" />
      <rect x="0" y="60" width="12" height="12" class="target-pixel" />
      <!-- Crossbar -->
      <rect x="12" y="30" width="12" height="12" class="target-pixel" />
      <rect x="24" y="30" width="12" height="12" class="target-pixel" />
      <!-- Right post -->
      <rect x="36" y="0" width="12" height="12" class="target-pixel" />
      <rect x="36" y="12" width="12" height="12" class="target-pixel" />
      <rect x="36" y="24" width="12" height="12" class="target-pixel" />
      <rect x="36" y="36" width="12" height="12" class="target-pixel" />
      <rect x="36" y="48" width="12" height="12" class="target-pixel" />
      <rect x="36" y="60" width="12" height="12" class="target-pixel" />

      <!-- Outline border -->
      <rect x="-8" y="-8" width="66" height="88" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-opacity="0.3" rx="3"/>
    </g>
    <text x="70" y="150" class="sublabel" text-anchor="middle" fill="#39ff14">Target Fringes (Airy)</text>

    <!-- Constraint Box -->
    <rect x="10" y="170" width="120" height="80" fill="#1f242c" stroke="#30363d" stroke-width="1" rx="4"/>
    <text x="70" y="188" class="sublabel" text-anchor="middle" font-weight="bold" fill="#00f0ff">Target Constraint</text>
    <text x="70" y="204" class="sublabel" text-anchor="middle">Replace Amplitude</text>
    <text x="70" y="218" class="sublabel" text-anchor="middle">Keep computed phase</text>
    <text x="70" y="238" class="math" text-anchor="middle">A &amp;leftarrow; &amp;radic;I_target</text>
  </g>

  <!-- Cycle Counter / Label -->
  <rect x="290" y="185" width="140" height="70" fill="#0d1117" stroke="#30363d" stroke-dasharray="3, 3" stroke-width="1.5" rx="5"/>
  <text x="360" y="205" class="label" text-anchor="middle" fill="#ffd700">ITERS: N = 50+</text>
  <text x="360" y="222" class="sublabel" text-anchor="middle">Error minimizes with</text>
  <text x="360" y="236" class="sublabel" text-anchor="middle">each round-trip</text>

</svg>
