<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;transition:all 0.3s ease;}
    .box:hover{stroke:var(--interactive-accent,#58a6ff);fill:rgba(88,166,255,0.02);filter:drop-shadow(0 0 4px rgba(88,166,255,0.15));}
    
    /* Crystal vibration animations (thermal energy simulation) */
    @keyframes wiggle-1 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(0.4px, -0.4px); }
      50% { transform: translate(-0.4px, 0.4px); }
      75% { transform: translate(0.4px, 0.4px); }
    }
    @keyframes wiggle-2 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-0.4px, 0.4px); }
      50% { transform: translate(0.4px, -0.4px); }
      75% { transform: translate(-0.4px, -0.4px); }
    }
    .atom-1 { animation: wiggle-1 0.4s ease-in-out infinite; }
    .atom-2 { animation: wiggle-2 0.35s ease-in-out infinite; }
    .atom-center { animation: wiggle-1 0.5s ease-in-out infinite; }
    
    /* Ashby Bubbles pulse & scale-in-place on hover */
    @keyframes pulse-bubble {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.05); opacity: 0.45; }
    }
    .bubble {
      transition: all 0.3s ease;
      animation: pulse-bubble 5s ease-in-out infinite;
      cursor: pointer;
    }
    .bubble:hover {
      animation: none !important;
      transform: scale(1.15) !important;
      opacity: 0.7 !important;
      stroke-width: 2px !important;
    }
    .b-cfrp { transform-origin: 290px 90px; animation-delay: 0s; }
    .b-steel { transform-origin: 330px 110px; animation-delay: 1.2s; }
    .b-al { transform-origin: 390px 130px; animation-delay: 2.4s; }
    .b-poly { transform-origin: 430px 155px; animation-delay: 3.6s; }
    
    /* Sequential selection glow */
    @keyframes method-glow {
      0%, 100% { stroke-width: 1.2; filter: brightness(0.9); }
      50% { stroke-width: 2.2; filter: brightness(1.2) drop-shadow(0 0 5px var(--interactive-accent,#58a6ff)); }
    }
    .m-step { transition: all 0.3s ease; cursor: pointer; }
    .m-step:hover { filter: brightness(1.4) drop-shadow(0 0 6px var(--interactive-accent,#58a6ff)) !important; stroke-width: 2px !important; fill: rgba(88,166,255,0.05); }
    .step-m1 { animation: method-glow 10s infinite; }
    .step-m2 { animation: method-glow 10s infinite 2s; }
    .step-m3 { animation: method-glow 10s infinite 4s; }
    .step-m4 { animation: method-glow 10s infinite 6s; }
    .step-m5 { animation: method-glow 10s infinite 8s; }
  </style>
  <text x="360" y="22" class="title" text-anchor="middle">34.2 — Materials Science: Structure → Properties → Processing → Performance</text>
  
  <!-- Crystal structures -->
  <rect x="20" y="35" width="200" height="175" class="box" rx="4"/>
  <text x="120" y="52" class="label" text-anchor="middle" font-weight="bold">Crystal Structures</text>
  <!-- BCC -->
  <rect x="35" y="60" width="50" height="50" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.2"/>
  <circle cx="60" cy="85" r="7" fill="var(--interactive-accent,#58a6ff)" opacity="0.7" class="atom-center"/>
  <circle cx="35" cy="60" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-1"/>
  <circle cx="85" cy="60" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-2"/>
  <circle cx="35" cy="110" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-2"/>
  <circle cx="85" cy="110" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-1"/>
  <text x="60" y="123" class="sub" text-anchor="middle">BCC (Iron α)</text>
  <!-- FCC -->
  <rect x="105" y="60" width="50" height="50" fill="none" stroke="#51cf66" stroke-width="1.2"/>
  <circle cx="130" cy="85" r="4" fill="#51cf66" opacity="0.6" class="atom-center"/>
  <circle cx="105" cy="85" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-1"/>
  <circle cx="155" cy="85" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-2"/>
  <circle cx="130" cy="60" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-2"/>
  <circle cx="130" cy="110" r="4" fill="var(--text-muted,#8b949e)" opacity="0.8" class="atom-1"/>
  <text x="130" y="123" class="sub" text-anchor="middle">FCC (Al, Cu)</text>
  <text x="120" y="142" class="sub" text-anchor="middle">BCC: harder, magnetic</text>
  <text x="120" y="154" class="sub" text-anchor="middle">FCC: ductile, formable</text>
  <text x="120" y="166" class="sub" text-anchor="middle">HCP: Mg, Ti — low ductility</text>
  <text x="120" y="180" class="sub" text-anchor="middle">Amorphous: glass, polymers</text>
  <text x="120" y="193" class="sub" text-anchor="middle">Grain size ↓ → strength ↑ (Hall-Petch)</text>
  
  <!-- Material classes -->
  <rect x="235" y="35" width="250" height="175" class="box" rx="4"/>
  <text x="360" y="52" class="label" text-anchor="middle" font-weight="bold">Material Classes &amp; Selection Space</text>
  <!-- Ashby chart axes -->
  <line x1="255" y1="180" x2="255" y2="70" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="255" y1="180" x2="470" y2="180" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <text x="253" y="68" class="mono" text-anchor="end">Strength</text>
  <text x="472" y="182" class="mono">Density →</text>
  <!-- Material bubbles (Animated) -->
  <ellipse cx="290" cy="90" rx="20" ry="15" fill="var(--interactive-accent,#58a6ff)" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" class="bubble b-cfrp"/>
  <text x="290" y="91" class="mono" text-anchor="middle" pointer-events="none">CFRP</text>
  <text x="290" y="101" class="mono" text-anchor="middle" pointer-events="none">composites</text>
  
  <ellipse cx="330" cy="110" rx="25" ry="18" fill="#51cf66" stroke="#51cf66" stroke-width="1" class="bubble b-steel"/>
  <text x="330" y="111" class="mono" text-anchor="middle" pointer-events="none">Steel alloys</text>
  <text x="330" y="121" class="mono" text-anchor="middle" pointer-events="none">Ti alloys</text>
  
  <ellipse cx="390" cy="130" rx="22" ry="14" fill="#ffd93d" stroke="#ffd93d" stroke-width="1" class="bubble b-al"/>
  <text x="390" y="131" class="mono" text-anchor="middle" pointer-events="none">Aluminium</text>
  <text x="390" y="141" class="mono" text-anchor="middle" pointer-events="none">alloys</text>
  
  <ellipse cx="430" cy="155" rx="20" ry="12" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="1" class="bubble b-poly"/>
  <text x="430" y="156" class="mono" text-anchor="middle" pointer-events="none">Polymers</text>
  <text x="430" y="166" class="mono" text-anchor="middle" pointer-events="none">foams</text>
  <text x="360" y="200" class="sub" text-anchor="middle">Ashby chart: log-log axes → material index lines = performance limits</text>
  
  <!-- Right: Processing effects + CES -->
  <rect x="500" y="35" width="200" height="175" class="box" rx="4"/>
  <text x="600" y="52" class="label" text-anchor="middle" font-weight="bold">Processing → Microstructure</text>
  <text x="510" y="70" class="sub" font-weight="bold">Annealing</text>
  <text x="510" y="82" class="sub">Slow cool → coarse grains → soft</text>
  <text x="510" y="95" class="sub" font-weight="bold">Quench &amp; Temper (steel)</text>
  <text x="510" y="107" class="sub">Rapid cool → martensite → hard</text>
  <text x="510" y="119" class="sub">Temper → toughness back</text>
  <text x="510" y="132" class="sub" font-weight="bold">Cold Working</text>
  <text x="510" y="144" class="sub">Dislocations pile up → work hardening</text>
  <text x="510" y="157" class="sub" font-weight="bold">Precipitation Hardening (Al 7075)</text>
  <text x="510" y="169" class="sub">Age at elevated T → fine precipitates</text>
  <text x="510" y="181" class="sub">→ highest strength-to-weight</text>
  <text x="510" y="195" class="sub">Free tool: CES EduPack student ed.</text>
  
  <!-- Bottom: Selection methodology -->
  <rect x="20" y="225" width="680" height="170" class="box" rx="4"/>
  <text x="360" y="243" class="label" text-anchor="middle" font-weight="bold">Cambridge Material Selection Methodology (Ashby)</text>
  
  <rect x="35" y="255" width="120" height="50" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.2" rx="3" class="m-step step-m1"/>
  <text x="95" y="275" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">1. Define</text>
  <text x="95" y="288" class="sub" text-anchor="middle">Function / Objective</text>
  <text x="95" y="300" class="sub" text-anchor="middle">/ Constraint / Free var</text>
  
  <rect x="175" y="255" width="120" height="50" fill="none" stroke="#51cf66" stroke-width="1.2" rx="3" class="m-step step-m2"/>
  <text x="235" y="275" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">2. Material Index</text>
  <text x="235" y="288" class="sub" text-anchor="middle">e.g. E^½/ρ for stiff</text>
  <text x="235" y="300" class="sub" text-anchor="middle">light beam</text>
  
  <rect x="315" y="255" width="120" height="50" fill="none" stroke="#ffd93d" stroke-width="1.2" rx="3" class="m-step step-m3"/>
  <text x="375" y="275" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">3. Ashby Chart</text>
  <text x="375" y="288" class="sub" text-anchor="middle">Plot index line</text>
  <text x="375" y="300" class="sub" text-anchor="middle">rank candidates</text>
  
  <rect x="455" y="255" width="120" height="50" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.2" rx="3" class="m-step step-m4"/>
  <text x="515" y="275" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">4. Screen</text>
  <text x="515" y="288" class="sub" text-anchor="middle">Corrosion, temp,</text>
  <text x="515" y="300" class="sub" text-anchor="middle">cost, availability</text>
  
  <rect x="595" y="255" width="105" height="50" fill="none" stroke="#ff6b6b" stroke-width="1.2" rx="3" class="m-step step-m5"/>
  <text x="647" y="275" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">5. Detail</text>
  <text x="647" y="288" class="sub" text-anchor="middle">Specific alloy grade</text>
  <text x="647" y="300" class="sub" text-anchor="middle">temper, finish spec</text>
  
  <line x1="155" y1="280" x2="175" y2="280" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="295" y1="280" x2="315" y2="280" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="435" y1="280" x2="455" y2="280" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  <line x1="575" y1="280" x2="595" y2="280" stroke="var(--text-muted,#8b949e)" stroke-width="1"/>
  
  <text x="360" y="332" class="sub" text-anchor="middle">Common indexes: E/ρ (stiff panel) · E^½/ρ (stiff beam) · σ_y/ρ (strong light) · σ_y^⅔/ρ (strong beam) · K_IC/σ_y (fracture safe)</text>
  <text x="360" y="348" class="sub" text-anchor="middle">For robotics: Al 6061-T6 (general structure) · Al 7075-T6 (high-load) · CFRP (aerospace/weight-critical) · PLA/PETG (3D printed prototypes)</text>
  <text x="360" y="364" class="sub" text-anchor="middle">For enclosures: Al 5052 (sheet metal/weld) · PC/ABS (injection mould) · HDPE (chemical resistant) · 316 SS (outdoor/marine)</text>
  <text x="360" y="380" class="sub" text-anchor="middle">Hall-Petch: σ_y = σ₀ + k·d^(-½) — finer grain → higher yield strength. Heat treatment changes d and phase (martensite vs pearlite).</text>
</svg>
