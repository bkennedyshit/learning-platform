<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;}
    .channel{fill:var(--background-secondary,#161b22);stroke:var(--interactive-accent,#58a6ff);stroke-width:1.2;}
  </style>
  <defs>
    <marker id="sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 2 L8 5 L0 8z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>
  <text x="360" y="22" class="title" text-anchor="middle">35.3 — DAW Workflow &amp; Signal Chain: Channels, Routing &amp; Mix Bus Architecture</text>
  <!-- DAW channel strip -->
  <rect x="20" y="35" width="130" height="280" class="box" rx="4"/>
  <text x="85" y="52" class="label" text-anchor="middle" font-weight="bold">Channel Strip</text>
  <rect x="32" y="60" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="75" class="sub" text-anchor="middle">Input (audio/MIDI)</text>
  <rect x="32" y="88" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="103" class="sub" text-anchor="middle">Pre-FX Insert 1</text>
  <rect x="32" y="116" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="131" class="sub" text-anchor="middle">Pre-FX Insert 2</text>
  <rect x="32" y="144" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="159" class="sub" text-anchor="middle">EQ (4-band)</text>
  <rect x="32" y="172" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="187" class="sub" text-anchor="middle">Compressor</text>
  <rect x="32" y="200" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="215" class="sub" text-anchor="middle">Send → FX Bus</text>
  <rect x="32" y="228" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="243" class="sub" text-anchor="middle">Fader (volume)</text>
  <rect x="32" y="256" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="271" class="sub" text-anchor="middle">Pan (L–C–R)</text>
  <rect x="32" y="284" width="86" height="22" class="channel" rx="2"/>
  <text x="75" y="299" class="sub" text-anchor="middle">→ Group/Master</text>
  <line x1="75" y1="82" x2="75" y2="88" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="110" x2="75" y2="116" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="138" x2="75" y2="144" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="166" x2="75" y2="172" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="194" x2="75" y2="200" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="222" x2="75" y2="228" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="250" x2="75" y2="256" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <line x1="75" y1="278" x2="75" y2="284" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" marker-end="url(#sig)"/>
  <!-- DAW routing diagram -->
  <rect x="165" y="35" width="350" height="280" class="box" rx="4"/>
  <text x="340" y="52" class="label" text-anchor="middle" font-weight="bold">DAW Routing Architecture</text>
  <!-- Instrument tracks -->
  <rect x="178" y="62" width="75" height="22" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="2"/>
  <text x="215" y="77" class="sub" text-anchor="middle">Kick drum</text>
  <rect x="178" y="90" width="75" height="22" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="2"/>
  <text x="215" y="105" class="sub" text-anchor="middle">Snare</text>
  <rect x="178" y="118" width="75" height="22" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="2"/>
  <text x="215" y="133" class="sub" text-anchor="middle">Hi-hat</text>
  <!-- Group buses -->
  <rect x="290" y="75" width="80" height="55" fill="none" stroke="#51cf66" stroke-width="1.2" rx="3"/>
  <text x="330" y="95" class="sub" text-anchor="middle" fill="#51cf66">DRUM BUS</text>
  <text x="330" y="108" class="sub" text-anchor="middle">Bus comp</text>
  <text x="330" y="120" class="sub" text-anchor="middle">Transient shaper</text>
  <line x1="253" y1="73" x2="290" y2="95" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <line x1="253" y1="101" x2="290" y2="103" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <line x1="253" y1="129" x2="290" y2="115" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <circle r="2.5" fill="var(--interactive-accent,#58a6ff)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M253,73 L290,95" />
  </circle>
  <circle r="2.5" fill="var(--interactive-accent,#58a6ff)">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M253,101 L290,103" />
  </circle>
  <circle r="2.5" fill="var(--interactive-accent,#58a6ff)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M253,129 L290,115" />
  </circle>
  <!-- Synth tracks -->
  <rect x="178" y="158" width="75" height="22" fill="none" stroke="#ffd93d" stroke-width="1" rx="2"/>
  <text x="215" y="173" class="sub" text-anchor="middle">Bass synth</text>
  <rect x="178" y="186" width="75" height="22" fill="none" stroke="#ffd93d" stroke-width="1" rx="2"/>
  <text x="215" y="201" class="sub" text-anchor="middle">Lead synth</text>
  <rect x="178" y="214" width="75" height="22" fill="none" stroke="#ffd93d" stroke-width="1" rx="2"/>
  <text x="215" y="229" class="sub" text-anchor="middle">Pad/chords</text>
  <rect x="290" y="163" width="80" height="55" fill="none" stroke="#ffd93d" stroke-width="1.2" rx="3"/>
  <text x="330" y="183" class="sub" text-anchor="middle" fill="#ffd93d">SYNTH BUS</text>
  <text x="330" y="196" class="sub" text-anchor="middle">Saturation</text>
  <text x="330" y="208" class="sub" text-anchor="middle">Stereo width</text>
  <line x1="253" y1="169" x2="290" y2="183" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <line x1="253" y1="197" x2="290" y2="193" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <line x1="253" y1="225" x2="290" y2="203" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <circle r="2.5" fill="#ffd93d">
    <animateMotion dur="2s" repeatCount="indefinite" path="M253,169 L290,183" />
  </circle>
  <circle r="2.5" fill="#ffd93d">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M253,197 L290,193" />
  </circle>
  <circle r="2.5" fill="#ffd93d">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M253,225 L290,203" />
  </circle>
  <!-- Master bus -->
  <rect x="390" y="100" width="100" height="120" fill="none" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="440" y="120" class="sub" text-anchor="middle" fill="#ff6b6b" font-weight="bold">MASTER BUS</text>
  <text x="440" y="136" class="sub" text-anchor="middle">Glue comp</text>
  <text x="440" y="150" class="sub" text-anchor="middle">EQ (subtle)</text>
  <text x="440" y="164" class="sub" text-anchor="middle">Stereo imager</text>
  <text x="440" y="178" class="sub" text-anchor="middle">Limiter (ceiling</text>
  <text x="440" y="190" class="sub" text-anchor="middle">-1.0 dBTP)</text>
  <text x="440" y="208" class="sub" text-anchor="middle">→ Stereo output</text>
  <line x1="370" y1="103" x2="390" y2="130" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <line x1="370" y1="190" x2="390" y2="175" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <circle r="3" fill="#51cf66">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M370,103 L390,130" />
  </circle>
  <circle r="3" fill="#ffd93d">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M370,190 L390,175" />
  </circle>
  <!-- FX returns -->
  <rect x="178" y="255" width="190" height="22" fill="none" stroke="var(--text-muted,#8b949e)" stroke-width="1" stroke-dasharray="3 2" rx="2"/>
  <text x="273" y="270" class="sub" text-anchor="middle">FX Return: Reverb room · Delay send · Chorus send</text>
  <line x1="440" y1="220" x2="440" y2="255" stroke="var(--text-muted,#8b949e)" stroke-dasharray="2 2" stroke-width="0.8"/>
  <line x1="368" y1="265" x2="390" y2="165" stroke="var(--text-muted,#8b949e)" stroke-dasharray="2 2" stroke-width="0.8"/>
  <circle r="2" fill="#ff6b6b">
    <animateMotion dur="3s" repeatCount="indefinite" path="M440,220 L440,255" />
  </circle>
  <circle r="2" fill="var(--text-muted,#8b949e)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M368,265 L390,165" />
  </circle>
  <!-- Right: arrangement view concepts -->
  <rect x="530" y="35" width="170" height="280" class="box" rx="4"/>
  <text x="615" y="52" class="label" text-anchor="middle" font-weight="bold">Arrangement View</text>
  <text x="540" y="68" class="sub" font-weight="bold">Song structure (EDM):</text>
  <text x="540" y="82" class="mono">0:00  Intro (8 bars)</text>
  <text x="540" y="96" class="mono">0:32  Build (8 bars)</text>
  <text x="540" y="110" class="mono">1:04  Drop (16 bars)</text>
  <text x="540" y="124" class="mono">1:36  Breakdown</text>
  <text x="540" y="138" class="mono">2:08  Build 2</text>
  <text x="540" y="152" class="mono">2:40  Drop 2</text>
  <text x="540" y="166" class="mono">3:12  Outro</text>
  <text x="540" y="183" class="sub" font-weight="bold">Clip-based workflow:</text>
  <text x="540" y="197" class="sub">Piano roll: draw MIDI notes</text>
  <text x="540" y="209" class="sub">Audio clip: record/sample</text>
  <text x="540" y="221" class="sub">Scene: vertical = all clips same bar</text>
  <text x="540" y="237" class="sub" font-weight="bold">Automation:</text>
  <text x="540" y="249" class="sub">Draw envelope on any parameter</text>
  <text x="540" y="261" class="sub">Record: turn knob while playing</text>
  <text x="540" y="273" class="sub">Clip envelope = per-clip, loops</text>
  <text x="540" y="287" class="sub">Global = fades/build automation</text>
  <text x="540" y="303" class="sub">Free DAWs: LMMS · GarageBand iOS</text>
  <!-- Bottom: latency, buffer, sample rate -->
  <rect x="20" y="330" width="680" height="75" class="box" rx="4"/>
  <text x="360" y="347" class="label" text-anchor="middle" font-weight="bold">Audio Engine: Sample Rate, Bit Depth &amp; Buffer Size (Latency)</text>
  <text x="360" y="364" class="sub" text-anchor="middle">Sample rate: 44.1 kHz (CD/distribution) · 48 kHz (video/broadcast) · 96 kHz (tracking only — no audible benefit to listeners). Nyquist = half sample rate = max freq captured.</text>
  <text x="360" y="378" class="sub" text-anchor="middle">Bit depth: 16-bit (65536 levels, CD) = 96 dB dynamic range · 24-bit = 144 dB (tracking headroom) · 32-bit float = no clipping in the DAW bus (use for internal routing).</text>
  <text x="360" y="392" class="sub" text-anchor="middle">Buffer size: 64–128 samples → ~3ms latency for tracking · 256–512 for mixing · 1024 for rendering. ASIO driver (Windows) or CoreAudio (Mac) required for low-latency performance.</text>
</svg>
