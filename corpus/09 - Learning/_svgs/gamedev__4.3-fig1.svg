<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .grid-line { stroke: var(--text-muted, #8b949e); stroke-width: 0.5; opacity: 0.4; }
    .tile-fill { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1; cursor: pointer; transition: all 0.2s; }
    .tile-fill:hover { fill: var(--interactive-accent, #58a6ff); opacity: 0.3; stroke: var(--interactive-accent, #58a6ff); }
    .tile-grass { fill: #4a7c3f; opacity: 0.6; stroke: var(--text-normal, #c9d1d9); stroke-width: 0.5; }
    .tile-water { fill: #3a6fb5; opacity: 0.5; stroke: var(--text-normal, #c9d1d9); stroke-width: 0.5; }
    .tile-path { fill: #8b7355; opacity: 0.6; stroke: var(--text-normal, #c9d1d9); stroke-width: 0.5; }
    .sprite-box { fill: var(--interactive-accent, #58a6ff); opacity: 0.8; stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .aabb { fill: none; stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; stroke-dasharray: 4,3; }
    .coord { font-family: monospace; font-size: 9px; fill: var(--text-muted, #8b949e); }
    
    /* Animations */
    @keyframes walk-path {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(32px, 0px); }
      50% { transform: translate(64px, 0px); }
      75% { transform: translate(64px, 32px); }
    }
    .moving-player {
      animation: walk-path 8s infinite ease-in-out;
    }
    
    @keyframes sprite-frame {
      0%, 24.9% { transform: translate(0px, 0px); }
      25%, 49.9% { transform: translate(48px, 0px); }
      50%, 74.9% { transform: translate(96px, 0px); }
      75%, 100% { transform: translate(144px, 0px); }
    }
    .frame-highlight {
      animation: sprite-frame 1.6s steps(1) infinite;
    }
    
    @keyframes collision-move {
      0%, 100% { transform: translate(75px, 0px); }
      40%, 60% { transform: translate(0px, 0px); }
    }
    @keyframes overlap-appear {
      0%, 30%, 70%, 100% { opacity: 0; }
      40%, 60% { opacity: 0.45; fill: #e74c3c; }
    }
    @keyframes text-flash {
      0%, 30%, 70%, 100% { fill: var(--text-normal, #c9d1d9); }
      40%, 60% { fill: #e74c3c; font-weight: bold; }
    }
    
    .aabb-b {
      animation: collision-move 4s infinite ease-in-out;
    }
    .aabb-overlap {
      animation: overlap-appear 4s infinite ease-in-out;
    }
    .collision-status-text {
      animation: text-flash 4s infinite ease-in-out;
    }
  </style>
  
  <text x="150" y="20" class="title" text-anchor="middle">Tilemap Grid (16×16 tiles)</text>
  <!-- Tilemap grid -->
  <g transform="translate(20, 30)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="32" height="32" class="tile-grass"/><rect x="32" y="0" width="32" height="32" class="tile-grass"/>
    <rect x="64" y="0" width="32" height="32" class="tile-grass"/><rect x="96" y="0" width="32" height="32" class="tile-grass"/>
    <rect x="128" y="0" width="32" height="32" class="tile-water"/><rect x="160" y="0" width="32" height="32" class="tile-water"/>
    <rect x="192" y="0" width="32" height="32" class="tile-grass"/><rect x="224" y="0" width="32" height="32" class="tile-grass"/>
    <!-- Row 1 -->
    <rect x="0" y="32" width="32" height="32" class="tile-grass"/><rect x="32" y="32" width="32" height="32" class="tile-path"/>
    <rect x="64" y="32" width="32" height="32" class="tile-path"/><rect x="96" y="32" width="32" height="32" class="tile-path"/>
    <rect x="128" y="32" width="32" height="32" class="tile-water"/><rect x="160" y="32" width="32" height="32" class="tile-grass"/>
    <rect x="192" y="32" width="32" height="32" class="tile-grass"/><rect x="224" y="32" width="32" height="32" class="tile-grass"/>
    <!-- Row 2 -->
    <rect x="0" y="64" width="32" height="32" class="tile-grass"/><rect x="32" y="64" width="32" height="32" class="tile-grass"/>
    <rect x="64" y="64" width="32" height="32" class="tile-grass"/><rect x="96" y="64" width="32" height="32" class="tile-path"/>
    <rect x="128" y="64" width="32" height="32" class="tile-grass"/><rect x="160" y="64" width="32" height="32" class="tile-grass"/>
    <rect x="192" y="64" width="32" height="32" class="tile-grass"/><rect x="224" y="64" width="32" height="32" class="tile-grass"/>
    
    <!-- Moving player group -->
    <g class="moving-player">
      <!-- Sprite on tilemap -->
      <rect x="34" y="34" width="28" height="28" class="sprite-box" rx="3"/>
      <text x="48" y="52" class="label" text-anchor="middle" fill="var(--text-normal, #c9d1d9)" font-size="10">P</text>
      <!-- AABB collision box -->
      <rect x="30" y="30" width="36" height="36" class="aabb"/>
    </g>
    
    <!-- Coordinates -->
    <text x="0" y="108" class="coord">(0,3)</text>
    <text x="32" y="108" class="coord">(1,3)</text>
    <text x="96" y="108" class="coord">(3,3)</text>
  </g>
  
  <!-- Sprite sheet section -->
  <text x="440" y="20" class="title" text-anchor="middle">Sprite Sheet &amp; AABB</text>
  <g transform="translate(340, 30)">
    <rect x="0" y="0" width="48" height="48" class="tile-fill"/><rect x="48" y="0" width="48" height="48" class="tile-fill"/>
    <rect x="96" y="0" width="48" height="48" class="tile-fill"/><rect x="144" y="0" width="48" height="48" class="tile-fill"/>
    <rect x="0" y="48" width="48" height="48" class="tile-fill"/><rect x="48" y="48" width="48" height="48" class="tile-fill"/>
    <rect x="96" y="48" width="48" height="48" class="tile-fill"/><rect x="144" y="48" width="48" height="48" class="tile-fill"/>
    
    <!-- Frame highlight -->
    <rect x="0" y="0" width="48" height="48" fill="none" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2.5" class="frame-highlight"/>
    
    <text x="24" y="28" class="label" text-anchor="middle" font-size="10">Frame 0</text>
    <text x="72" y="28" class="label" text-anchor="middle" font-size="10">Frame 1</text>
    <text x="120" y="28" class="label" text-anchor="middle" font-size="10">Frame 2</text>
    <text x="168" y="28" class="label" text-anchor="middle" font-size="10">Frame 3</text>
  </g>
  
  <!-- Physics section -->
  <text x="300" y="180" class="title" text-anchor="middle">2D Collision Detection</text>
  
  <!-- AABB overlap diagram -->
  <g transform="translate(0, 0)">
    <rect x="80" y="200" width="80" height="60" fill="var(--interactive-accent, #58a6ff)" opacity="0.15" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2"/>
    <text x="120" y="235" class="label" text-anchor="middle">A</text>
    
    <!-- Moving Box B -->
    <g class="aabb-b">
      <rect x="130" y="220" width="80" height="60" fill="var(--text-accent, #79c0ff)" opacity="0.15" stroke="var(--text-accent, #79c0ff)" stroke-width="2"/>
      <text x="170" y="255" class="label" text-anchor="middle">B</text>
    </g>
    
    <!-- Overlap region (static location, but width is 30 when B is overlaps) -->
    <rect x="130" y="220" width="30" height="40" fill="var(--interactive-accent, #58a6ff)" opacity="0" stroke="none" class="aabb-overlap"/>
    <text x="145" y="295" class="label collision-status-text" text-anchor="middle" font-size="10">Overlap = AABB intersection</text>
  </g>
  
  <!-- Separating axis -->
  <g transform="translate(300, 195)">
    <rect x="0" y="20" width="70" height="50" fill="none" stroke="var(--text-normal, #c9d1d9)" stroke-width="1.5" transform="rotate(15, 35, 45)"/>
    <rect x="80" y="30" width="70" height="50" fill="none" stroke="var(--text-normal, #c9d1d9)" stroke-width="1.5" transform="rotate(-10, 115, 55)"/>
    <line x1="0" y1="90" x2="200" y2="90" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="110" class="label" text-anchor="middle" font-size="10">SAT: project onto axes</text>
    <!-- Projections -->
    <line x1="10" y1="85" x2="75" y2="85" stroke="var(--interactive-accent, #58a6ff)" stroke-width="3"/>
    <line x1="85" y1="85" x2="155" y2="85" stroke="var(--text-accent, #79c0ff)" stroke-width="3"/>
    <text x="100" y="125" class="label" text-anchor="middle" font-size="10">Gap found → no collision</text>
  </g>
  
  <!-- Formula box -->
  <rect x="80" y="330" width="440" height="40" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="300" y="350" class="label" text-anchor="middle" font-size="11">AABB overlap: (A.max.x > B.min.x) ∧ (A.min.x &lt; B.max.x) ∧ (A.max.y > B.min.y) ∧ (A.min.y &lt; B.max.y)</text>
  <text x="300" y="365" class="coord" text-anchor="middle">O(1) per pair — use spatial hash or quadtree for broad phase</text>
</svg>
