<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      .text { font-family: sans-serif; fill: #333; }
      .line { fill: none; stroke: #333; stroke-width: 2; }
      .box { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 2; }
      .add { fill: #fff; stroke: #2c3e50; stroke-width: 2; }
      .mult { fill: #fff; stroke: #2c3e50; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow" />
    </marker>
  </defs>

  <text x="400" y="30" class="text" font-size="22" font-weight="bold" text-anchor="middle">Digital Filter Structures: FIR vs IIR</text>

  <!-- FIR Structure -->
  <g transform="translate(50, 100)">
    <text x="150" y="-20" class="text" font-size="16" font-weight="bold" text-anchor="middle">FIR Filter (Transversal)</text>
    
    <!-- Input -->
    <text x="0" y="25" class="text">x[n]</text>
    <line x1="30" y1="20" x2="80" y2="20" class="line" marker-end="url(#arrow)" />

    <!-- Delay chain -->
    <rect x="80" y="0" width="40" height="40" class="box" />
    <text x="100" y="25" class="text" text-anchor="middle">z⁻¹</text>
    <line x1="120" y1="20" x2="160" y2="20" class="line" marker-end="url(#arrow)" />
    
    <rect x="160" y="0" width="40" height="40" class="box" />
    <text x="180" y="25" class="text" text-anchor="middle">z⁻¹</text>
    <line x1="200" y1="20" x2="240" y2="20" class="line" marker-end="url(#arrow)" />
    
    <!-- Multipliers -->
    <circle cx="50" cy="80" r="15" class="mult" /> <text x="50" y="85" class="text" text-anchor="middle">×</text>
    <text x="25" y="85" class="text">h₀</text>
    <line x1="50" y1="20" x2="50" y2="65" class="line" marker-end="url(#arrow)" />
    
    <circle cx="140" cy="80" r="15" class="mult" /> <text x="140" y="85" class="text" text-anchor="middle">×</text>
    <text x="115" y="85" class="text">h₁</text>
    <line x1="140" y1="20" x2="140" y2="65" class="line" marker-end="url(#arrow)" />

    <circle cx="220" cy="80" r="15" class="mult" /> <text x="220" y="85" class="text" text-anchor="middle">×</text>
    <text x="195" y="85" class="text">h₂</text>
    <line x1="220" y1="20" x2="220" y2="65" class="line" marker-end="url(#arrow)" />

    <!-- Adders -->
    <circle cx="50" cy="140" r="15" class="add" /> <text x="50" y="145" class="text" text-anchor="middle">+</text>
    <circle cx="140" cy="140" r="15" class="add" /> <text x="140" y="145" class="text" text-anchor="middle">+</text>
    <circle cx="220" cy="140" r="15" class="add" /> <text x="220" y="145" class="text" text-anchor="middle">+</text>

    <!-- Adder Connections -->
    <line x1="50" y1="95" x2="50" y2="125" class="line" marker-end="url(#arrow)" />
    <line x1="140" y1="95" x2="140" y2="125" class="line" marker-end="url(#arrow)" />
    <line x1="220" y1="95" x2="220" y2="125" class="line" marker-end="url(#arrow)" />
    
    <line x1="220" y1="155" x2="220" y2="180" class="line" />
    <line x1="220" y1="180" x2="140" y2="180" class="line" />
    <line x1="140" y1="180" x2="140" y2="155" class="line" marker-end="url(#arrow)" />
    
    <line x1="125" y1="140" x2="65" y2="140" class="line" marker-end="url(#arrow)" />
    <line x1="35" y1="140" x2="-10" y2="140" class="line" marker-end="url(#arrow)" />
    
    <text x="-40" y="145" class="text">y[n]</text>
  </g>

  <!-- IIR Structure (Direct Form II Biquad) -->
  <g transform="translate(480, 100)">
    <text x="120" y="-20" class="text" font-size="16" font-weight="bold" text-anchor="middle">IIR Biquad (Direct Form II)</text>
    
    <text x="0" y="25" class="text">x[n]</text>
    <line x1="30" y1="20" x2="60" y2="20" class="line" marker-end="url(#arrow)" />
    
    <circle cx="80" cy="20" r="15" class="add" /> <text x="80" y="25" class="text" text-anchor="middle">+</text>
    <line x1="95" y1="20" x2="180" y2="20" class="line" />
    
    <!-- Central Delay Line -->
    <line x1="120" y1="20" x2="120" y2="40" class="line" marker-end="url(#arrow)" />
    <rect x="100" y="40" width="40" height="40" class="box" /> <text x="120" y="65" class="text" text-anchor="middle">z⁻¹</text>
    
    <line x1="120" y1="80" x2="120" y2="100" class="line" marker-end="url(#arrow)" />
    <rect x="100" y="100" width="40" height="40" class="box" /> <text x="120" y="125" class="text" text-anchor="middle">z⁻¹</text>

    <!-- Feedforward (b) multipliers -->
    <circle cx="180" cy="20" r="15" class="mult" /> <text x="180" y="25" class="text" text-anchor="middle">×</text> <text x="180" y="-5" class="text" text-anchor="middle">b₀</text>
    
    <line x1="120" y1="90" x2="180" y2="90" class="line" marker-end="url(#arrow)" />
    <circle cx="180" cy="90" r="15" class="mult" /> <text x="180" y="95" class="text" text-anchor="middle">×</text> <text x="210" y="95" class="text">b₁</text>
    
    <line x1="120" y1="150" x2="180" y2="150" class="line" marker-end="url(#arrow)" />
    <circle cx="180" cy="150" r="15" class="mult" /> <text x="180" y="155" class="text" text-anchor="middle">×</text> <text x="210" y="155" class="text">b₂</text>

    <!-- Feedforward Adders -->
    <circle cx="250" cy="20" r="15" class="add" /> <text x="250" y="25" class="text" text-anchor="middle">+</text>
    <line x1="195" y1="20" x2="235" y2="20" class="line" marker-end="url(#arrow)" />
    
    <circle cx="250" cy="90" r="15" class="add" /> <text x="250" y="95" class="text" text-anchor="middle">+</text>
    <line x1="250" y1="90" x2="250" y2="35" class="line" marker-end="url(#arrow)" />
    <line x1="195" y1="90" x2="235" y2="90" class="line" marker-end="url(#arrow)" />

    <line x1="195" y1="150" x2="250" y2="150" class="line" />
    <line x1="250" y1="150" x2="250" y2="105" class="line" marker-end="url(#arrow)" />

    <!-- Feedback (a) multipliers -->
    <line x1="120" y1="90" x2="60" y2="90" class="line" marker-end="url(#arrow)" />
    <circle cx="60" cy="90" r="15" class="mult" /> <text x="60" y="95" class="text" text-anchor="middle">×</text> <text x="20" y="95" class="text">-a₁</text>
    
    <line x1="120" y1="150" x2="60" y2="150" class="line" marker-end="url(#arrow)" />
    <circle cx="60" cy="150" r="15" class="mult" /> <text x="60" y="155" class="text" text-anchor="middle">×</text> <text x="20" y="155" class="text">-a₂</text>

    <!-- Feedback Adders -->
    <circle cx="60" cy="20" r="15" class="add" /> <!-- Used as just a node/adder -->
    <line x1="60" y1="75" x2="60" y2="35" class="line" marker-end="url(#arrow)" />
    <line x1="60" y1="135" x2="60" y2="105" class="line" marker-end="url(#arrow)" />

    <!-- Output -->
    <line x1="265" y1="20" x2="310" y2="20" class="line" marker-end="url(#arrow)" />
    <text x="320" y="25" class="text">y[n]</text>
  </g>

  <!-- Animation for Data Flow -->
  <circle cx="120" cy="20" r="5" fill="#e74c3c">
    <animate attributeName="cy" values="20;40;40;80;100;100;150" dur="3s" repeatCount="indefinite" />
  </circle>

</svg>
