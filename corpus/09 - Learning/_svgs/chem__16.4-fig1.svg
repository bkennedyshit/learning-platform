<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .energy-curve { fill: none; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; }
    .axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .dashed { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 4,3; }
    .ea-arrow { stroke: #ff6b6b; stroke-width: 2; fill: none; marker-end: url(#earr); }
    .dh-arrow { stroke: #4dabf7; stroke-width: 2; fill: none; marker-end: url(#earr); }
    .ts-dot { fill: #ff6b6b; stroke: var(--text-normal, #c9d1d9); stroke-width: 1; }
    .fill-area { fill: var(--interactive-accent, #58a6ff); opacity: 0.1; }
  </style>
  <defs><marker id="earr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/></marker></defs>
  <text x="300" y="20" class="title" text-anchor="middle">Reaction Energy Diagram (Exothermic)</text>
  <!-- Axes -->
  <line x1="60" y1="310" x2="560" y2="310" class="axis"/>
  <line x1="60" y1="310" x2="60" y2="40" class="axis"/>
  <text x="310" y="340" class="label" text-anchor="middle">Reaction Coordinate →</text>
  <text x="30" y="175" class="label" text-anchor="middle" transform="rotate(-90 30 175)">Potential Energy</text>
  <!-- Reactant level -->
  <line x1="80" y1="150" x2="180" y2="150" class="dashed"/>
  <text x="130" y="140" class="label" text-anchor="middle">Reactants</text>
  <!-- Product level -->
  <line x1="420" y1="220" x2="540" y2="220" class="dashed"/>
  <text x="480" y="210" class="label" text-anchor="middle">Products</text>
  <!-- Energy curve -->
  <path d="M 130 150 C 200 150, 240 150, 280 80 C 320 10, 340 80, 380 150 C 420 220, 460 220, 480 220" class="energy-curve"/>
  <!-- Transition state -->
  <circle cx="280" cy="80" r="5" class="ts-dot"/>
  <text x="280" y="65" class="label" text-anchor="middle">Transition State (‡)</text>
  <!-- Ea arrow -->
  <line x1="190" y1="150" x2="190" y2="80" class="ea-arrow" style="stroke: #ff6b6b;"/>
  <text x="175" y="115" class="sublabel" fill="#ff6b6b">E_a</text>
  <!-- ΔH arrow -->
  <line x1="540" y1="150" x2="540" y2="220" class="dh-arrow" style="stroke: #4dabf7;"/>
  <text x="555" y="185" class="sublabel" fill="#4dabf7">ΔH</text>
  <text x="555" y="198" class="sublabel" fill="#4dabf7">(&lt;0)</text>
  <!-- Catalyst curve (dashed, lower barrier) -->
  <path d="M 130 150 C 200 150, 230 120, 280 110 C 330 100, 360 150, 380 180 C 420 220, 460 220, 480 220" fill="none" stroke="var(--text-muted, #8b949e)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="125" class="sublabel">with catalyst</text>
  <text x="320" y="137" class="sublabel">(lower E_a)</text>
  <!-- Arrhenius box -->
  <rect x="350" y="270" width="200" height="55" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="4"/>
  <text x="450" y="290" class="label" text-anchor="middle">Arrhenius: k = A·e^(-Ea/RT)</text>
  <text x="450" y="308" class="sublabel" text-anchor="middle">From Boltzmann: fraction with E ≥ Ea</text>
  <text x="450" y="320" class="sublabel" text-anchor="middle">ΔG° = -RT ln K (equilibrium)</text>
</svg>
