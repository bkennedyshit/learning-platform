<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .text-code { font-family: 'Courier New', Courier, monospace; font-size: 24px; font-weight: bold; fill: #e2e8f0; }
      .token-box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .token-text { font-family: 'Courier New', Courier, monospace; font-size: 16px; fill: #93c5fd; }
      .token-type { font-family: sans-serif; font-size: 12px; fill: #64748b; font-weight: bold; }
      .highlight { fill: #3b82f6; opacity: 0; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0f172a" rx="12" />

  <text x="400" y="40" font-family="sans-serif" font-size="20" fill="#f8fafc" text-anchor="middle" font-weight="bold" letter-spacing="2">LEXICAL ANALYSIS</text>

  <!-- Source Code Area -->
  <g transform="translate(100, 120)">
    <rect width="600" height="60" fill="#1e293b" rx="8" stroke="#475569" stroke-width="2"/>
    <text x="30" y="40" class="text-code" id="sourceText">
      <tspan>int</tspan> <tspan>x</tspan> <tspan>=</tspan> <tspan>42</tspan><tspan>;</tspan>
    </text>

    <!-- Scanning Highlight -->
    <rect x="25" y="15" width="45" height="30" class="highlight" rx="4">
      <animate attributeName="x" values="25; 85; 115; 145; 180" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="4s" repeatCount="indefinite" calcMode="discrete" />
      <animate attributeName="width" values="45; 20; 20; 30; 20" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="4s" repeatCount="indefinite" calcMode="discrete" />
      <animate attributeName="opacity" values="0.3; 0.3" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Arrows -->
  <path d="M 150 180 L 150 250" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 270 180 L 270 250" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 400 180 L 400 250" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 530 180 L 530 250" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 650 180 L 650 250" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Tokens Area -->
  <g transform="translate(90, 260)">
    <!-- Token 1 -->
    <g transform="translate(0,0)">
      <rect width="110" height="60" class="token-box">
        <animate attributeName="stroke" values="#3b82f6;#60a5fa;#3b82f6" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="55" y="25" class="token-type" text-anchor="middle">KEYWORD</text>
      <text x="55" y="45" class="token-text" text-anchor="middle">"int"</text>
      <animateTransform attributeName="transform" type="translate" values="0,10; 0,0; 0,0" dur="4s" repeatCount="indefinite" keyTimes="0; 0.1; 1"/>
      <animate attributeName="opacity" values="0; 1; 1" dur="4s" repeatCount="indefinite" keyTimes="0; 0.1; 1"/>
    </g>

    <!-- Token 2 -->
    <g transform="translate(130,0)">
      <rect width="100" height="60" class="token-box" stroke="#10b981">
        <animate attributeName="stroke" values="#10b981;#34d399;#10b981" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="50" y="25" class="token-type" text-anchor="middle">IDENTIFIER</text>
      <text x="50" y="45" class="token-text" text-anchor="middle" fill="#a7f3d0">"x"</text>
      <animateTransform attributeName="transform" type="translate" values="130,10; 130,0; 130,0" dur="4s" repeatCount="indefinite" keyTimes="0; 0.35; 1"/>
      <animate attributeName="opacity" values="0; 1; 1" dur="4s" repeatCount="indefinite" keyTimes="0; 0.35; 1"/>
    </g>

    <!-- Token 3 -->
    <g transform="translate(250,0)">
      <rect width="100" height="60" class="token-box" stroke="#f59e0b">
        <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="50" y="25" class="token-type" text-anchor="middle">OPERATOR</text>
      <text x="50" y="45" class="token-text" text-anchor="middle" fill="#fde68a">"="</text>
      <animateTransform attributeName="transform" type="translate" values="250,10; 250,0; 250,0" dur="4s" repeatCount="indefinite" keyTimes="0; 0.6; 1"/>
      <animate attributeName="opacity" values="0; 1; 1" dur="4s" repeatCount="indefinite" keyTimes="0; 0.6; 1"/>
    </g>

    <!-- Token 4 -->
    <g transform="translate(370,0)">
      <rect width="110" height="60" class="token-box" stroke="#8b5cf6">
        <animate attributeName="stroke" values="#8b5cf6;#a78bfa;#8b5cf6" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="55" y="25" class="token-type" text-anchor="middle">NUMBER</text>
      <text x="55" y="45" class="token-text" text-anchor="middle" fill="#ddd6fe">"42"</text>
      <animateTransform attributeName="transform" type="translate" values="370,10; 370,0; 370,0" dur="4s" repeatCount="indefinite" keyTimes="0; 0.85; 1"/>
      <animate attributeName="opacity" values="0; 1; 1" dur="4s" repeatCount="indefinite" keyTimes="0; 0.85; 1"/>
    </g>

    <!-- Token 5 -->
    <g transform="translate(500,0)">
      <rect width="100" height="60" class="token-box" stroke="#ec4899">
        <animate attributeName="stroke" values="#ec4899;#f472b6;#ec4899" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="50" y="25" class="token-type" text-anchor="middle">PUNCT</text>
      <text x="50" y="45" class="token-text" text-anchor="middle" fill="#fbcfe8">";"</text>
      <animateTransform attributeName="transform" type="translate" values="500,10; 500,0; 500,0" dur="4s" repeatCount="indefinite" keyTimes="0; 0.95; 1"/>
      <animate attributeName="opacity" values="0; 1; 1" dur="4s" repeatCount="indefinite" keyTimes="0; 0.95; 1"/>
    </g>
  </g>
</svg>
