<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .layer { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.2; rx: 4; transition: all 0.2s; cursor: pointer; }
    .layer:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .rw-layer { fill: var(--interactive-accent, #58a6ff); opacity: 0.15; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 4; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .detail { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .arrow { stroke: var(--text-muted, #8b949e); stroke-width: 1; marker-end: url(#dock-arr); }
    .section { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
  </style>
  <defs><marker id="dock-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 2 L 7 5 L 0 8 z" fill="var(--text-muted, #8b949e)"/></marker></defs>

  <text x="300" y="20" class="title">Docker Image Layers &amp; Container Lifecycle</text>

  <!-- Image layers (left) -->
  <text x="150" y="50" class="section">Image (Read-Only Layers)</text>
  <rect x="50" y="280" width="200" height="30" class="layer"/><text x="150" y="300" class="label">Base OS (python:3.12-slim)</text>
  <rect x="50" y="240" width="200" height="30" class="layer"/><text x="150" y="260" class="label">apt-get install deps</text>
  <rect x="50" y="200" width="200" height="30" class="layer"/><text x="150" y="220" class="label">COPY requirements.txt</text>
  <rect x="50" y="160" width="200" height="30" class="layer"/><text x="150" y="180" class="label">pip install -r requirements</text>
  <rect x="50" y="120" width="200" height="30" class="layer"/><text x="150" y="140" class="label">COPY src/ ./src/</text>
  <rect x="50" y="70" width="200" height="30" class="rw-layer"/><text x="150" y="90" class="label">Container Layer (R/W)</text>
  <text x="150" y="65" class="detail">Runtime writes go here</text>

  <!-- Container lifecycle (right) -->
  <text x="430" y="50" class="section">Container Lifecycle</text>
  <rect x="350" y="70" width="120" height="35" class="layer"/><text x="410" y="92" class="label">docker build</text>
  <line x1="410" y1="105" x2="410" y2="125" class="arrow"/>
  <rect x="350" y="130" width="120" height="35" class="layer"/><text x="410" y="152" class="label">docker run</text>
  <line x1="410" y1="165" x2="410" y2="185" class="arrow"/>
  <rect x="350" y="190" width="120" height="35" class="layer"/><text x="410" y="212" class="label">Running</text>
  <line x1="410" y1="225" x2="410" y2="245" class="arrow"/>
  <rect x="350" y="250" width="120" height="35" class="layer"/><text x="410" y="272" class="label">docker stop</text>
  <line x1="410" y1="285" x2="410" y2="305" class="arrow"/>
  <rect x="350" y="310" width="120" height="35" class="layer"/><text x="410" y="332" class="label">docker rm</text>

  <!-- Key insight -->
  <rect x="490" y="130" width="100" height="100" rx="6" fill="none" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="540" y="155" class="detail">Volumes</text>
  <text x="540" y="170" class="detail">persist data</text>
  <text x="540" y="185" class="detail">beyond</text>
  <text x="540" y="200" class="detail">container</text>
  <text x="540" y="215" class="detail">lifecycle</text>
</svg>
