<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .region { fill: none; stroke: #89b4fa; stroke-width: 2; stroke-dasharray: 5,5; }
      .az { fill: #313244; stroke: #cba6f7; stroke-width: 2; rx: 8; }
      .dc { fill: #45475a; stroke: #a6e3a1; stroke-width: 1; rx: 4; }
      .text-title { fill: #cdd6f4; font-family: monospace; font-size: 20px; font-weight: bold; }
      .text-label { fill: #bac2de; font-family: monospace; font-size: 14px; }
      .text-small { fill: #a6adc8; font-family: monospace; font-size: 10px; }
      .link { fill: none; stroke: #f38ba8; stroke-width: 2; }
      .packet { fill: #f9e2af; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  
  <text x="400" y="40" text-anchor="middle" class="text-title">Cloud Region Architecture</text>
  
  <!-- Region Boundary -->
  <rect x="50" y="80" width="700" height="380" class="region" />
  <text x="60" y="105" class="text-label" fill="#89b4fa">Region (e.g., us-east-1)</text>

  <!-- AZ 1 -->
  <rect x="80" y="140" width="180" height="280" class="az"/>
  <text x="170" y="165" text-anchor="middle" class="text-label">AZ A</text>
  <rect x="100" y="180" width="140" height="60" class="dc"/>
  <text x="170" y="215" text-anchor="middle" class="text-small">Data Center 1</text>
  <rect x="100" y="260" width="140" height="60" class="dc"/>
  <text x="170" y="295" text-anchor="middle" class="text-small">Data Center 2</text>
  
  <!-- AZ 2 -->
  <rect x="310" y="140" width="180" height="280" class="az"/>
  <text x="400" y="165" text-anchor="middle" class="text-label">AZ B</text>
  <rect x="330" y="220" width="140" height="60" class="dc"/>
  <text x="400" y="255" text-anchor="middle" class="text-small">Data Center 3</text>

  <!-- AZ 3 -->
  <rect x="540" y="140" width="180" height="280" class="az"/>
  <text x="630" y="165" text-anchor="middle" class="text-label">AZ C</text>
  <rect x="560" y="180" width="140" height="60" class="dc"/>
  <text x="630" y="215" text-anchor="middle" class="text-small">Data Center 4</text>
  <rect x="560" y="260" width="140" height="60" class="dc"/>
  <text x="630" y="295" text-anchor="middle" class="text-small">Data Center 5</text>

  <!-- Inter-AZ Links -->
  <path id="link1" d="M 260 280 L 310 280" class="link"/>
  <path id="link2" d="M 490 280 L 540 280" class="link"/>
  <path id="link3" d="M 260 210 Q 400 100 540 210" class="link"/>
  
  <!-- Network Packets (Animations) -->
  <circle r="4" class="packet">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#link1"/>
    </animateMotion>
  </circle>
  <circle r="4" class="packet">
    <animateMotion dur="1.5s" repeatCount="indefinite">
      <mpath href="#link2"/>
    </animateMotion>
  </circle>
  <circle r="4" class="packet">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#link3"/>
    </animateMotion>
  </circle>
  
</svg>
