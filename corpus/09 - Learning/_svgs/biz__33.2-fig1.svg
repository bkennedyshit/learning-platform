<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .bold { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .bmc-bg { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .bmc-kp { fill: #1a3a5c; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out; }
    .bmc-ka { fill: #2a1a4a; stroke: #8c3db8; stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out 0.5s; }
    .bmc-vp { fill: #1a4a3a; stroke: #3db88c; stroke-width: 1.5; animation: bmcPulseVP 4s infinite ease-in-out; }
    .bmc-cr { fill: #4a2a1a; stroke: #b8703d; stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out 1s; }
    .bmc-ch { fill: #4a2a1a; stroke: #b8703d; stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out 2.5s; }
    .bmc-cs { fill: #4a1a3a; stroke: #b83d7a; stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out 1.5s; }
    .bmc-kr { fill: #2a1a4a; stroke: #8c3db8; stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out 2s; }
    .bmc-cost { fill: #1a3a5c; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.2; animation: bmcPulseKP 4s infinite ease-in-out 3s; }
    .bmc-rev { fill: #1a4a3a; stroke: #51cf66; stroke-width: 1.5; animation: bmcPulseRev 4s infinite ease-in-out 1s; }
    .rev-type { fill: var(--background-secondary, #161b22); stroke: #51cf66; stroke-width: 1; animation: revTypePulse 5s infinite ease-in-out; }

    @keyframes bmcPulseVP {
      0%, 100% { stroke-width: 1.5; stroke: #3db88c; fill-opacity: 0.85; }
      50% { stroke-width: 2.2; stroke: #51cf66; fill-opacity: 1; filter: drop-shadow(0 0 4px #3db88c); }
    }
    @keyframes bmcPulseRev {
      0%, 100% { stroke-width: 1.5; stroke: #51cf66; fill-opacity: 0.85; }
      50% { stroke-width: 2.2; stroke: #3db88c; fill-opacity: 1; filter: drop-shadow(0 0 4px #51cf66); }
    }
    @keyframes bmcPulseKP {
      0%, 100% { fill-opacity: 0.9; }
      50% { fill-opacity: 1; }
    }
    @keyframes revTypePulse {
      0%, 100% { stroke: #51cf66; }
      50% { stroke: #3db88c; filter: drop-shadow(0 0 3px #51cf66); }
    }
  </style>

  <text x="360" y="20" class="title" text-anchor="middle">Business Model Canvas — Revenue Stream Architecture</text>

  <!-- BMC Grid -->
  <!-- Row 1 -->
  <!-- Key Partners -->
  <rect x="10" y="30" width="110" height="130" rx="4" class="bmc-kp"/>
  <text x="65" y="48" class="bold" text-anchor="middle">Key Partners</text>
  <text x="20" y="64" class="sublabel">Stripe (payments)</text>
  <text x="20" y="77" class="sublabel">AWS / Vercel (infra)</text>
  <text x="20" y="90" class="sublabel">Plugin ecosystems</text>
  <text x="20" y="103" class="sublabel">(Unity, Godot)</text>
  <text x="20" y="116" class="sublabel">Co-founders</text>
  <text x="20" y="129" class="sublabel">Advisors</text>
  <text x="20" y="142" class="sublabel">Integration partners</text>

  <!-- Key Activities -->
  <rect x="126" y="30" width="110" height="62" rx="4" class="bmc-ka"/>
  <text x="181" y="48" class="bold" text-anchor="middle">Key Activities</text>
  <text x="132" y="62" class="sublabel">Eng: ship product</text>
  <text x="132" y="74" class="sublabel">Sales: close deals</text>
  <text x="132" y="86" class="sublabel">CS: retain customers</text>

  <!-- Value Proposition -->
  <rect x="242" y="30" width="140" height="130" rx="4" class="bmc-vp"/>
  <text x="312" y="48" class="bold" text-anchor="middle">Value Proposition</text>
  <text x="250" y="64" class="sublabel">The job you do for customers.</text>
  <text x="250" y="77" class="sublabel">"We help [segment] do [job]</text>
  <text x="250" y="90" class="sublabel"> unlike [alt] by [differentiator]"</text>
  <text x="250" y="106" class="sublabel">Must relieve a real pain or</text>
  <text x="250" y="118" class="sublabel">create a meaningful gain.</text>
  <text x="250" y="131" class="sublabel">Functional + Emotional + Social.</text>
  <text x="250" y="144" class="sublabel">Derived from JTBD discovery.</text>

  <!-- Customer Relationships -->
  <rect x="388" y="30" width="110" height="62" rx="4" class="bmc-cr"/>
  <text x="443" y="47" class="bold" text-anchor="middle">Customer</text>
  <text x="443" y="60" class="bold" text-anchor="middle">Relationships</text>
  <text x="394" y="74" class="sublabel">Self-serve / PLG</text>
  <text x="394" y="86" class="sublabel">Sales-led / CSM</text>

  <!-- Customer Segments -->
  <rect x="504" y="30" width="206" height="130" rx="4" class="bmc-cs"/>
  <text x="607" y="48" class="bold" text-anchor="middle">Customer Segments</text>
  <text x="512" y="64" class="sublabel">Be specific. Not "developers."</text>
  <text x="512" y="77" class="sublabel">→ Solo indie game devs</text>
  <text x="512" y="90" class="sublabel">  on Steam/itch.io, Unity/Godot</text>
  <text x="512" y="103" class="sublabel">→ Freelance devs billing clients</text>
  <text x="512" y="116" class="sublabel">→ Small SaaS teams (5–20 ppl)</text>
  <text x="512" y="129" class="sublabel">ICP = best slice of your market</text>
  <text x="512" y="142" class="sublabel">that pays most and churns least</text>

  <!-- Key Resources -->
  <rect x="126" y="98" width="110" height="62" rx="4" class="bmc-kr"/>
  <text x="181" y="115" class="bold" text-anchor="middle">Key Resources</text>
  <text x="132" y="130" class="sublabel">Code + IP + data</text>
  <text x="132" y="142" class="sublabel">Brand + audience</text>
  <text x="132" y="154" class="sublabel">Team + advisors</text>

  <!-- Channels -->
  <rect x="388" y="98" width="110" height="62" rx="4" class="bmc-ch"/>
  <text x="443" y="115" class="bold" text-anchor="middle">Channels</text>
  <text x="394" y="130" class="sublabel">SEO / Content</text>
  <text x="394" y="142" class="sublabel">Discord / Reddit</text>
  <text x="394" y="154" class="sublabel">Product Hunt / WOM</text>

  <!-- Divider line -->
  <line x1="10" y1="167" x2="710" y2="167" stroke="var(--text-muted, #8b949e)" stroke-width="0.5"/>

  <!-- Cost Structure -->
  <rect x="10" y="173" width="344" height="70" rx="4" class="bmc-cost"/>
  <text x="182" y="190" class="bold" text-anchor="middle">Cost Structure</text>
  <text x="20" y="207" class="sublabel">Fixed: salaries, servers, tools, registered agent, insurance</text>
  <text x="20" y="220" class="sublabel">Variable: cloud compute (AI inference!), CAC, payment processing fees (~2.9%)</text>
  <text x="20" y="233" class="sublabel">Unit: cost per customer served per month (target: keep low vs ARPU)</text>

  <!-- Revenue Streams -->
  <rect x="360" y="173" width="350" height="70" rx="4" class="bmc-rev"/>
  <text x="535" y="190" class="bold" text-anchor="middle">Revenue Streams</text>
  <text x="368" y="207" class="sublabel">Subscription MRR ($29–$179/mo) · Usage-based (AI credits) · Annual plan (2 months free)</text>
  <text x="368" y="220" class="sublabel">One-time: setup fee · productized service · asset license</text>
  <text x="368" y="233" class="sublabel">Expansion: seat adds · tier upgrades · platform fee on marketplace transactions</text>

  <!-- Bottom: Revenue Stream Type Comparison -->
  <text x="360" y="262" class="title" text-anchor="middle">Revenue Stream Types — Quick Compare</text>

  <rect x="10" y="270" width="135" height="78" rx="4" class="rev-type"/>
  <text x="77" y="285" class="bold" text-anchor="middle">SaaS Subscription</text>
  <text x="18" y="299" class="sublabel">Recurring · predictable</text>
  <text x="18" y="311" class="sublabel">Gross margin: 60–90%</text>
  <text x="18" y="323" class="sublabel">LTV: high if churn low</text>
  <text x="18" y="337" class="sublabel">Best for: software products</text>

  <rect x="152" y="270" width="135" height="78" rx="4" class="rev-type"/>
  <text x="219" y="285" class="bold" text-anchor="middle">Usage / API</text>
  <text x="160" y="299" class="sublabel">Pay per action/compute</text>
  <text x="160" y="311" class="sublabel">Gross margin: 40–80%</text>
  <text x="160" y="323" class="sublabel">LTV: lumpy</text>
  <text x="160" y="337" class="sublabel">Best for: AI tools, APIs</text>

  <rect x="294" y="270" width="135" height="78" rx="4" class="rev-type"/>
  <text x="361" y="285" class="bold" text-anchor="middle">Marketplace</text>
  <text x="302" y="299" class="sublabel">Take rate on txns</text>
  <text x="302" y="311" class="sublabel">Gross margin: 15–40%</text>
  <text x="302" y="323" class="sublabel">Network effect moat</text>
  <text x="302" y="337" class="sublabel">Best for: 2-sided mkt</text>

  <rect x="436" y="270" width="135" height="78" rx="4" class="rev-type"/>
  <text x="503" y="285" class="bold" text-anchor="middle">Productized Svc</text>
  <text x="444" y="299" class="sublabel">Fixed scope + price</text>
  <text x="444" y="311" class="sublabel">Gross margin: 40–65%</text>
  <text x="444" y="323" class="sublabel">Cash flow fast</text>
  <text x="444" y="337" class="sublabel">Best for: bridge / validate</text>

  <rect x="578" y="270" width="132" height="78" rx="4" class="rev-type"/>
  <text x="644" y="285" class="bold" text-anchor="middle">Media / Content</text>
  <text x="586" y="299" class="sublabel">Sponsorships + ads</text>
  <text x="586" y="311" class="sublabel">Gross margin: 60–80%</text>
  <text x="586" y="323" class="sublabel">Slow build; audience</text>
  <text x="586" y="337" class="sublabel">Best for: BMX brand</text>

  <text x="360" y="368" class="sublabel" text-anchor="middle">LTV/CAC ≥ 3 = fundable  ·  LTV/CAC ≥ 5 = excellent  ·  Gross margin drives long-run sustainability</text>
  <text x="360" y="384" class="sublabel" text-anchor="middle">Recurring &gt; transactional: the compounding advantage of subscription revenue makes it the default for software founders.</text>

</svg>
