<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:620px;height:auto;">
  <defs>
    <marker id="hci-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .hci-phone{fill:var(--background-secondary, #161b22);stroke:var(--text-normal, #c9d1d9);stroke-width:2;rx:20}
    .hci-screen{fill:none;stroke:var(--text-muted, #8b949e);stroke-width:1;rx:5}
    .hci-btn{fill:var(--interactive-accent, #58a6ff);fill-opacity:0.15;stroke:var(--interactive-accent, #58a6ff);stroke-width:2;rx:8;cursor:pointer;transition:all 0.3s}
    .hci-btn:hover{fill-opacity:0.4;stroke:var(--text-accent, #79c0ff);filter:drop-shadow(0 0 4px var(--interactive-accent, #58a6ff))}
    .hci-lbl{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:var(--text-normal, #c9d1d9)}
    .hci-acc{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--interactive-accent, #58a6ff);font-weight:bold}
    .hci-metric{font-family:Inter,system-ui,sans-serif;font-size:18px;fill:var(--text-accent, #79c0ff);font-weight:bold}
    .hci-annot{stroke:var(--text-accent, #79c0ff);stroke-width:1.5;fill:none;stroke-dasharray:4,3;animation:annotDash 1.2s linear infinite}
    
    /* Biometric Sync & Telemetry Animations */
    .hci-hr-pulse {
      transform-origin: 310px 120px;
      animation: hrBreathe 1.818s ease-in-out infinite;
    }
    .hci-heart-pulse {
      display: inline-block;
      transform-origin: 395px 65px;
      animation: heartBlink 1.818s ease-in-out infinite;
    }
    .hci-chart-line {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawHciChart 3s ease-out forwards;
    }

    @keyframes annotDash {
      to { stroke-dashoffset: -7; }
    }
    @keyframes drawHciChart {
      to { stroke-dashoffset: 0; }
    }
    @keyframes hrBreathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px var(--text-accent, #79c0ff)); }
      14% { transform: scale(1.08); filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); fill: var(--interactive-accent, #58a6ff); }
      28% { transform: scale(1); }
      42% { transform: scale(1.06); filter: drop-shadow(0 0 3px var(--interactive-accent, #58a6ff)); fill: var(--interactive-accent, #58a6ff); }
      70% { transform: scale(1); }
    }
    @keyframes heartBlink {
      0%, 100% { opacity: 0.5; }
      14% { opacity: 1; fill: #ff6b6b; }
      28% { opacity: 0.5; }
      42% { opacity: 0.9; fill: #ff6b6b; }
      70% { opacity: 0.5; }
    }
  </style>
  <!-- Phone frame -->
  <rect x="180" y="20" width="260" height="380" class="hci-phone"/>
  <rect x="195" y="50" width="230" height="320" class="hci-screen"/>
  <!-- Status bar -->
  <text x="210" y="70" class="hci-lbl">9:41 AM</text>
  <text x="390" y="70" class="hci-lbl"><tspan fill="#ff6b6b" class="hci-heart-pulse">♥</tspan> BLE</text>
  <!-- HR display (large, central) -->
  <text x="310" y="130" class="hci-metric hci-hr-pulse" text-anchor="middle" font-size="36">33</text>
  <text x="310" y="150" class="hci-lbl" text-anchor="middle">BPM (resting)</text>
  <!-- HRV mini-chart -->
  <polyline points="210,180 230,170 250,185 270,165 290,175 310,160 330,178 350,168 370,180 390,172" fill="none" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2" class="hci-chart-line"/>
  <text x="310" y="200" class="hci-lbl" text-anchor="middle">RMSSD: 112 ms</text>
  <!-- Action buttons (Fitts's Law sized) -->
  <rect x="210" y="220" width="100" height="44" class="hci-btn"/>
  <text x="260" y="247" class="hci-acc" text-anchor="middle">Start</text>
  <rect x="320" y="220" width="100" height="44" class="hci-btn"/>
  <text x="370" y="247" class="hci-acc" text-anchor="middle">History</text>
  <!-- Bottom nav (spatial memory) -->
  <rect x="210" y="320" width="50" height="40" class="hci-btn"/>
  <text x="235" y="345" class="hci-lbl" text-anchor="middle">♥</text>
  <rect x="270" y="320" width="50" height="40" class="hci-btn"/>
  <text x="295" y="345" class="hci-lbl" text-anchor="middle">📊</text>
  <rect x="330" y="320" width="50" height="40" class="hci-btn"/>
  <text x="355" y="345" class="hci-lbl" text-anchor="middle">⚙</text>
  <!-- Annotations -->
  <line x1="180" y1="130" x2="100" y2="100" class="hci-annot"/>
  <text x="30" y="95" class="hci-acc">Fitts's Law:</text>
  <text x="30" y="110" class="hci-lbl">Large target = fast tap</text>
  <line x1="440" y1="240" x2="510" y2="220" class="hci-annot"/>
  <text x="460" y="215" class="hci-acc">44px min</text>
  <text x="460" y="230" class="hci-lbl">touch target</text>
  <line x1="440" y1="340" x2="510" y2="340" class="hci-annot"/>
  <text x="460" y="335" class="hci-acc">Spatial memory</text>
  <text x="460" y="350" class="hci-lbl">Fixed nav position</text>
  <line x1="180" y1="200" x2="100" y2="200" class="hci-annot"/>
  <text x="30" y="195" class="hci-acc">Miller's Law:</text>
  <text x="30" y="210" class="hci-lbl">≤7 items visible</text>
</svg>