<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <defs>
    <marker id="gt-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="gt-norm" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    .region { fill: var(--interactive-accent, #58a6ff); opacity: 0.08; }
    .bound  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .area   { fill: var(--text-accent, #79c0ff); opacity: 0.18; }
    .axis   { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.3; fill: none; }
    .grid   { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.3; }
    .lab    { font-family: Inter,system-ui,sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .math   { font-family: 'Latin Modern Math',serif; font-style: italic; font-size: 14px; fill: var(--interactive-accent, #58a6ff); }
    .muted  { font-family: Inter,system-ui,sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="40" x2="60" y2="320"/>
    <line x1="160" y1="40" x2="160" y2="320"/>
    <line x1="260" y1="40" x2="260" y2="320"/>
    <line x1="360" y1="40" x2="360" y2="320"/>
    <line x1="460" y1="40" x2="460" y2="320"/>
    <line x1="40" y1="80" x2="500" y2="80"/>
    <line x1="40" y1="160" x2="500" y2="160"/>
    <line x1="40" y1="240" x2="500" y2="240"/>
    <line x1="40" y1="320" x2="500" y2="320"/>
  </g>
  <!-- Region D -->
  <ellipse cx="270" cy="190" rx="160" ry="110" class="region"/>
  <!-- Small dA square inside -->
  <rect x="240" y="170" width="36" height="28" class="area"/>
  <text x="258" y="190" class="muted" text-anchor="middle">dA</text>
  <!-- Oriented boundary curve with arrows -->
  <ellipse cx="270" cy="190" rx="160" ry="110" class="bound" marker-mid="url(#gt-arr)"/>
  <!-- CCW arrows at key points -->
  <line x1="270" y1="80" x2="310" y2="80" class="bound" stroke-width="0" marker-end="url(#gt-arr)"/>
  <line x1="430" y1="190" x2="430" y2="150" class="bound" stroke-width="0" marker-end="url(#gt-arr)"/>
  <line x1="270" y1="300" x2="230" y2="300" class="bound" stroke-width="0" marker-end="url(#gt-arr)"/>
  <line x1="110" y1="190" x2="110" y2="230" class="bound" stroke-width="0" marker-end="url(#gt-arr)"/>
  <!-- Axes -->
  <line x1="40" y1="340" x2="510" y2="340" class="axis"/>
  <line x1="40" y1="340" x2="40" y2="30" class="axis"/>
  <text x="515" y="344" class="lab">x</text>
  <text x="32" y="28" class="lab">y</text>
  <!-- Labels -->
  <text x="268" y="188" class="math" text-anchor="middle">D</text>
  <text x="430" y="78" class="math">∂D</text>
  <text x="190" y="130" class="muted">counterclockwise</text>
  <text x="190" y="143" class="muted">= positive orientation</text>
  <text x="268" y="355" class="muted" text-anchor="middle">D stays to the LEFT of a walker on ∂D</text>
</svg>