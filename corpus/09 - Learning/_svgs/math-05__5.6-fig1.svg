<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <style>
    .zf-box { fill:var(--background-secondary, #161b22); stroke:var(--text-muted, #8b949e); stroke-width:1.5; rx:8; cursor:pointer; transition:all 0.3s; }
    .zf-box:hover { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; filter:drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); }
    .zf-ctr { fill:var(--interactive-accent, #58a6ff); fill-opacity:0.15; stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; rx:12; }
    .zf-lbl { font-family:Inter,system-ui,sans-serif; font-size:11px; fill:var(--text-normal, #c9d1d9); text-anchor:middle; }
    .zf-acc { font-family:Inter,system-ui,sans-serif; font-size:14px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; text-anchor:middle; }
    .zf-eq { font-family:serif; font-size:11px; fill:var(--text-accent, #79c0ff); text-anchor:middle; }
    @keyframes flow-out { from{stroke-dashoffset: 15;} to{stroke-dashoffset: 0;} }
    .zf-arr { stroke:var(--interactive-accent, #58a6ff); stroke-width:1.5; fill:none; stroke-dasharray: 5; animation: flow-out 1s linear infinite; }
    @keyframes pulse-z { 0%,100%{stroke-width:2.5} 50%{stroke-width:3.5} }
    .zf-pulse { animation: pulse-z 2s ease-in-out infinite; }
  </style>
  <defs>
    <marker id="zfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Central Z box -->
  <rect x="190" y="120" width="140" height="70" class="zf-ctr zf-pulse"/>
  <text x="260" y="150" class="zf-acc" font-size="18">Z = Σ e^(−βEᵢ)</text>
  <text x="260" y="175" class="zf-lbl">Partition Function</text>
  <!-- Derived quantities -->
  <rect x="20" y="20" width="130" height="50" class="zf-box"/>
  <text x="85" y="42" class="zf-acc">F = −k_BT ln Z</text>
  <text x="85" y="58" class="zf-lbl">Free Energy</text>
  <rect x="370" y="20" width="130" height="50" class="zf-box"/>
  <text x="435" y="42" class="zf-acc">⟨E⟩ = −∂ln Z/∂β</text>
  <text x="435" y="58" class="zf-lbl">Average Energy</text>
  <rect x="20" y="250" width="130" height="50" class="zf-box"/>
  <text x="85" y="272" class="zf-acc">S = k_B(ln Z + β⟨E⟩)</text>
  <text x="85" y="288" class="zf-lbl">Entropy</text>
  <rect x="370" y="250" width="130" height="50" class="zf-box"/>
  <text x="435" y="272" class="zf-acc">C_V = ∂⟨E⟩/∂T</text>
  <text x="435" y="288" class="zf-lbl">Heat Capacity</text>
  <rect x="195" y="250" width="130" height="50" class="zf-box"/>
  <text x="260" y="272" class="zf-acc">P = k_BT ∂ln Z/∂V</text>
  <text x="260" y="288" class="zf-lbl">Pressure</text>
  <!-- Arrows from Z -->
  <line x1="220" y1="120" x2="120" y2="70" class="zf-arr" marker-end="url(#zfa)"/>
  <line x1="300" y1="120" x2="400" y2="70" class="zf-arr" marker-end="url(#zfa)"/>
  <line x1="220" y1="190" x2="120" y2="250" class="zf-arr" marker-end="url(#zfa)"/>
  <line x1="300" y1="190" x2="400" y2="250" class="zf-arr" marker-end="url(#zfa)"/>
  <line x1="260" y1="190" x2="260" y2="250" class="zf-arr" marker-end="url(#zfa)"/>
</svg>