<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <style>
    .axp { stroke:var(--text-muted, #8b949e); stroke-width:1.2; fill:none; }
    .vecp{ stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none; }
    .veco{ stroke:var(--text-normal, #c9d1d9); stroke-width:2; fill:none; stroke-dasharray:5 3; }
    .labp{ font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); }
    .lacc{ font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    .righ{ stroke:var(--text-muted, #8b949e); stroke-width:1; fill:none; }
  </style>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- Projection line -->
  <line x1="50" y1="250" x2="450" y2="50" stroke="var(--text-muted, #8b949e)" stroke-width="1.5" stroke-dasharray="6 3"/>
  <!-- Axes -->
  <line x1="50" y1="250" x2="460" y2="250" class="axp"/>
  <line x1="50" y1="260" x2="50"  y2="30"  class="axp"/>
  <!-- vector v -->
  <line x1="50" y1="250" x2="250" y2="80" stroke="var(--text-normal, #c9d1d9)" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="253" y="75" class="labp">v</text>
  <!-- Dropping perpendicular -->
  <line x1="250" y1="80" x2="330" y2="103" stroke="var(--text-muted, #8b949e)" stroke-width="1.5" stroke-dasharray="5 3">
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="4s" repeatCount="indefinite"/>
  </line>
  <!-- projection Pv -->
  <line x1="50" y1="250" x2="330" y2="103" class="vecp" marker-end="url(#ap)">
    <animate attributeName="x2" values="52.8; 330; 330; 52.8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="248.5; 103; 103; 248.5" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="333" y="98" class="lacc">
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="4s" repeatCount="indefinite"/>
    Pv
  </text>
  <!-- right angle mark -->
  <g>
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="4s" repeatCount="indefinite"/>
    <line x1="245" y1="87"  x2="260" y2="114" class="righ"/>
    <line x1="260" y1="114" x2="245" y2="120" class="righ"/>
  </g>
  <!-- caption -->
  <text x="250" y="285" class="labp" text-anchor="middle">Projection: P² = P (idempotent), rank = 1</text>
</svg>