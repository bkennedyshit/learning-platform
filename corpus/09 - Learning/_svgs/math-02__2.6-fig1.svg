<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:580px;height:auto;">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="eb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
    <marker id="ec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    .eax { stroke:var(--text-muted, #8b949e); stroke-width:1.2; fill:none; }
    .evA { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.8; fill:none; }
    .evB { stroke:var(--text-accent, #79c0ff); stroke-width:2.5; fill:none; stroke-dasharray:6 3; }
    .evC { stroke:var(--text-muted, #8b949e); stroke-width:2; fill:none; }
    .eln { stroke:var(--interactive-accent, #58a6ff); stroke-width:1; fill:none; stroke-dasharray:3 2; opacity:0.5; }
    .elb { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); }
    .ela { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
  </style>
  <!-- Axes -->
  <line x1="30"  y1="200" x2="290" y2="200" class="eax"/>
  <line x1="50"  y1="280" x2="50"  y2="30"  class="eax"/>
  <!-- Eigenvector v1 = (1,1) direction, λ₁=3: before → (100,100) from center(50,200) scaled 60 -->
  <!-- Before: v=(60,−60), After: 3v=(180,−180): origin at (50,200) -->
  <!-- Before vector: (50,200)->(110,140) -->
  <line x1="50" y1="200" x2="110" y2="140" class="evC" marker-end="url(#ec)"/>
  <text x="90"  y="132" class="elb">v</text>
  <!-- After: A·v = 3v → (50,200)->(230,20) -->
  <line x1="50" y1="200" x2="230" y2="20" class="evA" marker-end="url(#ea)">
    <animate attributeName="x2" values="110;230;230;110;110" keyTimes="0;0.3;0.7;0.9;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="140;20;20;140;140" keyTimes="0;0.3;0.7;0.9;1" dur="6s" repeatCount="indefinite" />
  </line>
  <text x="233" y="16" class="ela">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.7;0.9;1" dur="6s" repeatCount="indefinite" />
    Av = 3v
  </text>
  <!-- Invariant direction line -->
  <line x1="30" y1="220" x2="270" y2="-20" class="eln" stroke="var(--interactive-accent, #58a6ff)"/>
  <text x="55" y="268" class="ela">eigenline</text>
  <!-- Non-eigenvector u = (1,0): Au = (3,1) for matrix [[3,1],[0,2]] -->
  <!-- u: (50,200)->(110,200); Au=(3,1)×60: (50,200)->(230,140) -->
  <line x1="50" y1="200" x2="110" y2="200" class="evC" marker-end="url(#ec)"/>
  <text x="114" y="197" class="elb">u</text>
  <line x1="50" y1="200" x2="230" y2="140" class="evB" marker-end="url(#eb)">
    <animate attributeName="x2" values="110;230;230;110;110" keyTimes="0;0.3;0.7;0.9;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="200;140;140;200;200" keyTimes="0;0.3;0.7;0.9;1" dur="6s" repeatCount="indefinite" />
  </line>
  <text x="233" y="137" fill="var(--text-accent, #79c0ff)" class="elb">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.7;0.9;1" dur="6s" repeatCount="indefinite" />
    Au ≠ λu
  </text>
  <!-- Right panel info box -->
  <rect x="310" y="40" width="255" height="160" rx="7" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="437" y="66"  class="elb" text-anchor="middle" font-weight="bold">Eigenvalue Equation</text>
  <text x="437" y="92"  class="ela" text-anchor="middle" font-size="15px">Av = λv</text>
  <text x="437" y="115" class="elb" text-anchor="middle">v ≠ 0 is the eigenvector</text>
  <text x="437" y="133" class="elb" text-anchor="middle">λ is the eigenvalue</text>
  <text x="437" y="158" class="elb" text-anchor="middle">(A − λI)v = 0</text>
  <text x="437" y="178" class="ela" text-anchor="middle">det(A − λI) = 0</text>
  <text x="290" y="302" class="elb" text-anchor="middle">Eigenvectors don't rotate — they only stretch/shrink along their line</text>
</svg>