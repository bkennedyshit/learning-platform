<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 500px; height: auto;">
  <style>
    .axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .curve-p2 { stroke: #ff6b6b; stroke-width: 2.5; fill: none; }
    .curve-2pq { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .curve-q2 { stroke: #4dabf7; stroke-width: 2.5; fill: none; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .legend { font-family: Inter, system-ui, sans-serif; font-size: 11px; }
  </style>
  <text x="250" y="25" class="title" text-anchor="middle">Hardy-Weinberg Genotype Frequencies</text>
  <!-- Axes -->
  <line x1="60" y1="280" x2="440" y2="280" class="axis"/>
  <line x1="60" y1="280" x2="60" y2="50" class="axis"/>
  <text x="250" y="310" class="label" text-anchor="middle">Allele frequency p (A)</text>
  <text x="25" y="165" class="label" text-anchor="middle" transform="rotate(-90,25,165)">Genotype frequency</text>
  <!-- Tick marks -->
  <text x="60" y="295" class="label" text-anchor="middle">0</text>
  <text x="155" y="295" class="label" text-anchor="middle">0.25</text>
  <text x="250" y="295" class="label" text-anchor="middle">0.5</text>
  <text x="345" y="295" class="label" text-anchor="middle">0.75</text>
  <text x="440" y="295" class="label" text-anchor="middle">1.0</text>
  <text x="50" y="284" class="label" text-anchor="end">0</text>
  <text x="50" y="169" class="label" text-anchor="end">0.5</text>
  <text x="50" y="54" class="label" text-anchor="end">1.0</text>
  <!-- p² curve (AA) - parabola from (0,0) to (1,1) -->
  <path d="M 60 280 Q 155 270 250 222 Q 345 145 440 50" class="curve-p2"/>
  <!-- q² curve (aa) - parabola from (0,1) to (1,0) -->
  <path d="M 60 50 Q 155 145 250 222 Q 345 270 440 280" class="curve-q2"/>
  <!-- 2pq curve (Aa) - inverted parabola peaking at p=0.5 -->
  <path d="M 60 280 Q 155 165 250 165 Q 345 165 440 280" class="curve-2pq"/>
  <!-- Max 2pq annotation -->
  <line x1="250" y1="165" x2="250" y2="280" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="255" y="158" class="label" fill="var(--interactive-accent, #58a6ff)">max 2pq = 0.5</text>
  <!-- Legend -->
  <rect x="320" y="40" width="120" height="70" rx="4" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="0.5"/>
  <line x1="330" y1="55" x2="360" y2="55" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="370" y="59" class="legend" fill="#ff6b6b">p² (AA)</text>
  <line x1="330" y1="75" x2="360" y2="75" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2.5"/>
  <text x="370" y="79" class="legend" fill="var(--interactive-accent, #58a6ff)">2pq (Aa)</text>
  <line x1="330" y1="95" x2="360" y2="95" stroke="#4dabf7" stroke-width="2.5"/>
  <text x="370" y="99" class="legend" fill="#4dabf7">q² (aa)</text>
  <!-- Equation -->
  <text x="250" y="340" class="label" text-anchor="middle" font-style="italic">p² + 2pq + q² = 1</text>
</svg>
