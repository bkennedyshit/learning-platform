<svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <style>
    .cbax { stroke:var(--text-muted, #8b949e); stroke-width:1.2; fill:none; }
    .cbb1 { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none; }
    .cbb2 { stroke:var(--text-accent, #79c0ff); stroke-width:2.5; fill:none; }
    .cbl  { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); }
    .cba  { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    .cbfill{ fill:var(--interactive-accent, #58a6ff); opacity:0.08; stroke:none; }
  </style>
  <defs>
    <marker id="acb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="acb2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- Grid axes -->
  <line x1="50" y1="220" x2="460" y2="220" class="cbax"/>
  <line x1="50" y1="240" x2="50"  y2="20"  class="cbax"/>
  <!-- Standard basis e1, e2 (dashed grey) -->
  <line x1="50" y1="220" x2="190" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#acb2)"/>
  <text x="194" y="217" class="cbl">e₁</text>
  <line x1="50" y1="220" x2="50"  y2="80"  stroke="var(--text-muted, #8b949e)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#acb2)"/>
  <text x="55"  y="76"  class="cbl">e₂</text>
  <!-- New basis vectors b1, b2 -->
  <line x1="50" y1="220" x2="230" y2="160" class="cbb1" marker-end="url(#acb1)">
    <animate attributeName="x2" values="190; 230; 190" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="220; 160; 220" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="234" y="157" class="cba">
    <animate attributeName="x" values="194; 234; 194" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="217; 157; 217" dur="4s" repeatCount="indefinite"/>
    b₁
  </text>
  <line x1="50" y1="220" x2="110" y2="80"  class="cbb1" marker-end="url(#acb1)">
    <animate attributeName="x2" values="50; 110; 50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="80; 80; 80" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="96"  y="74"  class="cba">
    <animate attributeName="x" values="55; 96; 55" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="76; 74; 76" dur="4s" repeatCount="indefinite"/>
    b₂
  </text>
  <!-- Parallelogram spanned by b1, b2 -->
  <polygon points="50,220 230,160 290,20 110,80" class="cbfill">
    <animate attributeName="points" values="50,220 190,220 190,80 50,80; 50,220 230,160 290,20 110,80; 50,220 190,220 190,80 50,80" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="50,220 230,160 290,20 110,80" fill="none" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1" stroke-dasharray="3 2">
    <animate attributeName="points" values="50,220 190,220 190,80 50,80; 50,220 230,160 290,20 110,80; 50,220 190,220 190,80 50,80" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <!-- Caption -->
  <text x="250" y="265" class="cbl" text-anchor="middle">Columns of P = b₁, b₂ in standard coords</text>
</svg>