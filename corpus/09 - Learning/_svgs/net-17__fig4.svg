<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .text-light { fill: #cdd6f4; font-family: 'Inter', sans-serif; font-size: 14px; }
      .text-bold { fill: #cdd6f4; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; }
      .title { fill: #cdd6f4; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: bold; text-anchor: middle; }
      .timeline { stroke: #585b70; stroke-width: 3px; stroke-dasharray: 6; }
      .msg-line { stroke: #89b4fa; stroke-width: 3px; marker-end: url(#arrow); }
      .msg-enc { stroke: #a6e3a1; stroke-width: 3px; marker-end: url(#arrow-enc); }
      .msg-data { stroke: #cba6f7; stroke-width: 4px; marker-end: url(#arrow-data); }
      .box { fill: #313244; stroke: #45475a; stroke-width: 2px; rx: 8px; }
      .code { fill: #bac2de; font-family: 'Fira Code', monospace; font-size: 13px; }
      .highlight { fill: #f9e2af; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa" />
    </marker>
    <marker id="arrow-enc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1" />
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cba6f7" />
    </marker>
  </defs>
  <rect width="800" height="550" class="bg" />
  
  <text x="400" y="35" class="title">TLS 1.3 1-RTT Handshake</text>

  <!-- Client & Server headers -->
  <rect x="150" y="60" width="100" height="40" class="box" />
  <text x="200" y="85" class="text-bold" text-anchor="middle">Client</text>
  
  <rect x="550" y="60" width="100" height="40" class="box" />
  <text x="600" y="85" class="text-bold" text-anchor="middle">Server</text>
  
  <line x1="200" y1="100" x2="200" y2="520" class="timeline" />
  <line x1="600" y1="100" x2="600" y2="520" class="timeline" />

  <!-- ClientHello -->
  <line x1="200" y1="130" x2="590" y2="160" class="msg-line" />
  <text x="230" y="125" class="text-bold" style="fill:#89b4fa;">ClientHello</text>
  <text x="230" y="145" class="code">+ Key Share (Client's ECDHE PubKey)</text>

  <!-- ServerHello -->
  <line x1="600" y1="190" x2="210" y2="220" class="msg-line" />
  <text x="490" y="185" class="text-bold" style="fill:#89b4fa;">ServerHello</text>
  <text x="350" y="205" class="code">+ Key Share (Server's ECDHE PubKey)</text>
  
  <rect x="620" y="210" width="150" height="40" fill="#313244" rx="4" stroke="#45475a"/>
  <text x="630" y="225" class="code" style="fill:#a6e3a1; font-size:11px;">Derive Handshake Keys</text>
  <text x="630" y="240" class="code" style="fill:#a6e3a1; font-size:11px;">(HKDF-Extract + Expand)</text>

  <!-- Encrypted Block (Server -> Client) -->
  <path d="M 600 270 Q 400 290 210 310" fill="none" class="msg-enc" />
  <text x="410" y="270" class="text-bold" style="fill:#a6e3a1;">{EncryptedExtensions}</text>
  <text x="490" y="290" class="text-bold" style="fill:#a6e3a1;">{Certificate}</text>
  <text x="450" y="310" class="text-bold" style="fill:#a6e3a1;">{CertificateVerify}</text>
  <text x="510" y="330" class="text-bold" style="fill:#a6e3a1;">{Finished}</text>
  
  <text x="380" y="360" class="code" style="fill:#f9e2af; font-size:12px;">Client verifies signature &amp; cert chain</text>
  
  <!-- Encrypted Block (Client -> Server) -->
  <line x1="200" y1="390" x2="590" y2="420" class="msg-enc" />
  <text x="230" y="405" class="text-bold" style="fill:#a6e3a1;">{Finished}</text>
  
  <rect x="350" y="440" width="100" height="30" fill="#181825" stroke="#313244" rx="4" />
  <text x="400" y="460" class="text-bold" style="fill:#f38ba8;" text-anchor="middle">1 RTT</text>

  <!-- Application Data -->
  <line x1="200" y1="480" x2="590" y2="510" class="msg-data" />
  <text x="250" y="495" class="text-bold" style="fill:#cba6f7;">[Application Data - HTTP/2 over AEAD]</text>

</svg>
