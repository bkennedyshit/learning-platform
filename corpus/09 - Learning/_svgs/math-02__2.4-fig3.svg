<svg viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <style>
    .shs { stroke:var(--text-muted, #8b949e); stroke-width:1; fill:var(--background-secondary, #161b22); stroke-dasharray:3 2; }
    .sht { stroke:var(--interactive-accent, #58a6ff); stroke-width:1.5; fill:none; }
    .sha { stroke:var(--interactive-accent, #58a6ff); stroke-width:1.8; fill:none; }
    .shl { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--text-normal, #c9d1d9); }
    .shm { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
  </style>
  <!-- Original square -->
  <rect x="60" y="110" width="100" height="100" class="shs"/>
  <text x="110" y="225" class="shl" text-anchor="middle">original</text>
  <!-- Arrow -->
  <line x1="195" y1="160" x2="245" y2="160" stroke="var(--text-muted, #8b949e)" stroke-width="1.5" marker-end="url(#arr24b)"/>
  <defs>
    <marker id="arrsh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <line x1="195" y1="160" x2="245" y2="160" stroke="var(--text-muted, #8b949e)" stroke-width="1.5" marker-end="url(#arrsh)"/>
  <text x="220" y="152" class="shl" text-anchor="middle">shear</text>
  <!-- Sheared parallelogram: pts (260,210),(360,210),(410,110),(310,110) -->
  <polygon points="260,210 360,210 410,110 310,110" class="sht" fill="var(--background-secondary, #161b22)" opacity="0.6">
    <animate attributeName="points" values="260,210 360,210 360,110 260,110; 260,210 360,210 410,110 310,110; 260,210 360,210 360,110 260,110" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <text x="335" y="225" class="shm" text-anchor="middle">sheared</text>
  <!-- Matrix label -->
  <text x="380" y="75" class="shl" font-weight="bold">Shear matrix:</text>
  <text x="380" y="93" class="shl" font-family="monospace">⎡1  k⎤</text>
  <text x="380" y="108" class="shl" font-family="monospace">⎣0  1⎦</text>
  <text x="380" y="126" class="shl">det = 1, area preserved</text>
</svg>