<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#181825" rx="15" />
  <text x="400" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Dopamine Reward Prediction Error (RPE)</text>
  
  <!-- Grid -->
  <line x1="150" y1="120" x2="150" y2="450" stroke="#45475a" stroke-dasharray="5,5" />
  <text x="150" y="100" font-family="sans-serif" font-size="14" fill="#a6adc8" text-anchor="middle">Cue (CS)</text>

  <line x1="550" y1="120" x2="550" y2="450" stroke="#45475a" stroke-dasharray="5,5" />
  <text x="550" y="100" font-family="sans-serif" font-size="14" fill="#a6adc8" text-anchor="middle">Reward (US)</text>

  <!-- 1. Unpredicted Reward -->
  <text x="40" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#89b4fa">1. No Prediction</text>
  <text x="40" y="180" font-family="sans-serif" font-size="12" fill="#a6adc8">(Reward occurs)</text>
  <path d="M 100 220 L 530 220 L 540 150 L 560 220 L 700 220" fill="none" stroke="#89b4fa" stroke-width="3">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- 2. Predicted Reward -->
  <text x="40" y="270" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a6e3a1">2. Prediction</text>
  <text x="40" y="290" font-family="sans-serif" font-size="12" fill="#a6adc8">(Reward occurs)</text>
  <path d="M 100 330 L 130 330 L 140 260 L 160 330 L 700 330" fill="none" stroke="#a6e3a1" stroke-width="3">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- 3. Predicted, No Reward -->
  <text x="40" y="380" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f38ba8">3. Negative RPE</text>
  <text x="40" y="400" font-family="sans-serif" font-size="12" fill="#a6adc8">(Reward withheld)</text>
  <path d="M 100 440 L 130 440 L 140 370 L 160 440 L 530 440 L 540 480 L 570 440 L 700 440" fill="none" stroke="#f38ba8" stroke-width="3">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="4s" repeatCount="indefinite" />
  </path>
  
  <!-- Dopamine Baseline label -->
  <text x="710" y="225" font-family="sans-serif" font-size="12" fill="#6c7086">Baseline</text>
  <text x="710" y="335" font-family="sans-serif" font-size="12" fill="#6c7086">Baseline</text>
  <text x="710" y="445" font-family="sans-serif" font-size="12" fill="#6c7086">Baseline</text>
  
</svg>
