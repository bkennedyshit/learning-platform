<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a24" rx="8"/>
  <text x="400" y="40" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">MVCC &amp; Tuple Visibility in PostgreSQL</text>

  <g transform="translate(100, 80)">
    <!-- Old Tuple Version -->
    <text x="0" y="20" fill="#a8a8c0" font-family="sans-serif" font-size="14" font-weight="bold">Tuple Version 1 (Old)</text>
    <rect x="0" y="30" width="600" height="80" fill="#2a2530" stroke="#7f8c8d" stroke-width="2" rx="4"/>
    
    <rect x="0" y="30" width="100" height="80" fill="#34495e" rx="4"/>
    <text x="50" y="60" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">xmin</text>
    <text x="50" y="80" fill="#2ecc71" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">100</text>

    <rect x="100" y="30" width="100" height="80" fill="#34495e"/>
    <text x="150" y="60" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">xmax</text>
    <text x="150" y="80" fill="#e74c3c" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">200</text>
    <line x1="100" y1="30" x2="100" y2="110" stroke="#1a1a24" stroke-width="2"/>

    <rect x="200" y="30" width="120" height="80" fill="#34495e"/>
    <text x="260" y="60" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">t_ctid</text>
    <text x="260" y="80" fill="#f1c40f" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">-> (V2)</text>
    <line x1="200" y1="30" x2="200" y2="110" stroke="#1a1a24" stroke-width="2"/>

    <text x="460" y="75" fill="#bdc3c7" font-family="sans-serif" font-size="16" text-anchor="middle">Data: 'Bob'</text>
    
    <path d="M 260 110 L 260 170" stroke="#f1c40f" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-yellow)"/>

    <!-- New Tuple Version -->
    <text x="0" y="190" fill="#a8a8c0" font-family="sans-serif" font-size="14" font-weight="bold">Tuple Version 2 (Current)</text>
    <rect x="0" y="200" width="600" height="80" fill="#25302a" stroke="#2ecc71" stroke-width="2" rx="4"/>
    
    <rect x="0" y="200" width="100" height="80" fill="#27ae60" rx="4"/>
    <text x="50" y="230" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">xmin</text>
    <text x="50" y="250" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">200</text>

    <rect x="100" y="200" width="100" height="80" fill="#27ae60"/>
    <text x="150" y="230" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">xmax</text>
    <text x="150" y="250" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">0</text>
    <line x1="100" y1="200" x2="100" y2="280" stroke="#1a1a24" stroke-width="2"/>

    <rect x="200" y="200" width="120" height="80" fill="#27ae60"/>
    <text x="260" y="230" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">t_ctid</text>
    <text x="260" y="250" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">(self)</text>
    <line x1="200" y1="200" x2="200" y2="280" stroke="#1a1a24" stroke-width="2"/>

    <text x="460" y="245" fill="#bdc3c7" font-family="sans-serif" font-size="16" text-anchor="middle">Data: 'Bob2'</text>

    <!-- Snapshots -->
    <rect x="0" y="340" width="280" height="70" fill="#8e44ad" rx="4" opacity="0.8"/>
    <text x="140" y="365" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Snapshot @ XID=150</text>
    <text x="140" y="385" fill="#d2b4de" font-family="sans-serif" font-size="12" text-anchor="middle">Sees V1 (xmax=200 is in future)</text>

    <rect x="320" y="340" width="280" height="70" fill="#2980b9" rx="4" opacity="0.8"/>
    <text x="460" y="365" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Snapshot @ XID=250</text>
    <text x="460" y="385" fill="#a9cce3" font-family="sans-serif" font-size="12" text-anchor="middle">Sees V2 (xmin=200 is committed)</text>

    <!-- Eye animation for Snapshot 150 -->
    <circle cx="140" cy="160" r="12" fill="#8e44ad">
       <animateMotion dur="6s" repeatCount="indefinite" path="M 0 180 L 0 0" keyTimes="0; 1"/>
       <animate attributeName="opacity" values="1;1;0;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;0.6;1"/>
    </circle>
    <!-- Eye animation for Snapshot 250 -->
    <circle cx="460" cy="300" r="12" fill="#2980b9">
       <animateMotion dur="6s" repeatCount="indefinite" path="M 0 40 L 0 -40" keyTimes="0; 1"/>
       <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;0.6;0.9;1"/>
    </circle>

  </g>

  <defs>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f1c40f" />
    </marker>
  </defs>
</svg>
