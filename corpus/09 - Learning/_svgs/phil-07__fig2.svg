<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <rect width="800" height="400" fill="#1e1e1e" rx="12"/>
    <text x="400" y="40" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Functionalism &amp; Multiple Realizability</text>
    
    <!-- Input -->
    <g transform="translate(100, 200)">
        <rect x="-60" y="-30" width="120" height="60" fill="#333" stroke="#aaa" stroke-width="2" rx="8"/>
        <text y="5" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle">Input (Stimulus)</text>
        <circle cx="60" cy="0" r="5" fill="#4a90e2">
            <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
    </g>

    <line x1="160" y1="200" x2="280" y2="200" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow2)"/>

    <!-- The Functional State -->
    <g transform="translate(400, 200)">
        <rect x="-100" y="-80" width="200" height="160" fill="none" stroke="#e2b94a" stroke-width="4" stroke-dasharray="10 5" rx="15"/>
        <text y="-95" fill="#e2b94a" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Mental State (e.g. Pain)</text>
        <text y="105" fill="#a0a0a0" font-family="sans-serif" font-size="14" text-anchor="middle">Defined by causal role, not material</text>

        <!-- Substrate 1: Biological -->
        <g opacity="1">
            <animate attributeName="opacity" values="1; 1; 0; 0; 1" dur="6s" repeatCount="indefinite"/>
            <path d="M-40,0 C-40,-30 40,-30 40,0 C40,30 -40,30 -40,0" fill="#e24a4a" fill-opacity="0.3" stroke="#e24a4a" stroke-width="2"/>
            <text y="5" fill="#e24a4a" font-family="sans-serif" font-size="16" text-anchor="middle">Biological Neurons</text>
        </g>
        
        <!-- Substrate 2: Silicon -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0" dur="6s" repeatCount="indefinite"/>
            <rect x="-40" y="-20" width="80" height="40" fill="#4ae29c" fill-opacity="0.3" stroke="#4ae29c" stroke-width="2"/>
            <path d="M-30,-20 L-30,-30 M-10,-20 L-10,-30 M10,-20 L10,-30 M30,-20 L30,-30" stroke="#4ae29c" stroke-width="2"/>
            <text y="5" fill="#4ae29c" font-family="sans-serif" font-size="16" text-anchor="middle">Silicon Chips</text>
        </g>
    </g>

    <line x1="500" y1="200" x2="620" y2="200" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow2)"/>

    <!-- Output -->
    <g transform="translate(700, 200)">
        <rect x="-60" y="-30" width="120" height="60" fill="#333" stroke="#aaa" stroke-width="2" rx="8"/>
        <text y="5" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle">Output (Behavior)</text>
        <circle cx="-60" cy="0" r="5" fill="#4a90e2">
            <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
        </circle>
    </g>

    <defs>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#4a90e2"/>
        </marker>
    </defs>
</svg>
