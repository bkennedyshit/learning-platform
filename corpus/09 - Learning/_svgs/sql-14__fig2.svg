<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background-color: #1e1e2e; font-family: sans-serif;">
  <style>
    .title { fill: #cdd6f4; font-size: 24px; font-weight: bold; text-anchor: middle; }
    .subtitle { fill: #a6adc8; font-size: 16px; text-anchor: middle; }
    .grid-line { stroke: #45475a; stroke-width: 2; }
    .cell-text { fill: #cdd6f4; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .partition { fill: none; stroke: #f38ba8; stroke-width: 4; stroke-dasharray: 8; }
    .highlight { fill: #89b4fa; opacity: 0.3; }
    .current { fill: #a6e3a1; opacity: 0.5; }
    .arrow { stroke: #a6e3a1; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1" />
    </marker>
  </defs>

  <text x="400" y="40" class="title">Window Functions: Partition &amp; Frame</text>
  <text x="400" y="70" class="subtitle">PARTITION BY dept_id ORDER BY salary ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</text>

  <g transform="translate(200, 120)">
    <rect x="0" y="0" width="400" height="40" fill="#313244" />
    <text x="100" y="25" class="cell-text" font-weight="bold">dept_id</text>
    <text x="300" y="25" class="cell-text" font-weight="bold">salary</text>

    <!-- Sales Partition -->
    <rect x="0" y="40" width="400" height="40" fill="#1e1e2e" />
    <text x="100" y="65" class="cell-text">Sales</text><text x="300" y="65" class="cell-text">50000</text>
    
    <rect x="0" y="80" width="400" height="40" fill="#181825" />
    <text x="100" y="105" class="cell-text">Sales</text><text x="300" y="105" class="cell-text">60000</text>

    <rect x="0" y="120" width="400" height="40" fill="#1e1e2e" />
    <text x="100" y="145" class="cell-text">Sales</text><text x="300" y="145" class="cell-text">70000</text>

    <!-- IT Partition -->
    <rect x="0" y="160" width="400" height="40" fill="#181825" />
    <text x="100" y="185" class="cell-text">IT</text><text x="300" y="185" class="cell-text">75000</text>

    <rect x="0" y="200" width="400" height="40" fill="#1e1e2e" />
    <text x="100" y="225" class="cell-text">IT</text><text x="300" y="225" class="cell-text">85000</text>

    <line x1="0" y1="0" x2="400" y2="0" class="grid-line" />
    <line x1="0" y1="40" x2="400" y2="40" class="grid-line" />
    <line x1="0" y1="160" x2="400" y2="160" class="grid-line" stroke="#f38ba8" stroke-width="3" />
    <line x1="0" y1="240" x2="400" y2="240" class="grid-line" />
    <line x1="0" y1="0" x2="0" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="240" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="240" class="grid-line" />

    <text x="-40" y="105" class="cell-text" fill="#f38ba8" font-weight="bold" transform="rotate(-90 -40 105)">PARTITION 1</text>
    <text x="-40" y="200" class="cell-text" fill="#f38ba8" font-weight="bold" transform="rotate(-90 -40 200)">PARTITION 2</text>

    <!-- Animated Frame for current row = 145 (Sales, 70000) -->
    <rect x="0" y="40" width="400" height="120" class="highlight">
      <animate attributeName="height" values="40;80;120;40" keyTimes="0; 0.33; 0.66; 1" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="0" y="40" width="400" height="40" class="current">
      <animate attributeName="y" values="40;80;120;40" keyTimes="0; 0.33; 0.66; 1" dur="6s" repeatCount="indefinite" />
    </rect>
    
    <path d="M 420,60 L 450,60" class="arrow">
      <animate attributeName="d" values="M 420,60 L 450,60; M 420,100 L 450,100; M 420,140 L 450,140; M 420,60 L 450,60" keyTimes="0; 0.33; 0.66; 1" dur="6s" repeatCount="indefinite" />
    </path>
    <text x="460" y="65" class="cell-text" fill="#a6e3a1" text-anchor="start">
      <animate attributeName="y" values="65;105;145;65" keyTimes="0; 0.33; 0.66; 1" dur="6s" repeatCount="indefinite" />
      Current Row
    </text>
  </g>
</svg>
