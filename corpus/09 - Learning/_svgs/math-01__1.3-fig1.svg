<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 640px; height: auto;">
  <defs>
    <marker id="rs-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .axis    { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .grid    { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.30; }
    .curve   { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.8; fill: none; }
    .rect-L  { fill: var(--interactive-accent, #58a6ff); opacity: 0.25; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.2; }
    .rect-R  { fill: var(--text-accent, #79c0ff); opacity: 0.20; stroke: var(--text-accent, #79c0ff); stroke-width: 1.2; }
    .label   { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .math    { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .legend-L{ fill: var(--interactive-accent, #58a6ff); }
    .legend-R{ fill: var(--text-accent, #79c0ff); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>

  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="40" x2="60" y2="360"/>
    <line x1="160" y1="40" x2="160" y2="360"/>
    <line x1="260" y1="40" x2="260" y2="360"/>
    <line x1="360" y1="40" x2="360" y2="360"/>
    <line x1="460" y1="40" x2="460" y2="360"/>
    <line x1="560" y1="40" x2="560" y2="360"/>
    <line x1="60" y1="80"  x2="580" y2="80"/>
    <line x1="60" y1="160" x2="580" y2="160"/>
    <line x1="60" y1="240" x2="580" y2="240"/>
    <line x1="60" y1="320" x2="580" y2="320"/>
  </g>

  <!-- Axes -->
  <line x1="40"  y1="360" x2="600" y2="360" class="axis" marker-end="url(#rs-arrow)"/>
  <line x1="60"  y1="385" x2="60"  y2="30"  class="axis" marker-end="url(#rs-arrow)"/>
  <text x="606" y="364" class="label">x</text>
  <text x="48"  y="28"  class="label">y</text>

  <!-- LEFT endpoint rectangles (n=5 partition of [80,560]) -->
  <!-- Curve: approximately y = 360 - 0.0008*(x-80)*(x-560) - smooth hill -->
  <!-- x values for left endpoints: 80,176,272,368,464 width=96 -->
  <!-- f(80)=360-0=360 → y=360 (bottom=360), so height=0: skip, use f(x)= 200 + 100*sin(...) proxy -->
  <!-- Using fixed rectangle heights reflecting a hill shape: -->
  <rect x="80"  y="180" width="96" height="180" class="rect-L"/>
  <rect x="176" y="120" width="96" height="240" class="rect-L"/>
  <rect x="272" y="100" width="96" height="260" class="rect-L"/>
  <rect x="368" y="130" width="96" height="230" class="rect-L"/>
  <rect x="464" y="200" width="96" height="160" class="rect-L"/>

  <!-- RIGHT endpoint rectangles (slightly different heights) -->
  <rect x="80"  y="120" width="96" height="240" class="rect-R"/>
  <rect x="176" y="100" width="96" height="260" class="rect-R"/>
  <rect x="272" y="130" width="96" height="230" class="rect-R"/>
  <rect x="368" y="200" width="96" height="160" class="rect-R"/>
  <rect x="464" y="270" width="96" height="90"  class="rect-R"/>

  <!-- The actual curve (smooth hill approximation) -->
  <path class="curve" d="M 80 360 C 120 300, 160 160, 200 110 S 300 90, 320 100 S 440 140, 500 220 S 560 320, 560 360"/>

  <!-- Axis labels a and b -->
  <line x1="80"  y1="360" x2="80"  y2="368" stroke="var(--text-normal, #c9d1d9)" stroke-width="1.5"/>
  <line x1="560" y1="360" x2="560" y2="368" stroke="var(--text-normal, #c9d1d9)" stroke-width="1.5"/>
  <text x="80"  y="382" class="math" text-anchor="middle">a</text>
  <text x="560" y="382" class="math" text-anchor="middle">b</text>

  <!-- Legend -->
  <rect x="390" y="50" width="16" height="12" class="legend-L" opacity="0.5"/>
  <text x="412" y="61" class="label">Left endpoint (L_n)</text>
  <rect x="390" y="72" width="16" height="12" class="legend-R" opacity="0.5"/>
  <text x="412" y="83" class="label">Right endpoint (R_n)</text>

  <!-- Title -->
  <text x="320" y="24" class="label" text-anchor="middle" font-weight="bold">Riemann Sums — n = 5 partition of [a, b]</text>
</svg>