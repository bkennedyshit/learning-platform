<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);transition: fill 0.2s ease;}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;transition:all 0.3s ease;}
    .box:hover{stroke:var(--interactive-accent,#58a6ff);fill:rgba(88,166,255,0.02);filter:drop-shadow(0 0 4px rgba(88,166,255,0.15));}
    .process{fill:var(--background-secondary,#161b22);stroke:var(--interactive-accent,#58a6ff);stroke-width:1.4;transition:all 0.3s ease;cursor:pointer;}
    .process:hover{fill:rgba(88,166,255,0.08) !important;stroke-width:2px;filter:drop-shadow(0 0 4px var(--interactive-accent,#58a6ff));}
    
    /* Hover effects for selection table rows */
    .table-row {
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .table-row:hover text {
      fill: var(--interactive-accent,#58a6ff) !important;
      font-weight: bold;
    }
    
    /* Gentle slow scan animation across the manufacturing columns */
    @keyframes column-pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 2px rgba(88,166,255,0.1)); }
    }
    .col-anim {
      animation: column-pulse 6s ease-in-out infinite;
    }
    .col-1 { animation-delay: 0s; }
    .col-2 { animation-delay: 2s; }
    .col-3 { animation-delay: 4s; }
  </style>
  <text x="360" y="22" class="title" text-anchor="middle">34.3 — Manufacturing Processes &amp; DFM: From Raw Stock to Finished Part</text>
  
  <!-- Subtractive processes -->
  <rect x="20" y="35" width="165" height="200" class="box col-anim col-1" rx="4"/>
  <text x="102" y="52" class="label" text-anchor="middle" font-weight="bold">Subtractive</text>
  <text x="102" y="64" class="sub" text-anchor="middle">(material removed)</text>
  <rect x="30" y="72" width="145" height="22" class="process" rx="3"/>
  <text x="102" y="87" class="sub" text-anchor="middle" pointer-events="none">Turning (lathe) — cylindrical</text>
  <rect x="30" y="100" width="145" height="22" class="process" rx="3"/>
  <text x="102" y="115" class="sub" text-anchor="middle" pointer-events="none">Milling — flat, pockets, profiles</text>
  <rect x="30" y="128" width="145" height="22" class="process" rx="3"/>
  <text x="102" y="143" class="sub" text-anchor="middle" pointer-events="none">Drilling — holes ≥ 0.3 mm</text>
  <rect x="30" y="156" width="145" height="22" class="process" rx="3"/>
  <text x="102" y="171" class="sub" text-anchor="middle" pointer-events="none">Grinding — high tolerance (IT5)</text>
  <rect x="30" y="184" width="145" height="22" class="process" rx="3"/>
  <text x="102" y="199" class="sub" text-anchor="middle" pointer-events="none">Laser / Waterjet — 2D sheet</text>
  <text x="102" y="220" class="sub" text-anchor="middle">Tol: ±0.025–0.1 mm typical</text>
  <text x="102" y="232" class="sub" text-anchor="middle">Surface: Ra 0.8–3.2 µm CNC</text>
  
  <!-- Additive processes -->
  <rect x="200" y="35" width="155" height="200" class="box col-anim col-2" rx="4"/>
  <text x="277" y="52" class="label" text-anchor="middle" font-weight="bold">Additive</text>
  <text x="277" y="64" class="sub" text-anchor="middle">(material added)</text>
  <rect x="210" y="72" width="135" height="22" class="process" rx="3"/>
  <text x="277" y="87" class="sub" text-anchor="middle" pointer-events="none">FDM — filament, ±0.2 mm</text>
  <rect x="210" y="100" width="135" height="22" class="process" rx="3"/>
  <text x="277" y="115" class="sub" text-anchor="middle" pointer-events="none">SLA/MSLA — resin, ±0.05 mm</text>
  <rect x="210" y="128" width="135" height="22" class="process" rx="3"/>
  <text x="277" y="143" class="sub" text-anchor="middle" pointer-events="none">SLS — nylon powder, functional</text>
  <rect x="210" y="156" width="135" height="22" class="process" rx="3"/>
  <text x="277" y="171" class="sub" text-anchor="middle" pointer-events="none">DMLS/SLM — metal (Ti, SS)</text>
  <rect x="210" y="184" width="135" height="22" class="process" rx="3"/>
  <text x="277" y="199" class="sub" text-anchor="middle" pointer-events="none">Polyjet — multi-material</text>
  <text x="277" y="220" class="sub" text-anchor="middle">Anisotropic! Test print orientation.</text>
  <text x="277" y="232" class="sub" text-anchor="middle">Supports add post-process time.</text>
  
  <!-- Forming processes -->
  <rect x="370" y="35" width="155" height="200" class="box col-anim col-3" rx="4"/>
  <text x="447" y="52" class="label" text-anchor="middle" font-weight="bold">Forming</text>
  <text x="447" y="64" class="sub" text-anchor="middle">(shape without removal)</text>
  <rect x="380" y="72" width="135" height="22" class="process" rx="3"/>
  <text x="447" y="87" class="sub" text-anchor="middle" pointer-events="none">Sheet metal bend (K-factor)</text>
  <rect x="380" y="100" width="135" height="22" class="process" rx="3"/>
  <text x="447" y="115" class="sub" text-anchor="middle" pointer-events="none">Deep drawing — cups/enclosures</text>
  <rect x="380" y="128" width="135" height="22" class="process" rx="3"/>
  <text x="447" y="143" class="sub" text-anchor="middle" pointer-events="none">Injection moulding — plastic</text>
  <rect x="380" y="156" width="135" height="22" class="process" rx="3"/>
  <text x="447" y="171" class="sub" text-anchor="middle" pointer-events="none">Die casting — Al/Zn alloys</text>
  <rect x="380" y="184" width="135" height="22" class="process" rx="3"/>
  <text x="447" y="199" class="sub" text-anchor="middle" pointer-events="none">Forging — high fatigue strength</text>
  <text x="447" y="220" class="sub" text-anchor="middle">Tooling cost: $5k–$100k+</text>
  <text x="447" y="232" class="sub" text-anchor="middle">Unit cost drops steeply (&gt;1000)</text>
  
  <!-- DFM rules -->
  <rect x="540" y="35" width="165" height="200" class="box" rx="4"/>
  <text x="622" y="52" class="label" text-anchor="middle" font-weight="bold">DFM Rules</text>
  <text x="545" y="68" class="sub" font-weight="bold">Universal:</text>
  <text x="545" y="80" class="sub">• Minimize setups (ops)</text>
  <text x="545" y="92" class="sub">• Design for worst tolerance</text>
  <text x="545" y="104" class="sub">• Avoid tight tol where loose ok</text>
  <text x="545" y="116" class="sub">• Self-locating features</text>
  <text x="545" y="130" class="sub" font-weight="bold">CNC Machining:</text>
  <text x="545" y="142" class="sub">• Min corner radius = tool R</text>
  <text x="545" y="154" class="sub">• Depth ≤ 4× width for pockets</text>
  <text x="545" y="166" class="sub">• Thread depth ≤ 2.5× dia</text>
  <text x="545" y="178" class="sub" font-weight="bold">3D Printing:</text>
  <text x="545" y="190" class="sub">• Overhang &lt;45° = no support</text>
  <text x="545" y="202" class="sub">• Layer lines ⊥ to stress</text>
  <text x="545" y="214" class="sub">• Embed brass inserts for threads</text>
  <text x="545" y="226" class="sub" font-weight="bold">Sheet Metal:</text>
  <text x="545" y="238" class="sub">• Hole dia ≥ material thickness</text>
  
  <!-- Bottom: process selection matrix -->
  <rect x="20" y="250" width="680" height="150" class="box" rx="4"/>
  <text x="360" y="268" class="label" text-anchor="middle" font-weight="bold">Process Selection: Volume × Complexity × Material Matrix</text>
  <!-- Table header -->
  <line x1="20" y1="276" x2="700" y2="276" stroke="var(--text-muted,#8b949e)" stroke-width="0.6"/>
  <text x="100" y="289" class="sub" text-anchor="middle" font-weight="bold">Process</text>
  <text x="250" y="289" class="sub" text-anchor="middle" font-weight="bold">Volume (units)</text>
  <text x="390" y="289" class="sub" text-anchor="middle" font-weight="bold">Complexity</text>
  <text x="530" y="289" class="sub" text-anchor="middle" font-weight="bold">Materials</text>
  <text x="640" y="289" class="sub" text-anchor="middle" font-weight="bold">Lead Time</text>
  <line x1="20" y1="294" x2="700" y2="294" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  
  <!-- Row 1 -->
  <g class="table-row">
    <text x="100" y="307" class="mono" text-anchor="middle">FDM 3D Print</text>
    <text x="250" y="307" class="mono" text-anchor="middle">1–50</text>
    <text x="390" y="307" class="mono" text-anchor="middle">High (undercuts ok)</text>
    <text x="530" y="307" class="mono" text-anchor="middle">PLA/PETG/ASA/PA</text>
    <text x="640" y="307" class="mono" text-anchor="middle">Hours–days</text>
  </g>
  
  <!-- Row 2 -->
  <g class="table-row">
    <text x="100" y="321" class="mono" text-anchor="middle">CNC Machining</text>
    <text x="250" y="321" class="mono" text-anchor="middle">1–500</text>
    <text x="390" y="321" class="mono" text-anchor="middle">Med (setup limited)</text>
    <text x="530" y="321" class="mono" text-anchor="middle">Any machinable metal/plastic</text>
    <text x="640" y="321" class="mono" text-anchor="middle">Days–2 weeks</text>
  </g>
  
  <!-- Row 3 -->
  <g class="table-row">
    <text x="100" y="335" class="mono" text-anchor="middle">Sheet Metal</text>
    <text x="250" y="335" class="mono" text-anchor="middle">10–10k</text>
    <text x="390" y="335" class="mono" text-anchor="middle">Medium (bend limits)</text>
    <text x="530" y="335" class="mono" text-anchor="middle">Al, SS, mild steel, Cu</text>
    <text x="640" y="335" class="mono" text-anchor="middle">1–3 weeks</text>
  </g>
  
  <!-- Row 4 -->
  <g class="table-row">
    <text x="100" y="349" class="mono" text-anchor="middle">Inj. Moulding</text>
    <text x="250" y="349" class="mono" text-anchor="middle">1000+</text>
    <text x="390" y="349" class="mono" text-anchor="middle">High (complex geometry)</text>
    <text x="530" y="349" class="mono" text-anchor="middle">Any thermoplastic</text>
    <text x="640" y="349" class="mono" text-anchor="middle">6–12 weeks (tooling)</text>
  </g>
  
  <text x="360" y="370" class="sub" text-anchor="middle">Decision rule: prototype with FDM/SLA → validate function → quote CNC for low-volume (&lt;500) → injection mould when unit economics demand it.</text>
  <text x="360" y="385" class="sub" text-anchor="middle">DFMA (Design for Manufacture AND Assembly): fewer parts = fewer joints = fewer failures. Every screw not designed out is a screw that can fall out.</text>
  <text x="360" y="400" class="sub" text-anchor="middle">Online DFM checklist tools: Hubs (hubs.com/knowledge-base/dfm) · Xometry (xometry.com/resources/dfm) · Fictiv (fictiv.com/resources)</text>
</svg>
