<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:620px;height:auto;">
  <defs>
    <marker id="attn-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <style>
    .attn-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1.2; rx: 6; }
    .attn-qkv { fill: var(--interactive-accent, #58a6ff); fill-opacity: 0.1; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 4; animation: qkvPulse 2s infinite alternate; }
    .attn-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; stroke-dasharray: 5; animation: attnFlow 1s linear infinite; }
    @keyframes qkvPulse { from { fill-opacity: 0.1; } to { fill-opacity: 0.2; } }
    @keyframes attnFlow { to { stroke-dashoffset: -10; } }
    .attn-weight { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; opacity: 0.6; }
    .attn-lbl { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .attn-acc { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .attn-dim { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
  </style>
  <!-- Input tokens -->
  <rect x="20" y="140" width="60" height="30" class="attn-box"/>
  <text x="50" y="160" class="attn-lbl">x₁</text>
  <rect x="20" y="180" width="60" height="30" class="attn-box"/>
  <text x="50" y="200" class="attn-lbl">x₂</text>
  <rect x="20" y="220" width="60" height="30" class="attn-box"/>
  <text x="50" y="240" class="attn-lbl">x₃</text>
  <text x="50" y="130" class="attn-dim">X: (n×d)</text>
  <!-- Q, K, V projections -->
  <rect x="130" y="100" width="50" height="30" class="attn-qkv"/>
  <text x="155" y="120" class="attn-acc">Q</text>
  <text x="155" y="90" class="attn-dim">(n×dₖ)</text>
  <rect x="130" y="170" width="50" height="30" class="attn-qkv"/>
  <text x="155" y="190" class="attn-acc">K</text>
  <text x="155" y="160" class="attn-dim">(n×dₖ)</text>
  <rect x="130" y="240" width="50" height="30" class="attn-qkv"/>
  <text x="155" y="260" class="attn-acc">V</text>
  <text x="155" y="230" class="attn-dim">(n×dᵥ)</text>
  <!-- Arrows from X to QKV -->
  <line x1="80" y1="155" x2="130" y2="115" class="attn-line" marker-end="url(#attn-arr)"/>
  <line x1="80" y1="195" x2="130" y2="185" class="attn-line" marker-end="url(#attn-arr)"/>
  <line x1="80" y1="235" x2="130" y2="255" class="attn-line" marker-end="url(#attn-arr)"/>
  <!-- MatMul QKᵀ -->
  <rect x="230" y="130" width="80" height="40" class="attn-box"/>
  <text x="270" y="155" class="attn-lbl">QKᵀ/√dₖ</text>
  <text x="270" y="120" class="attn-dim">(n×n)</text>
  <line x1="180" y1="115" x2="230" y2="145" class="attn-line" marker-end="url(#attn-arr)"/>
  <line x1="180" y1="185" x2="230" y2="155" class="attn-line" marker-end="url(#attn-arr)"/>
  <!-- Softmax -->
  <rect x="350" y="130" width="70" height="40" class="attn-box"/>
  <text x="385" y="155" class="attn-acc">softmax</text>
  <text x="385" y="120" class="attn-dim">(n×n)</text>
  <line x1="310" y1="150" x2="350" y2="150" class="attn-line" marker-end="url(#attn-arr)"/>
  <!-- Multiply by V -->
  <rect x="460" y="130" width="60" height="40" class="attn-box"/>
  <text x="490" y="155" class="attn-lbl">× V</text>
  <line x1="420" y1="150" x2="460" y2="150" class="attn-line" marker-end="url(#attn-arr)"/>
  <line x1="180" y1="255" x2="490" y2="170" class="attn-line" marker-end="url(#attn-arr)"/>
  <!-- Output -->
  <rect x="550" y="130" width="55" height="40" class="attn-qkv"/>
  <text x="577" y="155" class="attn-acc">Out</text>
  <text x="577" y="120" class="attn-dim">(n×dᵥ)</text>
  <line x1="520" y1="150" x2="550" y2="150" class="attn-line" marker-end="url(#attn-arr)"/>
  <!-- Formula box -->
  <rect x="130" y="290" width="380" height="50" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="320" y="312" class="attn-acc">Attention(Q, K, V) = softmax(QKᵀ / √dₖ) · V</text>
  <text x="320" y="332" class="attn-dim">Shapes: (n×dₖ)(dₖ×n) = (n×n), then (n×n)(n×dᵥ) = (n×dᵥ)</text>
</svg>