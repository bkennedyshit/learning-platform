<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .loop-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 2; rx: 8; transition: all 0.2s; }
    .loop-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; filter: drop-shadow(0 0 6px var(--interactive-accent, #58a6ff)); }
    .loop-label { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal, #c9d1d9); font-weight: bold; text-anchor: middle; }
    .loop-sublabel { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .flow-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; color: var(--interactive-accent, #58a6ff); }
    .time-axis { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 4,4; }
    .title-text { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .frame-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-accent, #79c0ff); text-anchor: middle; }
    
    /* Animations */
    @keyframes pulse-box {
      0%, 100% { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; filter: none; }
      12.5%, 25% { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; filter: drop-shadow(0 0 8px var(--interactive-accent, #58a6ff)); }
      37.5%, 87.5% { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; filter: none; }
    }
    .box-input { animation: pulse-box 4s infinite 0s; }
    .box-update { animation: pulse-box 4s infinite 1s; }
    .box-render { animation: pulse-box 4s infinite 2s; }
    .box-swap { animation: pulse-box 4s infinite 3s; }
    
    @keyframes pulse-fixed {
      0%, 100% { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; filter: none; }
      50% { stroke: var(--text-accent, #79c0ff); stroke-width: 2.5; filter: drop-shadow(0 0 6px var(--text-accent, #79c0ff)); }
    }
    .box-fixed { animation: pulse-fixed 3s infinite 0s; }
    .box-variable { animation: pulse-fixed 3s infinite 1.5s; }
    
    .pulse-glow {
      filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff));
    }
  </style>
  <!-- Title -->
  <text x="300" y="30" class="title-text">The Game Loop — One Frame</text>
  <!-- Frame time indicator -->
  <line x1="50" y1="380" x2="550" y2="380" class="time-axis"/>
  <text x="300" y="395" class="frame-label">← 16.67ms (60 FPS) | 11.11ms (90 FPS VR) →</text>
  
  <!-- Main loop flow path for motion guide -->
  <path id="loop-path" d="M 100 95 L 250 95 L 400 95 L 530 95 L 530 160 Q 530 175 515 175 L 85 175 Q 70 175 70 160 L 70 95 Z" fill="none" stroke="none" />

  <!-- Process Input Box -->
  <rect x="40" y="60" width="120" height="70" class="loop-box box-input" style="cursor:pointer;"/>
  <text x="100" y="90" class="loop-label">Process</text>
  <text x="100" y="108" class="loop-label">Input</text>
  <text x="100" y="125" class="loop-sublabel">Poll HID / Events</text>
  <!-- Update Box -->
  <rect x="190" y="60" width="120" height="70" class="loop-box box-update" style="cursor:pointer;"/>
  <text x="250" y="90" class="loop-label">Update</text>
  <text x="250" y="108" class="loop-label">Game State</text>
  <text x="250" y="125" class="loop-sublabel">Logic + Physics</text>
  <!-- Render Box -->
  <rect x="340" y="60" width="120" height="70" class="loop-box box-render" style="cursor:pointer;"/>
  <text x="400" y="90" class="loop-label">Render</text>
  <text x="400" y="108" class="loop-label">Frame</text>
  <text x="400" y="125" class="loop-sublabel">Draw calls → GPU</text>
  <!-- Present Box -->
  <rect x="490" y="60" width="80" height="70" class="loop-box box-swap" style="cursor:pointer;"/>
  <text x="530" y="95" class="loop-label">Swap</text>
  <text x="530" y="113" class="loop-label">Buffers</text>
  <!-- Flow arrows -->
  <line x1="160" y1="95" x2="190" y2="95" class="flow-line" marker-end="url(#loop-arrow)"/>
  <line x1="310" y1="95" x2="340" y2="95" class="flow-line" marker-end="url(#loop-arrow)"/>
  <line x1="460" y1="95" x2="490" y2="95" class="flow-line" marker-end="url(#loop-arrow)"/>
  <!-- Loop-back arrow -->
  <path d="M 530 130 L 530 160 Q 530 175 515 175 L 85 175 Q 70 175 70 160 L 70 130" class="flow-line" fill="none" marker-end="url(#loop-arrow)"/>
  <text x="300" y="190" class="frame-label">Next Frame</text>
  
  <!-- Glowing loop-runner dot -->
  <circle r="5" fill="var(--interactive-accent, #58a6ff)" class="pulse-glow">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 100 95 L 250 95 L 400 95 L 530 95 L 530 160 Q 530 175 515 175 L 85 175 Q 70 175 70 160 L 70 95 Z" />
  </circle>

  <!-- Fixed timestep detail -->
  <rect x="80" y="220" width="200" height="60" class="loop-box box-fixed" style="cursor:pointer;"/>
  <text x="180" y="245" class="loop-label">Fixed Update (Physics)</text>
  <text x="180" y="265" class="loop-sublabel">Δt = 1/50s deterministic</text>
  <!-- Variable timestep detail -->
  <rect x="320" y="220" width="200" height="60" class="loop-box box-variable" style="cursor:pointer;"/>
  <text x="420" y="245" class="loop-label">Variable Update (Logic)</text>
  <text x="420" y="265" class="loop-sublabel">Δt = actual frame time</text>
  <!-- Connection lines -->
  <line x1="250" y1="130" x2="180" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="250" y1="130" x2="420" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Accumulator note -->
  <rect x="150" y="310" width="300" height="45" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="300" y="330" class="loop-sublabel" font-size="12">accumulator += frameTime;</text>
  <text x="300" y="347" class="loop-sublabel" font-size="12">while (accumulator >= fixedDt) { physics(); accumulator -= fixedDt; }</text>
</svg>
