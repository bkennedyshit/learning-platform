<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .box { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; rx: 12; ry: 12; transition: all 0.3s ease; cursor: pointer; }
    .box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; filter: drop-shadow(0 0 8px var(--interactive-accent, #58a6ff)); }
    .box-mechanics { fill: var(--background-secondary, #161b22); }
    .box-dynamics { fill: var(--background-secondary, #161b22); }
    .box-aesthetics { fill: var(--background-secondary, #161b22); }
    .arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; marker-end: url(#mda-arrow); }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 18px; fill: var(--text-normal, #c9d1d9); font-weight: bold; text-anchor: middle; }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .perspective { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-accent, #79c0ff); text-anchor: middle; font-style: italic; font-weight: bold; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .flow-arrow-right { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; marker-end: url(#mda-arrow-accent); animation: flow-r 1.5s linear infinite; }
    .flow-arrow-left { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; marker-end: url(#mda-arrow-accent-reverse); animation: flow-l 1.5s linear infinite; }
    
    @keyframes flow-r {
      to { stroke-dashoffset: -20; }
    }
    @keyframes flow-l {
      to { stroke-dashoffset: 20; }
    }
    
    .pulse-dot { fill: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 3px var(--interactive-accent, #58a6ff)); }
    
    /* Box hover triggers a soft scale effect */
    .box-group { transition: transform 0.3s ease; }
    .box-group:hover { transform: translateY(-3px); }
  </style>
  <defs>
    <marker id="mda-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="mda-arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
    <marker id="mda-arrow-accent-reverse" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <!-- Flipped marker for left-pointing flow -->
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" class="title">The MDA Framework (Hunicke, LeBlanc, Zubek, 2004)</text>

  <!-- Mechanics Box -->
  <g class="box-group">
    <rect x="50" y="80" width="160" height="120" class="box box-mechanics"/>
    <text x="130" y="120" class="label">Mechanics</text>
    <text x="130" y="145" class="sublabel">Rules, algorithms,</text>
    <text x="130" y="162" class="sublabel">data structures</text>
    <text x="130" y="185" class="sublabel">— what you BUILD</text>
  </g>

  <!-- Dynamics Box -->
  <g class="box-group">
    <rect x="270" y="80" width="160" height="120" class="box box-dynamics"/>
    <text x="350" y="120" class="label">Dynamics</text>
    <text x="350" y="145" class="sublabel">Emergent behavior,</text>
    <text x="350" y="162" class="sublabel">player interactions</text>
    <text x="350" y="185" class="sublabel">— what HAPPENS</text>
  </g>

  <!-- Aesthetics Box -->
  <g class="box-group">
    <rect x="490" y="80" width="160" height="120" class="box box-aesthetics"/>
    <text x="570" y="120" class="label">Aesthetics</text>
    <text x="570" y="145" class="sublabel">Emotional responses,</text>
    <text x="570" y="162" class="sublabel">player experience</text>
    <text x="570" y="185" class="sublabel">— what players FEEL</text>
  </g>

  <!-- Arrows between boxes -->
  <line x1="215" y1="140" x2="265" y2="140" class="arrow"/>
  <line x1="435" y1="140" x2="485" y2="140" class="arrow"/>

  <!-- Flowing Signal Dots on the main arrows -->
  <circle cx="215" cy="140" r="3.5" class="pulse-dot">
    <animate attributeName="cx" from="215" to="265" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="435" cy="140" r="3.5" class="pulse-dot">
    <animate attributeName="cx" from="435" to="485" dur="2s" repeatCount="indefinite" begin="1s" />
  </circle>

  <!-- Designer perspective (left to right) -->
  <text x="350" y="240" class="perspective">Designer's View →</text>
  <line x1="130" y1="250" x2="570" y2="250" class="flow-arrow-right"/>

  <!-- Player perspective (right to left) -->
  <text x="350" y="290" class="perspective">← Player's View</text>
  <line x1="570" y1="300" x2="130" y2="300" class="flow-arrow-left"/>

  <!-- 8 Aesthetics taxonomy -->
  <text x="350" y="345" class="sublabel" font-weight="bold">The 8 Kinds of Fun:</text>
  <text x="350" y="365" class="sublabel">Sensation · Fantasy · Narrative · Challenge · Fellowship · Discovery · Expression · Submission</text>
  <text x="350" y="385" class="sublabel" fill="var(--text-accent, #79c0ff)">(Each maps to specific mechanics → dynamics chains)</text>
</svg>
