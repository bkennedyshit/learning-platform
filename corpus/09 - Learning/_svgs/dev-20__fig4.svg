<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />

  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">DEPLOYMENT STRATEGIES</text>

  <!-- Blue/Green -->
  <g transform="translate(50, 80)">
    <text x="150" y="0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Blue / Green</text>
    
    <rect x="0" y="20" width="120" height="80" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="60" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#bfdbfe" text-anchor="middle">v1.0</text>
    <text x="60" y="90" font-family="sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Idle</text>

    <rect x="180" y="20" width="120" height="80" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2" />
    <text x="240" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#bbf7d0" text-anchor="middle">v2.0</text>
    <text x="240" y="90" font-family="sans-serif" font-size="12" fill="#4ade80" text-anchor="middle">100% Traffic</text>

    <!-- Load Balancer -->
    <path d="M 150 160 L 150 140" stroke="#94a3b8" stroke-width="2" fill="none" />
    <rect x="100" y="160" width="100" height="40" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <text x="150" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Router</text>
    
    <path d="M 150 140 L 240 105" stroke="#22c55e" stroke-width="3" fill="none" />
    <path d="M 150 140 L 60 105" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" fill="none" />

    <circle cx="150" cy="140" r="6" fill="#22c55e">
      <animate attributeName="fill" values="#3b82f6; #22c55e; #3b82f6" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Divider -->
  <line x1="400" y1="70" x2="400" y2="350" stroke="#475569" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Canary -->
  <g transform="translate(450, 80)">
    <text x="150" y="0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Canary (Progressive)</text>
    
    <rect x="0" y="20" width="120" height="80" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="60" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#bfdbfe" text-anchor="middle">v1.0 (Stable)</text>
    
    <!-- Animated Text for v1.0 Traffic -->
    <text x="60" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">
      <tspan>
        <animate attributeName="fill-opacity" values="1;0;0;0;1" dur="10s" repeatCount="indefinite" />95% Traffic
      </tspan>
      <tspan x="60" y="90">
        <animate attributeName="fill-opacity" values="0;1;0;0;0" dur="10s" repeatCount="indefinite" />50% Traffic
      </tspan>
      <tspan x="60" y="90">
        <animate attributeName="fill-opacity" values="0;0;1;0;0" dur="10s" repeatCount="indefinite" />5% Traffic
      </tspan>
      <tspan x="60" y="90">
        <animate attributeName="fill-opacity" values="0;0;0;1;0" dur="10s" repeatCount="indefinite" />0% Traffic
      </tspan>
    </text>

    <rect x="180" y="20" width="120" height="80" rx="8" fill="#4a044e" stroke="#d946ef" stroke-width="2" />
    <text x="240" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbcfe8" text-anchor="middle">v2.0 (Canary)</text>
    
    <!-- Animated Text for v2.0 Traffic -->
    <text x="240" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e879f9" text-anchor="middle">
      <tspan>
        <animate attributeName="fill-opacity" values="1;0;0;0;1" dur="10s" repeatCount="indefinite" />5% Traffic
      </tspan>
      <tspan x="240" y="90">
        <animate attributeName="fill-opacity" values="0;1;0;0;0" dur="10s" repeatCount="indefinite" />50% Traffic
      </tspan>
      <tspan x="240" y="90">
        <animate attributeName="fill-opacity" values="0;0;1;0;0" dur="10s" repeatCount="indefinite" />95% Traffic
      </tspan>
      <tspan x="240" y="90">
        <animate attributeName="fill-opacity" values="0;0;0;1;0" dur="10s" repeatCount="indefinite" />100% Traffic
      </tspan>
    </text>

    <!-- Load Balancer -->
    <path d="M 150 160 L 150 140" stroke="#94a3b8" stroke-width="2" fill="none" />
    <rect x="100" y="160" width="100" height="40" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <text x="150" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Service Mesh</text>
    
    <path d="M 150 140 L 240 105" stroke="#d946ef" stroke-width="2" fill="none" />
    <path d="M 150 140 L 60 105" stroke="#3b82f6" stroke-width="2" fill="none" />
    
    <!-- Progress bar -->
    <rect x="50" y="230" width="200" height="10" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="50" y="230" width="10" height="10" rx="5" fill="#d946ef">
      <animate attributeName="width" values="10; 100; 190; 200; 10" dur="10s" repeatCount="indefinite" />
    </rect>
    <text x="150" y="260" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Traffic Shift over time</text>
  </g>
</svg>
