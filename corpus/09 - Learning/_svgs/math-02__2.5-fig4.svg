<svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <style>
    .rbox { fill:var(--background-secondary, #161b22); stroke:var(--text-muted, #8b949e); stroke-width:1; rx:5; }
    .rarr { stroke:var(--interactive-accent, #58a6ff); stroke-width:1.8; fill:none; }
    .rlab { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--text-normal, #c9d1d9); text-anchor:middle; }
    .racc { font-family:Inter,system-ui,sans-serif; font-size:11px; fill:var(--interactive-accent, #58a6ff); text-anchor:middle; }
    @keyframes step1 { 0%, 15% { opacity: 0; } 20%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes step2 { 0%, 35% { opacity: 0; } 40%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes step3 { 0%, 55% { opacity: 0; } 60%, 95% { opacity: 1; } 100% { opacity: 0; } }
    .s1 { animation: step1 6s infinite; }
    .s2 { animation: step2 6s infinite; }
    .s3 { animation: step3 6s infinite; }
  </style>
  <defs>
    <marker id="rar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Box 1: Original -->
  <rect x="10" y="30" width="100" height="80" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="60" y="65" class="rlab" font-weight="bold">det A</text>
  <text x="60" y="85" class="rlab">= d</text>
  <g class="s1">
    <!-- Arrow 1: swap rows -->
    <line x1="110" y1="70" x2="155" y2="70" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.8" marker-end="url(#rar)"/>
    <text x="132" y="62" class="racc">swap R_i,R_j</text>
    <!-- Box 2: after swap -->
    <rect x="155" y="30" width="100" height="80" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
    <text x="205" y="65" class="rlab" font-weight="bold">det A'</text>
    <text x="205" y="85" class="rlab">= −d</text>
  </g>
  <g class="s2">
    <!-- Arrow 2: scale row -->
    <line x1="255" y1="70" x2="300" y2="70" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.8" marker-end="url(#rar)"/>
    <text x="277" y="62" class="racc">R_i ← c·R_i</text>
    <!-- Box 3: after scale -->
    <rect x="300" y="30" width="100" height="80" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
    <text x="350" y="65" class="rlab" font-weight="bold">det A''</text>
    <text x="350" y="85" class="rlab">= −c·d</text>
  </g>
  <g class="s3">
    <!-- Arrow 3: add multiple -->
    <line x1="400" y1="70" x2="445" y2="70" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.8" marker-end="url(#rar)"/>
    <text x="422" y="62" class="racc">R_i += c·R_j</text>
    <!-- Box 4: unchanged -->
    <rect x="445" y="30" width="65" height="80" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
    <text x="477" y="65" class="rlab">det</text>
    <text x="477" y="85" class="rlab">= −c·d</text>
  </g>
</svg>