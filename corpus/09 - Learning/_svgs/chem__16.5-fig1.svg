<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .curve { fill: none; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; }
    .axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .min-dot { fill: var(--interactive-accent, #58a6ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .region { font-family: Inter, system-ui, sans-serif; font-size: 10px; }
  </style>
  <text x="300" y="20" class="title" text-anchor="middle">Equilibrium = Gibbs Free Energy Minimum</text>
  <!-- Axes -->
  <line x1="60" y1="270" x2="540" y2="270" class="axis"/>
  <line x1="60" y1="270" x2="60" y2="40" class="axis"/>
  <text x="300" y="295" class="label" text-anchor="middle">Extent of Reaction (ξ) →</text>
  <text x="80" y="285" class="sublabel">Pure</text>
  <text x="80" y="298" class="sublabel">Reactants</text>
  <text x="500" y="285" class="sublabel">Pure</text>
  <text x="500" y="298" class="sublabel">Products</text>
  <text x="30" y="155" class="label" text-anchor="middle" transform="rotate(-90 30 155)">Gibbs Free Energy (G)</text>
  <!-- G curve (parabola-like with minimum) -->
  <path d="M 80 100 C 120 95, 160 90, 200 100 C 240 110, 270 140, 300 180 C 280 150, 250 120, 300 180" class="curve" style="display:none;"/>
  <path d="M 80 80 Q 200 60, 280 150 Q 320 200, 520 120" class="curve"/>
  <!-- Minimum point -->
  <circle cx="310" cy="175" r="6" class="min-dot"/>
  <text x="310" y="200" class="label" text-anchor="middle" fill="var(--interactive-accent, #58a6ff)">Equilibrium</text>
  <text x="310" y="215" class="sublabel" text-anchor="middle">(dG/dξ = 0)</text>
  <!-- Q < K region -->
  <text x="150" y="130" class="region" fill="#4dabf7">Q &lt; K</text>
  <text x="150" y="145" class="sublabel" fill="#4dabf7">→ forward rxn</text>
  <text x="150" y="158" class="sublabel" fill="#4dabf7">ΔG &lt; 0</text>
  <!-- Q > K region -->
  <text x="430" y="130" class="region" fill="#ff6b6b">Q &gt; K</text>
  <text x="430" y="145" class="sublabel" fill="#ff6b6b">← reverse rxn</text>
  <text x="430" y="158" class="sublabel" fill="#ff6b6b">ΔG &gt; 0</text>
  <!-- Key equations -->
  <rect x="60" y="230" width="200" height="35" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="3"/>
  <text x="160" y="250" class="label" text-anchor="middle">ΔG° = −RT ln K</text>
  <rect x="340" y="230" width="200" height="35" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="3"/>
  <text x="440" y="250" class="label" text-anchor="middle">K = q_prod/q_react · e^(-Δε₀/kT)</text>
</svg>
