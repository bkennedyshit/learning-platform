<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:700px;height:auto;">
  <defs>
    <marker id="bp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .bp-ax { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; }
    .bp-grid { stroke: var(--text-muted, #8b949e); stroke-width: 0.5; opacity: 0.3; }
    .bp-mag { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawBode 4s ease-in-out infinite; }
    .bp-phase { stroke: var(--text-accent, #79c0ff); stroke-width: 2.5; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawBode 4s ease-in-out infinite 0.5s; }
    @keyframes drawBode { 0% { stroke-dashoffset: 1000; } 50%, 100% { stroke-dashoffset: 0; } }
    .bp-asym { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; stroke-dasharray: 6 3; fill: none; }
    .bp-0db { stroke: var(--text-normal, #c9d1d9); stroke-width: 1; stroke-dasharray: 4 2; }
    .bp-lbl { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .bp-acc { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .bp-brk { fill: var(--interactive-accent, #58a6ff); cursor: pointer; transition: all 0.2s; }
    .bp-brk:hover { r: 6; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
  </style>

  <!-- MAGNITUDE PLOT (top half) -->
  <text x="350" y="20" class="bp-acc" text-anchor="middle">Magnitude Plot (dB vs log ω)</text>

  <!-- Axes -->
  <line x1="80" y1="130" x2="650" y2="130" class="bp-0db"/>
  <text x="660" y="135" class="bp-lbl">0 dB</text>
  <line x1="80" y1="30" x2="80" y2="220" class="bp-ax" marker-end="url(#bp-arr)"/>
  <line x1="80" y1="220" x2="650" y2="220" class="bp-ax" marker-end="url(#bp-arr)"/>
  <text x="660" y="225" class="bp-lbl">ω</text>
  <text x="60" y="30" class="bp-lbl">|G| dB</text>

  <!-- Frequency markers -->
  <text x="180" y="235" class="bp-lbl" text-anchor="middle">ω₁</text>
  <text x="350" y="235" class="bp-lbl" text-anchor="middle">ω₂</text>
  <text x="520" y="235" class="bp-lbl" text-anchor="middle">ω₃</text>

  <!-- Asymptotic magnitude (0 dB → -20 dB/dec → -40 dB/dec → -60 dB/dec) -->
  <path d="M 80 80 L 180 80 L 350 130 L 520 210" class="bp-asym"/>

  <!-- Actual magnitude curve (smooth) -->
  <path d="M 80 80 C 130 80 160 78 180 83 C 210 90 280 115 350 135 C 420 155 470 185 520 210 L 600 240" class="bp-mag"/>

  <!-- Break frequency dots -->
  <circle cx="180" cy="80" r="4" class="bp-brk"/>
  <circle cx="350" cy="130" r="4" class="bp-brk"/>

  <!-- Slope annotations -->
  <text x="130" y="70" class="bp-lbl">0 dB/dec</text>
  <text x="260" y="95" class="bp-acc">-20 dB/dec</text>
  <text x="430" y="165" class="bp-acc">-40 dB/dec</text>

  <!-- PHASE PLOT (bottom half) -->
  <text x="350" y="270" class="bp-acc" text-anchor="middle">Phase Plot (degrees vs log ω)</text>

  <!-- Axes -->
  <line x1="80" y1="280" x2="80" y2="470" class="bp-ax"/>
  <line x1="80" y1="470" x2="650" y2="470" class="bp-ax" marker-end="url(#bp-arr)"/>
  <text x="660" y="475" class="bp-lbl">ω</text>
  <text x="40" y="285" class="bp-lbl">∠G</text>

  <!-- Phase reference lines -->
  <line x1="80" y1="310" x2="650" y2="310" class="bp-grid"/>
  <text x="60" y="315" class="bp-lbl">0°</text>
  <line x1="80" y1="370" x2="650" y2="370" class="bp-grid"/>
  <text x="55" y="375" class="bp-lbl">-90°</text>
  <line x1="80" y1="430" x2="650" y2="430" class="bp-grid"/>
  <text x="50" y="435" class="bp-lbl">-180°</text>

  <!-- Phase curve -->
  <path d="M 80 310 C 120 310 150 315 180 340 C 220 370 280 385 350 400 C 420 415 480 425 520 430 C 560 435 600 438 640 440" class="bp-phase"/>

  <!-- Phase margin annotation -->
  <line x1="400" y1="430" x2="400" y2="410" stroke="var(--text-accent, #79c0ff)" stroke-width="2"/>
  <text x="410" y="425" class="bp-lbl" fill="var(--text-accent, #79c0ff)">PM</text>
</svg>