<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="ed-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>

  <style>
    .axis      { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .grid      { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.35; }
    .curve     { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.8; fill: none; }
    .eps-band  { fill: var(--interactive-accent, #58a6ff); opacity: 0.10; }
    .delta-band{ fill: var(--text-accent, #79c0ff); opacity: 0.10; }
    .ref-line  { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    .pt        { fill: var(--text-accent, #79c0ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.2; }
    .pt:hover  { fill: var(--interactive-accent, #58a6ff); r: 6; }
    .label     { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .math      { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 15px; fill: var(--text-normal, #c9d1d9); }
    .math-acc  { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 15px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
  </style>

  <!-- Grid -->
  <g class="grid">
    <line x1="60"  y1="40"  x2="60"  y2="370"/>
    <line x1="160" y1="40"  x2="160" y2="370"/>
    <line x1="260" y1="40"  x2="260" y2="370"/>
    <line x1="360" y1="40"  x2="360" y2="370"/>
    <line x1="460" y1="40"  x2="460" y2="370"/>
    <line x1="560" y1="40"  x2="560" y2="370"/>
    <line x1="60"  y1="80"  x2="560" y2="80"/>
    <line x1="60"  y1="160" x2="560" y2="160"/>
    <line x1="60"  y1="240" x2="560" y2="240"/>
    <line x1="60"  y1="320" x2="560" y2="320"/>
  </g>

  <!-- Epsilon band (horizontal around L) -->
  <rect x="60" y="140" width="500" height="120" class="eps-band">
    <animate attributeName="y" values="140;190;140" dur="6s" repeatCount="indefinite" />
    <animate attributeName="height" values="120;20;120" dur="6s" repeatCount="indefinite" />
  </rect>
  <line x1="60" y1="140" x2="560" y2="140" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.2" stroke-dasharray="3 2">
    <animate attributeName="y1" values="140;190;140" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="140;190;140" dur="6s" repeatCount="indefinite" />
  </line>
  <line x1="60" y1="260" x2="560" y2="260" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.2" stroke-dasharray="3 2">
    <animate attributeName="y1" values="260;210;260" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="260;210;260" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Delta band (vertical around a) -->
  <rect x="240" y="40" width="160" height="330" class="delta-band">
    <animate attributeName="x" values="240;305;240" dur="6s" repeatCount="indefinite" />
    <animate attributeName="width" values="160;30;160" dur="6s" repeatCount="indefinite" />
  </rect>
  <line x1="240" y1="40" x2="240" y2="370" stroke="var(--text-accent, #79c0ff)" stroke-width="1.2" stroke-dasharray="3 2">
    <animate attributeName="x1" values="240;305;240" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="240;305;240" dur="6s" repeatCount="indefinite" />
  </line>
  <line x1="400" y1="40" x2="400" y2="370" stroke="var(--text-accent, #79c0ff)" stroke-width="1.2" stroke-dasharray="3 2">
    <animate attributeName="x1" values="400;335;400" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="400;335;400" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Axes -->
  <line x1="40"  y1="370" x2="580" y2="370" class="axis" marker-end="url(#ed-arrow)"/>
  <line x1="60"  y1="395" x2="60"  y2="30"  class="axis" marker-end="url(#ed-arrow)"/>
  <text x="585" y="374" class="label">x</text>
  <text x="48"  y="28"  class="label">y</text>

  <!-- The function curve y = f(x), an arbitrary smooth example -->
  <path class="curve" d="M 70 340
                          C 140 280, 200 220, 260 200
                          L 320 200
                          C 380 200, 440 150, 540 60"/>

  <!-- Limit point markers -->
  <line x1="320" y1="200" x2="320" y2="370" class="ref-line"/>
  <line x1="320" y1="200" x2="60"  y2="200" class="ref-line"/>
  <circle cx="320" cy="200" r="5" class="pt"/>

  <!-- Anchor labels for a, L, epsilon, delta -->
  <text x="320" y="388" class="math" text-anchor="middle">a</text>
  <text x="240" y="388" class="math-acc" text-anchor="middle">
    a−δ
    <animate attributeName="x" values="240;305;240" dur="6s" repeatCount="indefinite" />
  </text>
  <text x="400" y="388" class="math-acc" text-anchor="middle">
    a+δ
    <animate attributeName="x" values="400;335;400" dur="6s" repeatCount="indefinite" />
  </text>

  <text x="48"  y="204" class="math" text-anchor="end">L</text>
  <text x="48"  y="144" class="math-acc" text-anchor="end">
    L+ε
    <animate attributeName="y" values="144;194;144" dur="6s" repeatCount="indefinite" />
  </text>
  <text x="48"  y="264" class="math-acc" text-anchor="end">
    L−ε
    <animate attributeName="y" values="264;214;264" dur="6s" repeatCount="indefinite" />
  </text>

  <!-- Title block -->
  <rect x="380" y="50" width="190" height="60" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="475" y="72" class="label" text-anchor="middle" font-weight="bold">For every ε &gt; 0,</text>
  <text x="475" y="92" class="label" text-anchor="middle">∃ δ &gt; 0 : 0 &lt; |x − a| &lt; δ</text>
  <text x="475" y="106" class="label" text-anchor="middle">⟹ |f(x) − L| &lt; ε</text>
</svg>