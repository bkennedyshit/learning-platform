<svg viewBox="0 0 480 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px;height:auto;">
  <defs>
    <marker id="gv-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <style>
    .gax   { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.2; fill: none; }
    .lc    { stroke: var(--text-muted, #8b949e); stroke-width: 1.3; fill: none; opacity: 0.7; }
    .gvec  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; }
    .gl3   { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .gacc3 { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--interactive-accent, #58a6ff); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Axes -->
  <line x1="50" y1="230" x2="440" y2="230" class="gax"/>
  <line x1="240" y1="420" x2="240" y2="40" class="gax"/>
  <text x="445" y="234" class="gl3">x</text>
  <text x="244" y="36"  class="gl3">y</text>
  <!-- Level curves: circles centered at origin -->
  <circle cx="240" cy="230" r="40"  class="lc"/>
  <circle cx="240" cy="230" r="80"  class="lc"/>
  <circle cx="240" cy="230" r="120" class="lc"/>
  <circle cx="240" cy="230" r="160" class="lc"/>
  <!-- Gradient vectors: radially outward at 8 directions on circle r=80 -->
  <line x1="240" y1="150" x2="240" y2="118" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="297" y1="173" x2="321" y2="149" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="320" y1="230" x2="353" y2="230" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="297" y1="287" x2="321" y2="311" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="240" y1="310" x2="240" y2="342" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="183" y1="287" x2="159" y2="311" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="160" y1="230" x2="127" y2="230" class="gvec" marker-end="url(#gv-arrow)"/>
  <line x1="183" y1="173" x2="159" y2="149" class="gvec" marker-end="url(#gv-arrow)"/>
  <!-- Labels -->
  <text x="368" y="200" class="gacc3">∇f ⊥ level curves</text>
  <text x="368" y="216" class="gl3">∇f = ⟨2x, 2y⟩</text>
  <text x="40" y="430"  class="gl3">f(x,y) = x²+y², level curves: circles</text>
</svg>