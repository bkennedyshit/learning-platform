<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <defs>
    <marker id="arrow-prod" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; }
    .di-box { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 8; }
    .service-box { fill: var(--background-secondary, #161b22); stroke: #4CAF50; stroke-width: 1.5; rx: 6; }
    .consumer-box { fill: var(--background-secondary, #161b22); stroke: #FF9800; stroke-width: 1.5; rx: 6; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; fill: var(--interactive-accent, #58a6ff); }
    .inject-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; marker-end: url(#arrow-prod); stroke-dasharray: 5,3; }
    .dep-arrow { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; marker-end: url(#arrow-prod); }
    .note { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
  </style>

  <text x="350" y="22" class="title">Production Architecture — DI, Save, Addressables</text>

  <!-- DI Container (center) -->
  <text x="350" y="48" class="section-label">DI container (VContainer)</text>
  <rect x="250" y="55" width="200" height="40" class="di-box"/>
  <text x="350" y="72" class="label">LifetimeScope</text>
  <text x="350" y="86" class="note">Resolves all dependencies at startup</text>

  <!-- Services (left column) -->
  <text x="100" y="115" class="section-label">services (interfaces)</text>

  <rect x="30" y="125" width="140" height="28" class="service-box"/>
  <text x="100" y="143" class="label">ISaveService</text>

  <rect x="30" y="160" width="140" height="28" class="service-box"/>
  <text x="100" y="178" class="label">IAudioService</text>

  <rect x="30" y="195" width="140" height="28" class="service-box"/>
  <text x="100" y="213" class="label">IItemDatabase</text>

  <rect x="30" y="230" width="140" height="28" class="service-box"/>
  <text x="100" y="248" class="label">IWallet</text>

  <!-- Consumers (right column) -->
  <text x="570" y="115" class="section-label">consumers</text>

  <rect x="500" y="125" width="140" height="28" class="consumer-box"/>
  <text x="570" y="143" class="label">ShopSystem</text>

  <rect x="500" y="160" width="140" height="28" class="consumer-box"/>
  <text x="570" y="178" class="label">CraftingSystem</text>

  <rect x="500" y="195" width="140" height="28" class="consumer-box"/>
  <text x="570" y="213" class="label">SaveCoordinator</text>

  <rect x="500" y="230" width="140" height="28" class="consumer-box"/>
  <text x="570" y="248" class="label">UI Controllers</text>

  <!-- Injection arrows -->
  <path d="M 170 139 L 250 75" class="inject-arrow"/>
  <path d="M 170 174 L 250 80" class="inject-arrow"/>
  <path d="M 170 209 L 260 85" class="inject-arrow"/>
  <path d="M 170 244 L 260 90" class="inject-arrow"/>

  <path d="M 450 75 L 500 139" class="inject-arrow"/>
  <path d="M 450 80 L 500 174" class="inject-arrow"/>
  <path d="M 450 85 L 500 209" class="inject-arrow"/>
  <path d="M 450 90 L 500 244" class="inject-arrow"/>

  <!-- Save flow (bottom) -->
  <rect x="50" y="290" width="600" height="90" class="box"/>
  <text x="350" y="310" class="label">Save System Flow</text>

  <rect x="70" y="320" width="90" height="25" class="service-box"/>
  <text x="115" y="336" class="label">CaptureState</text>

  <path d="M 160 332 L 195 332" class="dep-arrow"/>

  <rect x="195" y="320" width="90" height="25" class="service-box"/>
  <text x="240" y="336" class="label">Serialize</text>

  <path d="M 285 332 L 320 332" class="dep-arrow"/>

  <rect x="320" y="320" width="90" height="25" class="service-box"/>
  <text x="365" y="336" class="label">Write .tmp</text>

  <path d="M 410 332 L 445 332" class="dep-arrow"/>

  <rect x="445" y="320" width="70" height="25" class="service-box"/>
  <text x="480" y="336" class="label">Verify</text>

  <path d="M 515 332 L 545 332" class="dep-arrow"/>

  <rect x="545" y="320" width="90" height="25" class="di-box"/>
  <text x="590" y="336" class="label">Rename ✓</text>

  <text x="350" y="365" class="note">Atomic save: write temp → verify → backup old → rename temp to save</text>
  <text x="350" y="378" class="note">Crash at any point = previous valid save preserved</text>
</svg>
