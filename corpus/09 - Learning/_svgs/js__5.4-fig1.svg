<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 8; fill: var(--background-secondary, #161b22); transition: all 0.2s; cursor: pointer; }
    .box:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 3px var(--interactive-accent, #58a6ff)); transform: translateY(-1px); }
    .oop-accent { stroke: #3b82f6; stroke-width: 2; }
    .fp-accent { stroke: #10b981; stroke-width: 2; }
    .both-accent { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; }
    .connector { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; marker-end: url(#decide-arrow); stroke-dasharray: 6; animation: dashMove 1s linear infinite; }
    .section-title { font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: bold; }
    @keyframes dashMove { to { stroke-dashoffset: -12; } }
  </style>
  <defs>
    <marker id="decide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" class="title" text-anchor="middle">OOP vs FP — Decision Model</text>

  <!-- Decision diamond -->
  <polygon points="350,50 450,100 350,150 250,100" fill="var(--background-secondary, #161b22)" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2"/>
  <text x="350" y="97" class="label" text-anchor="middle">What's the</text>
  <text x="350" y="112" class="label" text-anchor="middle">problem shape?</text>

  <!-- Left branch: OOP -->
  <path d="M 250 100 L 130 100" class="connector"/>
  <text x="190" y="92" class="sublabel" text-anchor="middle">Entities with identity</text>

  <rect x="20" y="130" width="220" height="250" class="box oop-accent"/>
  <text x="130" y="155" class="section-title" text-anchor="middle" fill="#3b82f6">OOP Patterns</text>

  <rect x="35" y="165" width="190" height="35" class="box"/>
  <text x="130" y="180" class="label" text-anchor="middle">Classes + Private Fields</text>
  <text x="130" y="193" class="sublabel" text-anchor="middle">Encapsulated state, clear API</text>

  <rect x="35" y="208" width="190" height="35" class="box"/>
  <text x="130" y="223" class="label" text-anchor="middle">Composition (Mixins)</text>
  <text x="130" y="236" class="sublabel" text-anchor="middle">Behaviors as reusable units</text>

  <rect x="35" y="251" width="190" height="35" class="box"/>
  <text x="130" y="266" class="label" text-anchor="middle">Observer / EventEmitter</text>
  <text x="130" y="279" class="sublabel" text-anchor="middle">Decoupled communication</text>

  <rect x="35" y="294" width="190" height="35" class="box"/>
  <text x="130" y="309" class="label" text-anchor="middle">Builder / Factory</text>
  <text x="130" y="322" class="sublabel" text-anchor="middle">Complex object construction</text>

  <rect x="35" y="337" width="190" height="35" class="box"/>
  <text x="130" y="352" class="label" text-anchor="middle">Strategy</text>
  <text x="130" y="365" class="sublabel" text-anchor="middle">Swappable algorithms</text>

  <!-- Right branch: FP -->
  <path d="M 450 100 L 570 100" class="connector"/>
  <text x="510" y="92" class="sublabel" text-anchor="middle">Data transformations</text>

  <rect x="460" y="130" width="220" height="250" class="box fp-accent"/>
  <text x="570" y="155" class="section-title" text-anchor="middle" fill="#10b981">FP Patterns</text>

  <rect x="475" y="165" width="190" height="35" class="box"/>
  <text x="570" y="180" class="label" text-anchor="middle">Pure Functions</text>
  <text x="570" y="193" class="sublabel" text-anchor="middle">No side effects, testable</text>

  <rect x="475" y="208" width="190" height="35" class="box"/>
  <text x="570" y="223" class="label" text-anchor="middle">pipe() / compose()</text>
  <text x="570" y="236" class="sublabel" text-anchor="middle">Data transformation pipelines</text>

  <rect x="475" y="251" width="190" height="35" class="box"/>
  <text x="570" y="266" class="label" text-anchor="middle">Currying / Partial Apply</text>
  <text x="570" y="279" class="sublabel" text-anchor="middle">Specialized function factories</text>

  <rect x="475" y="294" width="190" height="35" class="box"/>
  <text x="570" y="309" class="label" text-anchor="middle">Immutable Updates</text>
  <text x="570" y="322" class="sublabel" text-anchor="middle">Spread, toSorted, structuredClone</text>

  <rect x="475" y="337" width="190" height="35" class="box"/>
  <text x="570" y="352" class="label" text-anchor="middle">Higher-Order Functions</text>
  <text x="570" y="365" class="sublabel" text-anchor="middle">map, filter, reduce</text>

  <!-- Bottom: Both -->
  <path d="M 350 150 L 350 385" class="connector" stroke-dasharray="4,3"/>
  <text x="350" y="395" class="label" text-anchor="middle" fill="var(--interactive-accent, #58a6ff)">Best JS uses BOTH — OOP for structure, FP for logic</text>
</svg>
