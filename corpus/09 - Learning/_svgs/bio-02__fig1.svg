<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mitochondria gradient -->
    <radialGradient id="mitoGrad">
      <stop offset="0%" stop-color="var(--interactive-accent, #f39c12)" />
      <stop offset="100%" stop-color="var(--background-modifier-error, #e74c3c)" />
    </radialGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="transparent"/>
  
  <!-- Cell Membrane -->
  <circle cx="400" cy="300" r="250" fill="none" stroke="var(--text-normal, #ddd)" stroke-width="6" stroke-dasharray="10 5">
    <animateTransform attributeName="transform" type="rotate" from="0 400 300" to="360 400 300" dur="60s" repeatCount="indefinite" />
  </circle>

  <!-- Cytoplasm -->
  <circle cx="400" cy="300" r="247" fill="var(--background-secondary, #222)" opacity="0.8"/>

  <!-- Nucleus -->
  <circle cx="400" cy="300" r="90" fill="var(--background-modifier-active-hover, #444)" stroke="var(--text-muted, #888)" stroke-width="4">
    <animate attributeName="r" values="90; 95; 90" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Nucleolus -->
  <circle cx="420" cy="280" r="30" fill="var(--text-accent, #4a90e2)">
    <animate attributeName="cx" values="420; 425; 420" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- ER -->
  <path d="M 300 200 Q 250 150 200 200 T 250 300 T 200 400" fill="none" stroke="var(--interactive-success, #2ecc71)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M 300 200 Q 250 150 200 200 T 250 300 T 200 400; M 300 200 Q 220 120 180 200 T 270 300 T 180 400; M 300 200 Q 250 150 200 200 T 250 300 T 200 400" dur="6s" repeatCount="indefinite" />
  </path>
  
  <path d="M 500 200 Q 550 150 600 200 T 550 300 T 600 400" fill="none" stroke="var(--interactive-success, #2ecc71)" stroke-width="8" stroke-linecap="round"/>

  <!-- Mitochondria -->
  <g transform="translate(300, 450)">
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="url(#mitoGrad)" stroke="var(--text-normal, #ddd)" stroke-width="2"/>
      <path d="M -30 0 Q -15 -15 0 0 T 30 0" fill="none" stroke="var(--text-normal, #ddd)" stroke-width="2"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="300 450; 300 440; 300 450" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <g transform="translate(500, 150)">
    <g transform="rotate(-45)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="url(#mitoGrad)" stroke="var(--text-normal, #ddd)" stroke-width="2"/>
      <path d="M -30 0 Q -15 -15 0 0 T 30 0" fill="none" stroke="var(--text-normal, #ddd)" stroke-width="2"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="500 150; 510 160; 500 150" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Golgi -->
  <g transform="translate(200, 300)">
    <path d="M -30 -40 Q 0 -50 30 -40" fill="none" stroke="var(--interactive-accent, #9b59b6)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -40 -20 Q 0 -30 40 -20" fill="none" stroke="var(--interactive-accent, #9b59b6)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -50 0 Q 0 -10 50 0" fill="none" stroke="var(--interactive-accent, #9b59b6)" stroke-width="10" stroke-linecap="round"/>
    <path d="M -40 20 Q 0 10 40 20" fill="none" stroke="var(--interactive-accent, #9b59b6)" stroke-width="10" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="scale" values="1; 1.05; 1" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Labels -->
  <text x="400" y="295" font-family="sans-serif" font-size="14" fill="var(--text-normal, #fff)" text-anchor="middle">Nucleus</text>
  <text x="500" y="190" font-family="sans-serif" font-size="14" fill="var(--text-normal, #fff)">Mitochondrion</text>
  <text x="130" y="305" font-family="sans-serif" font-size="14" fill="var(--text-normal, #fff)">Golgi</text>
  <text x="170" y="160" font-family="sans-serif" font-size="14" fill="var(--text-normal, #fff)">ER</text>
</svg>
