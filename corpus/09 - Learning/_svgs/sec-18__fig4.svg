<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .text { font-family: sans-serif; font-size: 14px; fill: #333; }
      .bold { font-weight: bold; }
      .wall { fill: #6c757d; }
      .server { fill: #007bff; rx: 8; }
      .cloud { fill: #e9ecef; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Cloud/Internet -->
  <ellipse cx="150" cy="200" rx="80" ry="50" class="cloud" />
  <text x="150" y="205" text-anchor="middle" class="text bold">Internet</text>
  
  <!-- Firewall / WAF -->
  <rect x="400" y="100" width="20" height="200" class="wall" />
  <text x="410" y="80" text-anchor="middle" class="text bold">Firewall / WAF</text>
  
  <!-- Server -->
  <rect x="600" y="150" width="100" height="100" class="server" />
  <text x="650" y="205" text-anchor="middle" class="text bold" fill="#fff">Internal App</text>
  
  <!-- Traffic Lines -->
  <path d="M 230 170 L 400 170" stroke="#dee2e6" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 420 170 L 600 170" stroke="#dee2e6" stroke-width="2" stroke-dasharray="4,4" />
  
  <path d="M 230 230 L 400 230" stroke="#dee2e6" stroke-width="2" stroke-dasharray="4,4" />
  
  <!-- Legitimate Packet Animation -->
  <g>
    <circle cx="230" cy="170" r="10" fill="#28a745" />
    <text x="230" y="174" text-anchor="middle" font-size="10px" fill="#fff">OK</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="370 0" begin="0s" dur="3s" repeatCount="indefinite" />
  </g>
  
  <!-- Malicious Packet Animation -->
  <g>
    <circle cx="230" cy="230" r="10" fill="#dc3545" />
    <text x="230" y="234" text-anchor="middle" font-size="10px" fill="#fff">SQLi</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" begin="1s" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" begin="1s" dur="3s" repeatCount="indefinite" />
  </g>
  <g opacity="0">
    <text x="390" y="235" font-size="20px" fill="#dc3545">💥</text>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.49;0.5;1" begin="1s" dur="3s" repeatCount="indefinite" />
  </g>
</svg>
