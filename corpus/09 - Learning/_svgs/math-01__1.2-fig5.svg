<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="t-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .axis  { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .grid  { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.3; }
    .true  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; fill: none; }
    .t1    { stroke: var(--text-muted, #8b949e); stroke-width: 1.6; fill: none; stroke-dasharray: 7 4; opacity: 0.85; }
    .t2    { stroke: var(--text-accent, #79c0ff); stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; opacity: 0.85; }
    .t3    { stroke: var(--text-accent, #79c0ff); stroke-width: 2.2; fill: none; stroke-dasharray: 3 2; opacity: 0.95; }
    .t5    { stroke: var(--text-accent, #79c0ff); stroke-width: 2.4; fill: none; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .math  { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>

  <!-- Grid -->
  <g class="grid">
    <line x1="60"  y1="40"  x2="60"  y2="350"/>
    <line x1="160" y1="40"  x2="160" y2="350"/>
    <line x1="260" y1="40"  x2="260" y2="350"/>
    <line x1="360" y1="40"  x2="360" y2="350"/>
    <line x1="460" y1="40"  x2="460" y2="350"/>
    <line x1="560" y1="40"  x2="560" y2="350"/>
    <line x1="60"  y1="80"  x2="560" y2="80"/>
    <line x1="60"  y1="160" x2="560" y2="160"/>
    <line x1="60"  y1="240" x2="560" y2="240"/>
    <line x1="60"  y1="320" x2="560" y2="320"/>
  </g>

  <!-- Axes (y axis at x=60 representing input x=0; y=0 at SVG y=320) -->
  <line x1="40"  y1="320" x2="580" y2="320" class="axis" marker-end="url(#t-arrow)"/>
  <line x1="60"  y1="370" x2="60"  y2="30"  class="axis" marker-end="url(#t-arrow)"/>
  <text x="585" y="324" class="label">x</text>
  <text x="48"  y="28"  class="label">y</text>
  <text x="60"  y="338" class="math" text-anchor="middle">0</text>

  <!-- True e^x (orange thick) - sweeping rapidly upward as x grows -->
  <!-- Map: x in [-1, 2] -> SVG x in [60, 560]; e^x in [0.37, 7.39] -> SVG y in [320, 30] (top) -->
  <path class="true" d="M 60 282 Q 130 260 200 220 Q 280 165 360 100 Q 440 60 560 30"/>

  <!-- T1 = 1 + x (just a line) -->
  <line x1="60" y1="280" x2="560" y2="80" class="t1"/>

  <!-- T2 = 1 + x + x^2/2 (quadratic), curves upward but undershoots -->
  <path class="t2" d="M 60 280 Q 200 240 360 140 Q 460 90 560 35"/>

  <!-- T3 closer -->
  <path class="t3" d="M 60 282 Q 200 250 360 120 Q 450 75 560 32"/>

  <!-- T5 nearly indistinguishable -->
  <path class="t5" d="M 60 282 Q 130 260 200 220 Q 280 165 360 100 Q 440 60 560 30"/>

  <!-- Anchor label -->
  <circle cx="60" cy="280" r="4" fill="var(--text-accent, #79c0ff)" stroke="var(--text-normal, #c9d1d9)" stroke-width="1"/>
  <text x="68" y="276" class="math">expand around 0</text>

  <!-- Legend -->
  <rect x="380" y="220" width="190" height="92" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="475" y="240" class="label" text-anchor="middle" font-weight="bold">Approximations</text>
  <line x1="395" y1="252" x2="425" y2="252" class="true"/>
  <text x="430" y="256" class="label">e^x (true)</text>
  <line x1="395" y1="268" x2="425" y2="268" class="t1"/>
  <text x="430" y="272" class="label">T₁ = 1 + x</text>
  <line x1="395" y1="284" x2="425" y2="284" class="t3"/>
  <text x="430" y="288" class="label">T₃ (cubic)</text>
  <line x1="395" y1="300" x2="425" y2="300" class="t5"/>
  <text x="430" y="304" class="label">T₅ ≈ overlay</text>
</svg>