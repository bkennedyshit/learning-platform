<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <defs>
    <marker id="arrow-ue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .ue-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.3s; cursor: pointer; }
    .ue-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .ue-core { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 8; }
    .ecs-box { fill: none; stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 6; stroke-dasharray: 5,3; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .detail { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: start; }
    .lifecycle-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#arrow-ue); }
    .inherit-arrow { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; marker-end: url(#arrow-ue); }
  </style>

  <text x="350" y="22" class="title">Unreal Engine C++ Architecture &amp; ECS Comparison</text>

  <!-- UObject hierarchy -->
  <text x="150" y="48" class="section-label">UObject Hierarchy</text>

  <rect x="80" y="58" width="120" height="30" class="ue-core"/>
  <text x="140" y="77" class="label">UObject</text>

  <rect x="30" y="105" width="100" height="30" class="ue-box"/>
  <text x="80" y="124" class="label">AActor</text>
  <rect x="150" y="105" width="110" height="30" class="ue-box"/>
  <text x="205" y="124" class="label">UActorComp</text>

  <rect x="10" y="150" width="90" height="28" class="ue-box"/>
  <text x="55" y="168" class="label">APawn</text>
  <rect x="110" y="150" width="100" height="28" class="ue-box"/>
  <text x="160" y="168" class="label">ACharacter</text>

  <line x1="140" y1="88" x2="80" y2="105" class="inherit-arrow"/>
  <line x1="140" y1="88" x2="205" y2="105" class="inherit-arrow"/>
  <line x1="80" y1="135" x2="55" y2="150" class="inherit-arrow"/>
  <line x1="80" y1="135" x2="160" y2="150" class="inherit-arrow"/>

  <!-- Macros -->
  <text x="150" y="200" class="section-label">Key Macros</text>
  <rect x="20" y="208" width="260" height="80" class="ue-box"/>
  <text x="30" y="225" class="detail">UCLASS(Blueprintable)</text>
  <text x="30" y="240" class="detail">UPROPERTY(EditAnywhere)</text>
  <text x="30" y="255" class="detail">UFUNCTION(BlueprintCallable)</text>
  <text x="30" y="270" class="detail">GENERATED_BODY()</text>
  <text x="30" y="285" class="detail">→ Reflection + GC + Serialization</text>

  <!-- Actor Lifecycle -->
  <text x="500" y="48" class="section-label">AActor Lifecycle</text>

  <rect x="420" y="60" width="90" height="25" class="ue-box"/>
  <text x="465" y="77" class="label">Constructor</text>
  <line x1="465" y1="85" x2="465" y2="95" class="lifecycle-arrow"/>

  <rect x="420" y="95" width="90" height="25" class="ue-box"/>
  <text x="465" y="112" class="label">BeginPlay</text>
  <line x1="465" y1="120" x2="465" y2="130" class="lifecycle-arrow"/>

  <rect x="420" y="130" width="90" height="25" class="ue-core"/>
  <text x="465" y="147" class="label">Tick(dt)</text>
  <line x1="465" y1="155" x2="465" y2="165" class="lifecycle-arrow"/>
  <path d="M 510 142 C 530 142 530 130 510 130" class="lifecycle-arrow"/>

  <rect x="420" y="165" width="90" height="25" class="ue-box"/>
  <text x="465" y="182" class="label">EndPlay</text>
  <line x1="465" y1="190" x2="465" y2="200" class="lifecycle-arrow"/>

  <rect x="420" y="200" width="90" height="25" class="ue-box"/>
  <text x="465" y="217" class="label">GC Collect</text>

  <!-- Blueprint interop -->
  <text x="600" y="65" class="detail">C++ defines</text>
  <text x="600" y="78" class="detail">base behavior</text>
  <text x="600" y="100" class="detail">Blueprint</text>
  <text x="600" y="113" class="detail">overrides &amp;</text>
  <text x="600" y="126" class="detail">extends</text>

  <!-- ECS comparison -->
  <text x="500" y="250" class="section-label">ECS Alternative (Custom Engine)</text>

  <rect x="340" y="265" width="80" height="35" class="ecs-box"/>
  <text x="380" y="280" class="label">Entity</text>
  <text x="380" y="293" class="detail">  (just ID)</text>

  <rect x="440" y="265" width="100" height="35" class="ecs-box"/>
  <text x="490" y="280" class="label">Components</text>
  <text x="490" y="293" class="detail">  (pure data)</text>

  <rect x="560" y="265" width="100" height="35" class="ecs-box"/>
  <text x="610" y="280" class="label">Systems</text>
  <text x="610" y="293" class="detail">  (pure logic)</text>

  <!-- Comparison table -->
  <text x="350" y="325" class="section-label">Unreal vs Custom ECS</text>
  <text x="200" y="345" class="detail">Unreal: Rich tooling, Blueprint support</text>
  <text x="200" y="360" class="detail">        GC, reflection, networking built-in</text>
  <text x="200" y="375" class="detail">        Virtual dispatch, OOP-heavy</text>
  <text x="500" y="345" class="detail">ECS: Cache-friendly, SIMD-able</text>
  <text x="500" y="360" class="detail">     Zero overhead, data-oriented</text>
  <text x="500" y="375" class="detail">     Build everything yourself</text>
</svg>
