<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Background Cas9 blob -->
  <path d="M 250 200 C 350 150, 550 150, 600 250 C 650 350, 550 450, 450 450 C 300 450, 200 400, 250 200" fill="var(--background-modifier-active-hover, #333)" stroke="var(--text-muted, #777)" stroke-width="3">
    <animate attributeName="d" values="M 250 200 C 350 150, 550 150, 600 250 C 650 350, 550 450, 450 450 C 300 450, 200 400, 250 200;
                                      M 240 210 C 360 160, 540 140, 610 260 C 640 340, 560 460, 440 440 C 310 460, 210 390, 240 210;
                                      M 250 200 C 350 150, 550 150, 600 250 C 650 350, 550 450, 450 450 C 300 450, 200 400, 250 200" dur="5s" repeatCount="indefinite" />
  </path>
  <text x="500" y="220" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text-muted, #777)">Cas9</text>

  <!-- DNA Target Strand -->
  <path d="M 100 320 L 700 320" fill="none" stroke="var(--text-normal, #ddd)" stroke-width="6"/>
  <!-- DNA Non-Target Strand -->
  <path d="M 100 340 L 400 340 C 450 340, 480 380, 550 380 L 700 380" fill="none" stroke="var(--text-normal, #ddd)" stroke-width="6"/>
  
  <!-- sgRNA -->
  <path d="M 400 320 C 450 320, 480 280, 550 280" fill="none" stroke="var(--interactive-accent, #9b59b6)" stroke-width="6" stroke-dasharray="5 2">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <!-- sgRNA scaffold loop -->
  <path d="M 550 280 C 600 280, 600 200, 500 200" fill="none" stroke="var(--interactive-accent, #9b59b6)" stroke-width="6"/>
  
  <!-- PAM Sequence -->
  <rect x="580" y="310" width="50" height="20" fill="var(--interactive-success, #2ecc71)" opacity="0.8"/>
  <text x="605" y="325" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">PAM</text>

  <!-- Scissors / Cut site -->
  <g transform="translate(560, 300)">
    <g>
      <line x1="-15" y1="-15" x2="5" y2="5" stroke="var(--background-modifier-error, #e74c3c)" stroke-width="3"/>
      <line x1="-15" y1="5" x2="5" y2="-15" stroke="var(--background-modifier-error, #e74c3c)" stroke-width="3"/>
      <circle cx="-15" cy="-15" r="4" fill="none" stroke="var(--background-modifier-error, #e74c3c)" stroke-width="2"/>
      <circle cx="-15" cy="5" r="4" fill="none" stroke="var(--background-modifier-error, #e74c3c)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="0; 20; 0; -20; 0" dur="2s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Labels -->
  <text x="460" y="270" font-family="sans-serif" font-size="14" fill="var(--interactive-accent, #9b59b6)" font-weight="bold">sgRNA</text>
  <text x="150" y="305" font-family="sans-serif" font-size="14" fill="var(--text-normal, #ddd)">Target DNA</text>
  
  <text x="400" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text-normal, #ddd)" text-anchor="middle">CRISPR-Cas9 Editing</text>
</svg>
