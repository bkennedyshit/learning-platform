<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1a202c; }
      .text-title { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 20px; fill: #ffffff; text-anchor: middle; }
      .text-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #ffffff; text-anchor: middle; }
      .text-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #a0aec0; text-anchor: middle; }
      .pod { fill: none; stroke: #4a5568; stroke-width: 2; stroke-dasharray: 4; rx: 8; }
      .container-app { fill: #2d3748; stroke: #718096; stroke-width: 2; rx: 4; }
      .container-proxy { fill: #2b6cb0; stroke: #63b3ed; stroke-width: 2; rx: 4; }
      .mtls-line { stroke: #48bb78; stroke-width: 3; fill: none; }
      .mtls-glow { stroke: #48bb78; stroke-width: 8; opacity: 0.3; fill: none; }
      .internal-line { stroke: #a0aec0; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="12"/>
  <text x="400" y="40" class="text-title">Service Mesh (Sidecar Pattern)</text>
  
  <!-- Pod A -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="220" height="200" class="pod"/>
    <text x="110" y="25" class="text-label" fill="#cbd5e0">Pod A (Orders)</text>
    
    <!-- App Container -->
    <rect x="30" y="40" width="160" height="60" class="container-app"/>
    <text x="110" y="75" class="text-label">App Process</text>
    
    <!-- Proxy Container -->
    <rect x="30" y="120" width="160" height="60" class="container-proxy"/>
    <text x="110" y="150" class="text-label">Envoy Proxy</text>
    <text x="110" y="168" class="text-sub">(Sidecar)</text>
    
    <!-- Local connection -->
    <path d="M 110 100 L 110 120" class="internal-line"/>
  </g>
  
  <!-- Pod B -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="220" height="200" class="pod"/>
    <text x="110" y="25" class="text-label" fill="#cbd5e0">Pod B (Payments)</text>
    
    <!-- App Container -->
    <rect x="30" y="40" width="160" height="60" class="container-app"/>
    <text x="110" y="75" class="text-label">App Process</text>
    
    <!-- Proxy Container -->
    <rect x="30" y="120" width="160" height="60" class="container-proxy"/>
    <text x="110" y="150" class="text-label">Envoy Proxy</text>
    <text x="110" y="168" class="text-sub">(Sidecar)</text>
    
    <!-- Local connection -->
    <path d="M 110 100 L 110 120" class="internal-line"/>
  </g>
  
  <!-- Network mTLS Connection -->
  <g>
    <!-- Base line -->
    <path d="M 320 250 L 480 250" class="mtls-line"/>
    <!-- Animated Glow -->
    <path d="M 320 250 L 480 250" class="mtls-glow">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2s" repeatCount="indefinite"/>
    </path>
    <rect x="360" y="235" width="80" height="30" fill="#1a202c" rx="4"/>
    <text x="400" y="255" class="text-label" fill="#48bb78">mTLS</text>
  </g>
  
  <!-- Control Plane -->
  <g transform="translate(290, 340)">
    <rect x="0" y="0" width="220" height="60" class="container-app" stroke="#d69e2e"/>
    <text x="110" y="35" class="text-label" fill="#d69e2e">Control Plane (Istiod)</text>
  </g>
  
  <!-- Control Lines -->
  <path d="M 210 300 L 290 370" stroke="#d69e2e" stroke-width="2" stroke-dasharray="4" fill="none">
     <animate attributeName="stroke-dashoffset" from="100" to="0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M 590 300 L 510 370" stroke="#d69e2e" stroke-width="2" stroke-dasharray="4" fill="none">
     <animate attributeName="stroke-dashoffset" from="100" to="0" dur="4s" repeatCount="indefinite"/>
  </path>
  
</svg>
