<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-normal, #c9d1d9); }
    .box { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 6; fill: var(--background-secondary, #161b22); }
    .stack-frame { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 4; fill: var(--background-secondary, #161b22); }
    .micro-box { stroke: #a855f7; stroke-width: 2; rx: 6; fill: none; }
    .macro-box { stroke: #f59e0b; stroke-width: 2; rx: 6; fill: none; }
    .loop-path { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 8,4; animation: spin 2s linear infinite; }
    .loop-arrow { fill: var(--interactive-accent, #58a6ff); }
    .flow-arrow { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; marker-end: url(#flow-end); stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawFlow 1.5s infinite; }
    .priority-high { fill: #a855f7; }
    .priority-low { fill: #f59e0b; }
    @keyframes spin { to { stroke-dashoffset: -24; } }
    @keyframes drawFlow { to { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <marker id="flow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
    <marker id="loop-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" class="title" text-anchor="middle">The JavaScript Event Loop</text>

  <!-- Call Stack -->
  <text x="100" y="55" class="label" text-anchor="middle" font-weight="bold">Call Stack</text>
  <rect x="30" y="60" width="140" height="180" class="box"/>
  <rect x="40" y="190" width="120" height="25" class="stack-frame"/>
  <text x="100" y="207" class="code" text-anchor="middle">main()</text>
  <rect x="40" y="160" width="120" height="25" class="stack-frame"/>
  <text x="100" y="177" class="code" text-anchor="middle">fetchData()</text>
  <rect x="40" y="130" width="120" height="25" class="stack-frame"/>
  <text x="100" y="147" class="code" text-anchor="middle">processItem()</text>
  <text x="100" y="85" class="sublabel" text-anchor="middle">LIFO — one at a time</text>
  <text x="100" y="230" class="sublabel" text-anchor="middle">Single thread!</text>

  <!-- Web APIs -->
  <text x="310" y="55" class="label" text-anchor="middle" font-weight="bold">Web APIs / Runtime</text>
  <rect x="200" y="60" width="220" height="100" class="box"/>
  <text x="220" y="85" class="code">setTimeout(cb, 1000) ⏱️</text>
  <text x="220" y="102" class="code">fetch(url) 🌐</text>
  <text x="220" y="119" class="code">addEventListener(...) 🖱️</text>
  <text x="220" y="136" class="code">requestAnimationFrame 🎨</text>
  <text x="310" y="152" class="sublabel" text-anchor="middle">Handled by browser/runtime (separate threads)</text>

  <!-- Arrow from stack to Web APIs -->
  <path d="M 170 130 L 195 110" class="flow-arrow"/>

  <!-- Microtask Queue -->
  <text x="310" y="195" class="label" text-anchor="middle" font-weight="bold">Microtask Queue</text>
  <text x="310" y="208" class="sublabel" text-anchor="middle">(HIGH priority — drained completely)</text>
  <rect x="200" y="215" width="220" height="70" class="micro-box"/>
  <rect x="210" y="225" width="95" height="22" rx="3" fill="var(--background-secondary, #161b22)" stroke="#a855f7" stroke-width="1"/>
  <text x="257" y="240" class="code" text-anchor="middle">.then(cb)</text>
  <rect x="310" y="225" width="100" height="22" rx="3" fill="var(--background-secondary, #161b22)" stroke="#a855f7" stroke-width="1"/>
  <text x="360" y="240" class="code" text-anchor="middle">queueMicro()</text>
  <rect x="210" y="252" width="95" height="22" rx="3" fill="var(--background-secondary, #161b22)" stroke="#a855f7" stroke-width="1"/>
  <text x="257" y="267" class="code" text-anchor="middle">await cont.</text>
  <rect x="310" y="252" width="100" height="22" rx="3" fill="var(--background-secondary, #161b22)" stroke="#a855f7" stroke-width="1"/>
  <text x="360" y="267" class="code" text-anchor="middle">MutationObs</text>

  <!-- Macrotask Queue -->
  <text x="310" y="310" class="label" text-anchor="middle" font-weight="bold">Macrotask Queue</text>
  <text x="310" y="323" class="sublabel" text-anchor="middle">(LOW priority — one per loop iteration)</text>
  <rect x="200" y="330" width="220" height="50" class="macro-box"/>
  <rect x="210" y="340" width="95" height="22" rx="3" fill="var(--background-secondary, #161b22)" stroke="#f59e0b" stroke-width="1"/>
  <text x="257" y="355" class="code" text-anchor="middle">setTimeout</text>
  <rect x="310" y="340" width="100" height="22" rx="3" fill="var(--background-secondary, #161b22)" stroke="#f59e0b" stroke-width="1"/>
  <text x="360" y="355" class="code" text-anchor="middle">setInterval</text>

  <!-- Event Loop Circle -->
  <text x="570" y="55" class="label" text-anchor="middle" font-weight="bold">Event Loop</text>
  <ellipse cx="570" cy="220" rx="90" ry="150" class="loop-path" stroke-dasharray="8,4"/>

  <!-- Loop steps -->
  <circle cx="570" cy="75" r="18" fill="var(--background-secondary, #161b22)" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2"/>
  <text x="570" y="79" class="label" text-anchor="middle" font-weight="bold">1</text>
  <text x="570" y="100" class="sublabel" text-anchor="middle">Run sync code</text>

  <circle cx="660" cy="180" r="18" fill="var(--background-secondary, #161b22)" stroke="#a855f7" stroke-width="2"/>
  <text x="660" y="184" class="label" text-anchor="middle" font-weight="bold">2</text>
  <text x="660" y="205" class="sublabel" text-anchor="middle">Drain ALL</text>
  <text x="660" y="216" class="sublabel" text-anchor="middle">microtasks</text>

  <circle cx="620" cy="320" r="18" fill="var(--background-secondary, #161b22)" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="324" class="label" text-anchor="middle" font-weight="bold">3</text>
  <text x="620" y="345" class="sublabel" text-anchor="middle">Run ONE</text>
  <text x="620" y="356" class="sublabel" text-anchor="middle">macrotask</text>

  <circle cx="500" cy="340" r="18" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <text x="500" y="344" class="label" text-anchor="middle" font-weight="bold">4</text>
  <text x="500" y="365" class="sublabel" text-anchor="middle">Render</text>
  <text x="500" y="376" class="sublabel" text-anchor="middle">(browser)</text>

  <!-- Arrows between steps -->
  <path d="M 588 80 Q 650 120 658 162" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="none" marker-end="url(#loop-end)"/>
  <path d="M 658 198 Q 650 260 625 305" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="none" marker-end="url(#loop-end)"/>
  <path d="M 602 330 Q 560 340 518 340" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="none" marker-end="url(#loop-end)"/>
  <path d="M 485 330 Q 470 250 555 80" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="none" marker-end="url(#loop-end)"/>

  <!-- Key insight box -->
  <rect x="30" y="400" width="640" height="60" rx="8" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="var(--background-secondary, #161b22)"/>
  <text x="350" y="420" class="label" text-anchor="middle" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">🔑 Key Insight</text>
  <text x="350" y="438" class="sublabel" text-anchor="middle">Microtasks are drained COMPLETELY before the next macrotask runs.</text>
  <text x="350" y="452" class="sublabel" text-anchor="middle">A microtask that enqueues another microtask → processed in same cycle (can starve macrotasks!)</text>
</svg>
