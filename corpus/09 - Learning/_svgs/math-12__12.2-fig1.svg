<svg viewBox="0 0 650 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:650px;height:auto;">
  <defs>
    <marker id="stress-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .cube-edge { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .cube-face { fill: var(--background-secondary, #161b22); opacity: 0.3; stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .normal-stress { color: var(--interactive-accent, #58a6ff); stroke: currentColor; stroke-width: 2.5; fill: none; cursor: pointer; transition: all 0.2s; }
    .normal-stress:hover { stroke-width: 3.5; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .shear-stress { color: var(--text-accent, #79c0ff); stroke: currentColor; stroke-width: 2; fill: none; cursor: pointer; transition: all 0.2s; }
    .shear-stress:hover { stroke-width: 3; filter: drop-shadow(0 0 3px var(--text-accent, #79c0ff)); }
    .axis-line { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .label-normal { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .label-shear { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-accent, #79c0ff); font-weight: bold; }
    .info-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
  </style>

  <!-- 3D Cube (isometric projection) -->
  <!-- Back face -->
  <polygon points="200,120 350,60 350,260 200,320" class="cube-face"/>
  <!-- Top face -->
  <polygon points="200,120 350,60 500,120 350,180" class="cube-face"/>
  <!-- Right face -->
  <polygon points="350,180 500,120 500,320 350,380" class="cube-face"/>
  <!-- Front face -->
  <polygon points="200,320 350,380 350,180 200,120" class="cube-face" style="opacity:0.1"/>

  <!-- Cube edges -->
  <line x1="200" y1="120" x2="350" y2="60" class="cube-edge"/>
  <line x1="350" y1="60" x2="500" y2="120" class="cube-edge"/>
  <line x1="500" y1="120" x2="350" y2="180" class="cube-edge"/>
  <line x1="200" y1="120" x2="350" y2="180" class="cube-edge"/>
  <line x1="200" y1="120" x2="200" y2="320" class="cube-edge"/>
  <line x1="350" y1="180" x2="350" y2="380" class="cube-edge"/>
  <line x1="500" y1="120" x2="500" y2="320" class="cube-edge"/>
  <line x1="200" y1="320" x2="350" y2="380" class="cube-edge"/>
  <line x1="350" y1="380" x2="500" y2="320" class="cube-edge"/>
  <line x1="350" y1="60" x2="350" y2="260" class="cube-edge" style="stroke-dasharray:4 3; opacity:0.4"/>

  <!-- Normal stresses (σ_xx on x-face, σ_yy on y-face, σ_zz on z-face) -->
  <!-- σ_xx: right face, pointing right -->
  <line x1="500" y1="220" x2="570" y2="190" class="normal-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 7,-3; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="575" y="185" class="label-normal">σ_xx</text>

  <!-- σ_yy: top face, pointing up -->
  <line x1="350" y1="120" x2="350" y2="40" class="normal-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="358" y="35" class="label-normal">σ_yy</text>

  <!-- σ_zz: front face, pointing out (toward viewer) -->
  <line x1="275" y1="250" x2="225" y2="290" class="normal-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -6,5; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="205" y="310" class="label-normal">σ_zz</text>

  <!-- Shear stresses on right face -->
  <!-- τ_xy on x-face in y-direction -->
  <line x1="480" y1="220" x2="465" y2="160" class="shear-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,-12; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="468" y="148" class="label-shear">τ_xy</text>

  <!-- τ_xz on x-face in z-direction -->
  <line x1="460" y1="240" x2="420" y2="270" class="shear-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -8,6; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="400" y="285" class="label-shear">τ_xz</text>

  <!-- Shear stresses on top face -->
  <!-- τ_yx on y-face in x-direction -->
  <line x1="380" y1="90" x2="440" y2="100" class="shear-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 12,2; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="445" y="98" class="label-shear">τ_yx</text>

  <!-- τ_yz on y-face in z-direction -->
  <line x1="320" y1="100" x2="280" y2="120" class="shear-stress" marker-end="url(#stress-arrow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -8,4; 0,0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="258" y="125" class="label-shear">τ_yz</text>

  <!-- Coordinate axes -->
  <line x1="80" y1="430" x2="140" y2="400" class="axis-line" marker-end="url(#stress-arrow)" style="color:var(--text-muted, #8b949e)"/>
  <text x="145" y="395" class="label">x</text>
  <line x1="80" y1="430" x2="80" y2="370" class="axis-line" marker-end="url(#stress-arrow)" style="color:var(--text-muted, #8b949e)"/>
  <text x="80" y="362" class="label">y</text>
  <line x1="80" y1="430" x2="40" y2="455" class="axis-line" marker-end="url(#stress-arrow)" style="color:var(--text-muted, #8b949e)"/>
  <text x="28" y="465" class="label">z</text>

  <!-- Info box: tensor matrix -->
  <rect x="20" y="10" width="170" height="95" rx="6" class="info-box"/>
  <text x="105" y="32" class="label" text-anchor="middle" font-weight="bold">Cauchy Stress Tensor</text>
  <text x="105" y="52" class="label-normal" text-anchor="middle" font-size="11">⎡ σ_xx  τ_xy  τ_xz ⎤</text>
  <text x="105" y="68" class="label-normal" text-anchor="middle" font-size="11">⎢ τ_yx  σ_yy  τ_yz ⎥</text>
  <text x="105" y="84" class="label-normal" text-anchor="middle" font-size="11">⎣ τ_zx  τ_zy  σ_zz ⎦</text>
  <text x="105" y="100" class="label" text-anchor="middle" font-size="10">σ_ij = σ_ji (symmetric)</text>
</svg>