<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <defs>
    <marker id="arrow-oop2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .class-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.3s; cursor: pointer; }
    .class-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); }
    .vtable-box { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 4; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .member { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: start; }
    .inherit-arrow { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; marker-end: url(#arrow-oop2); }
    .vptr-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; marker-end: url(#arrow-oop2); stroke-dasharray: 5,3; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .cost-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-accent, #79c0ff); text-anchor: middle; }
  </style>

  <text x="350" y="22" class="title">C++ Class Layout — vtable &amp; Virtual Dispatch</text>

  <!-- Base class -->
  <text x="200" y="50" class="section-label">Inheritance Hierarchy</text>
  <rect x="130" y="58" width="140" height="70" class="class-box"/>
  <text x="200" y="78" class="label">Shape (abstract)</text>
  <text x="140" y="95" class="member">virtual ~Shape()</text>
  <text x="140" y="108" class="member">virtual area() = 0</text>
  <text x="140" y="121" class="member">virtual draw()</text>

  <!-- Derived classes -->
  <rect x="40" y="165" width="130" height="60" class="class-box"/>
  <text x="105" y="185" class="label">Circle</text>
  <text x="50" y="200" class="member">double radius_</text>
  <text x="50" y="213" class="member">area() override</text>

  <rect x="220" y="165" width="130" height="60" class="class-box"/>
  <text x="285" y="185" class="label">Rectangle</text>
  <text x="230" y="200" class="member">double w_, h_</text>
  <text x="230" y="213" class="member">area() override</text>

  <!-- Inheritance arrows -->
  <line x1="105" y1="165" x2="175" y2="128" class="inherit-arrow"/>
  <line x1="285" y1="165" x2="225" y2="128" class="inherit-arrow"/>

  <!-- Object memory layout -->
  <text x="530" y="50" class="section-label">Object in Memory</text>
  <rect x="440" y="58" width="180" height="90" class="class-box"/>
  <text x="530" y="78" class="label">Circle instance</text>
  <text x="450" y="98" class="member">vptr → [vtable]  (8 bytes)</text>
  <text x="450" y="114" class="member">radius_ = 5.0   (8 bytes)</text>
  <text x="530" y="138" class="cost-label">Total: 16 bytes</text>

  <!-- vtable -->
  <text x="530" y="175" class="section-label">Circle's vtable</text>
  <rect x="440" y="183" width="180" height="70" class="vtable-box"/>
  <text x="450" y="200" class="member">[0] → Circle::~Circle()</text>
  <text x="450" y="216" class="member">[1] → Circle::area()</text>
  <text x="450" y="232" class="member">[2] → Circle::draw()</text>

  <!-- vptr arrow -->
  <path d="M 530 115 C 560 115 560 160 530 183" class="vptr-arrow"/>

  <!-- Dispatch comparison -->
  <text x="350" y="285" class="section-label">Dispatch Cost Comparison</text>

  <rect x="40" y="300" width="190" height="70" class="class-box"/>
  <text x="135" y="320" class="label">Virtual (runtime)</text>
  <text x="50" y="338" class="member">shape.area()</text>
  <text x="50" y="352" class="member">→ vptr[1]() indirect call</text>
  <text x="135" y="365" class="cost-label">~2-5ns overhead</text>

  <rect x="260" y="300" width="190" height="70" class="class-box"/>
  <text x="355" y="320" class="label">Template (compile-time)</text>
  <text x="270" y="338" class="member">obj.area() // known type</text>
  <text x="270" y="352" class="member">→ direct call, inlineable</text>
  <text x="355" y="365" class="cost-label">Zero overhead</text>

  <rect x="480" y="300" width="190" height="70" class="class-box"/>
  <text x="575" y="320" class="label">CRTP (static poly)</text>
  <text x="490" y="338" class="member">Drawable&lt;Sprite&gt;::draw()</text>
  <text x="490" y="352" class="member">→ static_cast + direct</text>
  <text x="575" y="365" class="cost-label">Zero overhead</text>
</svg>
