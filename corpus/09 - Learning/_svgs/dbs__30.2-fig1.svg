<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, monospace; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .internal{ fill: var(--background-secondary,#161b22); stroke: var(--interactive-accent,#58a6ff); stroke-width:1.8; }
    .leaf   { fill: var(--background-secondary,#161b22); stroke: #51cf66; stroke-width:1.8; }
    .split  { fill: #3a1a1a; stroke: #ff6b6b; stroke-width:1.5; }
    .arr    { stroke: var(--text-muted,#8b949e); stroke-width:1.2; fill:none; }
    .acc    { stroke: var(--interactive-accent,#58a6ff); stroke-width:1.5; fill:none; }
    .red    { stroke: #ff6b6b; stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
  </style>
  <defs>
    <marker id="dbs2-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="dbs2-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#51cf66"/>
    </marker>
    <marker id="dbs2-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">B+ Tree Anatomy — Internal Nodes, Leaf Nodes &amp; Node Split</text>

  <!-- ROOT (internal node) -->
  <rect x="254" y="34" width="212" height="38" class="internal" rx="5"/>
  <text x="360" y="48" class="label" text-anchor="middle" fill="#58a6ff">Root (internal)</text>
  <text x="280" y="64" class="mono">P0 | 30 | P1 | 70 | P2</text>

  <!-- level-1 internal nodes -->
  <rect x="60"  y="108" width="180" height="38" class="internal" rx="5"/>
  <text x="150" y="122" class="label" text-anchor="middle" fill="#58a6ff">Internal [ 10 | 20 | 30 ]</text>
  <text x="150" y="136" class="small" text-anchor="middle">keys only, n+1 child pointers</text>

  <rect x="480" y="108" width="180" height="38" class="internal" rx="5"/>
  <text x="570" y="122" class="label" text-anchor="middle" fill="#58a6ff">Internal [ 50 | 60 | 70 ]</text>
  <text x="570" y="136" class="small" text-anchor="middle">keys only, n+1 child pointers</text>

  <!-- arrows root → internal -->
  <line x1="296" y1="72" x2="185" y2="108" class="acc" marker-end="url(#dbs2-b)"/>
  <line x1="424" y1="72" x2="535" y2="108" class="acc" marker-end="url(#dbs2-b)"/>

  <!-- LEAF nodes — row 3 -->
  <rect x="18"  y="188" width="120" height="46" class="leaf" rx="4"/>
  <text x="78"  y="203" class="label" text-anchor="middle" fill="#51cf66">Leaf</text>
  <text x="78"  y="216" class="mono" text-anchor="middle">1→v1</text>
  <text x="78"  y="228" class="mono" text-anchor="middle">5→v5</text>

  <rect x="148" y="188" width="120" height="46" class="leaf" rx="4"/>
  <text x="208" y="203" class="label" text-anchor="middle" fill="#51cf66">Leaf</text>
  <text x="208" y="216" class="mono" text-anchor="middle">10→v10</text>
  <text x="208" y="228" class="mono" text-anchor="middle">15→v15</text>

  <rect x="278" y="188" width="120" height="46" class="leaf" rx="4"/>
  <text x="338" y="203" class="label" text-anchor="middle" fill="#51cf66">Leaf</text>
  <text x="338" y="216" class="mono" text-anchor="middle">20→v20</text>
  <text x="338" y="228" class="mono" text-anchor="middle">25→v25</text>

  <rect x="408" y="188" width="120" height="46" class="leaf" rx="4"/>
  <text x="468" y="203" class="label" text-anchor="middle" fill="#51cf66">Leaf</text>
  <text x="468" y="216" class="mono" text-anchor="middle">50→v50</text>
  <text x="468" y="228" class="mono" text-anchor="middle">55→v55</text>

  <rect x="538" y="188" width="120" height="46" class="leaf" rx="4"/>
  <text x="598" y="203" class="label" text-anchor="middle" fill="#51cf66">Leaf</text>
  <text x="598" y="216" class="mono" text-anchor="middle">60→v60</text>
  <text x="598" y="228" class="mono" text-anchor="middle">65→v65</text>

  <!-- sibling linked-list arrows -->
  <line x1="138" y1="210" x2="148" y2="210" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="268" y1="210" x2="278" y2="210" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="398" y1="210" x2="408" y2="210" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="528" y1="210" x2="538" y2="210" class="arr" marker-end="url(#dbs2-a)"/>
  <text x="360" y="252" class="small" text-anchor="middle">← Leaf nodes form a doubly-linked list enabling efficient range scans →</text>

  <!-- arrows internal → leaf -->
  <line x1="100" y1="146" x2="60"  y2="188" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="150" y1="146" x2="175" y2="188" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="200" y1="146" x2="305" y2="188" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="520" y1="146" x2="450" y2="188" class="arr" marker-end="url(#dbs2-a)"/>
  <line x1="570" y1="146" x2="570" y2="188" class="arr" marker-end="url(#dbs2-a)"/>

  <!-- BOTTOM: Node split illustration -->
  <rect x="18" y="272" width="684" height="132" fill="var(--background-secondary,#161b22)" stroke="var(--text-muted,#8b949e)" stroke-width="1" rx="6"/>
  <text x="360" y="290" class="label" text-anchor="middle" font-weight="bold">Insert Split — Inserting key 22 into full leaf [10|15|20|25] (order-4 tree)</text>

  <!-- before split -->
  <rect x="30"  y="302" width="200" height="36" class="split" rx="4"/>
  <text x="130" y="316" class="label" text-anchor="middle" fill="#ff6b6b">FULL: [ 10 | 15 | 20 | 25 ]</text>
  <text x="130" y="330" class="small" text-anchor="middle">Insert 22 → overflow!</text>

  <!-- arrow to after split -->
  <line x1="230" y1="320" x2="258" y2="320" class="red" marker-end="url(#dbs2-a)"/>

  <!-- after split left -->
  <rect x="262" y="302" width="150" height="36" class="leaf" rx="4"/>
  <text x="337" y="316" class="label" text-anchor="middle" fill="#51cf66">[ 10 | 15 | 20 ]</text>
  <text x="337" y="330" class="small" text-anchor="middle">left half</text>

  <!-- after split right -->
  <rect x="422" y="302" width="155" height="36" class="leaf" rx="4"/>
  <text x="500" y="316" class="label" text-anchor="middle" fill="#51cf66">[ 22 | 25 ]</text>
  <text x="500" y="330" class="small" text-anchor="middle">right half + new key</text>

  <!-- promoted key -->
  <rect x="588" y="302" width="104" height="36" class="internal" rx="4"/>
  <text x="640" y="316" class="label" text-anchor="middle" fill="#58a6ff">↑ promote 22</text>
  <text x="640" y="330" class="small" text-anchor="middle">to parent node</text>

  <text x="360" y="366" class="small" text-anchor="middle">If parent is also full → split propagates up. Root split increases tree height by 1.</text>
  <text x="360" y="382" class="small" text-anchor="middle">Search = O(log n). Every path from root to leaf has the same length — the height invariant.</text>
  <text x="360" y="396" class="small" text-anchor="middle">Page size = OS page size (4 KB / 8 KB) → one disk read per node = 1 I/O per level</text>
</svg>
