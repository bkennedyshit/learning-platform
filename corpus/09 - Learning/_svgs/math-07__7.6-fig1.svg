<svg viewBox="0 0 650 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <style>
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 8; }
    .phys-box { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; rx: 8; }
    .arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#gauge-arr); }
    .dashed { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; animation: gaugeFlow 1.5s linear infinite; }
    @keyframes gaugeFlow { to { stroke-dashoffset: -9; } }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .math { font-family: 'Latin Modern Math', serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; font-weight: bold; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>
  <defs>
    <marker id="gauge-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>

  <text x="325" y="25" class="title">Gauge Invariance: Many Potentials → Same Physics</text>

  <!-- Potential boxes (gauge-equivalent) -->
  <rect x="30" y="60" width="160" height="50" class="box"/>
  <text x="110" y="82" class="math">(φ, A)</text>
  <text x="110" y="100" class="label">Gauge 1</text>

  <rect x="30" y="140" width="160" height="50" class="box"/>
  <text x="110" y="162" class="math">(φ', A')</text>
  <text x="110" y="180" class="label">Gauge 2</text>

  <rect x="30" y="220" width="160" height="50" class="box"/>
  <text x="110" y="242" class="math">(φ'', A'')</text>
  <text x="110" y="260" class="label">Gauge 3</text>

  <!-- Gauge transformation arrows -->
  <path d="M 110 110 L 110 140" class="dashed"/>
  <path d="M 110 190 L 110 220" class="dashed"/>
  <text x="155" y="128" class="label" font-size="11" fill="var(--text-muted, #8b949e)">A' = A + ∇λ</text>
  <text x="155" y="208" class="label" font-size="11" fill="var(--text-muted, #8b949e)">φ' = φ − ∂λ/∂t</text>

  <!-- Arrow to physical fields -->
  <path d="M 190 85 C 280 85, 320 150, 380 150" class="arrow"/>
  <path d="M 190 165 C 280 165, 320 150, 380 150" class="arrow"/>
  <path d="M 190 245 C 280 245, 320 150, 380 150" class="arrow"/>

  <!-- Physical fields box -->
  <rect x="380" y="110" width="240" height="80" class="phys-box pulse"/>
  <text x="500" y="140" class="math">E = −∇φ − ∂A/∂t</text>
  <text x="500" y="165" class="math">B = ∇ × A</text>
  <text x="500" y="185" class="label">GAUGE INVARIANT (Physical)</text>

  <!-- Observable box -->
  <rect x="420" y="240" width="180" height="50" class="phys-box"/>
  <text x="510" y="262" class="math">F, τ, W, S</text>
  <text x="510" y="280" class="label">Observables</text>
  <path d="M 500 190 L 510 240" class="arrow"/>
</svg>