<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .gate-path { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; fill: var(--background-primary, #0d1117); }
    .gate-bubble { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: var(--background-primary, #0d1117); }
    .wire-glow { stroke-width: 2; fill: none; stroke-linecap: round; }
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    .tb-text { font-family: Menlo, Monaco, Consolas, "Fira Code", monospace; font-size: 9px; fill: var(--text-normal, #c9d1d9); }
    .tb-header { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); font-weight: bold; }
  </style>

  <text x="350" y="24" class="title" text-anchor="middle">Digital Logic — Combinational Gates &amp; Truth Tables</text>

  <!-- ==================== QUADRANT 1: AND GATE ==================== -->
  <g id="quad-and">
    <rect x="20" y="45" width="315" height="145" class="box"/>
    <text x="35" y="65" class="label" font-weight="bold" fill="#ffd93d">AND Gate</text>

    <!-- Inputs Wires and readouts -->
    <!-- Input A -->
    <line x1="50" y1="85" x2="90" y2="85" class="wire-glow">
      <animate attributeName="stroke" values="#343a40;#343a40;#343a40;#343a40;#58a6ff;#58a6ff;#58a6ff;#58a6ff;#343a40" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <text x="42" y="88" class="tb-text" font-weight="bold">
      <animate attributeName="textContent" values="0;0;0;0;1;1;1;1;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
      0<animate attributeName="dummy1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="32" y="88" class="sublabel">A</text>

    <!-- Input B -->
    <line x1="50" y1="105" x2="90" y2="105" class="wire-glow">
      <animate attributeName="stroke" values="#343a40;#343a40;#58a6ff;#58a6ff;#343a40;#343a40;#58a6ff;#58a6ff;#343a40" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <text x="42" y="108" class="tb-text" font-weight="bold">
      <animate attributeName="textContent" values="0;0;1;1;0;0;1;1;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
      0<animate attributeName="dummy2" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="32" y="108" class="sublabel">B</text>

    <!-- Gate Symbol -->
    <path d="M 90 75 L 105 75 C 122 75 122 115 105 115 L 90 115 Z" class="gate-path"/>
    <text x="103" y="100" class="sublabel" font-weight="bold" fill="var(--text-muted, #8b949e)">AND</text>

    <!-- Output Y Wire & readout -->
    <line x1="120" y1="95" x2="160" y2="95" class="wire-glow">
      <animate attributeName="stroke" values="#343a40;#343a40;#343a40;#343a40;#343a40;#343a40;#58a6ff;#58a6ff;#343a40" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <text x="165" y="98" class="tb-text" font-weight="bold" fill="#58a6ff">
      <animate attributeName="textContent" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
      0<animate attributeName="dummy3" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="175" y="98" class="sublabel">Y</text>

    <!-- Truth Table -->
    <rect x="210" y="55" width="105" height="120" rx="3" fill="#0d1117" stroke="var(--text-muted, #8b949e)" stroke-width="0.8"/>
    
    <!-- Table Row Highlights -->
    <rect x="212" y="77" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0.25;0.25;0;0;0;0;0;0;0.25" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="212" y="91" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.25;0.25;0;0;0;0;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="212" y="105" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.25;0.25;0;0;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="212" y="119" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;0.25;0.25;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="220" y="70" class="tb-header">A  B  |  Y</text>
    <line x1="215" y1="73" x2="310" y2="73" stroke="var(--text-muted, #8b949e)" stroke-width="0.8"/>
    <text x="220" y="87" class="tb-text">0  0  |  0</text>
    <text x="220" y="101" class="tb-text">0  1  |  0</text>
    <text x="220" y="115" class="tb-text">1  0  |  0</text>
    <text x="220" y="129" class="tb-text" font-weight="bold" fill="#58a6ff">1  1  |  1</text>
  </g>

  <!-- ==================== QUADRANT 2: OR GATE ==================== -->
  <g id="quad-or">
    <rect x="365" y="45" width="315" height="145" class="box"/>
    <text x="380" y="65" class="label" font-weight="bold" fill="#ffd93d">OR Gate</text>

    <!-- Inputs Wires -->
    <line x1="395" y1="85" x2="435" y2="85" class="wire-glow">
      <animate attributeName="stroke" values="#343a40;#343a40;#343a40;#343a40;#58a6ff;#58a6ff;#58a6ff;#58a6ff;#343a40" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <text x="387" y="88" class="tb-text" font-weight="bold">
      <animate attributeName="textContent" values="0;0;0;0;1;1;1;1;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
      0<animate attributeName="dummy4" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="377" y="88" class="sublabel">A</text>

    <line x1="395" y1="105" x2="435" y2="105" class="wire-glow">
