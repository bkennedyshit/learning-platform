      0<animate attributeName="dummy5" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="377" y="108" class="sublabel">B</text>

    <!-- Gate Symbol -->
    <path d="M 430 75 C 438 85 438 105 430 115 C 450 115 460 105 470 95 C 460 85 450 75 430 75 Z" class="gate-path"/>
    <text x="440" y="100" class="sublabel" font-weight="bold" fill="var(--text-muted, #8b949e)">OR</text>

    <!-- Output Y Wire & readout -->
    <line x1="470" y1="95" x2="510" y2="95" class="wire-glow">
      <animate attributeName="stroke" values="#343a40;#343a40;#58a6ff;#58a6ff;#58a6ff;#58a6ff;#58a6ff;#58a6ff;#343a40" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <text x="515" y="98" class="tb-text" font-weight="bold" fill="#58a6ff">
      <animate attributeName="textContent" values="0;0;1;1;1;1;1;1;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
      0<animate attributeName="dummy6" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="525" y="98" class="sublabel">Y</text>

    <!-- Truth Table -->
    <rect x="555" y="55" width="105" height="120" rx="3" fill="#0d1117" stroke="var(--text-muted, #8b949e)" stroke-width="0.8"/>
    
    <!-- Table Row Highlights -->
    <rect x="557" y="77" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0.25;0.25;0;0;0;0;0;0;0.25" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="557" y="91" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.25;0.25;0;0;0;0;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="557" y="105" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.25;0.25;0;0;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="557" y="119" width="101" height="13" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;0.25;0.25;0" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="565" y="70" class="tb-header">A  B  |  Y</text>
    <line x1="560" y1="73" x2="655" y2="73" stroke="var(--text-muted, #8b949e)" stroke-width="0.8"/>
    <text x="565" y="87" class="tb-text">0  0  |  0</text>
    <text x="565" y="101" class="tb-text" font-weight="bold" fill="#58a6ff">0  1  |  1</text>
    <text x="565" y="115" class="tb-text" font-weight="bold" fill="#58a6ff">1  0  |  1</text>
    <text x="565" y="129" class="tb-text" font-weight="bold" fill="#58a6ff">1  1  |  1</text>
  </g>

  <!-- ==================== QUADRANT 3: NAND GATE ==================== -->
  <g id="quad-nand">
    <rect x="20" y="210" width="315" height="145" class="box"/>
    <text x="35" y="230" class="label" font-weight="bold" fill="#ffd93d">NAND Gate</text>

    <!-- Inputs Wires -->
