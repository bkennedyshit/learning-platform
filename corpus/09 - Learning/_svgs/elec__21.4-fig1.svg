      <animate attributeName="stroke" values="#343a40;#343a40;#343a40;#343a40;#58a6ff;#58a6ff;#58a6ff;#58a6ff;#343a40" keyTimes="0;0.23;0.25;0.48;0.50;0.73;0.75;0.98;1" dur="8s" repeatCount="indefinite"/>
