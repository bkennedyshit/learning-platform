<svg viewBox="0 0 650 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <style>
    .shell-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.2s; cursor: pointer; }
    .shell-box:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .cat { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .pipe-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#pipe-arr); }
    .detail { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
  </style>
  <defs>
    <marker id="pipe-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>

  <text x="325" y="22" class="title">Shell Pipeline Architecture — stdin → process → stdout</text>

  <!-- Pipeline visualization -->
  <rect x="30" y="50" width="100" height="50" class="shell-box"/>
  <text x="80" y="72" class="label">cat data.csv</text>
  <text x="80" y="88" class="detail">→ stdout</text>

  <line x1="130" y1="75" x2="170" y2="75" class="pipe-line"/>
  <text x="150" y="65" class="label">|</text>

  <rect x="170" y="50" width="110" height="50" class="shell-box"/>
  <text x="225" y="72" class="label">grep "ERROR"</text>
  <text x="225" y="88" class="detail">stdin → stdout</text>

  <line x1="280" y1="75" x2="320" y2="75" class="pipe-line"/>
  <text x="300" y="65" class="label">|</text>

  <rect x="320" y="50" width="100" height="50" class="shell-box"/>
  <text x="370" y="72" class="label">sort -k2</text>
  <text x="370" y="88" class="detail">stdin → stdout</text>

  <line x1="420" y1="75" x2="460" y2="75" class="pipe-line"/>
  <text x="440" y="65" class="label">|</text>

  <rect x="460" y="50" width="100" height="50" class="shell-box"/>
  <text x="510" y="72" class="label">wc -l</text>
  <text x="510" y="88" class="detail">stdin → stdout</text>

  <line x1="560" y1="75" x2="600" y2="75" class="pipe-line"/>
  <rect x="600" y="60" width="35" height="30" class="shell-box"/>
  <text x="617" y="80" class="label">42</text>

  <!-- Cross-platform comparison -->
  <text x="30" y="140" class="cat">Cross-Platform Shell Comparison</text>
  <rect x="30" y="150" width="190" height="180" class="shell-box"/>
  <text x="125" y="170" class="label" font-weight="bold">Bash / Zsh (Unix)</text>
  <text x="125" y="190" class="detail">ls, grep, awk, sed, find</text>
  <text x="125" y="208" class="detail">chmod, chown, ln -s</text>
  <text x="125" y="226" class="detail">$HOME, $PATH, ~/.bashrc</text>
  <text x="125" y="244" class="detail">#!/usr/bin/env python3</text>
  <text x="125" y="262" class="detail">export VAR=value</text>
  <text x="125" y="280" class="detail">cmd1 && cmd2 || cmd3</text>
  <text x="125" y="298" class="detail">$(command substitution)</text>
  <text x="125" y="316" class="detail">/ path separator</text>

  <rect x="240" y="150" width="190" height="180" class="shell-box"/>
  <text x="335" y="170" class="label" font-weight="bold">PowerShell (Windows)</text>
  <text x="335" y="190" class="detail">Get-ChildItem, Select-String</text>
  <text x="335" y="208" class="detail">Set-Acl, New-Item -Type Link</text>
  <text x="335" y="226" class="detail">$env:HOME, $env:PATH</text>
  <text x="335" y="244" class="detail">#Requires -Version 7</text>
  <text x="335" y="262" class="detail">$env:VAR = "value"</text>
  <text x="335" y="280" class="detail">cmd1; if($?) { cmd2 }</text>
  <text x="335" y="298" class="detail">$(command) or (command)</text>
  <text x="335" y="316" class="detail">\ path separator</text>

  <rect x="450" y="150" width="180" height="180" class="shell-box"/>
  <text x="540" y="170" class="label" font-weight="bold">Python (subprocess)</text>
  <text x="540" y="190" class="detail">subprocess.run()</text>
  <text x="540" y="208" class="detail">shutil, os, pathlib</text>
  <text x="540" y="226" class="detail">Path.home(), os.environ</text>
  <text x="540" y="244" class="detail">if __name__ == "__main__"</text>
  <text x="540" y="262" class="detail">os.environ["VAR"] = val</text>
  <text x="540" y="280" class="detail">try/except for error flow</text>
  <text x="540" y="298" class="detail">subprocess.check_output()</text>
  <text x="540" y="316" class="detail">Path("/") cross-platform</text>
</svg>
