<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <defs>
    <marker id="arrow-build" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .stage-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 8; transition: all 0.3s; cursor: pointer; }
    .stage-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); }
    .tool-box { fill: none; stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 4,3; rx: 6; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .subtitle { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .flow-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#arrow-build); }
    .tool-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .file-ext { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-accent, #79c0ff); text-anchor: middle; }
  </style>

  <text x="350" y="25" class="title">C++ Build Pipeline — Source to Executable</text>

  <!-- Stage 1: Source Files -->
  <rect x="20" y="50" width="110" height="70" class="stage-box"/>
  <text x="75" y="72" class="label">Source Files</text>
  <text x="75" y="88" class="file-ext">.cpp .h</text>
  <text x="75" y="104" class="tool-label">#include, #define</text>

  <!-- Arrow 1 -->
  <line x1="130" y1="85" x2="160" y2="85" class="flow-arrow"/>

  <!-- Stage 2: Preprocessor -->
  <rect x="160" y="50" width="110" height="70" class="stage-box"/>
  <text x="215" y="72" class="label">Preprocessor</text>
  <text x="215" y="88" class="file-ext">Translation Unit</text>
  <text x="215" y="104" class="tool-label">Expands macros</text>

  <!-- Arrow 2 -->
  <line x1="270" y1="85" x2="300" y2="85" class="flow-arrow"/>

  <!-- Stage 3: Compiler -->
  <rect x="300" y="50" width="110" height="70" class="stage-box"/>
  <text x="355" y="72" class="label">Compiler</text>
  <text x="355" y="88" class="file-ext">.o / .obj</text>
  <text x="355" y="104" class="tool-label">AST → Machine Code</text>

  <!-- Arrow 3 -->
  <line x1="410" y1="85" x2="440" y2="85" class="flow-arrow"/>

  <!-- Stage 4: Linker -->
  <rect x="440" y="50" width="110" height="70" class="stage-box"/>
  <text x="495" y="72" class="label">Linker</text>
  <text x="495" y="88" class="file-ext">.exe / binary</text>
  <text x="495" y="104" class="tool-label">Resolves symbols</text>

  <!-- Arrow 4 -->
  <line x1="550" y1="85" x2="580" y2="85" class="flow-arrow"/>

  <!-- Stage 5: Executable -->
  <rect x="580" y="50" width="100" height="70" class="stage-box"/>
  <text x="630" y="72" class="label">Executable</text>
  <text x="630" y="88" class="file-ext">my_game.exe</text>
  <text x="630" y="104" class="tool-label">Run / Debug</text>

  <!-- Tools Layer -->
  <text x="350" y="160" class="section-label">Toolchain</text>

  <!-- CMake -->
  <rect x="40" y="175" width="120" height="55" class="tool-box"/>
  <text x="100" y="195" class="label">CMake</text>
  <text x="100" y="212" class="tool-label">Build system generator</text>
  <text x="100" y="224" class="tool-label">CMakeLists.txt</text>

  <!-- Ninja -->
  <rect x="180" y="175" width="100" height="55" class="tool-box"/>
  <text x="230" y="195" class="label">Ninja</text>
  <text x="230" y="212" class="tool-label">Build executor</text>
  <text x="230" y="224" class="tool-label">(fast!)</text>

  <!-- vcpkg -->
  <rect x="300" y="175" width="100" height="55" class="tool-box"/>
  <text x="350" y="195" class="label">vcpkg</text>
  <text x="350" y="212" class="tool-label">Package manager</text>
  <text x="350" y="224" class="tool-label">Dependencies</text>

  <!-- clangd -->
  <rect x="420" y="175" width="100" height="55" class="tool-box"/>
  <text x="470" y="195" class="label">clangd</text>
  <text x="470" y="212" class="tool-label">LSP server</text>
  <text x="470" y="224" class="tool-label">IDE intelligence</text>

  <!-- LLDB -->
  <rect x="540" y="175" width="100" height="55" class="tool-box"/>
  <text x="590" y="195" class="label">LLDB</text>
  <text x="590" y="212" class="tool-label">Debugger</text>
  <text x="590" y="224" class="tool-label">Breakpoints</text>

  <!-- Comparison: Python vs C++ -->
  <text x="350" y="270" class="section-label">Python vs C++ Build Comparison</text>

  <rect x="40" y="285" width="280" height="90" class="tool-box"/>
  <text x="180" y="305" class="label">Python</text>
  <text x="180" y="325" class="tool-label">pip install → python main.py</text>
  <text x="180" y="345" class="tool-label">Interpreted at runtime</text>
  <text x="180" y="365" class="tool-label">No compilation step</text>

  <rect x="380" y="285" width="280" height="90" class="tool-box"/>
  <text x="520" y="305" class="label">C++</text>
  <text x="520" y="325" class="tool-label">vcpkg install → cmake → ninja → ./app</text>
  <text x="520" y="345" class="tool-label">Compiled ahead of time</text>
  <text x="520" y="365" class="tool-label">Full control over output binary</text>
</svg>
