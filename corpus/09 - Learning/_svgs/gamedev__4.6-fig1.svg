<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="net-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .server { fill: var(--interactive-accent, #58a6ff); opacity: 0.15; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 8; }
    .client { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; pointer-events: none; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .packet { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; color: var(--interactive-accent, #58a6ff); stroke-dasharray: 6,3; }
    .packet-solid { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; color: var(--interactive-accent, #58a6ff); }
    .timeline { stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .note { font-family: monospace; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .tick-mark { stroke: var(--text-normal, #c9d1d9); stroke-width: 1; }
    
    /* Client-Server Packet Flow Animations */
    @keyframes CS-packet {
      to { stroke-dashoffset: -24; }
    }
    .client-flow-line {
      stroke-dasharray: 8, 4;
      animation: CS-packet 1.5s linear infinite;
    }
    
    /* Rollback Timeline Sequential Animations */
    @keyframes mispredict-flash {
      0%, 34%, 80%, 100% { opacity: 0; }
      35%, 55% { opacity: 0.95; }
    }
    .mispredict-node {
      transform-origin: 360px 130px;
      animation: mispredict-flash 4s infinite;
    }
    .mispredict-text {
      animation: mispredict-flash 4s infinite;
    }
    
    @keyframes draw-rollback {
      0%, 54%, 100% { stroke-dashoffset: 50; opacity: 0; }
      55%, 72% { stroke-dashoffset: 0; opacity: 1; }
    }
    .rollback-path {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: draw-rollback 4s infinite ease-in-out;
    }
    @keyframes text-fade-rollback {
      0%, 54%, 100% { opacity: 0; }
      55%, 72% { opacity: 1; }
    }
    .rollback-text {
      animation: text-fade-rollback 4s infinite;
    }
    
    @keyframes draw-resim {
      0%, 72%, 100% { stroke-dashoffset: 35; opacity: 0; }
      73%, 94% { stroke-dashoffset: 0; opacity: 1; }
    }
    .resim-line {
      stroke-dasharray: 35;
      stroke-dashoffset: 35;
      animation: draw-resim 4s infinite ease-in-out;
    }
    @keyframes text-fade-resim {
      0%, 72%, 100% { opacity: 0; }
      73%, 94% { opacity: 1; }
    }
    .resim-text {
      animation: text-fade-resim 4s infinite;
    }
  </style>
  
  <!-- Client-Server Model -->
  <text x="160" y="20" class="title">Client-Server Architecture</text>
  <!-- Server -->
  <rect x="100" y="35" width="120" height="50" class="server"/>
  <text x="160" y="60" class="label" font-weight="bold">Server</text>
  <text x="160" y="78" class="note">Authoritative state</text>
  <!-- Clients -->
  <rect x="20" y="120" width="90" height="40" class="client"/>
  <text x="65" y="145" class="label">Client A</text>
  <rect x="130" y="120" width="90" height="40" class="client"/>
  <text x="175" y="145" class="label">Client B</text>
  <rect x="240" y="120" width="90" height="40" class="client"/>
  <text x="285" y="145" class="label">Client C</text>
  <!-- Connections with flowing packet dashes -->
  <line x1="65" y1="120" x2="130" y2="85" class="packet-solid client-flow-line" marker-end="url(#net-arrow)"/>
  <line x1="175" y1="120" x2="160" y2="85" class="packet-solid client-flow-line" marker-end="url(#net-arrow)"/>
  <line x1="285" y1="120" x2="190" y2="85" class="packet-solid client-flow-line" marker-end="url(#net-arrow)"/>
  
  <!-- Rollback Netcode Timeline -->
  <text x="450" y="20" class="title">Rollback Netcode</text>
  <!-- Timeline bars -->
  <line x1="360" y1="50" x2="360" y2="190" class="timeline"/>
  <line x1="500" y1="50" x2="500" y2="190" class="timeline"/>
  <text x="360" y="45" class="label">Local</text>
  <text x="500" y="45" class="label">Remote</text>
  <!-- Tick marks -->
  <line x1="355" y1="70" x2="365" y2="70" class="tick-mark"/><text x="345" y="74" class="note" text-anchor="end">T1</text>
  <line x1="355" y1="100" x2="365" y2="100" class="tick-mark"/><text x="345" y="104" class="note" text-anchor="end">T2</text>
  <line x1="355" y1="130" x2="365" y2="130" class="tick-mark"/><text x="345" y="134" class="note" text-anchor="end">T3</text>
  <line x1="355" y1="160" x2="365" y2="160" class="tick-mark"/><text x="345" y="164" class="note" text-anchor="end">T4</text>
  
  <!-- Input packet lines -->
  <line x1="365" y1="70" x2="495" y2="130" class="packet" marker-end="url(#net-arrow)"/>
  <text x="430" y="90" class="note" fill="var(--interactive-accent, #58a6ff)">input @ T1</text>
  
  <!-- Network packet dot traveling -->
  <circle r="4" fill="var(--interactive-accent, #58a6ff)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 365 70 L 495 130" keyTimes="0; 0.35; 1" keyPoints="0; 1; 1" calcMode="linear" />
  </circle>

  <!-- Misprediction indicator -->
  <rect x="355" y="125" width="10" height="10" fill="#e74c3c" class="mispredict-node"/>
  <text x="400" y="148" class="note mispredict-text" fill="#e74c3c">misprediction!</text>
  <!-- Rollback arrow -->
  <path d="M 360 160 C 340 145 340 135 360 130" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#net-arrow)" class="rollback-path"/>
  <text x="325" y="148" class="note rollback-text" fill="#e74c3c" text-anchor="end">rollback</text>
  <!-- Resimulate -->
  <line x1="365" y1="130" x2="365" y2="160" stroke="#2ecc71" stroke-width="3" class="resim-line"/>
  <text x="385" y="170" class="note resim-text" fill="#2ecc71">resim</text>
  
  <!-- Lag Compensation section -->
  <rect x="20" y="200" width="560" height="180" rx="8" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="300" y="220" class="title">Network Models Comparison</text>
  <!-- Table -->
  <text x="80" y="245" class="label" font-weight="bold">Model</text>
  <text x="220" y="245" class="label" font-weight="bold">Latency Feel</text>
  <text x="370" y="245" class="label" font-weight="bold">Consistency</text>
  <text x="520" y="245" class="label" font-weight="bold">Use Case</text>
  <!-- Lockstep -->
  <text x="80" y="268" class="note">Lockstep</text>
  <text x="220" y="268" class="note">High (wait for all)</text>
  <text x="370" y="268" class="note">Perfect</text>
  <text x="520" y="268" class="note">RTS, fighting</text>
  <!-- Client prediction -->
  <text x="80" y="290" class="note">Client Predict</text>
  <text x="220" y="290" class="note">Low (immediate)</text>
  <text x="370" y="290" class="note">Eventual</text>
  <text x="520" y="290" class="note">FPS, action</text>
  <!-- Rollback -->
  <text x="80" y="312" class="note">Rollback</text>
  <text x="220" y="312" class="note">Zero (speculative)</text>
  <text x="370" y="312" class="note">Corrected</text>
  <text x="520" y="312" class="note">Fighting, platformer</text>
  <!-- Snapshot interp -->
  <text x="80" y="334" class="note">Snapshot Interp</text>
  <text x="220" y="334" class="note">Medium (buffered)</text>
  <text x="370" y="334" class="note">Smooth</text>
  <text x="520" y="334" class="note">MMO, co-op</text>
  <!-- State sync -->
  <text x="80" y="356" class="note">State Sync</text>
  <text x="220" y="356" class="note">Variable</text>
  <text x="370" y="356" class="note">Server-auth</text>
  <text x="520" y="356" class="note">Unreal replication</text>
</svg>
