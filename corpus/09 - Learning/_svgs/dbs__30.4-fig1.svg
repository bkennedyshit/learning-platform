<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, monospace; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box    { fill: var(--background-secondary,#161b22); stroke: var(--text-muted,#8b949e); stroke-width:1.2; }
    .acid   { fill: var(--background-secondary,#161b22); stroke: var(--interactive-accent,#58a6ff); stroke-width:1.8; }
    .ok     { fill: #1a3a1a; stroke: #51cf66; stroke-width: 1.5; }
    .warn   { fill: #3a2a1a; stroke: #ffd93d; stroke-width: 1.5; }
    .fail   { fill: #3a1a1a; stroke: #ff6b6b; stroke-width: 1.5; }
    .arr    { stroke: var(--text-muted,#8b949e); stroke-width: 1.2; fill: none; }
    .acc    { stroke: var(--interactive-accent,#58a6ff); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="dbs4-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="dbs4-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">ACID Properties &amp; Transaction Lifecycle</text>

  <!-- ACID four boxes -->
  <rect x="18"  y="32" width="158" height="96" class="acid" rx="6"/>
  <text x="97"  y="52" class="label" text-anchor="middle" fill="#58a6ff" font-weight="bold">Atomicity</text>
  <text x="26"  y="70" class="small">All-or-nothing. Every write</text>
  <text x="26"  y="84" class="small">in the txn commits together</text>
  <text x="26"  y="98" class="small">or the entire txn is rolled</text>
  <text x="26"  y="112" class="small">back. Enforced by WAL undo.</text>

  <rect x="184" y="32" width="158" height="96" class="acid" rx="6"/>
  <text x="263" y="52" class="label" text-anchor="middle" fill="#58a6ff" font-weight="bold">Consistency</text>
  <text x="192" y="70" class="small">DB moves from one valid</text>
  <text x="192" y="84" class="small">state to another. Constraints,</text>
  <text x="192" y="98" class="small">foreign keys, CHECK clauses</text>
  <text x="192" y="112" class="small">enforced at commit.</text>

  <rect x="350" y="32" width="158" height="96" class="acid" rx="6"/>
  <text x="429" y="52" class="label" text-anchor="middle" fill="#58a6ff" font-weight="bold">Isolation</text>
  <text x="358" y="70" class="small">Concurrent txns don't see</text>
  <text x="358" y="84" class="small">each other's partial writes.</text>
  <text x="358" y="98" class="small">Level: RU, RC, RR, Serializable</text>
  <text x="358" y="112" class="small">Enforced by 2PL or MVCC.</text>

  <rect x="516" y="32" width="186" height="96" class="acid" rx="6"/>
  <text x="609" y="52" class="label" text-anchor="middle" fill="#58a6ff" font-weight="bold">Durability</text>
  <text x="524" y="70" class="small">Committed txns survive crash.</text>
  <text x="524" y="84" class="small">WAL flushed to stable storage</text>
  <text x="524" y="98" class="small">before COMMIT ack returned.</text>
  <text x="524" y="112" class="small">fsync / group commit strategies.</text>

  <!-- Transaction lifecycle -->
  <rect x="18" y="144" width="684" height="60" class="box" rx="6"/>
  <text x="360" y="160" class="label" text-anchor="middle" font-weight="bold">Transaction Lifecycle</text>

  <rect x="30"  y="170" width="90" height="26" class="ok" rx="4"/>
  <text x="75"  y="187" class="label" text-anchor="middle" fill="#51cf66">BEGIN</text>
  <line x1="120" y1="183" x2="140" y2="183" class="arr" marker-end="url(#dbs4-a)"/>

  <rect x="142" y="170" width="90" height="26" fill="var(--background-secondary,#161b22)" stroke="#58a6ff" stroke-width="1.2" rx="4"/>
  <text x="187" y="187" class="label" text-anchor="middle">READ/WRITE</text>
  <line x1="232" y1="183" x2="252" y2="183" class="arr" marker-end="url(#dbs4-a)"/>

  <rect x="254" y="170" width="100" height="26" class="warn" rx="4"/>
  <text x="304" y="187" class="label" text-anchor="middle" fill="#ffd93d">VALIDATION</text>
  <line x1="354" y1="183" x2="374" y2="183" class="acc" marker-end="url(#dbs4-b)"/>

  <rect x="376" y="170" width="90" height="26" class="ok" rx="4"/>
  <text x="421" y="187" class="label" text-anchor="middle" fill="#51cf66">COMMIT</text>
  <text x="421" y="202" class="small" text-anchor="middle">WAL flush</text>

  <line x1="466" y1="183" x2="486" y2="183" class="arr" marker-end="url(#dbs4-a)" stroke-dasharray="4 3"/>

  <rect x="488" y="170" width="80" height="26" class="fail" rx="4"/>
  <text x="528" y="187" class="label" text-anchor="middle" fill="#ff6b6b">ABORT</text>
  <line x1="568" y1="183" x2="590" y2="183" class="arr" marker-end="url(#dbs4-a)"/>

  <rect x="592" y="170" width="100" height="26" class="fail" rx="4"/>
  <text x="642" y="187" class="label" text-anchor="middle" fill="#ff6b6b">ROLLBACK</text>
  <text x="642" y="202" class="small" text-anchor="middle">undo log applied</text>

  <!-- Isolation levels table -->
  <rect x="18" y="222" width="684" height="184" class="box" rx="6"/>
  <text x="360" y="240" class="label" text-anchor="middle" font-weight="bold">ANSI Isolation Levels — What Anomalies They Prevent</text>

  <!-- header row -->
  <rect x="28" y="248" width="144" height="22" fill="#1a2a3a" rx="2"/>
  <text x="100" y="263" class="small" text-anchor="middle" fill="#58a6ff">Level</text>
  <rect x="176" y="248" width="114" height="22" fill="#1a2a3a" rx="2"/>
  <text x="233" y="263" class="small" text-anchor="middle" fill="#58a6ff">Dirty Read</text>
  <rect x="294" y="248" width="114" height="22" fill="#1a2a3a" rx="2"/>
  <text x="351" y="263" class="small" text-anchor="middle" fill="#58a6ff">Non-Repeat Read</text>
  <rect x="412" y="248" width="114" height="22" fill="#1a2a3a" rx="2"/>
  <text x="469" y="263" class="small" text-anchor="middle" fill="#58a6ff">Phantom Read</text>
  <rect x="530" y="248" width="164" height="22" fill="#1a2a3a" rx="2"/>
  <text x="612" y="263" class="small" text-anchor="middle" fill="#58a6ff">Serialization Anomaly</text>

  <!-- rows -->
  <text x="100" y="283" class="small" text-anchor="middle">Read Uncommitted</text>
  <text x="233" y="283" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>
  <text x="351" y="283" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>
  <text x="469" y="283" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>
  <text x="612" y="283" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>

  <text x="100" y="303" class="small" text-anchor="middle">Read Committed</text>
  <text x="233" y="303" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="351" y="303" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>
  <text x="469" y="303" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>
  <text x="612" y="303" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>

  <text x="100" y="323" class="small" text-anchor="middle">Repeatable Read</text>
  <text x="233" y="323" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="351" y="323" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="469" y="323" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>
  <text x="612" y="323" class="small" text-anchor="middle" fill="#ff6b6b">✗ possible</text>

  <text x="100" y="343" class="small" text-anchor="middle">Serializable</text>
  <text x="233" y="343" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="351" y="343" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="469" y="343" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="612" y="343" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>

  <text x="100" y="365" class="small" text-anchor="middle" fill="#a855f7">Snapshot Isolation</text>
  <text x="233" y="365" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="351" y="365" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="469" y="365" class="small" text-anchor="middle" fill="#51cf66">✓ prevented</text>
  <text x="612" y="365" class="small" text-anchor="middle" fill="#ffd93d">✗ write skew</text>

  <text x="360" y="393" class="small" text-anchor="middle">PostgreSQL default = Read Committed. Postgres "Repeatable Read" is actually Snapshot Isolation. DDIA Ch. 7 · CMU 15-445 Lec 17–18</text>
</svg>
