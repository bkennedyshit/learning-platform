<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 640px; height: auto;">
  <defs>
    <marker id="conv-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .ax    { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.4; fill: none; }
    .cu    { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .r1    { fill: var(--interactive-accent, #58a6ff); opacity: 0.30; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; }
    .r2    { fill: var(--text-accent, #79c0ff); opacity: 0.22; stroke: var(--text-accent, #79c0ff); stroke-width: 0.8; }
    .lab   { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .tit   { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .math  { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>

  <!-- Panel 1: n=2 -->
  <g transform="translate(0,0)">
    <text x="100" y="22" class="tit" text-anchor="middle">n = 2</text>
    <line x1="20" y1="310" x2="200" y2="310" class="ax" marker-end="url(#conv-arrow)"/>
    <line x1="30" y1="330" x2="30" y2="40" class="ax" marker-end="url(#conv-arrow)"/>
    <rect x="40" y="150" width="70" height="160" class="r1"/>
    <rect x="110" y="220" width="70" height="90" class="r1"/>
    <path class="cu" d="M 30 310 C 55 250, 80 120, 110 100 S 165 200, 195 260"/>
    <text x="100" y="328" class="math" text-anchor="middle">a ——— b</text>
    <text x="100" y="350" class="lab" text-anchor="middle">error large</text>
  </g>

  <!-- Panel 2: n=4 -->
  <g transform="translate(210,0)">
    <text x="100" y="22" class="tit" text-anchor="middle">n = 4</text>
    <line x1="20" y1="310" x2="200" y2="310" class="ax" marker-end="url(#conv-arrow)"/>
    <line x1="30" y1="330" x2="30" y2="40"  class="ax" marker-end="url(#conv-arrow)"/>
    <rect x="40"  y="180" width="35" height="130" class="r2"/>
    <rect x="75"  y="130" width="35" height="180" class="r2"/>
    <rect x="110" y="180" width="35" height="130" class="r2"/>
    <rect x="145" y="230" width="35" height="80"  class="r2"/>
    <path class="cu" d="M 30 310 C 55 250, 80 120, 110 100 S 165 200, 195 260"/>
    <text x="100" y="328" class="math" text-anchor="middle">a ——— b</text>
    <text x="100" y="350" class="lab" text-anchor="middle">error smaller</text>
  </g>

  <!-- Panel 3: n=8 (many thin rects) -->
  <g transform="translate(420,0)">
    <text x="100" y="22" class="tit" text-anchor="middle">n = 8</text>
    <line x1="20" y1="310" x2="200" y2="310" class="ax" marker-end="url(#conv-arrow)"/>
    <line x1="30" y1="330" x2="30" y2="40"  class="ax" marker-end="url(#conv-arrow)"/>
    <rect x="40"  y="210" width="17" height="100" class="r1"/>
    <rect x="57"  y="160" width="17" height="150" class="r1"/>
    <rect x="74"  y="125" width="17" height="185" class="r1"/>
    <rect x="91"  y="110" width="17" height="200" class="r1"/>
    <rect x="108" y="120" width="17" height="190" class="r1"/>
    <rect x="125" y="155" width="17" height="155" class="r1"/>
    <rect x="142" y="205" width="17" height="105" class="r1"/>
    <rect x="159" y="255" width="17" height="55"  class="r1"/>
    <path class="cu" d="M 30 310 C 55 250, 80 120, 110 100 S 165 200, 195 260"/>
    <text x="100" y="328" class="math" text-anchor="middle">a ——— b</text>
    <text x="100" y="350" class="lab" text-anchor="middle">nearly exact</text>
  </g>

  <!-- Bottom annotation -->
  <text x="320" y="375" class="lab" text-anchor="middle">As n → ∞, ||P|| → 0, and the Riemann sum → ∫ f(x) dx  (Riemann integrability)</text>
</svg>