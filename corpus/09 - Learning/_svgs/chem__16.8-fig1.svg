<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .tier { rx: 8; stroke-width: 2; }
    .tier1 { fill: #862e9c; opacity: 0.2; stroke: #862e9c; }
    .tier2 { fill: #ff6b6b; opacity: 0.2; stroke: #ff6b6b; }
    .tier3 { fill: #fab005; opacity: 0.2; stroke: #fab005; }
    .tier4 { fill: #51cf66; opacity: 0.2; stroke: #51cf66; }
    .tier5 { fill: #4dabf7; opacity: 0.2; stroke: #4dabf7; }
    .axis { stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .arrow-up { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; marker-end: url(#uarr); }
  </style>
  <defs><marker id="uarr" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 10 L 5 0 L 10 10 z" fill="var(--text-normal, #c9d1d9)"/></marker></defs>
  <text x="300" y="20" class="title" text-anchor="middle">Computational Chemistry: Accuracy vs Scale</text>
  <!-- Accuracy axis (left) -->
  <line x1="50" y1="350" x2="50" y2="50" class="arrow-up"/>
  <text x="30" y="200" class="label" text-anchor="middle" transform="rotate(-90 30 200)">Accuracy</text>
  <!-- Scale axis (right) -->
  <text x="570" y="200" class="label" text-anchor="middle" transform="rotate(90 570 200)">System Size →</text>
  <!-- Tiers (bottom = largest scale, top = highest accuracy) -->
  <!-- Tier 5: Force Fields (largest scale, lowest accuracy) -->
  <rect x="80" y="300" width="480" height="50" class="tier tier5"/>
  <text x="320" y="322" class="label" text-anchor="middle">Force Fields (AMBER, CHARMM, OPLS)</text>
  <text x="320" y="338" class="sublabel" text-anchor="middle">O(N) | ~10⁶ atoms | MD simulations, protein folding | ~1 kcal/mol (parameterized)</text>
  <!-- Tier 4: Semi-empirical -->
  <rect x="80" y="240" width="400" height="50" class="tier tier4"/>
  <text x="280" y="262" class="label" text-anchor="middle">Semi-Empirical (PM7, GFN2-xTB)</text>
  <text x="280" y="278" class="sublabel" text-anchor="middle">O(N²) | ~10³ atoms | Conformer search, screening | ~3 kcal/mol</text>
  <!-- Tier 3: DFT -->
  <rect x="80" y="180" width="320" height="50" class="tier tier3"/>
  <text x="240" y="202" class="label" text-anchor="middle">DFT (B3LYP, ωB97X-D, PBE)</text>
  <text x="240" y="218" class="sublabel" text-anchor="middle">O(N³) | ~10²-10³ atoms | Reaction energies, spectra | ~1-3 kcal/mol</text>
  <!-- Tier 2: MP2 -->
  <rect x="80" y="120" width="220" height="50" class="tier tier2"/>
  <text x="190" y="142" class="label" text-anchor="middle">MP2 / CC2</text>
  <text x="190" y="158" class="sublabel" text-anchor="middle">O(N⁵) | ~50 atoms | Weak interactions | ~0.5 kcal/mol</text>
  <!-- Tier 1: CCSD(T) -->
  <rect x="80" y="55" width="150" height="55" class="tier tier1"/>
  <text x="155" y="77" class="label" text-anchor="middle">CCSD(T) / FCI</text>
  <text x="155" y="93" class="sublabel" text-anchor="middle">O(N⁷) | ~20 atoms</text>
  <text x="155" y="105" class="sublabel" text-anchor="middle">"Gold standard" | ~0.1 kcal/mol</text>
  <!-- AI/ML overlay -->
  <rect x="400" y="55" width="160" height="120" fill="var(--background-secondary, #161b22)" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2" rx="6" stroke-dasharray="5,3"/>
  <text x="480" y="75" class="label" text-anchor="middle" fill="var(--interactive-accent, #58a6ff)" font-weight="bold">AI/ML Models</text>
  <text x="480" y="93" class="sublabel" text-anchor="middle">GNNs, Transformers</text>
  <text x="480" y="108" class="sublabel" text-anchor="middle">DFT accuracy at</text>
  <text x="480" y="121" class="sublabel" text-anchor="middle">force-field speed</text>
  <text x="480" y="140" class="sublabel" text-anchor="middle">ANI, SchNet, MACE</text>
  <text x="480" y="155" class="sublabel" text-anchor="middle">AlphaFold, DiffDock</text>
</svg>
