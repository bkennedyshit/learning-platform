<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .math   { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: var(--interactive-accent, #58a6ff); }
    .box    { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .panel  { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.3; }
    .arr    { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .axis   { stroke: var(--text-muted, #8b949e); stroke-width: 1; fill: none; }
    .edgeh  { fill: none; stroke: #ff6b6b; stroke-width: 2; }
    .edgev  { fill: none; stroke: #ffd93d; stroke-width: 2; }
    .orig   { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
  </style>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">Image Processing &amp; 2D Transforms — 2D DFT &amp; Edge Detection</text>

  <!-- ===== LEFT: 2D DFT formula + description ===== -->
  <rect x="16" y="36" width="230" height="172" rx="5" class="panel"/>
  <text x="131" y="56" class="label" text-anchor="middle" font-weight="bold">2D Discrete Fourier Transform</text>
  <text x="26" y="74" class="math">F[u,v] = ΣₘΣₙ f[m,n]·e^{-j2π(um/M+vn/N)}</text>
  <text x="26" y="92" class="small">• f[m,n]: pixel value at row m, col n</text>
  <text x="26" y="106" class="small">• F[u,v]: frequency content at (u,v)</text>
  <text x="26" y="120" class="small">• DC component F[0,0] = mean brightness</text>
  <text x="26" y="134" class="small">• Low freq (center): smooth regions</text>
  <text x="26" y="148" class="small">• High freq (edges): sharp transitions</text>
  <text x="26" y="162" class="small">• Convolution theorem holds in 2D:</text>
  <text x="26" y="176" class="math">  f*g  ↔  F·G  (pointwise multiply)</text>
  <text x="26" y="192" class="small">→ image filtering = freq domain multiply</text>

  <!-- ===== MIDDLE: Convolution pipeline ===== -->
  <rect x="260" y="36" width="200" height="172" rx="5" class="panel"/>
  <text x="360" y="56" class="label" text-anchor="middle" font-weight="bold">Image Filtering Pipeline</text>

  <rect x="280" y="70" width="80" height="30" rx="3" class="orig"/>
  <text x="320" y="90" class="small" text-anchor="middle">Image f[m,n]</text>
  <line x1="320" y1="100" x2="320" y2="118" class="arr" marker-end="url(#a6)"/>

  <rect x="274" y="118" width="92" height="30" rx="3" class="orig"/>
  <text x="320" y="138" class="small" text-anchor="middle">2D FFT → F[u,v]</text>
  <line x1="320" y1="148" x2="320" y2="166" class="arr" marker-end="url(#a6)"/>

  <rect x="268" y="166" width="104" height="24" rx="3" class="orig"/>
  <text x="320" y="182" class="small" text-anchor="middle">Multiply H[u,v]</text>
  <line x1="320" y1="190" x2="320" y2="208" class="arr" marker-end="url(#a6)"/>

  <!-- Kernel label -->
  <rect x="400" y="170" width="50" height="24" rx="3" style="fill:#51cf66;opacity:0.15;stroke:#51cf66;stroke-width:1;"/>
  <text x="425" y="186" class="small" text-anchor="middle" fill="#51cf66">kernel</text>
  <line x1="400" y1="182" x2="372" y2="182" stroke="#51cf66" stroke-width="0.8" stroke-dasharray="2 2"/>

  <rect x="272" y="208" width="96" height="24" rx="3" class="orig"/>
  <text x="320" y="224" class="small" text-anchor="middle">Inverse FFT → y</text>

  <!-- ===== RIGHT: Common kernels ===== -->
  <rect x="474" y="36" width="230" height="172" rx="5" class="panel"/>
  <text x="589" y="56" class="label" text-anchor="middle" font-weight="bold">Common 2D Kernels (3×3)</text>

  <text x="484" y="74" class="small" fill="#51cf66">Gaussian blur (σ=1):</text>
  <text x="484" y="88" class="math">1/16·[1 2 1; 2 4 2; 1 2 1]</text>
  <text x="484" y="106" class="small" fill="#ff6b6b">Sobel X (horizontal edges):</text>
  <text x="484" y="120" class="math">[-1 0 1; -2 0 2; -1 0 1]</text>
  <text x="484" y="138" class="small" fill="#ffd93d">Sobel Y (vertical edges):</text>
  <text x="484" y="152" class="math">[-1 -2 -1; 0 0 0; 1 2 1]</text>
  <text x="484" y="170" class="small" fill="var(--interactive-accent,#58a6ff)">Laplacian (all edges):</text>
  <text x="484" y="184" class="math">[0 1 0; 1 -4 1; 0 1 0]</text>

  <!-- ===== BOTTOM: Visual grid showing original/edges ===== -->
  <rect x="16" y="224" width="688" height="186" rx="4" class="box"/>
  <text x="360" y="242" class="label" text-anchor="middle" font-weight="bold">Edge Detection: Sobel X + Sobel Y → Edge Magnitude</text>

  <!-- Original image grid (simulated checkerboard / gradient) -->
  <g transform="translate(30, 258)">
    <text x="60" y="-6" class="small" text-anchor="middle" fill="var(--text-muted,#8b949e)">Original Image</text>
    <!-- Simulated image: light-dark gradient blocks -->
    <rect x="0"   y="0" width="20" height="20" fill="#444" opacity="0.8"/>
    <rect x="20"  y="0" width="20" height="20" fill="#888" opacity="0.8"/>
    <rect x="40"  y="0" width="20" height="20" fill="#ccc" opacity="0.8"/>
    <rect x="60"  y="0" width="20" height="20" fill="#888" opacity="0.8"/>
    <rect x="80"  y="0" width="20" height="20" fill="#444" opacity="0.8"/>
    <rect x="100" y="0" width="20" height="20" fill="#ccc" opacity="0.8"/>
    <rect x="0"   y="20" width="20" height="20" fill="#ccc" opacity="0.8"/>
    <rect x="20"  y="20" width="20" height="20" fill="#444" opacity="0.8"/>
    <rect x="40"  y="20" width="20" height="20" fill="#888" opacity="0.8"/>
    <rect x="60"  y="20" width="20" height="20" fill="#ccc" opacity="0.8"/>
    <rect x="80"  y="20" width="20" height="20" fill="#888" opacity="0.8"/>
    <rect x="100" y="20" width="20" height="20" fill="#444" opacity="0.8"/>
    <rect x="0"   y="40" width="20" height="20" fill="#666" opacity="0.8"/>
    <rect x="20"  y="40" width="20" height="20" fill="#aaa" opacity="0.8"/>
    <rect x="40"  y="40" width="20" height="20" fill="#444" opacity="0.8"/>
    <rect x="60"  y="40" width="20" height="20" fill="#888" opacity="0.8"/>
    <rect x="80"  y="40" width="20" height="20" fill="#ccc" opacity="0.8"/>
    <rect x="100" y="40" width="20" height="20" fill="#555" opacity="0.8"/>
    <rect x="0"   y="60" width="120" height="20" fill="#999" opacity="0.6"/>
    <rect x="0"   y="80" width="120" height="20" fill="#333" opacity="0.8"/>
    <rect x="0"   y="100" width="120" height="20" fill="#bbb" opacity="0.7"/>
  </g>

  <!-- Arrow from original to Sobel X -->
  <text x="176" y="272" class="small" text-anchor="middle">Sobel X→</text>
  <line x1="152" y1="310" x2="192" y2="310" class="arr" marker-end="url(#a6)"/>

  <!-- Sobel X response (vertical edges highlighted) -->
  <g transform="translate(200, 258)">
    <text x="60" y="-6" class="small" text-anchor="middle" fill="#ff6b6b">Sobel X (horiz. edges)</text>
    <rect x="0" y="0" width="120" height="120" fill="#111" opacity="0.9"/>
    <!-- Bright vertical edge lines -->
    <line x1="20"  y1="0" x2="20"  y2="120" stroke="#ff6b6b" stroke-width="4" opacity="0.8"/>
    <line x1="60"  y1="0" x2="60"  y2="120" stroke="#ff6b6b" stroke-width="3" opacity="0.6"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ff6b6b" stroke-width="3" opacity="0.6"/>
  </g>

  <line x1="332" y1="310" x2="370" y2="310" class="arr" marker-end="url(#a6)"/>
  <text x="350" y="272" class="small" text-anchor="middle">Sobel Y→</text>

  <!-- Sobel Y response (horizontal edges highlighted) -->
  <g transform="translate(378, 258)">
    <text x="60" y="-6" class="small" text-anchor="middle" fill="#ffd93d">Sobel Y (vert. edges)</text>
    <rect x="0" y="0" width="120" height="120" fill="#111" opacity="0.9"/>
    <!-- Bright horizontal edge lines -->
    <line x1="0" y1="20"  x2="120" y2="20"  stroke="#ffd93d" stroke-width="4" opacity="0.8"/>
    <line x1="0" y1="60"  x2="120" y2="60"  stroke="#ffd93d" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="100" x2="120" y2="100" stroke="#ffd93d" stroke-width="3" opacity="0.6"/>
  </g>

  <text x="523" y="272" class="small" text-anchor="middle">magnitude:</text>
  <text x="523" y="284" class="small" text-anchor="middle">√(Gx²+Gy²)</text>
  <line x1="510" y1="310" x2="548" y2="310" class="arr" marker-end="url(#a6)"/>

  <!-- Combined edge map -->
  <g transform="translate(556, 258)">
    <text x="60" y="-6" class="small" text-anchor="middle" fill="#51cf66">Edge Map |∇f|</text>
    <rect x="0" y="0" width="120" height="120" fill="#111" opacity="0.9"/>
    <line x1="20"  y1="0"  x2="20"  y2="120" stroke="white" stroke-width="3" opacity="0.7"/>
    <line x1="60"  y1="0"  x2="60"  y2="120" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="0"  x2="100" y2="120" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0"   y1="20" x2="120" y2="20"  stroke="white" stroke-width="3" opacity="0.7"/>
    <line x1="0"   y1="60" x2="120" y2="60"  stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0"   y1="100" x2="120" y2="100" stroke="white" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
