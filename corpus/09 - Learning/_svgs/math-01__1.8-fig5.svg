<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px;height:auto;">
  <defs>
    <marker id="hole-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="hole-arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    .hole-bg  { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1.2; }
    .loop1    { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .loop2    { stroke: var(--text-muted, #8b949e); stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .singpt   { fill: var(--text-accent, #79c0ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .lab      { font-family: Inter,system-ui,sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .math     { font-family: 'Latin Modern Math',serif; font-style: italic; font-size: 13px; fill: var(--interactive-accent, #58a6ff); }
    .muted    { font-family: Inter,system-ui,sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .axis     { stroke: var(--text-muted, #8b949e); stroke-width: 1; fill: none; opacity: 0.5; }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Background domain -->
  <rect x="20" y="20" width="440" height="290" rx="8" class="hole-bg" opacity="0.4"/>
  <!-- Axes -->
  <line x1="240" y1="30" x2="240" y2="300" class="axis"/>
  <line x1="30"  y1="165" x2="450" y2="165" class="axis"/>
  <!-- Singularity (hole) at origin -->
  <circle cx="240" cy="165" r="14" fill="var(--background-primary, #0d1117)" stroke="var(--text-accent, #79c0ff)" stroke-width="2"/>
  <text x="240" y="170" class="math" text-anchor="middle" style="font-size:11px">×</text>
  <text x="240" y="155" class="lab" text-anchor="middle" style="font-size:10px">0</text>
  <!-- Loop C1: large circle going around the hole CCW -->
  <ellipse cx="240" cy="165" rx="130" ry="90" class="loop1"/>
  <!-- Arrow on C1 -->
  <line x1="370" y1="165" x2="370" y2="140" stroke="var(--interactive-accent, #58a6ff)" stroke-width="0" marker-end="url(#hole-arr)"/>
  <text x="388" y="145" class="math">C₁</text>
  <text x="388" y="160" class="muted" style="fill:var(--interactive-accent, #58a6ff)">∮_C₁ ω = 2π</text>
  <!-- Loop C2: loop that doesn't encircle origin -->
  <ellipse cx="350" cy="80" rx="55" ry="35" class="loop2"/>
  <text x="350" y="78" class="math" text-anchor="middle" style="font-size:11px">C₂</text>
  <text x="350" y="130" class="muted">∮_C₂ ω = 0</text>
  <text x="350" y="142" class="muted">(contractible loop)</text>
  <!-- Domain label -->
  <text x="100" y="250" class="math" style="fill:var(--text-muted, #8b949e)">ℝ²\{0}</text>
  <!-- Bottom annotation -->
  <text x="240" y="322" class="muted">dω = 0 everywhere (closed), but ∮_C₁ ω = 2π ≠ 0 (not exact)</text>
</svg>