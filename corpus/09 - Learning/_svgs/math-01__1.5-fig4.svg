<svg viewBox="0 0 500 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <style>
    .sph-ax  { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.4; fill: none; }
    .sphere  { fill: none; stroke: var(--text-muted, #8b949e); stroke-width: 1.0; opacity: 0.5; }
    .eq      { fill: none; stroke: var(--text-muted, #8b949e); stroke-width: 1.0; stroke-dasharray: 4 3; opacity: 0.6; }
    .vec     { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.0; fill: none; }
    .proj    { stroke: var(--text-muted, #8b949e); stroke-width: 1.0; stroke-dasharray: 3 2; }
    .arc-phi { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; fill: none; }
    .arc-tht { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; }
    .lab     { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .math    { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 15px; fill: var(--text-normal, #c9d1d9); }
    .math-acc{ font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 15px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .math-muted{ font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 14px; fill: var(--text-accent, #79c0ff); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
    <marker id="va" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Origin at (240,260) -->
  <!-- Axes -->
  <line x1="240" y1="260" x2="420" y2="310" class="sph-ax" marker-end="url(#sa)"/>
  <line x1="240" y1="260" x2="240" y2="60"  class="sph-ax" marker-end="url(#sa)"/>
  <line x1="240" y1="260" x2="80"  y2="310" class="sph-ax" marker-end="url(#sa)"/>
  <text x="425" y="315" class="math">x</text>
  <text x="228" y="56"  class="math">z</text>
  <text x="66"  y="316" class="math">y</text>
  <!-- Sphere outline (circle projection) -->
  <ellipse cx="240" cy="200" rx="160" ry="140" class="sphere"/>
  <!-- Equator (ellipse) -->
  <ellipse cx="240" cy="260" rx="140" ry="35" class="eq"/>
  <!-- Point P on sphere: rho=160, phi=40deg, theta=30deg -->
  <!-- In isometric: x=rho*sin(phi)*cos(theta), y=rho*sin(phi)*sin(theta), z=rho*cos(phi) -->
  <!-- phi=40deg => sin=0.643, cos=0.766; theta=30deg => sin=0.5, cos=0.866 -->
  <!-- projected: P_screen ~ (240 + 140*0.643*0.866, 260 - 130*0.766) = (318, 160) -->
  <!-- projection on xy-plane: Q ~ (240 + 140*0.643*0.866, 260 + 35*0.643*0.5) = (318, 271) -->
  <line x1="240" y1="260" x2="318" y2="160" class="vec" marker-end="url(#va)"/>
  <!-- Projection onto xy plane (dashed) -->
  <line x1="318" y1="160" x2="318" y2="271" class="proj"/>
  <line x1="240" y1="260" x2="318" y2="271" class="proj"/>
  <!-- phi arc (from z-axis to rho vector) -->
  <path d="M 240 160 A 100 100 0 0 1 318 168" class="arc-phi"/>
  <!-- theta arc (from x-axis to projection on xy plane) -->
  <path d="M 280 265 A 40 40 0 0 1 277 272" class="arc-tht"/>
  <!-- Labels -->
  <text x="276" y="155" class="math-acc">ρ</text>
  <text x="240" y="162" class="math-muted">φ</text>
  <text x="285" y="278" class="math-acc">θ</text>
  <text x="322" y="157" class="math">P</text>
  <text x="324" y="275" class="lab">proj on xy</text>
  <!-- Annotations box -->
  <rect x="15" y="380" width="470" height="68" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="250" y="400" class="lab" text-anchor="middle" font-weight="bold">Spherical: x = ρ sin φ cos θ,  y = ρ sin φ sin θ,  z = ρ cos φ</text>
  <text x="250" y="420" class="lab" text-anchor="middle">ρ ≥ 0,  φ ∈ [0, π],  θ ∈ [0, 2π)       Jacobian = ρ² sin φ</text>
  <text x="250" y="440" class="lab" text-anchor="middle">φ = polar angle from +z axis;  θ = azimuthal angle in xy-plane</text>
</svg>