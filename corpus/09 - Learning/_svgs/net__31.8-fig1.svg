<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sub   { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .box   { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .vol   { fill: #3d1a1a; stroke: #ff6b6b; stroke-width: 1.5; }
    .proto-atk { fill: #3d2a1a; stroke: #ffa94d; stroke-width: 1.5; }
    .app   { fill: #3d3a1a; stroke: #ffd93d; stroke-width: 1.5; }
    .mit   { fill: #1a3d1a; stroke: #51cf66; stroke-width: 1.5; }
    .bgp   { fill: #2d1a3d; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; }
    .any   { fill: #1a3a3d; stroke: #4dabf7; stroke-width: 1.5; }
  </style>

  <text x="360" y="20" class="title" text-anchor="middle">DDoS Categories · BGP Hijacking · Anycast · Mitigation Architecture</text>

  <!-- DDoS categories -->
  <text x="220" y="44" class="label" text-anchor="middle" font-weight="bold">DDoS Attack Categories</text>
  <rect x="20" y="52" width="400" height="180" rx="3" class="box"/>

  <!-- Volumetric -->
  <rect x="28" y="62" width="118" height="70" rx="4" class="vol"/>
  <text x="87" y="78" class="label" text-anchor="middle">Volumetric</text>
  <text x="87" y="92" class="sub" text-anchor="middle">Saturate bandwidth</text>
  <text x="87" y="104" class="sub" text-anchor="middle">UDP flood · DNS amp</text>
  <text x="87" y="116" class="sub" text-anchor="middle">ICMP flood · NTP amp</text>
  <text x="87" y="128" class="sub" text-anchor="middle">Peak: &gt;1 Tbit/s</text>

  <!-- Protocol attacks -->
  <rect x="154" y="62" width="118" height="70" rx="4" class="proto-atk"/>
  <text x="213" y="78" class="label" text-anchor="middle">Protocol</text>
  <text x="213" y="92" class="sub" text-anchor="middle">Exhaust state tables</text>
  <text x="213" y="104" class="sub" text-anchor="middle">SYN flood · Smurf</text>
  <text x="213" y="116" class="sub" text-anchor="middle">Ping-of-Death · Frag</text>
  <text x="213" y="128" class="sub" text-anchor="middle">Firewall / LB state</text>

  <!-- Application layer -->
  <rect x="280" y="62" width="132" height="70" rx="4" class="app"/>
  <text x="346" y="78" class="label" text-anchor="middle">Application (L7)</text>
  <text x="346" y="92" class="sub" text-anchor="middle">Exhaust app logic</text>
  <text x="346" y="104" class="sub" text-anchor="middle">HTTP flood · Slowloris</text>
  <text x="346" y="116" class="sub" text-anchor="middle">RUDY · CC attack</text>
  <text x="346" y="128" class="sub" text-anchor="middle">Hard to filter (valid HTTP)</text>

  <!-- Mitigation steps -->
  <text x="30" y="152" class="sub" font-weight="bold" fill="#51cf66">Mitigation layers:</text>
  <text x="30" y="164" class="sub">① Upstream scrubbing (Cloudflare Magic Transit / Akamai Prolexic) — absorb volumetric</text>
  <text x="30" y="176" class="sub">② Anycast routing — spread load across PoPs globally</text>
  <text x="30" y="188" class="sub">③ SYN cookies — stateless SYN-ACK reply; no state until ACK confirmed</text>
  <text x="30" y="200" class="sub">④ Rate-limit + challenge (CAPTCHA / JS proof-of-work) for L7</text>
  <text x="30" y="212" class="sub">⑤ WAF rules (OWASP CRS) · IP reputation lists · geo-block</text>
  <text x="30" y="224" class="sub">⑥ eBPF XDP — kernel-space drop at NIC speed before TCP stack</text>

  <!-- BGP hijacking panel -->
  <text x="570" y="44" class="label" text-anchor="middle" font-weight="bold">BGP Hijacking</text>
  <rect x="430" y="52" width="278" height="180" rx="3" class="bgp"/>
  <text x="440" y="70" class="sub" font-weight="bold">Normal:</text>
  <text x="440" y="82" class="mono">AS 64496 announces 1.2.3.0/24</text>
  <text x="440" y="94" class="sub">→ traffic routed to legitimate AS</text>
  <line x1="440" y1="102" x2="704" y2="102" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="440" y="116" class="sub" font-weight="bold" fill="#ff6b6b">Prefix hijack:</text>
  <text x="440" y="128" class="mono">AS 99999 announces 1.2.3.0/24</text>
  <text x="440" y="140" class="sub" fill="#ff6b6b">→ some ASes accept more-specific or</text>
  <text x="440" y="152" class="sub" fill="#ff6b6b">   shorter AS-path → traffic diverted</text>
  <line x1="440" y1="160" x2="704" y2="160" stroke="var(--text-muted,#8b949e)" stroke-width="0.5"/>
  <text x="440" y="174" class="sub" font-weight="bold" fill="#51cf66">Defenses:</text>
  <text x="440" y="186" class="mono">RPKI (Resource PKI) — cryptographic prefix-origin validation</text>
  <text x="440" y="198" class="mono">ROA (Route Origin Authorization) signed by RIR</text>
  <text x="440" y="210" class="mono">BGPsec — AS-path signing (not widely deployed)</text>
  <text x="440" y="222" class="mono">MANRS — network operator community norms</text>

  <!-- Anycast diagram bottom -->
  <text x="360" y="256" class="label" text-anchor="middle" font-weight="bold">Anycast — Same IP Prefix Announced from Multiple PoPs</text>
  <rect x="20" y="264" width="680" height="142" rx="3" class="box"/>

  <!-- Client -->
  <rect x="30" y="284" width="70" height="32" rx="4" fill="#1a2a1a" stroke="#51cf66" stroke-width="1"/>
  <text x="65" y="304" class="sub" text-anchor="middle">Client (EU)</text>

  <!-- PoP EU -->
  <rect x="180" y="274" width="90" height="52" rx="4" class="any"/>
  <text x="225" y="295" class="label" text-anchor="middle">PoP EU</text>
  <text x="225" y="308" class="sub" text-anchor="middle">1.1.1.0/24</text>
  <text x="225" y="320" class="mono" text-anchor="middle">Frankfurt</text>

  <!-- PoP US -->
  <rect x="340" y="274" width="90" height="52" rx="4" class="any"/>
  <text x="385" y="295" class="label" text-anchor="middle">PoP US</text>
  <text x="385" y="308" class="sub" text-anchor="middle">1.1.1.0/24</text>
  <text x="385" y="320" class="mono" text-anchor="middle">Ashburn</text>

  <!-- PoP APAC -->
  <rect x="500" y="274" width="90" height="52" rx="4" class="any"/>
  <text x="545" y="295" class="label" text-anchor="middle">PoP APAC</text>
  <text x="545" y="308" class="sub" text-anchor="middle">1.1.1.0/24</text>
  <text x="545" y="320" class="mono" text-anchor="middle">Singapore</text>

  <!-- Origin -->
  <rect x="630" y="284" width="58" height="32" rx="4" fill="#2a1a2a" stroke="#ffa94d" stroke-width="1"/>
  <text x="659" y="304" class="sub" text-anchor="middle">Origin</text>

  <!-- Routing arrows: client routes to closest PoP -->
  <line x1="100" y1="300" x2="180" y2="300" stroke="#51cf66" stroke-width="2" marker-end="url(#ga3)"/>
  <text x="140" y="292" class="sub" text-anchor="middle" fill="#51cf66">BGP nearest</text>
  <line x1="270" y1="300" x2="340" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="430" y1="300" x2="500" y2="300" stroke="var(--text-muted,#8b949e)" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="590" y1="300" x2="630" y2="300" stroke="#ffa94d" stroke-width="1.5" marker-end="url(#oa)"/>
  <text x="610" y="292" class="sub" text-anchor="middle" fill="#ffa94d">cache miss</text>

  <text x="30" y="350" class="sub">All PoPs announce same /24 · BGP's shortest-path selects nearest PoP · DDoS gets spread across global capacity</text>
  <text x="30" y="366" class="sub">Cloudflare: 300+ PoPs · Akamai: 4000+ PoPs · DNS also anycast (13 root server "letters", hundreds of instances each)</text>
  <text x="30" y="382" class="sub">SYN Cookies: server sends ISN = hash(src_ip, src_port, dst_ip, dst_port, secret, t) · validates ACK without storing state · RFC 4987</text>
  <text x="30" y="396" class="sub">eBPF XDP: attach BPF prog at NIC driver level → drop/pass decision before kernel TCP stack → 10–100M pps on single core</text>

  <defs>
    <marker id="ga3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#51cf66"/></marker>
    <marker id="oa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffa94d"/></marker>
  </defs>
</svg>
