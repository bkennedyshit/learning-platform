<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="imm-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .innate-box { fill: #ff6b6b; fill-opacity: 0.15; stroke: #ff6b6b; stroke-width: 2; rx: 8; }
    .adaptive-box { fill: #4dabf7; fill-opacity: 0.15; stroke: #4dabf7; stroke-width: 2; rx: 8; }
    .cell { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; cursor: pointer; transition: all 0.2s; }
    .cell:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 3px var(--interactive-accent, #58a6ff)); }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .section-title { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: bold; }
    .connector { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; color: var(--text-muted, #8b949e); }
    .time-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
  </style>
  <text x="300" y="22" class="title" text-anchor="middle">Immune Response — Innate vs Adaptive</text>
  <!-- Time axis -->
  <line x1="30" y1="45" x2="570" y2="45" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="100" y="40" class="time-label" text-anchor="middle">Minutes</text>
  <text x="250" y="40" class="time-label" text-anchor="middle">Hours</text>
  <text x="430" y="40" class="time-label" text-anchor="middle">Days–Weeks</text>
  <!-- Innate section -->
  <rect x="20" y="55" width="260" height="240" class="innate-box"/>
  <text x="150" y="75" class="section-title" text-anchor="middle" fill="#ff6b6b">INNATE IMMUNITY (Fast, Non-specific)</text>
  <!-- Innate cells -->
  <rect x="40" y="90" width="100" height="35" class="cell" rx="6"/>
  <text x="90" y="112" class="label" text-anchor="middle">Neutrophils</text>
  <rect x="160" y="90" width="100" height="35" class="cell" rx="6"/>
  <text x="210" y="112" class="label" text-anchor="middle">Macrophages</text>
  <rect x="40" y="140" width="100" height="35" class="cell" rx="6"/>
  <text x="90" y="162" class="label" text-anchor="middle">NK Cells</text>
  <rect x="160" y="140" width="100" height="35" class="cell" rx="6"/>
  <text x="210" y="162" class="label" text-anchor="middle">Complement</text>
  <rect x="80" y="195" width="120" height="35" class="cell" rx="6"/>
  <text x="140" y="212" class="label" text-anchor="middle" font-weight="bold">Dendritic Cells</text>
  <text x="140" y="225" class="label" text-anchor="middle" font-size="9">(Antigen Presentation)</text>
  <!-- Bridge arrow -->
  <line x1="200" y1="212" x2="310" y2="160" class="connector" marker-end="url(#imm-arrow)" stroke-width="2"/>
  <text x="260" y="175" class="time-label">MHC I/II</text>
  <!-- Adaptive section -->
  <rect x="300" y="55" width="280" height="240" class="adaptive-box"/>
  <text x="440" y="75" class="section-title" text-anchor="middle" fill="#4dabf7">ADAPTIVE IMMUNITY (Slow, Specific, Memory)</text>
  <!-- Adaptive cells -->
  <rect x="320" y="90" width="110" height="35" class="cell" rx="6"/>
  <text x="375" y="107" class="label" text-anchor="middle">CD4⁺ T Helper</text>
  <text x="375" y="120" class="label" text-anchor="middle" font-size="9">Th1/Th2/Th17/Treg</text>
  <rect x="450" y="90" width="110" height="35" class="cell" rx="6"/>
  <text x="505" y="107" class="label" text-anchor="middle">CD8⁺ T Killer</text>
  <text x="505" y="120" class="label" text-anchor="middle" font-size="9">Cytotoxic (CTL)</text>
  <rect x="320" y="145" width="110" height="35" class="cell" rx="6"/>
  <text x="375" y="167" class="label" text-anchor="middle">B Cells</text>
  <rect x="450" y="145" width="110" height="35" class="cell" rx="6"/>
  <text x="505" y="162" class="label" text-anchor="middle">Antibodies</text>
  <text x="505" y="175" class="label" text-anchor="middle" font-size="9">IgG/IgM/IgA</text>
  <!-- Memory -->
  <rect x="370" y="210" width="140" height="35" class="cell" rx="6" stroke="var(--interactive-accent, #58a6ff)"/>
  <text x="440" y="227" class="label" text-anchor="middle" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">Memory Cells</text>
  <text x="440" y="240" class="label" text-anchor="middle" font-size="9">Rapid recall (years–lifetime)</text>
  <!-- Arrows within adaptive -->
  <line x1="375" y1="125" x2="375" y2="145" class="connector" marker-end="url(#imm-arrow)"/>
  <line x1="430" y1="162" x2="450" y2="162" class="connector" marker-end="url(#imm-arrow)"/>
  <line x1="440" y1="180" x2="440" y2="210" class="connector" marker-end="url(#imm-arrow)"/>
  <!-- Bottom summary -->
  <text x="300" y="310" class="time-label" text-anchor="middle">Key: Innate = first responders (no memory) | Adaptive = specialists (memory + specificity via V(D)J)</text>
</svg>
