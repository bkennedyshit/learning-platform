<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #888; stroke-width: 2; }
      .text { font-family: sans-serif; font-size: 14px; fill: #ccc; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #fff; }
      .ltp-curve { fill: rgba(77, 171, 247, 0.2); stroke: #4dabf7; stroke-width: 3; }
      .ltd-curve { fill: rgba(255, 107, 107, 0.2); stroke: #ff6b6b; stroke-width: 3; }
    </style>
  </defs>
  <rect width="620" height="400" fill="#1e1e1e" rx="10"/>
  
  <text x="310" y="30" text-anchor="middle" class="title">Spike-Timing-Dependent Plasticity (STDP)</text>

  <!-- Axes -->
  <line x1="310" y1="60" x2="310" y2="340" class="axis"/>
  <line x1="60" y1="200" x2="560" y2="200" class="axis"/>
  
  <text x="560" y="190" text-anchor="end" class="text">Δt = t_post - t_pre (ms)</text>
  <text x="320" y="70" class="text">Δw > 0 (LTP)</text>
  <text x="320" y="330" class="text">Δw < 0 (LTD)</text>

  <text x="100" y="220" text-anchor="middle" class="text">-40</text>
  <text x="200" y="220" text-anchor="middle" class="text">-20</text>
  <text x="420" y="220" text-anchor="middle" class="text">+20</text>
  <text x="520" y="220" text-anchor="middle" class="text">+40</text>

  <!-- LTP Curve (Right Side, Delta t > 0) -->
  <path class="ltp-curve" d="M 310 200 L 310 80 Q 380 200, 560 200 Z">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- LTD Curve (Left Side, Delta t < 0) -->
  <path class="ltd-curve" d="M 310 200 L 310 320 Q 240 200, 60 200 Z">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </path>
  
  <text x="400" y="130" text-anchor="middle" fill="#4dabf7" font-family="sans-serif" font-weight="bold">Pre before Post</text>
  <text x="220" y="280" text-anchor="middle" fill="#ff6b6b" font-family="sans-serif" font-weight="bold">Post before Pre</text>

  <!-- Animated spikes demonstrating causality -->
  <circle cx="400" cy="150" r="4" fill="#ffcc00">
     <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="410" y="155" font-size="12" fill="#ffcc00">
     <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
     Causal correlation → LTP
  </text>
  
  <circle cx="220" cy="250" r="4" fill="#ffcc00">
     <animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text x="230" y="255" font-size="12" fill="#ffcc00">
     <animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
     Anti-causal correlation → LTD
  </text>

</svg>
