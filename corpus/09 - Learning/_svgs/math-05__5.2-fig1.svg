<svg viewBox="0 0 520 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .c-axis { stroke:var(--text-normal, #c9d1d9); stroke-width:2; fill:none; }
    .c-iso-h { stroke:#ff6b6b; stroke-width:3; fill:none; }
    .c-iso-c { stroke:#4dabf7; stroke-width:3; fill:none; }
    .c-adia { stroke:var(--text-muted, #8b949e); stroke-width:2.5; fill:none; stroke-dasharray:8 4; }
    .c-work { fill:var(--interactive-accent, #58a6ff); opacity:0.12; }
    .c-pt { fill:var(--text-accent, #79c0ff); stroke:var(--text-normal, #c9d1d9); stroke-width:1.5; cursor:pointer; transition:all 0.2s; }
    .c-pt:hover { r:8; fill:var(--interactive-accent, #58a6ff); filter:drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .c-lbl { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); }
    .c-acc { font-family:Inter,system-ui,sans-serif; font-size:14px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    .c-hot { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:#ff6b6b; font-weight:bold; }
    .c-cold { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:#4dabf7; font-weight:bold; }
    @keyframes pulse-work { 0%,100%{opacity:0.12} 50%{opacity:0.22} }
    .c-work-anim { animation: pulse-work 3s ease-in-out infinite; }
  </style>
  <!-- Axes -->
  <line x1="60" y1="380" x2="480" y2="380" class="c-axis" marker-end="url(#ca)" style="color:var(--text-normal, #c9d1d9)"/>
  <line x1="60" y1="380" x2="60" y2="30" class="c-axis" marker-end="url(#ca)" style="color:var(--text-normal, #c9d1d9)"/>
  <text x="490" y="385" class="c-lbl">V</text>
  <text x="55" y="20" class="c-lbl" text-anchor="end">P</text>
  <!-- Shaded work area -->
  <path d="M 130 100 Q 210 130 300 155 Q 270 240 230 310 Q 150 260 100 195 Q 115 145 130 100 Z" class="c-work c-work-anim"/>
  <!-- Isothermal expansion 1→2 (T_H) -->
  <path d="M 130 100 Q 210 130 300 155" class="c-iso-h" marker-end="url(#ca)" style="color:#ff6b6b"/>
  <text x="200" y="95" class="c-hot">Isothermal T_H (Q_H absorbed)</text>
  <!-- Adiabatic expansion 2→3 -->
  <path d="M 300 155 Q 270 240 230 310" class="c-adia" marker-end="url(#ca)" style="color:var(--text-muted, #8b949e)"/>
  <text x="305" y="235" class="c-lbl">Adiabatic</text>
  <!-- Isothermal compression 3→4 (T_C) -->
  <path d="M 230 310 Q 150 260 100 195" class="c-iso-c" marker-end="url(#ca)" style="color:#4dabf7"/>
  <text x="120" y="300" class="c-cold">Isothermal T_C (Q_C rejected)</text>
  <!-- Adiabatic compression 4→1 -->
  <path d="M 100 195 Q 115 145 130 100" class="c-adia" marker-end="url(#ca)" style="color:var(--text-muted, #8b949e)"/>
  <text x="70" y="145" class="c-lbl">Adiabatic</text>
  <!-- State points -->
  <circle cx="130" cy="100" r="6" class="c-pt"/><text x="130" y="85" class="c-acc" text-anchor="middle">1</text>
  <circle cx="300" cy="155" r="6" class="c-pt"/><text x="315" y="155" class="c-acc">2</text>
  <circle cx="230" cy="310" r="6" class="c-pt"/><text x="245" y="320" class="c-acc">3</text>
  <circle cx="100" cy="195" r="6" class="c-pt"/><text x="82" y="195" class="c-acc">4</text>
  
  <!-- Animated cycle particle -->
  <circle r="4" fill="var(--text-accent, #79c0ff)">
    <animateMotion dur="6s" repeatCount="indefinite" 
      path="M 130 100 Q 210 130 300 155 Q 270 240 230 310 Q 150 260 100 195 Q 115 145 130 100" />
  </circle>

  <!-- Efficiency box -->
  <rect x="340" y="50" width="160" height="80" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="420" y="75" class="c-acc" text-anchor="middle">Carnot Efficiency</text>
  <text x="420" y="100" class="c-lbl" text-anchor="middle" font-family="serif" font-size="15">η = 1 − T_C / T_H</text>
  <text x="420" y="120" class="c-lbl" text-anchor="middle">W_net = Q_H − Q_C</text>
  <!-- Net work label -->
  <text x="190" y="210" class="c-acc" text-anchor="middle">W_net</text>
</svg>