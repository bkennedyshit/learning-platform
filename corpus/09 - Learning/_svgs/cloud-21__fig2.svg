<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .user { fill: #89b4fa; }
      .cloud { fill: #a6e3a1; }
      .text { font-family: monospace; font-size: 14px; fill: #11111b; font-weight: bold; }
      .label { font-family: monospace; font-size: 16px; fill: #cdd6f4; }
      .ax { stroke: #cdd6f4; stroke-width: 2; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <text x="400" y="40" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="20" font-weight="bold">Compute Primitives: Responsibility Spectrum</text>
  
  <line x1="50" y1="350" x2="750" y2="350" class="ax"/>
  <line x1="50" y1="350" x2="50" y2="80" class="ax"/>
  <text x="40" y="215" transform="rotate(-90 40 215)" text-anchor="middle" class="label">Stack Layers</text>
  
  <!-- VM -->
  <g transform="translate(100, 100)">
    <text x="40" y="-10" class="label" text-anchor="middle">VM</text>
    <rect x="0" y="0" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="25" class="text" text-anchor="middle">App</text>
    <rect x="0" y="45" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="70" class="text" text-anchor="middle">Runtime</text>
    <rect x="0" y="90" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="115" class="text" text-anchor="middle">OS</text>
    <rect x="0" y="135" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="160" class="text" text-anchor="middle">Hyperv</text>
    <rect x="0" y="180" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="205" class="text" text-anchor="middle">Hardware</text>
  </g>

  <!-- Container -->
  <g transform="translate(250, 100)">
    <text x="40" y="-10" class="label" text-anchor="middle">Container</text>
    <rect x="0" y="0" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="25" class="text" text-anchor="middle">App</text>
    <rect x="0" y="45" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="70" class="text" text-anchor="middle">Runtime</text>
    <rect x="0" y="90" width="80" height="40" class="cloud" rx="4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="115" class="text" text-anchor="middle">OS</text>
    <rect x="0" y="135" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="160" class="text" text-anchor="middle">Hyperv</text>
    <rect x="0" y="180" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="205" class="text" text-anchor="middle">Hardware</text>
  </g>

  <!-- Serverless -->
  <g transform="translate(400, 100)">
    <text x="40" y="-10" class="label" text-anchor="middle">Serverless</text>
    <rect x="0" y="0" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="25" class="text" text-anchor="middle">App</text>
    <rect x="0" y="45" width="80" height="40" class="cloud" rx="4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="70" class="text" text-anchor="middle">Runtime</text>
    <rect x="0" y="90" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="115" class="text" text-anchor="middle">OS</text>
    <rect x="0" y="135" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="160" class="text" text-anchor="middle">Hyperv</text>
    <rect x="0" y="180" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="205" class="text" text-anchor="middle">Hardware</text>
  </g>

  <!-- Edge -->
  <g transform="translate(550, 100)">
    <text x="40" y="-10" class="label" text-anchor="middle">Edge</text>
    <rect x="0" y="0" width="80" height="40" class="user" rx="4"/>
    <text x="40" y="25" class="text" text-anchor="middle">App</text>
    <rect x="0" y="45" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="70" class="text" text-anchor="middle">V8 Isol</text>
    <rect x="0" y="90" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="115" class="text" text-anchor="middle">OS</text>
    <rect x="0" y="135" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="160" class="text" text-anchor="middle">Host</text>
    <rect x="0" y="180" width="80" height="40" class="cloud" rx="4"/>
    <text x="40" y="205" class="text" text-anchor="middle">Hardware</text>
  </g>

  <rect x="680" y="100" width="20" height="20" class="user" rx="2"/>
  <text x="710" y="115" class="label" font-size="12">User</text>
  <rect x="680" y="130" width="20" height="20" class="cloud" rx="2"/>
  <text x="710" y="145" class="label" font-size="12">Cloud</text>
</svg>
