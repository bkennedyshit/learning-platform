<svg viewBox="0 0 650 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:650px;height:auto;">
  <defs>
    <marker id="hrv-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .hrv-axis{stroke:var(--text-normal, #c9d1d9);stroke-width:1.5;fill:none}
    .hrv-rr{stroke:var(--interactive-accent, #58a6ff);stroke-width:2.5;fill:none;transition:stroke-width 0.2s;stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawChart 4s ease-out forwards, rrGlow 2s ease-in-out infinite alternate}
    .hrv-rr:hover{stroke-width:4;filter:drop-shadow(0 0 5px var(--interactive-accent, #58a6ff));animation-play-state:paused}
    .hrv-lf{fill:#ff6b6b;opacity:0.35;transform-origin: 210px 380px;animation:spectralBreathe 3s ease-in-out infinite alternate}
    .hrv-hf{fill:#4dabf7;opacity:0.35;transform-origin: 400px 380px;animation:spectralBreathe2 3.5s ease-in-out infinite alternate}
    .hrv-lbl{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:var(--text-normal, #c9d1d9)}
    .hrv-acc{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--interactive-accent, #58a6ff);font-weight:bold}
    .hrv-beat{fill:var(--text-accent, #79c0ff);stroke:var(--text-normal, #c9d1d9);stroke-width:1;cursor:pointer;transition:r 0.2s;animation:beatBlink 1.5s ease-in-out infinite alternate}
    .hrv-beat:hover{r:6;fill:var(--interactive-accent, #58a6ff);animation-play-state:paused}

    @keyframes drawChart {
      to { stroke-dashoffset: 0; }
    }
    @keyframes rrGlow {
      0% { filter: drop-shadow(0 0 1px var(--interactive-accent, #58a6ff)); }
      100% { filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    }
    @keyframes beatBlink {
      0% { r: 2.5; opacity: 0.5; }
      100% { r: 4.5; opacity: 1; filter: drop-shadow(0 0 3px var(--text-accent, #79c0ff)); }
    }
    @keyframes spectralBreathe {
      0% { transform: scaleY(0.90); opacity: 0.3; }
      100% { transform: scaleY(1.08); opacity: 0.45; filter: drop-shadow(0 0 4px rgba(255, 107, 107, 0.4)); }
    }
    @keyframes spectralBreathe2 {
      0% { transform: scaleY(0.93); opacity: 0.3; }
      100% { transform: scaleY(1.07); opacity: 0.45; filter: drop-shadow(0 0 4px rgba(77, 171, 247, 0.4)); }
    }
  </style>
  <!-- Top panel: R-R interval tachogram -->
  <text x="20" y="20" class="hrv-acc">R-R Interval Tachogram (33 BPM athlete)</text>
  <!-- Axes -->
  <line x1="50" y1="170" x2="620" y2="170" class="hrv-axis" marker-end="url(#hrv-arr)" style="color:var(--text-normal, #c9d1d9)"/>
  <line x1="50" y1="170" x2="50" y2="30" class="hrv-axis" marker-end="url(#hrv-arr)" style="color:var(--text-normal, #c9d1d9)"/>
  <text x="630" y="175" class="hrv-lbl">Beat #</text>
  <text x="15" y="30" class="hrv-lbl">RR (ms)</text>
  <!-- RR values oscillating around 1818ms (33 BPM) with high variability -->
  <polyline points="70,80 100,60 130,95 160,55 190,85 220,50 250,90 280,65 310,100 340,70 370,85 400,55 430,75 460,60 490,90 520,70 550,80 580,65" class="hrv-rr"/>
  <!-- Beat markers -->
  <circle cx="70" cy="80" r="3" class="hrv-beat" style="animation-delay: 0.1s;"/>
  <circle cx="100" cy="60" r="3" class="hrv-beat" style="animation-delay: 0.3s;"/>
  <circle cx="130" cy="95" r="3" class="hrv-beat" style="animation-delay: 0.5s;"/>
  <circle cx="160" cy="55" r="3" class="hrv-beat" style="animation-delay: 0.7s;"/>
  <circle cx="190" cy="85" r="3" class="hrv-beat" style="animation-delay: 0.9s;"/>
  <circle cx="220" cy="50" r="3" class="hrv-beat" style="animation-delay: 1.1s;"/>
  <circle cx="250" cy="90" r="3" class="hrv-beat" style="animation-delay: 1.3s;"/>
  <circle cx="280" cy="65" r="3" class="hrv-beat" style="animation-delay: 1.5s;"/>
  <circle cx="310" cy="100" r="3" class="hrv-beat" style="animation-delay: 1.7s;"/>
  <circle cx="340" cy="70" r="3" class="hrv-beat" style="animation-delay: 1.9s;"/>
  <circle cx="370" cy="85" r="3" class="hrv-beat" style="animation-delay: 2.1s;"/>
  <circle cx="400" cy="55" r="3" class="hrv-beat" style="animation-delay: 2.3s;"/>
  <circle cx="430" cy="75" r="3" class="hrv-beat" style="animation-delay: 2.5s;"/>
  <circle cx="460" cy="60" r="3" class="hrv-beat" style="animation-delay: 2.7s;"/>
  <circle cx="490" cy="90" r="3" class="hrv-beat" style="animation-delay: 2.9s;"/>
  <circle cx="520" cy="70" r="3" class="hrv-beat" style="animation-delay: 3.1s;"/>
  <circle cx="550" cy="80" r="3" class="hrv-beat" style="animation-delay: 3.3s;"/>
  <circle cx="580" cy="65" r="3" class="hrv-beat" style="animation-delay: 3.5s;"/>
  <!-- Y-axis labels -->
  <text x="25" y="55" class="hrv-lbl">2000</text>
  <text x="25" y="100" class="hrv-lbl">1818</text>
  <text x="25" y="145" class="hrv-lbl">1600</text>
  <!-- Bottom panel: Power Spectral Density -->
  <text x="20" y="215" class="hrv-acc">Power Spectral Density</text>
  <line x1="50" y1="380" x2="620" y2="380" class="hrv-axis" marker-end="url(#hrv-arr)" style="color:var(--text-normal, #c9d1d9)"/>
  <line x1="50" y1="380" x2="50" y2="230" class="hrv-axis" marker-end="url(#hrv-arr)" style="color:var(--text-normal, #c9d1d9)"/>
  <text x="630" y="385" class="hrv-lbl">Hz</text>
  <text x="15" y="230" class="hrv-lbl">PSD</text>
  <!-- LF band (0.04-0.15 Hz) -->
  <path d="M120 380 Q150 340 180 320 Q210 300 240 330 Q270 360 300 380 Z" class="hrv-lf"/>
  <text x="180" y="310" class="hrv-lbl" fill="#ff6b6b" font-weight="bold">LF</text>
  <text x="160" y="395" class="hrv-lbl">0.04-0.15 Hz</text>
  <!-- HF band (0.15-0.4 Hz) -->
  <path d="M300 380 Q350 280 400 250 Q450 270 500 320 Q530 360 560 380 Z" class="hrv-hf"/>
  <text x="400" y="260" class="hrv-lbl" fill="#4dabf7" font-weight="bold">HF (vagal)</text>
  <text x="380" y="395" class="hrv-lbl">0.15-0.4 Hz</text>
  <!-- Annotation -->
  <text x="400" y="245" class="hrv-lbl">← Dominant in 33 BPM athlete</text>
</svg>