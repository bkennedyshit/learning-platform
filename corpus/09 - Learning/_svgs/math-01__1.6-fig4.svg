<svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <defs>
    <marker id="cf-arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <style>
    .cf-axis   { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.4; fill: none; }
    .cf-level  { stroke: var(--text-muted, #8b949e); stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
    .cf-grad   { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.6; fill: none;
                 marker-end: url(#cf-arr); }
    .cf-label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-muted, #8b949e); }
    .cf-title  { font-family: Inter, system-ui, sans-serif; font-size: 13px;
                 fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .cf-perp   { stroke: var(--text-accent, #79c0ff); stroke-width: 1; stroke-dasharray: 2 2; fill: none; }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Axes -->
  <line x1="30" y1="260" x2="490" y2="260" class="cf-axis"/>
  <line x1="260" y1="490" x2="260" y2="30" class="cf-axis"/>
  <text x="494" y="264" style="font-size:13px;fill:var(--text-normal, #c9d1d9);">x</text>
  <text x="252" y="28"  style="font-size:13px;fill:var(--text-normal, #c9d1d9);">y</text>
  <!-- Level curves xy = c for c = 1, 2, 3 (first quadrant hyperbolas) -->
  <!-- xy=1: y=1/x, x from 35 to 480, centered at (260,260) with scale 70px per unit -->
  <path d="M 295 470 Q 300 400, 330 330 Q 360 295, 470 295" class="cf-level"/>
  <text x="474" y="293" class="cf-label">xy=1</text>
  <path d="M 295 400 Q 310 340, 350 310 Q 380 294, 440 292" class="cf-level"/>
  <text x="442" y="290" class="cf-label">xy=2</text>
  <path d="M 295 350 Q 315 320, 355 303 Q 385 291, 420 288" class="cf-level"/>
  <text x="422" y="287" class="cf-label">xy=3</text>
  <!-- Level curves in third quadrant xy=1,2,3 (negative x,y) -->
  <path d="M 225 50  Q 220 120, 190 190 Q 160 225, 50 225"  class="cf-level"/>
  <path d="M 225 120 Q 210 180, 170 210 Q 140 226, 80 228"  class="cf-level"/>
  <!-- Gradient arrows ∇f = ⟨y,x⟩ at a few points in Q1 -->
  <!-- At (1,1)=(330,190): grad=(1,1) → direction upper-right -->
  <line x1="330" y1="190" x2="358" y2="162" class="cf-grad"/>
  <!-- At (1,2)=(330,120): grad=(2,1) → more right than up -->
  <line x1="330" y1="120" x2="366" y2="106" class="cf-grad"/>
  <!-- At (2,1)=(400,190): grad=(1,2) → more up than right -->
  <line x1="400" y1="190" x2="414" y2="154" class="cf-grad"/>
  <!-- At (2,2)=(400,120): grad=(2,2) → upper-right -->
  <line x1="400" y1="120" x2="428" y2="92"  class="cf-grad"/>
  <!-- At (0.5,2)=(295,120): grad=(2,0.5) → mostly right -->
  <line x1="295" y1="120" x2="331" y2="113" class="cf-grad"/>
  <!-- Label -->
  <text x="260" y="506" class="cf-title" text-anchor="middle">f(x,y) = xy — level curves xy = c, gradient ⊥ contours</text>
</svg>