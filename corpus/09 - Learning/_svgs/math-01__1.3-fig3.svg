<svg viewBox="0 0 580 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 580px; height: auto;">
  <style>
    .axis  { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.4; fill: none; }
    .curve { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.6; fill: none; }
    .shad  { fill: var(--interactive-accent, #58a6ff); opacity: 0.20; }
    .arr   { stroke: var(--text-accent, #79c0ff); stroke-width: 2; fill: none; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .math  { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>

  <!-- Left panel: x-domain -->
  <text x="130" y="18" class="label" text-anchor="middle" font-weight="bold">x-domain</text>
  <line x1="20" y1="140" x2="250" y2="140" class="axis"/>
  <line x1="40" y1="160" x2="40"  y2="30"  class="axis"/>
  <path class="shad" d="M 60 140 C 80 90, 140 60, 200 80 L 200 140 Z"/>
  <path class="curve" d="M 40 150 C 60 100, 120 60, 220 120"/>
  <text x="60"  y="155" class="math">a</text>
  <text x="195" y="155" class="math">b</text>
  <text x="100" y="100" class="math" fill="var(--interactive-accent, #58a6ff)">∫f(φ(x))φ′(x)dx</text>

  <!-- Arrow -->
  <path d="M 260 90 Q 290 70, 320 90" class="arr" marker-end="url(#ftc-arrow)"/>
  <defs>
    <marker id="ftc-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
  </defs>
  <text x="285" y="65" class="label" text-anchor="middle">u = φ(x)</text>

  <!-- Right panel: u-domain -->
  <text x="460" y="18" class="label" text-anchor="middle" font-weight="bold">u-domain</text>
  <line x1="330" y1="140" x2="560" y2="140" class="axis"/>
  <line x1="350" y1="160" x2="350" y2="30"  class="axis"/>
  <path class="shad" d="M 370 140 C 400 90, 460 60, 510 80 L 510 140 Z"/>
  <path class="curve" d="M 350 150 C 380 80, 460 60, 540 100"/>
  <text x="368" y="155" class="math">φ(a)</text>
  <text x="500" y="155" class="math">φ(b)</text>
  <text x="400" y="100" class="math" fill="var(--interactive-accent, #58a6ff)">∫f(u)du</text>
</svg>