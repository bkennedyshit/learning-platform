<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <defs>
    <marker id="arrow-net" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; }
    .client-box { fill: var(--background-secondary, #161b22); stroke: #4CAF50; stroke-width: 2; rx: 6; }
    .server-box { fill: var(--background-secondary, #161b22); stroke: #FF9800; stroke-width: 2; rx: 6; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .client-label { fill: #4CAF50; }
    .server-label { fill: #FF9800; }
    .send-arrow { stroke: #4CAF50; stroke-width: 1.5; fill: none; marker-end: url(#arrow-net); }
    .recv-arrow { stroke: #FF9800; stroke-width: 1.5; fill: none; marker-end: url(#arrow-net); }
    .timeline { stroke: var(--text-muted, #8b949e); stroke-width: 2; }
    .tick { stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .note { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .predict { fill: var(--background-secondary, #161b22); stroke: #4CAF50; stroke-width: 1.5; rx: 3; }
    .confirm { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 3; }
  </style>

  <text x="350" y="22" class="title">Client Prediction &amp; Server Reconciliation</text>

  <!-- Client timeline -->
  <text x="60" y="55" class="section-label client-label">client</text>
  <line x1="100" y1="70" x2="680" y2="70" class="timeline"/>

  <!-- Server timeline -->
  <text x="60" y="185" class="section-label server-label">server</text>
  <line x1="100" y1="200" x2="680" y2="200" class="timeline"/>

  <!-- Tick marks -->
  <line x1="150" y1="65" x2="150" y2="75" class="tick"/>
  <text x="150" y="60" class="note">t=0</text>
  <line x1="270" y1="65" x2="270" y2="75" class="tick"/>
  <text x="270" y="60" class="note">t=1</text>
  <line x1="390" y1="65" x2="390" y2="75" class="tick"/>
  <text x="390" y="60" class="note">t=2</text>
  <line x1="510" y1="65" x2="510" y2="75" class="tick"/>
  <text x="510" y="60" class="note">t=3</text>
  <line x1="630" y1="65" x2="630" y2="75" class="tick"/>
  <text x="630" y="60" class="note">t=4</text>

  <!-- Client predictions -->
  <rect x="135" y="78" width="70" height="20" class="predict"/>
  <text x="170" y="92" class="label">Predict #1</text>

  <rect x="255" y="78" width="70" height="20" class="predict"/>
  <text x="290" y="92" class="label">Predict #2</text>

  <rect x="375" y="78" width="70" height="20" class="predict"/>
  <text x="410" y="92" class="label">Predict #3</text>

  <!-- Input sent to server (diagonal arrows) -->
  <path d="M 170 98 L 230 195" class="send-arrow"/>
  <text x="185" y="145" class="note">Input #1</text>

  <path d="M 290 98 L 350 195" class="send-arrow"/>
  <text x="305" y="145" class="note">Input #2</text>

  <path d="M 410 98 L 470 195" class="send-arrow"/>

  <!-- Server processes -->
  <rect x="220" y="205" width="80" height="20" class="server-box"/>
  <text x="260" y="219" class="label">Simulate #1</text>

  <rect x="340" y="205" width="80" height="20" class="server-box"/>
  <text x="380" y="219" class="label">Simulate #2</text>

  <rect x="460" y="205" width="80" height="20" class="server-box"/>
  <text x="500" y="219" class="label">Simulate #3</text>

  <!-- Server confirms back -->
  <path d="M 300 205 L 450 78" class="recv-arrow"/>
  <text x="395" y="140" class="note">Confirm #1</text>

  <!-- Reconciliation -->
  <rect x="440" y="78" width="90" height="20" class="confirm"/>
  <text x="485" y="92" class="label">Reconcile ✓</text>
  <text x="485" y="112" class="note">Server agrees with</text>
  <text x="485" y="122" class="note">prediction → no correction</text>

  <!-- Mismatch scenario -->
  <rect x="100" y="260" width="580" height="100" class="box"/>
  <text x="390" y="280" class="label">When Prediction is WRONG (mismatch)</text>

  <text x="120" y="300" class="note">1. Server sends confirmed position (differs from client's prediction)</text>
  <text x="120" y="316" class="note">2. Client SNAPS to server position</text>
  <text x="120" y="332" class="note">3. Client RE-APPLIES all unconfirmed inputs on top of server state</text>
  <text x="120" y="348" class="note">4. Result: smooth correction without losing responsiveness</text>
</svg>
