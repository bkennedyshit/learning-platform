<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .text { font-family: sans-serif; font-size: 14px; fill: #333; }
      .bold { font-weight: bold; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .key { font-size: 24px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c757d" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Alice -->
  <rect x="50" y="100" width="120" height="150" class="box" />
  <text x="110" y="130" text-anchor="middle" class="text bold">Alice (Sender)</text>
  
  <!-- Bob -->
  <rect x="630" y="100" width="120" height="150" class="box" />
  <text x="690" y="130" text-anchor="middle" class="text bold">Bob (Receiver)</text>
  
  <!-- Bob's Keys -->
  <text x="690" y="170" text-anchor="middle" class="key">🟢🔑</text>
  <text x="690" y="190" text-anchor="middle" class="text" font-size="12px">Public Key</text>
  
  <text x="690" y="220" text-anchor="middle" class="key">🔴🗝️</text>
  <text x="690" y="240" text-anchor="middle" class="text" font-size="12px">Private Key</text>
  
  <!-- Public Key transfer -->
  <path d="M 620 160 L 180 160" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)" />
  <text x="400" y="150" text-anchor="middle" class="text">1. Sends Public Key</text>
  
  <g id="pub-key-anim">
    <text x="600" y="165" class="key">🟢🔑</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-440 0" begin="0s" dur="3s" repeatCount="indefinite" />
  </g>
  
  <!-- Encrypt and send -->
  <path d="M 180 220 L 620 220" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="210" text-anchor="middle" class="text">2. Encrypts with 🟢🔑 &amp; Sends Ciphertext</text>
  
  <g id="msg-anim">
    <rect x="180" y="210" width="30" height="20" fill="#ffc107" rx="3" />
    <text x="195" y="225" text-anchor="middle" class="text" font-size="10px">🔒</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="440 0" begin="1.5s" dur="3s" repeatCount="indefinite" />
  </g>
  
</svg>
