<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <style>
      .text { font-family: sans-serif; font-size: 14px; fill: #ccc; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #fff; }
      .neuron-body { fill: #4dabf7; stroke: #228be6; stroke-width: 2; }
      .dendrite { stroke: #4dabf7; stroke-width: 3; fill: none; stroke-linecap: round; }
      .axon { stroke: #4dabf7; stroke-width: 4; fill: none; }
      .myelin { fill: #fcc419; stroke: #e67700; stroke-width: 1; rx: 5; }
      .synapse { fill: #ff6b6b; }
      
      .ai-node { fill: #20c997; stroke: #0ca678; stroke-width: 2; }
      .ai-conn { stroke: #666; stroke-width: 2; }
      .ai-weight { font-family: sans-serif; font-size: 12px; fill: #ffcc00; font-style: italic; }
    </style>
  </defs>
  <rect width="640" height="400" fill="#1e1e1e" rx="10"/>
  
  <!-- Divider -->
  <line x1="320" y1="50" x2="320" y2="380" stroke="#444" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="160" y="30" text-anchor="middle" class="title">Biological Neuron</text>
  <text x="480" y="30" text-anchor="middle" class="title">Artificial Neuron</text>

  <!-- Biological Neuron -->
  <g transform="translate(160, 200)">
    <!-- Dendrites -->
    <path class="dendrite" d="M 0 0 Q -40 -40, -80 -30"/>
    <path class="dendrite" d="M -20 -20 Q -50 -80, -30 -100"/>
    <path class="dendrite" d="M 0 0 Q -50 20, -70 60"/>
    <path class="dendrite" d="M 0 0 Q 10 -50, 40 -80"/>
    <path class="dendrite" d="M 0 0 Q 30 50, 60 90"/>
    
    <!-- Synapses -->
    <circle cx="-80" cy="-30" r="4" class="synapse"/>
    <circle cx="-30" cy="-100" r="4" class="synapse"/>
    <circle cx="-70" cy="60" r="4" class="synapse"/>
    <circle cx="40" cy="-80" r="4" class="synapse"/>
    <circle cx="60" cy="90" r="4" class="synapse"/>
    
    <!-- Axon -->
    <path class="axon" d="M 0 0 Q 0 40, 0 160"/>
    
    <!-- Myelin Sheaths -->
    <rect x="-8" y="40" width="16" height="30" class="myelin"/>
    <rect x="-8" y="80" width="16" height="30" class="myelin"/>
    <rect x="-8" y="120" width="16" height="30" class="myelin"/>
    
    <!-- Soma -->
    <circle cx="0" cy="0" r="25" class="neuron-body"/>
    <circle cx="0" cy="0" r="8" fill="#1864ab"/> <!-- Nucleus -->

    <!-- Signal animation -->
    <circle r="3" fill="#ffeb3b">
      <animateMotion dur="2s" repeatCount="indefinite" path="M -80 -30 Q -40 -40, 0 0"/>
    </circle>
    <circle r="3" fill="#ffeb3b">
      <animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M -30 -100 Q -50 -80, 0 0"/>
    </circle>
    <!-- Action Potential moving down axon -->
    <circle r="4" fill="#ffeb3b">
      <animateMotion dur="1s" begin="1.5s" repeatCount="indefinite" path="M 0 25 Q 0 40, 0 160"/>
    </circle>
  </g>

  <!-- Artificial Neuron -->
  <g transform="translate(480, 200)">
    <!-- Inputs -->
    <circle cx="-90" cy="-60" r="15" class="ai-node"/>
    <text x="-90" y="-55" text-anchor="middle" fill="#fff">x₁</text>
    
    <circle cx="-90" cy="0" r="15" class="ai-node"/>
    <text x="-90" y="5" text-anchor="middle" fill="#fff">x₂</text>
    
    <circle cx="-90" cy="60" r="15" class="ai-node"/>
    <text x="-90" y="65" text-anchor="middle" fill="#fff">x₃</text>
    
    <!-- Connections -->
    <line x1="-75" y1="-60" x2="-20" y2="-10" class="ai-conn"/>
    <line x1="-75" y1="0" x2="-25" y2="0" class="ai-conn"/>
    <line x1="-75" y1="60" x2="-20" y2="10" class="ai-conn"/>
    
    <!-- Weights -->
    <text x="-50" y="-45" class="ai-weight">w₁</text>
    <text x="-50" y="-5" class="ai-weight">w₂</text>
    <text x="-50" y="45" class="ai-weight">w₃</text>
    
    <!-- Main Node (Summation and Activation) -->
    <rect x="-25" y="-30" width="60" height="60" class="ai-node" rx="5"/>
    <line x1="5" y1="-30" x2="5" y2="30" stroke="#0ca678" stroke-width="2"/>
    <text x="-10" y="5" text-anchor="middle" fill="#fff">Σ</text>
    <text x="20" y="5" text-anchor="middle" fill="#fff" font-size="16">σ</text>
    <path d="M 12 10 Q 20 10, 20 0 T 28 -10" stroke="#fff" fill="none" stroke-width="1.5"/>
    
    <!-- Output -->
    <line x1="35" y1="0" x2="90" y2="0" class="ai-conn"/>
    <circle cx="90" cy="0" r="3" fill="#20c997"/>
    <text x="75" y="-10" text-anchor="middle" fill="#ccc">y</text>

    <!-- Signal animation -->
    <circle r="3" fill="#ffeb3b">
      <animateMotion dur="2s" repeatCount="indefinite" path="M -75 -60 L -25 -10"/>
    </circle>
    <circle r="3" fill="#ffeb3b">
      <animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M -75 0 L -25 0"/>
    </circle>
    <circle r="3" fill="#ffeb3b">
      <animateMotion dur="1s" begin="1.5s" repeatCount="indefinite" path="M 35 0 L 90 0"/>
    </circle>
  </g>
</svg>
