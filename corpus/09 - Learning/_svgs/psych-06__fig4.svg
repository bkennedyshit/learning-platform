<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <rect width="800" height="550" fill="#181825" rx="15" />
  <text x="400" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Reinforcement Learning from Human Feedback (RLHF)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cba6f7" />
    </marker>
  </defs>

  <!-- Pre-trained Model -->
  <rect x="100" y="100" width="160" height="80" fill="#45475a" rx="8" />
  <text x="180" y="135" font-family="sans-serif" font-size="16" font-weight="bold" fill="#bac2de" text-anchor="middle">Reference</text>
  <text x="180" y="155" font-family="sans-serif" font-size="14" fill="#a6adc8" text-anchor="middle">Model</text>

  <!-- Actor Model (Policy) -->
  <rect x="100" y="250" width="160" height="80" fill="#89b4fa" rx="8" />
  <text x="180" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#11111b" text-anchor="middle">Policy Model</text>
  <text x="180" y="305" font-family="sans-serif" font-size="14" fill="#11111b" text-anchor="middle">(Actor)</text>

  <!-- Reward Model -->
  <rect x="540" y="250" width="160" height="80" fill="#f9e2af" rx="8" />
  <text x="620" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#11111b" text-anchor="middle">Reward Model</text>
  <text x="620" y="305" font-family="sans-serif" font-size="14" fill="#11111b" text-anchor="middle">(Critic)</text>

  <!-- KL Divergence -->
  <rect x="100" y="400" width="160" height="60" fill="#f38ba8" rx="8" />
  <text x="180" y="435" font-family="sans-serif" font-size="16" font-weight="bold" fill="#11111b" text-anchor="middle">KL Penalty</text>
  
  <!-- Prompt input -->
  <text x="40" y="295" font-family="sans-serif" font-size="14" fill="#a6adc8" text-anchor="end">Prompt</text>
  <path d="M 50 290 L 90 290" fill="none" stroke="#cba6f7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 50 290 L 50 140 L 90 140" fill="none" stroke="#cba6f7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Output Generation -->
  <path id="genPath" d="M 260 290 L 530 290" fill="none" stroke="#cba6f7" stroke-width="3" marker-end="url(#arrow)" />
  <text x="395" y="280" font-family="sans-serif" font-size="14" fill="#cba6f7" text-anchor="middle">Response (y)</text>

  <circle r="5" fill="#cba6f7">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 260 290 L 530 290" />
  </circle>

  <!-- Reward Output -->
  <path id="rewardPath" d="M 620 330 L 620 430 L 270 430" fill="none" stroke="#a6e3a1" stroke-width="3" marker-end="url(#arrow)" />
  <text x="450" y="420" font-family="sans-serif" font-size="14" fill="#a6e3a1" text-anchor="middle">Scalar Reward (r)</text>
  
  <circle r="5" fill="#a6e3a1">
    <animateMotion dur="3s" repeatCount="indefinite" begin="2s" path="M 620 330 L 620 430 L 270 430" />
  </circle>

  <!-- KL Paths -->
  <path d="M 180 180 L 180 250" fill="none" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 180 330 L 180 400" fill="none" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- PPO Update -->
  <path d="M 100 430 L 70 430 L 70 270 L 90 270" fill="none" stroke="#94e2d5" stroke-width="3" marker-end="url(#arrow)" />
  <text x="60" y="360" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94e2d5" text-anchor="end" transform="rotate(-90 50 360)">PPO Update</text>
  
</svg>
