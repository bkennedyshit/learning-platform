<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .math   { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: var(--interactive-accent, #58a6ff); }
    .box    { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .panel  { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.3; }
    .melbar { fill: var(--interactive-accent, #58a6ff); opacity: 0.7; }
    .logbar { fill: #51cf66; opacity: 0.7; }
    .axis   { stroke: var(--text-muted, #8b949e); stroke-width: 1; fill: none; }
    .arr    { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .chain  { fill: var(--background-secondary, #161b22); stroke: #ffd93d; stroke-width: 1.3; }
    .arrow  { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">Audio Signal Processing &amp; Psychoacoustics — MFCC Pipeline</text>

  <!-- ===== TOP: MFCC pipeline chain ===== -->
  <text x="360" y="44" class="label" text-anchor="middle" font-weight="bold">MFCC Feature Extraction Chain (speech → AI features)</text>

  <rect x="16"  y="54" width="84" height="38" rx="4" class="chain"/>
  <text x="58"  y="70" class="small" text-anchor="middle">Audio</text>
  <text x="58"  y="84" class="small" text-anchor="middle">x[n]</text>

  <rect x="118" y="54" width="84" height="38" rx="4" class="chain"/>
  <text x="160" y="70" class="small" text-anchor="middle">Pre-emphasis</text>
  <text x="160" y="84" class="small" text-anchor="middle">y[n]=x[n]−αx[n-1]</text>

  <rect x="220" y="54" width="84" height="38" rx="4" class="chain"/>
  <text x="262" y="70" class="small" text-anchor="middle">Frame &amp; Window</text>
  <text x="262" y="84" class="small" text-anchor="middle">Hann 25ms/10ms</text>

  <rect x="322" y="54" width="84" height="38" rx="4" class="chain"/>
  <text x="364" y="70" class="small" text-anchor="middle">FFT</text>
  <text x="364" y="84" class="small" text-anchor="middle">N=512/1024</text>

  <rect x="424" y="54" width="84" height="38" rx="4" class="chain"/>
  <text x="466" y="70" class="small" text-anchor="middle">Mel Filterbank</text>
  <text x="466" y="84" class="small" text-anchor="middle">M=40 filters</text>

  <rect x="526" y="54" width="84" height="38" rx="4" class="chain"/>
  <text x="568" y="70" class="small" text-anchor="middle">log(power)</text>
  <text x="568" y="84" class="small" text-anchor="middle">perceptual scale</text>

  <rect x="628" y="54" width="76" height="38" rx="4" class="chain"/>
  <text x="666" y="70" class="small" text-anchor="middle">DCT</text>
  <text x="666" y="84" class="small" text-anchor="middle">→ 13 MFCCs</text>

  <!-- Arrows -->
  <line x1="100" y1="73" x2="118" y2="73" class="arrow" marker-end="url(#a5)"/>
  <line x1="202" y1="73" x2="220" y2="73" class="arrow" marker-end="url(#a5)"/>
  <line x1="304" y1="73" x2="322" y2="73" class="arrow" marker-end="url(#a5)"/>
  <line x1="406" y1="73" x2="424" y2="73" class="arrow" marker-end="url(#a5)"/>
  <line x1="508" y1="73" x2="526" y2="73" class="arrow" marker-end="url(#a5)"/>
  <line x1="610" y1="73" x2="628" y2="73" class="arrow" marker-end="url(#a5)"/>

  <!-- ===== BOTTOM LEFT: Mel scale vs Linear ===== -->
  <rect x="16" y="108" width="330" height="294" rx="4" class="box"/>
  <text x="181" y="126" class="label" text-anchor="middle" font-weight="bold">Mel Scale vs Linear Frequency</text>
  <text x="181" y="140" class="small" text-anchor="middle">m = 2595·log₁₀(1 + f/700)  →  compressed at high freqs</text>

  <!-- Chart axes -->
  <line x1="50" y1="375" x2="320" y2="375" class="axis" marker-end="url(#a5)"/>
  <line x1="50" y1="375" x2="50"  y2="158" class="axis" marker-end="url(#a5)"/>
  <text x="325" y="379" class="small">f (Hz)</text>
  <text x="30"  y="155" class="small">Mels</text>

  <!-- Frequency labels -->
  <text x="80"  y="390" class="small" text-anchor="middle">100</text>
  <text x="110" y="390" class="small" text-anchor="middle">500</text>
  <text x="148" y="390" class="small" text-anchor="middle">1k</text>
  <text x="198" y="390" class="small" text-anchor="middle">2k</text>
  <text x="248" y="390" class="small" text-anchor="middle">4k</text>
  <text x="300" y="390" class="small" text-anchor="middle">8k</text>

  <!-- Mel filters (overlapping triangular) in mel scale -->
  <!-- Low-freq filters (wider in linear, closer together) -->
  <polygon points="50,375 60,310 80,375"  class="melbar"/>
  <polygon points="60,375 80,310 110,375" class="melbar"/>
  <polygon points="80,375 110,310 148,375" class="melbar"/>
  <polygon points="110,375 148,300 198,375" class="melbar"/>
  <polygon points="148,375 198,290 248,375" class="melbar" opacity="0.5"/>
  <polygon points="198,375 248,280 300,375" class="melbar" opacity="0.4"/>
  <polygon points="248,375 300,270 320,375" class="melbar" opacity="0.3"/>

  <!-- Linear scale line for comparison -->
  <path d="M 50 375 L 320 200" stroke="#ff6b6b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="310" y="195" class="small" fill="#ff6b6b">Linear</text>
  <!-- Mel curve -->
  <path d="M 50 375 C 80 320, 130 280, 200 250 C 250 228, 290 220, 320 215" stroke="var(--interactive-accent,#58a6ff)" stroke-width="2" fill="none"/>
  <text x="322" y="212" class="small" fill="var(--interactive-accent,#58a6ff)">Mel</text>

  <text x="181" y="410" class="small" text-anchor="middle">Filters dense at low freq → matches ear's resolution</text>

  <!-- ===== BOTTOM RIGHT: Psychoacoustics table ===== -->
  <rect x="360" y="108" width="344" height="294" rx="4" class="panel"/>
  <text x="532" y="126" class="label" text-anchor="middle" font-weight="bold">Psychoacoustic Principles</text>

  <text x="372" y="148" class="small" font-weight="bold">Hearing Range &amp; Perception:</text>
  <text x="372" y="164" class="small">• Human hearing: 20 Hz – 20 kHz</text>
  <text x="372" y="178" class="small">• Best sensitivity: 2–5 kHz (speech intelligibility)</text>
  <text x="372" y="192" class="small">• Loudness: dB SPL (log scale, 0=threshold)</text>
  <text x="372" y="206" class="small">• Pitch: perceived as Mels / Bark / ERB scale</text>

  <text x="372" y="224" class="small" font-weight="bold">Critical Bands (Bark scale):</text>
  <text x="372" y="240" class="small">• ~24 bands up to 20 kHz</text>
  <text x="372" y="254" class="small">• Simultaneous masking: loud tone hides nearby tones</text>
  <text x="372" y="268" class="small">• Temporal masking: 200 ms pre/post loud sound</text>
  <text x="372" y="282" class="small">• MP3/AAC exploit masking → discard masked audio</text>

  <text x="372" y="300" class="small" font-weight="bold">Log-Mel Spectrogram (for Whisper/XTTS):</text>
  <text x="372" y="316" class="math">S_mel = log(Mel_filterbank · |FFT|²)</text>
  <text x="372" y="332" class="small">• Frame: 25 ms window, 10 ms hop</text>
  <text x="372" y="346" class="small">• 80 mel bins (Whisper default)</text>
  <text x="372" y="360" class="small">• Input: (batch, 80, T) mel tensor</text>
  <text x="372" y="374" class="small">• Librosa: librosa.feature.melspectrogram()</text>
  <text x="372" y="388" class="small">• log base-10 or log base-e (check your model!)</text>
  <text x="372" y="400" class="small">• MFCC ≈ DCT compression of log-mel (13–40 coeff.)</text>
</svg>
