<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .sm-box { fill: var(--interactive-accent, #58a6ff); opacity: 0.12; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; rx: 3; transition: all 0.2s; cursor: pointer; }
    .sm-box:hover { opacity: 0.3; filter: drop-shadow(0 0 3px var(--interactive-accent, #58a6ff)); }
    .mem-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 5; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .detail { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .section { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .bus { stroke: var(--text-muted, #8b949e); stroke-width: 2; stroke-dasharray: 4,2; }
  </style>

  <text x="350" y="20" class="title">GPU Architecture — NVIDIA CUDA Execution Model</text>

  <!-- GPU chip outline -->
  <rect x="30" y="35" width="400" height="250" rx="10" fill="none" stroke="var(--text-normal, #c9d1d9)" stroke-width="2"/>
  <text x="230" y="55" class="section">GPU (e.g., RTX 4090: 128 SMs, 16384 CUDA cores)</text>

  <!-- Streaming Multiprocessors grid -->
  <text x="80" y="80" class="detail">SM 0</text>
  <rect x="50" y="85" width="55" height="40" class="sm-box"/>
  <text x="77" y="100" class="detail">128 cores</text>
  <text x="77" y="115" class="detail">64KB L1</text>

  <rect x="115" y="85" width="55" height="40" class="sm-box"/>
  <text x="142" y="100" class="detail">128 cores</text>
  <rect x="180" y="85" width="55" height="40" class="sm-box"/>
  <rect x="245" y="85" width="55" height="40" class="sm-box"/>
  <rect x="310" y="85" width="55" height="40" class="sm-box"/>
  <rect x="375" y="85" width="40" height="40" class="sm-box"/>
  <text x="395" y="108" class="detail">...</text>

  <rect x="50" y="135" width="55" height="40" class="sm-box"/>
  <rect x="115" y="135" width="55" height="40" class="sm-box"/>
  <rect x="180" y="135" width="55" height="40" class="sm-box"/>
  <rect x="245" y="135" width="55" height="40" class="sm-box"/>
  <rect x="310" y="135" width="55" height="40" class="sm-box"/>
  <rect x="375" y="135" width="40" height="40" class="sm-box"/>

  <!-- L2 Cache -->
  <rect x="50" y="190" width="365" height="30" class="mem-box"/>
  <text x="232" y="210" class="label">L2 Cache (96 MB on RTX 4090)</text>

  <!-- Global Memory -->
  <rect x="50" y="235" width="365" height="35" class="mem-box"/>
  <text x="232" y="250" class="label">Global Memory (HBM / GDDR6X)</text>
  <text x="232" y="265" class="detail">24 GB @ 1 TB/s bandwidth (RTX 4090)</text>

  <!-- Host side -->
  <rect x="460" y="35" width="220" height="250" rx="10" fill="none" stroke="var(--text-muted, #8b949e)" stroke-width="1.5"/>
  <text x="570" y="55" class="section">Host (CPU + System RAM)</text>

  <rect x="480" y="70" width="180" height="40" class="mem-box"/>
  <text x="570" y="90" class="label">CPU (8-64 cores)</text>
  <text x="570" y="105" class="detail">Sequential + control flow</text>

  <rect x="480" y="125" width="180" height="40" class="mem-box"/>
  <text x="570" y="145" class="label">System RAM (64-512 GB)</text>
  <text x="570" y="160" class="detail">~50 GB/s bandwidth</text>

  <rect x="480" y="180" width="180" height="40" class="mem-box"/>
  <text x="570" y="200" class="label">Storage (NVMe SSD)</text>
  <text x="570" y="215" class="detail">~7 GB/s sequential</text>

  <!-- PCIe bus -->
  <line x1="430" y1="160" x2="460" y2="160" class="bus"/>
  <text x="445" y="150" class="detail" text-anchor="middle">PCIe</text>
  <text x="445" y="175" class="detail" text-anchor="middle">64 GB/s</text>

  <!-- Execution model -->
  <rect x="30" y="310" width="650" height="75" rx="6" fill="none" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="355" y="330" class="section">CUDA Execution Hierarchy</text>
  <text x="120" y="355" class="label">Grid</text>
  <text x="120" y="370" class="detail">(all blocks)</text>
  <text x="180" y="355" class="detail">→</text>
  <text x="270" y="355" class="label">Block (1-1024 threads)</text>
  <text x="270" y="370" class="detail">Maps to 1 SM, shared memory</text>
  <text x="380" y="355" class="detail">→</text>
  <text x="480" y="355" class="label">Warp (32 threads)</text>
  <text x="480" y="370" class="detail">SIMT execution unit</text>
  <text x="570" y="355" class="detail">→</text>
  <text x="630" y="355" class="label">Thread</text>
  <text x="630" y="370" class="detail">1 CUDA core</text>
</svg>
