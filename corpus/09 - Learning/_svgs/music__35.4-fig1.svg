<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;}
    .slice{fill:var(--interactive-accent,#58a6ff);opacity:0.3;stroke:var(--interactive-accent,#58a6ff);stroke-width:1;}
    
    @keyframes chop-sequence {
      0%, 100% { opacity: 0; }
      14% { opacity: 0.35; fill: var(--interactive-accent,#58a6ff); }
    }
    .chop-1 { animation: chop-sequence 7s infinite 0s; }
    .chop-2 { animation: chop-sequence 7s infinite 1.1s; }
    .chop-3 { animation: chop-sequence 7s infinite 2.2s; }
    .chop-4 { animation: chop-sequence 7s infinite 3.3s; }
    .chop-5 { animation: chop-sequence 7s infinite 4.4s; }
    .chop-6 { animation: chop-sequence 7s infinite 5.5s; }
    .chop-7 { animation: chop-sequence 7s infinite 6.4s; }

    @keyframes playhead-slice {
      0% { transform: translateX(0px); }
      100% { transform: translateX(380px); }
    }
    .playhead-s {
      stroke: #ffd93d;
      stroke-width: 2.5;
      opacity: 0.8;
      animation: playhead-slice 7s linear infinite;
    }
  </style>
  <text x="360" y="22" class="title" text-anchor="middle">35.4 — Sampling, Slicing &amp; Resampling: Workflow, Chops &amp; Manipulation</text>
  <!-- Waveform with slices -->
  <rect x="20" y="35" width="400" height="140" class="box" rx="4"/>
  <text x="220" y="52" class="label" text-anchor="middle" font-weight="bold">Drum Break Slicing (Amen Break style)</text>
  <!-- Waveform background -->
  <rect x="30" y="60" width="380" height="80" fill="#0d1117" rx="2"/>
  <!-- Slice Chop overlays that light up sequentially -->
  <rect x="30" y="60" width="40" height="80" class="chop-1" fill="none" rx="1"/>
  <rect x="70" y="60" width="55" height="80" class="chop-2" fill="none" rx="1"/>
  <rect x="125" y="60" width="50" height="80" class="chop-3" fill="none" rx="1"/>
  <rect x="175" y="60" width="70" height="80" class="chop-4" fill="none" rx="1"/>
  <rect x="245" y="60" width="45" height="80" class="chop-5" fill="none" rx="1"/>
  <rect x="290" y="60" width="55" height="80" class="chop-6" fill="none" rx="1"/>
  <rect x="345" y="60" width="65" height="80" class="chop-7" fill="none" rx="1"/>
  <!-- Waveform shape (simulated) -->
  <path d="M30,100 L50,72 L55,118 L60,88 L65,112 L70,75 L80,118 L85,82 L90,100 L100,70 L105,120 L110,90 L115,105 L125,78 L130,112 L140,100 L145,85 L155,72 L160,120 L165,95 L175,68 L185,122 L190,100 L200,80 L210,100 L220,72 L225,118 L235,88 L245,112 L250,75 L260,118 L270,82 L280,100 L290,70 L295,120 L305,90 L315,105 L325,78 L335,112 L345,100 L355,85 L365,72 L375,120 L380,100 L390,80 L400,100 L410,100" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.5"/>
  <!-- Slice markers -->
  <line x1="70" y1="58" x2="70" y2="142" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="125" y1="58" x2="125" y2="142" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="175" y1="58" x2="175" y2="142" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="245" y1="58" x2="245" y2="142" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="290" y1="58" x2="290" y2="142" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="345" y1="58" x2="345" y2="142" stroke="#ffd93d" stroke-width="1.5"/>
  <!-- Sweeping playhead -->
  <line x1="30" y1="58" x2="30" y2="142" class="playhead-s"/>
  <text x="48" y="155" class="mono" text-anchor="middle">1. Kick</text>
  <text x="97" y="155" class="mono" text-anchor="middle">2. Hat</text>
  <text x="150" y="155" class="mono" text-anchor="middle">3. Snare</text>
  <text x="210" y="155" class="mono" text-anchor="middle">4. Kick+Hat</text>
  <text x="267" y="155" class="mono" text-anchor="middle">5. Ghost</text>
  <text x="317" y="155" class="mono" text-anchor="middle">6. Snare</text>
  <text x="375" y="155" class="mono" text-anchor="middle">7. Fill</text>
  <text x="220" y="170" class="sub" text-anchor="middle">Each slice → individual sample pad · Map to MIDI · Repitch, reorder, layer</text>
  <!-- Sampling workflow -->
  <rect x="435" y="35" width="265" height="140" class="box" rx="4"/>
  <text x="567" y="52" class="label" text-anchor="middle" font-weight="bold">Sampling Workflow</text>
  <text x="445" y="68" class="sub" font-weight="bold">1. Source / Record:</text>
  <text x="445" y="80" class="sub">Vinyl, live instrument, foley, SFX, Splice</text>
  <text x="445" y="95" class="sub" font-weight="bold">2. Edit:</text>
  <text x="445" y="107" class="sub">Trim start/end · Normalize · Fade in/out</text>
  <text x="445" y="119" class="sub">Set loop points (zero-crossing = no click)</text>
  <text x="445" y="134" class="sub" font-weight="bold">3. Slice / Chop:</text>
  <text x="445" y="146" class="sub">Transient detection or manual · Assign to pads</text>
  <text x="445" y="162" class="sub">Reorder on piano roll → new rhythmic feel</text>
  <!-- Sample manipulation panel -->
  <rect x="20" y="192" width="400" height="200" class="box" rx="4"/>
  <text x="220" y="209" class="label" text-anchor="middle" font-weight="bold">Sample Manipulation Techniques</text>
  <text x="30" y="226" class="sub" font-weight="bold">Pitch shifting:</text>
  <text x="30" y="238" class="sub">Semitone-map breakbeat across keyboard</text>
  <text x="30" y="250" class="sub">Melo chop: cut melodic phrase → repitch harmonically</text>
  <text x="30" y="265" class="sub" font-weight="bold">Time-stretching:</text>
  <text x="30" y="277" class="sub">Beat match loop to project BPM without pitch change</text>
  <text x="30" y="289" class="sub">Extreme stretch (100×) = ambient texture / granular</text>
  <text x="30" y="304" class="sub" font-weight="bold">Resampling:</text>
  <text x="30" y="316" class="sub">Route DAW output back to audio input → print effect chains</text>
  <text x="30" y="328" class="sub">Mix down stems → treat as new sample → chop + layer</text>
  <text x="30" y="343" class="sub" font-weight="bold">Creative processing:</text>
  <text x="30" y="355" class="sub">Reverse · Bitcrushing · Tape saturation · Pitch env</text>
  <text x="30" y="367" class="sub">Granular stretch → clouds, pads from any source</text>
  <text x="30" y="382" class="sub">Stutter/glitch: repeat 1/16 or 1/32 of sample rhythmically</text>
  <!-- Legal + formats panel -->
  <rect x="435" y="192" width="265" height="200" class="box" rx="4"/>
  <text x="567" y="209" class="label" text-anchor="middle" font-weight="bold">Sample Legality &amp; Formats</text>
  <text x="445" y="226" class="sub" font-weight="bold">Copyright:</text>
  <text x="445" y="238" class="sub">Uncleared samples = copyright infringement</text>
  <text x="445" y="250" class="sub">Even 2-second samples (Bridgeport ruling)</text>
  <text x="445" y="265" class="sub" font-weight="bold">Safe sources:</text>
  <text x="445" y="277" class="sub">Splice (royalty-free when subscription active)</text>
  <text x="445" y="289" class="sub">Looperman.com (free, royalty-free)</text>
  <text x="445" y="301" class="sub">freesound.org (CC licensed — check terms)</text>
  <text x="445" y="313" class="sub">BBC Sound Effects (free personal use)</text>
  <text x="445" y="325" class="sub">Self-recorded (full ownership)</text>
  <text x="445" y="340" class="sub" font-weight="bold">Sample file formats:</text>
  <text x="445" y="352" class="sub">WAV: uncompressed, 24-bit/48kHz ideal</text>
  <text x="445" y="364" class="sub">AIFF: same quality, Mac-native</text>
  <text x="445" y="376" class="sub">FLAC: lossless compressed, archival</text>
  <text x="445" y="388" class="sub">MP3/AAC: lossy, distribution only</text>
</svg>
