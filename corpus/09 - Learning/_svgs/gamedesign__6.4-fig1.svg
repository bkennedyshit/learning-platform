<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .curve { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; fill: none; animation: curve-glow 3s ease-in-out infinite; }
    .zone { opacity: 0.12; animation: zone-breathe 6s ease-in-out infinite; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .zone-label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); text-anchor: middle; font-style: italic; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .tick { stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    
    @keyframes curve-glow {
      0%, 100% { stroke-width: 3; filter: drop-shadow(0 0 1px rgba(88, 166, 255, 0.4)); }
      50% { stroke-width: 4; filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.8)); }
    }
    
    @keyframes zone-breathe {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.15; }
    }
    
    .tracer { fill: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 6px var(--interactive-accent, #58a6ff)); }
  </style>
  <defs>
    <marker id="ld-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>

  <text x="350" y="25" class="title">Intensity Pacing Curve — Level Design Rhythm</text>

  <!-- Background Zones -->
  <rect x="60" y="40" width="600" height="80" class="zone" fill="#ff6b6b" style="animation-delay: 0s;"/>
  <text x="350" y="70" class="zone-label" fill="#ff6b6b" font-weight="bold">Anxiety Zone (too hard)</text>
  
  <rect x="60" y="210" width="600" height="80" class="zone" fill="#4dabf7" style="animation-delay: 2s;"/>
  <text x="350" y="260" class="zone-label" fill="#4dabf7" font-weight="bold">Boredom Zone (too easy)</text>
  
  <rect x="60" y="120" width="600" height="90" class="zone" fill="var(--interactive-accent, #58a6ff)" style="animation-delay: 4s;"/>
  <text x="350" y="170" class="zone-label" fill="var(--interactive-accent, #58a6ff)" font-weight="bold">FLOW CHANNEL</text>

  <!-- Axes -->
  <line x1="60" y1="290" x2="660" y2="290" class="axis" marker-end="url(#ld-arrow)"/>
  <line x1="60" y1="290" x2="60" y2="40" class="axis" marker-end="url(#ld-arrow)"/>
  <text x="360" y="320" class="label">Time / Progression</text>
  <text x="30" y="165" class="label" transform="rotate(-90, 30, 165)">Intensity</text>

  <!-- Intensity Curve Path -->
  <path id="intensity-curve" d="M 80 240 Q 100 200 120 160 L 140 200 Q 160 170 180 130 L 200 180 Q 230 150 260 110 L 290 170 Q 310 200 320 220 L 340 200 Q 370 150 400 100 L 430 160 Q 450 180 470 140 L 490 170 Q 520 120 560 80 L 590 130 Q 620 100 640 70" class="curve"/>

  <!-- Pacing Tracer Ball (Player's Journey) -->
  <circle r="5.5" class="tracer">
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#intensity-curve"/>
    </animateMotion>
  </circle>

  <!-- Timeline ticks and labels -->
  <line x1="140" y1="285" x2="140" y2="295" class="tick"/>
  <text x="140" y="310" class="zone-label">Rest</text>
  
  <line x1="290" y1="285" x2="290" y2="295" class="tick"/>
  <text x="290" y="310" class="zone-label">Rest</text>
  
  <line x1="430" y1="285" x2="430" y2="295" class="tick"/>
  <text x="430" y="310" class="zone-label">Rest</text>
  
  <line x1="640" y1="285" x2="640" y2="295" class="tick"/>
  <text x="640" y="310" class="zone-label" fill="var(--text-normal, #c9d1d9)" font-weight="bold">Climax</text>
</svg>
