<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .vpc { fill: none; stroke: #cba6f7; stroke-width: 3; stroke-dasharray: 8,4; }
      .pub { fill: #313244; stroke: #a6e3a1; stroke-width: 2; rx: 8; }
      .priv { fill: #313244; stroke: #f38ba8; stroke-width: 2; rx: 8; }
      .db { fill: #313244; stroke: #fab387; stroke-width: 2; rx: 8; }
      .text { fill: #cdd6f4; font-family: monospace; font-size: 16px; font-weight: bold; }
      .label { fill: #a6adc8; font-family: monospace; font-size: 12px; }
      .comp { fill: #45475a; stroke: #89b4fa; stroke-width: 1; rx: 4; }
      .flow { fill: none; stroke: #f9e2af; stroke-width: 2; }
      .packet { fill: #94e2d5; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg"/>
  <text x="400" y="40" text-anchor="middle" class="text" font-size="20">VPC Network Architecture</text>
  
  <!-- Internet -->
  <circle cx="400" cy="100" r="30" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" class="text" font-size="12">Internet</text>
  
  <!-- IGW -->
  <rect x="360" y="150" width="80" height="30" class="comp"/>
  <text x="400" y="170" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">IGW</text>

  <!-- VPC -->
  <rect x="50" y="200" width="700" height="350" class="vpc"/>
  <text x="70" y="225" class="text" fill="#cba6f7">VPC Boundary (10.0.0.0/16)</text>
  
  <!-- Public Subnet -->
  <rect x="80" y="250" width="640" height="80" class="pub"/>
  <text x="90" y="270" class="text" fill="#a6e3a1">Public Subnet</text>
  <rect x="250" y="270" width="100" height="40" class="comp"/>
  <text x="300" y="295" text-anchor="middle" class="label" fill="#cdd6f4">Load Balancer</text>
  <rect x="450" y="270" width="100" height="40" class="comp"/>
  <text x="500" y="295" text-anchor="middle" class="label" fill="#cdd6f4">NAT Gateway</text>

  <!-- Private Subnet -->
  <rect x="80" y="350" width="640" height="80" class="priv"/>
  <text x="90" y="370" class="text" fill="#f38ba8">Private Subnet</text>
  <rect x="250" y="370" width="100" height="40" class="comp"/>
  <text x="300" y="395" text-anchor="middle" class="label" fill="#cdd6f4">App Server 1</text>
  <rect x="450" y="370" width="100" height="40" class="comp"/>
  <text x="500" y="395" text-anchor="middle" class="label" fill="#cdd6f4">App Server 2</text>

  <!-- DB Subnet -->
  <rect x="80" y="450" width="640" height="80" class="db"/>
  <text x="90" y="470" class="text" fill="#fab387">DB Subnet</text>
  <rect x="350" y="470" width="100" height="40" class="comp"/>
  <text x="400" y="495" text-anchor="middle" class="label" fill="#cdd6f4">Primary DB</text>

  <!-- Connections -->
  <path id="inbound" d="M 400 130 L 400 150 L 300 270" class="flow" stroke-dasharray="4,4"/>
  <path id="lb2app" d="M 300 310 L 300 370" class="flow" stroke-dasharray="4,4"/>
  <path id="app2db" d="M 300 410 L 400 470" class="flow" stroke-dasharray="4,4"/>
  
  <path id="outbound" d="M 500 370 L 500 310 L 400 150 L 400 130" class="flow" stroke-dasharray="4,4" stroke="#f38ba8"/>
  
  <circle r="4" class="packet">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#inbound"/>
    </animateMotion>
  </circle>
  <circle r="4" class="packet">
    <animateMotion dur="2s" begin="2s" repeatCount="indefinite">
      <mpath href="#lb2app"/>
    </animateMotion>
  </circle>
  <circle r="4" class="packet">
    <animateMotion dur="2s" begin="4s" repeatCount="indefinite">
      <mpath href="#app2db"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#f38ba8">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#outbound"/>
    </animateMotion>
  </circle>
</svg>
