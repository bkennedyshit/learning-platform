<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 640px; height: auto;">
  <defs>
    <marker id="ftc-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .axis    { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .grid    { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.28; }
    .f-curve { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.8; fill: none; }
    .F-curve { stroke: var(--text-accent, #79c0ff); stroke-width: 2.6; fill: none; stroke-dasharray: 7 3; }
    .shaded  { fill: var(--interactive-accent, #58a6ff); opacity: 0.18; }
    .ref     { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 3 3; }
    .label   { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .math    { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .math-acc{ font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--interactive-accent, #58a6ff); }
    .math-gold{font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--text-accent, #79c0ff);}
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>

  <g class="grid">
    <line x1="60" y1="40" x2="60" y2="380"/>
    <line x1="160" y1="40" x2="160" y2="380"/>
    <line x1="260" y1="40" x2="260" y2="380"/>
    <line x1="360" y1="40" x2="360" y2="380"/>
    <line x1="460" y1="40" x2="460" y2="380"/>
    <line x1="560" y1="40" x2="560" y2="380"/>
    <line x1="60" y1="80"  x2="590" y2="80"/>
    <line x1="60" y1="160" x2="590" y2="160"/>
    <line x1="60" y1="240" x2="590" y2="240"/>
    <line x1="60" y1="320" x2="590" y2="320"/>
  </g>

  <line x1="40"  y1="240" x2="610" y2="240" class="axis" marker-end="url(#ftc-arrow)"/>
  <line x1="60"  y1="390" x2="60"  y2="30"  class="axis" marker-end="url(#ftc-arrow)"/>
  <text x="616" y="244" class="label">x</text>
  <text x="48"  y="28"  class="label">y</text>

  <!-- Shaded area under f from a=80 to x=380 -->
  <path class="shaded" d="M 80 240 C 120 180, 160 100, 200 80 S 280 70, 320 100 L 320 240 Z"/>
  <path class="shaded" d="M 320 100 C 350 120, 380 170, 400 200 L 400 240 Z"/>

  <!-- f(x) curve (positive hump) -->
  <path class="f-curve" d="M 80 240 C 120 180, 160 80, 200 70 S 300 80, 340 140 S 440 260, 500 310 S 570 330, 590 340"/>

  <!-- F(x) accumulation curve (starts at 0 at a=80, grows, then plateaus/decreases) -->
  <path class="F-curve" d="M 80 380 C 130 370, 200 330, 260 260 S 360 200, 400 210 S 460 250, 530 300"/>

  <!-- Vertical marker at x -->
  <line x1="380" y1="155" x2="380" y2="380" class="ref"/>
  <line x1="80"  y1="240" x2="80"  y2="380" class="ref"/>

  <!-- Labels -->
  <text x="80"  y="396" class="math" text-anchor="middle">a</text>
  <text x="380" y="396" class="math" text-anchor="middle">x</text>

  <!-- Curve labels -->
  <text x="200" y="55" class="math-acc">f(t)</text>
  <text x="470" y="238" class="math-gold">F(x) = ∫ₐˣ f(t) dt</text>

  <!-- Shaded region label -->
  <text x="220" y="220" class="math-acc">area = F(x)</text>

  <!-- Annotations -->
  <rect x="62" y="44" width="270" height="42" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="197" y="62" class="label" text-anchor="middle" font-weight="bold">FTC Part I:</text>
  <text x="197" y="80" class="label" text-anchor="middle">F′(x) = f(x)  — growth rate = current height</text>
</svg>