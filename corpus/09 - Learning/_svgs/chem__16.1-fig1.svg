<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .orbital-s { fill: var(--interactive-accent, #58a6ff); opacity: 0.3; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; }
    .orbital-p { fill: #4dabf7; opacity: 0.25; stroke: #4dabf7; stroke-width: 1.5; }
    .orbital-d { fill: #ff6b6b; opacity: 0.2; stroke: #ff6b6b; stroke-width: 1.5; }
    .orbital-f { fill: #51cf66; opacity: 0.2; stroke: #51cf66; stroke-width: 1.5; }
    .arrow { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .block-s { fill: var(--interactive-accent, #58a6ff); opacity: 0.2; }
    .block-p { fill: #4dabf7; opacity: 0.2; }
    .block-d { fill: #ff6b6b; opacity: 0.15; }
    .block-f { fill: #51cf66; opacity: 0.15; }
    .qn-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 4; }
    .connector { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 3,3; }
  </style>
  <text x="300" y="25" class="title" text-anchor="middle">Quantum Numbers → Periodic Table Structure</text>
  <!-- Left: Quantum Numbers -->
  <rect x="20" y="45" width="180" height="150" class="qn-box"/>
  <text x="110" y="65" class="label" text-anchor="middle" font-weight="bold">Quantum Numbers</text>
  <text x="35" y="90" class="sublabel">n = 1, 2, 3, ... (shell)</text>
  <text x="35" y="110" class="sublabel">ℓ = 0, 1, ..., n-1 (subshell)</text>
  <text x="35" y="130" class="sublabel">mₗ = -ℓ, ..., +ℓ (orientation)</text>
  <text x="35" y="150" class="sublabel">mₛ = ±½ (spin)</text>
  <text x="35" y="175" class="sublabel">Max electrons = 2(2ℓ+1)</text>
  <!-- Arrow -->
  <line x1="200" y1="120" x2="240" y2="120" class="arrow" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal, #c9d1d9)"/></marker></defs>
  <!-- Right: Periodic Table Blocks -->
  <rect x="250" y="50" width="40" height="80" class="block-s"/>
  <text x="270" y="95" class="label" text-anchor="middle">s</text>
  <text x="270" y="110" class="sublabel" text-anchor="middle">ℓ=0</text>
  <text x="270" y="122" class="sublabel" text-anchor="middle">2e⁻</text>
  <rect x="300" y="50" width="60" height="80" class="block-p"/>
  <text x="330" y="95" class="label" text-anchor="middle">p</text>
  <text x="330" y="110" class="sublabel" text-anchor="middle">ℓ=1</text>
  <text x="330" y="122" class="sublabel" text-anchor="middle">6e⁻</text>
  <rect x="370" y="50" width="100" height="80" class="block-d"/>
  <text x="420" y="95" class="label" text-anchor="middle">d</text>
  <text x="420" y="110" class="sublabel" text-anchor="middle">ℓ=2</text>
  <text x="420" y="122" class="sublabel" text-anchor="middle">10e⁻</text>
  <rect x="480" y="50" width="100" height="80" class="block-f"/>
  <text x="530" y="95" class="label" text-anchor="middle">f</text>
  <text x="530" y="110" class="sublabel" text-anchor="middle">ℓ=3</text>
  <text x="530" y="122" class="sublabel" text-anchor="middle">14e⁻</text>
  <!-- Bottom: Orbital Shapes -->
  <text x="300" y="170" class="title" text-anchor="middle">Orbital Shapes (|Yₗᵐ|²)</text>
  <!-- s orbital - sphere -->
  <circle cx="100" cy="280" r="35" class="orbital-s"/>
  <text x="100" y="330" class="label" text-anchor="middle">s (ℓ=0)</text>
  <text x="100" y="345" class="sublabel" text-anchor="middle">spherical</text>
  <!-- p orbital - dumbbell -->
  <ellipse cx="250" cy="260" rx="12" ry="35" class="orbital-p"/>
  <ellipse cx="250" cy="300" rx="12" ry="35" class="orbital-p"/>
  <circle cx="250" cy="280" r="3" fill="var(--text-muted, #8b949e)"/>
  <text x="250" y="345" class="label" text-anchor="middle">p (ℓ=1)</text>
  <text x="250" y="360" class="sublabel" text-anchor="middle">dumbbell</text>
  <!-- d orbital - cloverleaf -->
  <ellipse cx="390" cy="265" rx="20" ry="12" class="orbital-d" transform="rotate(45 390 265)"/>
  <ellipse cx="390" cy="265" rx="20" ry="12" class="orbital-d" transform="rotate(-45 390 265)"/>
  <ellipse cx="390" cy="295" rx="20" ry="12" class="orbital-d" transform="rotate(45 390 295)"/>
  <ellipse cx="390" cy="295" rx="20" ry="12" class="orbital-d" transform="rotate(-45 390 295)"/>
  <text x="390" y="345" class="label" text-anchor="middle">d (ℓ=2)</text>
  <text x="390" y="360" class="sublabel" text-anchor="middle">cloverleaf</text>
  <!-- f orbital - complex -->
  <ellipse cx="530" cy="260" rx="15" ry="10" class="orbital-f" transform="rotate(0 530 260)"/>
  <ellipse cx="530" cy="260" rx="15" ry="10" class="orbital-f" transform="rotate(60 530 260)"/>
  <ellipse cx="530" cy="260" rx="15" ry="10" class="orbital-f" transform="rotate(120 530 260)"/>
  <ellipse cx="530" cy="300" rx="15" ry="10" class="orbital-f" transform="rotate(30 530 300)"/>
  <ellipse cx="530" cy="300" rx="15" ry="10" class="orbital-f" transform="rotate(90 530 300)"/>
  <ellipse cx="530" cy="300" rx="15" ry="10" class="orbital-f" transform="rotate(150 530 300)"/>
  <text x="530" y="345" class="label" text-anchor="middle">f (ℓ=3)</text>
  <text x="530" y="360" class="sublabel" text-anchor="middle">complex</text>
  <!-- Filling order note -->
  <text x="300" y="390" class="sublabel" text-anchor="middle">Filling order: 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → ... (n+ℓ rule)</text>
</svg>
