<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <style>
    .mb-axis { stroke:var(--text-normal, #c9d1d9); stroke-width:1.5; fill:none; }
    .mb-t1 { stroke:#ff6b6b; stroke-width:2.5; fill:none; }
    .mb-t2 { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none; }
    .mb-t3 { stroke:#4dabf7; stroke-width:2.5; fill:none; }
    .mb-lbl { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--text-normal, #c9d1d9); }
    .mb-acc { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    .mb-vline { stroke:var(--text-muted, #8b949e); stroke-width:1; stroke-dasharray:4 3; }
    @keyframes draw-mb { from{stroke-dashoffset:600} to{stroke-dashoffset:0} }
    .mb-anim { stroke-dasharray:600; animation: draw-mb 4s ease-out infinite alternate; }
  </style>
  <defs>
    <marker id="mba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="60" y1="280" x2="480" y2="280" class="mb-axis" marker-end="url(#mba)"/>
  <line x1="60" y1="280" x2="60" y2="30" class="mb-axis" marker-end="url(#mba)"/>
  <text x="490" y="285" class="mb-lbl">v (speed)</text>
  <text x="55" y="20" class="mb-lbl" text-anchor="end">f(v)</text>
  <!-- T1 (low T) - tall narrow peak -->
  <path d="M 60 280 Q 100 280 130 100 Q 150 40 170 100 Q 200 200 250 260 Q 300 278 350 280" class="mb-t1 mb-anim"/>
  <text x="155" y="35" class="mb-lbl" fill="#ff6b6b" font-weight="bold">T₁ (low)</text>
  <!-- T2 (medium T) -->
  <path d="M 60 280 Q 120 270 180 160 Q 220 100 260 140 Q 320 220 400 270 Q 440 278 480 280" class="mb-t2 mb-anim" style="animation-delay:0.75s"/>
  <text x="240" y="90" class="mb-acc">T₂ (medium)</text>
  <!-- T3 (high T) - broad flat -->
  <path d="M 60 280 Q 140 260 220 200 Q 280 170 330 185 Q 400 220 460 260 Q 475 275 480 280" class="mb-t3 mb-anim" style="animation-delay:1.5s"/>
  <text x="360" y="165" class="mb-lbl" fill="#4dabf7" font-weight="bold">T₃ (high)</text>
  <!-- Characteristic speeds for T2 -->
  <line x1="180" y1="160" x2="180" y2="280" class="mb-vline"/>
  <text x="180" y="295" class="mb-lbl" text-anchor="middle">v_p</text>
  <line x1="220" y1="280" x2="220" y2="295" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="220" y="308" class="mb-lbl" text-anchor="middle">⟨v⟩</text>
  <line x1="245" y1="280" x2="245" y2="295" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="245" y="320" class="mb-lbl" text-anchor="middle">v_rms</text>
  <!-- Formula box -->
  <rect x="330" y="40" width="170" height="55" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="415" y="62" class="mb-acc" text-anchor="middle">f(v) = 4π(m/2πk_BT)^(3/2)</text>
  <text x="415" y="82" class="mb-acc" text-anchor="middle">× v² exp(−mv²/2k_BT)</text>
</svg>