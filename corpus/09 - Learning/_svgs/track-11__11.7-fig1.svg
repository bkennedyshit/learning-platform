<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:640px;height:auto;">
  <style>
    .bio-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; stroke-dasharray: 6; animation: flow 1s linear infinite; }
    .ai-line { stroke: var(--text-accent, #79c0ff); stroke-width: 2; fill: none; stroke-dasharray: 6; animation: flow 1s linear infinite; }
    .node-bio { fill: var(--interactive-accent, #58a6ff); opacity: 0.3; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; }
    .node-ai { fill: var(--text-accent, #79c0ff); opacity: 0.3; stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; }
    .comp-label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .comp-title { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .comp-detail { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    @keyframes flow { to { stroke-dashoffset: -12; } }
  </style>
  <!-- Left: Biological neuron -->
  <text x="160" y="18" class="comp-title" text-anchor="middle">Biological Neuron</text>
  <!-- Dendrites -->
  <path d="M 60 80 C 80 70 100 90 120 80" class="bio-line"/>
  <path d="M 50 120 C 70 110 100 130 120 120" class="bio-line"/>
  <path d="M 55 160 C 75 150 100 170 120 160" class="bio-line"/>
  <path d="M 65 200 C 85 190 100 210 120 200" class="bio-line"/>
  <!-- Soma -->
  <ellipse cx="160" cy="140" rx="35" ry="45" class="node-bio"/>
  <text x="160" y="135" class="comp-label" text-anchor="middle">Soma</text>
  <text x="160" y="150" class="comp-detail" text-anchor="middle">(nonlinear integration)</text>
  <!-- Axon -->
  <line x1="195" y1="140" x2="290" y2="140" class="bio-line"/>
  <!-- Axon terminal -->
  <circle cx="295" cy="140" r="6" fill="var(--interactive-accent, #58a6ff)"/>
  <!-- Labels -->
  <text x="40" y="80" class="comp-detail">5000+ inputs</text>
  <text x="40" y="100" class="comp-detail">(dendritic spines)</text>
  <text x="230" y="130" class="comp-detail">Spikes (0/1)</text>
  <text x="230" y="145" class="comp-detail">1-120 m/s</text>
  <!-- Properties -->
  <text x="160" y="220" class="comp-detail" text-anchor="middle">• Local learning (STDP)</text>
  <text x="160" y="232" class="comp-detail" text-anchor="middle">• Dendritic computation</text>
  <text x="160" y="244" class="comp-detail" text-anchor="middle">• ~20W total brain power</text>
  <text x="160" y="256" class="comp-detail" text-anchor="middle">• Stochastic, noisy</text>
  <text x="160" y="268" class="comp-detail" text-anchor="middle">• Temporal coding</text>
  <text x="160" y="280" class="comp-detail" text-anchor="middle">• 100+ channel types</text>
  <!-- Right: Artificial neuron -->
  <text x="480" y="18" class="comp-title" text-anchor="middle">Artificial Neuron</text>
  <!-- Inputs -->
  <line x1="370" y1="80" x2="430" y2="130" class="ai-line"/>
  <line x1="370" y1="110" x2="430" y2="135" class="ai-line"/>
  <line x1="370" y1="140" x2="430" y2="140" class="ai-line"/>
  <line x1="370" y1="170" x2="430" y2="145" class="ai-line"/>
  <line x1="370" y1="200" x2="430" y2="150" class="ai-line"/>
  <!-- Weights -->
  <text x="395" y="75" class="comp-detail">w₁</text>
  <text x="395" y="105" class="comp-detail">w₂</text>
  <text x="395" y="135" class="comp-detail">w₃</text>
  <text x="395" y="165" class="comp-detail">w₄</text>
  <text x="395" y="195" class="comp-detail">w₅</text>
  <!-- Node -->
  <circle cx="460" cy="140" r="30" class="node-ai"/>
  <text x="460" y="135" class="comp-label" text-anchor="middle">Σ + σ</text>
  <text x="460" y="150" class="comp-detail" text-anchor="middle">(linear sum + activation)</text>
  <!-- Output -->
  <line x1="490" y1="140" x2="580" y2="140" class="ai-line"/>
  <text x="540" y="130" class="comp-detail">Continuous output</text>
  <text x="540" y="145" class="comp-detail">[0,1] or ℝ</text>
  <!-- Properties -->
  <text x="480" y="220" class="comp-detail" text-anchor="middle">• Global learning (backprop)</text>
  <text x="480" y="232" class="comp-detail" text-anchor="middle">• Point neuron (no dendrites)</text>
  <text x="480" y="244" class="comp-detail" text-anchor="middle">• ~300W per GPU</text>
  <text x="480" y="256" class="comp-detail" text-anchor="middle">• Deterministic (usually)</text>
  <text x="480" y="268" class="comp-detail" text-anchor="middle">• Rate coding only</text>
  <text x="480" y="280" class="comp-detail" text-anchor="middle">• 1 activation function</text>
  <!-- VS divider -->
  <text x="320" y="145" class="comp-title" text-anchor="middle">vs</text>
  <!-- Bottom comparison -->
  <rect x="150" y="290" width="340" height="25" rx="4" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="320" y="307" class="comp-label" text-anchor="middle">86B neurons, 150T synapses, 20W | 175B params, 1T tokens, 300W+</text>
</svg>