<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .wire { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.6; fill: none; }
    .v-source { stroke: #ffd93d; stroke-width: 1.6; fill: none; }
    .res { stroke: #ff6b6b; stroke-width: 2; fill: none; }
    .cap { stroke: #4dabf7; stroke-width: 2.5; fill: none; }
    .ground { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; }
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    .scope-bg { fill: #0d1117; stroke: var(--text-muted, #8b949e); stroke-width: 1.2; rx: 4; }
    .grid-line { stroke: #21262d; stroke-width: 0.8; stroke-dasharray: 2 4; }
    .switch-lever { stroke: #ffd93d; stroke-width: 2.5; stroke-linecap: round; }
    .switch-node { fill: var(--text-normal, #c9d1d9); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    
    /* Animation classes */
    .flow-charge {
      stroke: #4dabf7;
      stroke-width: 1.8;
      stroke-dasharray: 5 10;
      stroke-linecap: round;
      fill: none;
      animation: charge-flow 1s linear infinite;
    }
    .flow-discharge {
      stroke: #ff6b6b;
      stroke-width: 1.8;
      stroke-dasharray: 5 10;
      stroke-linecap: round;
      fill: none;
      animation: discharge-flow 1s linear infinite;
    }
    @keyframes charge-flow {
      to { stroke-dashoffset: -15; }
    }
    @keyframes discharge-flow {
      to { stroke-dashoffset: 15; }
    }
  </style>

  <text x="350" y="24" class="title" text-anchor="middle">Passive Components — RC Transient Response</text>

  <!-- LEFT: Circuit Schematic Panel -->
  <rect x="20" y="45" width="280" height="300" class="box"/>
  <text x="160" y="68" class="label" text-anchor="middle" font-weight="bold">RC Step-Response Circuit</text>

  <!-- Ground Symbol -->
  <line x1="160" y1="290" x2="180" y2="290" class="ground"/>
  <line x1="163" y1="294" x2="177" y2="294" class="ground"/>
  <line x1="167" y1="298" x2="173" y2="298" class="ground"/>
  <line x1="170" y1="260" x2="170" y2="290" class="wire"/>

  <!-- DC Voltage Source -->
  <circle cx="70" cy="180" r="16" fill="none" stroke="#ffd93d" stroke-width="1.8"/>
  <line x1="70" y1="170" x2="70" y2="190" class="v-source"/>
  <line x1="65" y1="175" x2="75" y2="175" class="v-source"/>
  <line x1="65" y1="185" x2="75" y2="185" class="v-source"/>
  <text x="44" y="184" class="sublabel" fill="#ffd93d">5V</text>
  
  <!-- Connections to Source -->
  <line x1="70" y1="196" x2="70" y2="260" class="wire"/>
  <line x1="70" y1="260" x2="170" y2="260" class="wire"/>
  <line x1="70" y1="164" x2="70" y2="110" class="wire"/>
  <line x1="70" y1="110" x2="105" y2="110" class="wire"/>

  <!-- Switch Terminals -->
  <!-- Charge node (A) -->
  <circle cx="105" cy="110" r="3" class="switch-node"/>
  <text x="105" y="100" class="sublabel" text-anchor="middle">A</text>
  <!-- Discharge node (B) -->
  <circle cx="105" cy="150" r="3" class="switch-node"/>
  <text x="105" y="162" class="sublabel" text-anchor="middle">B</text>
  <line x1="105" y1="150" x2="170" y2="150" class="wire"/>
  <line x1="170" y1="150" x2="170" y2="260" class="wire"/>

  <!-- Switch Common Pole -->
  <circle cx="135" cy="130" r="3" class="switch-node"/>
  
  <!-- Switch Lever (Animated via SMIL) -->
  <line x1="135" y1="130" x2="106" y2="111" class="switch-lever">
    <animate attributeName="x2" values="106;106;106;106;106" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="111;111;149;149;111" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Wires from Switch to Resistor -->
  <line x1="138" y1="130" x2="160" y2="130" class="wire"/>

  <!-- Resistor (R) -->
  <polyline points="160,130 165,123 171,137 177,123 183,137 189,123 195,137 200,130" class="res"/>
  <text x="180" y="112" class="sublabel" fill="#ff6b6b">R = 10 kΩ</text>

  <!-- Wires from Resistor to Capacitor -->
  <line x1="200" y1="130" x2="230" y2="130" class="wire"/>

  <!-- Capacitor (C) -->
  <line x1="230" y1="115" x2="230" y2="145" class="cap"/>
  <line x1="236" y1="115" x2="236" y2="145" class="cap"/>
  <text x="248" y="134" class="sublabel" fill="#4dabf7">C = 100 µF</text>
  
  <!-- Capacitor connection to ground -->
  <line x1="236" y1="130" x2="260" y2="130" class="wire"/>
  <line x1="260" y1="130" x2="260" y2="260" class="wire"/>
  <line x1="260" y1="260" x2="170" y2="260" class="wire"/>

  <!-- Dynamic current flow path overlays (opacity matches charge state) -->
  <!-- Charging current -->
  <path class="flow-charge" d="M 70 164 L 70 110 L 105 110 L 135 130 L 160 130 L 165 123 L 171 137 L 177 123 L 183 137 L 189 123 L 195 137 L 200 130 L 230 130">
    <animate attributeName="opacity" values="1;0.7;0.4;0.2;0.05;0;0;0;0;0" keyTimes="0;0.1;0.2;0.3;0.4;0.48;0.5;0.98;0.99;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Discharging current -->
  <path class="flow-discharge" d="M 230 130 L 200 130 L 195 137 L 189 123 L 183 137 L 177 123 L 171 137 L 165 123 L 160 130 L 135 130 L 105 150 L 170 150">
    <animate attributeName="opacity" values="0;0;0;0;0;1;0.7;0.4;0.2;0" keyTimes="0;0.1;0.2;0.3;0.48;0.5;0.6;0.7;0.8;0.95" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Labels showing state -->
  <text x="160" y="325" class="sublabel" text-anchor="middle" fill="#58a6ff" font-weight="bold">
    <animate attributeName="textContent" values="Charging (τ = RC)...;Charging (τ = RC)...;Discharging...;Discharging...;Charging (τ = RC)..." keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite"/>
    State: <animate attributeName="dummy" dur="6s" repeatCount="indefinite"/>
  </text>


  <!-- RIGHT: Oscilloscope Graph Panel -->
  <rect x="320" y="45" width="360" height="300" class="box"/>
  <text x="500" y="68" class="label" text-anchor="middle" font-weight="bold">Oscilloscope Transient Plot</text>

  <!-- Oscilloscope screen area -->
  <rect x="340" y="85" width="320" height="220" class="scope-bg"/>

  <!-- Oscilloscope Grid Lines -->
  <!-- Horizontal -->
  <line x1="340" y1="129" x2="660" y2="129" class="grid-line"/>
  <line x1="340" y1="173" x2="660" y2="173" class="grid-line"/>
  <line x1="340" y1="217" x2="660" y2="217" class="grid-line"/>
  <line x1="340" y1="261" x2="660" y2="261" class="grid-line"/>
  <!-- Vertical -->
  <line x1="380" y1="85" x2="380" y2="305" class="grid-line"/>
  <line x1="420" y1="85" x2="420" y2="305" class="grid-line"/>
  <line x1="460" y1="85" x2="460" y2="305" class="grid-line"/>
  <line x1="500" y1="85" x2="500" y2="305" class="grid-line"/>
  <line x1="540" y1="85" x2="540" y2="305" class="grid-line"/>
  <line x1="580" y1="85" x2="580" y2="305" class="grid-line"/>
  <line x1="620" y1="85" x2="620" y2="305" class="grid-line"/>

  <!-- Oscilloscope Axes Labels -->
  <text x="348" y="102" class="sublabel" fill="#8b949e">5V</text>
  <text x="348" y="297" class="sublabel" fill="#8b949e">0V</text>
  <text x="495" y="297" class="sublabel" fill="#4dabf7" font-weight="bold">τ</text>
  <text x="645" y="297" class="sublabel" fill="#ff6b6b" font-weight="bold">t</text>

  <!-- Step input reference (dashed yellow) -->
  <path d="M 340 283 L 340 107 L 500 107 L 500 283 L 660 283" stroke="#ffd93d" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.4"/>

  <!-- Charging voltage curve (drawn dynamically) -->
  <path d="M 340 283 C 380 283, 420 120, 500 107" stroke="#4dabf7" stroke-width="2.5" fill="none" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" values="300;0;0;300;300" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Discharging voltage curve (drawn dynamically) -->
  <path d="M 500 107 C 540 107, 580 270, 660 283" stroke="#ff6b6b" stroke-width="2.5" fill="none" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" values="300;300;0;0;300" keyTimes="0;0.5;0.95;0.98;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Sweeping time vertical cursor line -->
  <line x1="340" y1="85" x2="340" y2="305" stroke="#ffd93d" stroke-width="1" stroke-dasharray="2 2" opacity="0.6">
    <animate attributeName="x1" values="340;500;500;660;340" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="340;500;500;660;340" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Pulsing dot following the active voltage value -->
  <circle cx="340" cy="283" r="5" fill="#58a6ff" filter="drop-shadow(0 0 3px #58a6ff)">
    <animate attributeName="cx" values="340;380;420;460;500;500;540;580;620;660;340" keyTimes="0;0.12;0.24;0.36;0.48;0.5;0.62;0.74;0.86;0.98;1" dur="6s" repeatCount="indefinite" />
    <!-- Exponential approximations for y position -->
    <animate attributeName="cy" values="283;218;162;125;107;107;172;228;265;283;283" keyTimes="0;0.12;0.24;0.36;0.48;0.5;0.62;0.74;0.86;0.98;1" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Voltage readout badge -->
  <rect x="560" y="95" width="90" height="24" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="0.8" opacity="0.8"/>
  <text x="605" y="111" class="sublabel" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-weight="bold">
    <animate attributeName="textContent" values="vC = 0.00V;vC = 3.16V;vC = 4.32V;vC = 4.85V;vC = 5.00V;vC = 5.00V;vC = 1.84V;vC = 0.68V;vC = 0.25V;vC = 0.00V;vC = 0.00V" keyTimes="0;0.12;0.24;0.36;0.48;0.5;0.62;0.74;0.86;0.98;1" dur="6s" repeatCount="indefinite"/>
    vC = 0.00V<animate attributeName="dummy2" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
