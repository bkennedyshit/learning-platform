<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="transparent"/>
  
  <text x="400" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="var(--text-normal, #ddd)" text-anchor="middle">Dihybrid Cross: AaBb x AaBb</text>
  
  <g transform="translate(200, 100)">
    <!-- Grid -->
    <rect x="0" y="0" width="400" height="400" fill="none" stroke="var(--text-muted, #888)" stroke-width="4"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="var(--text-muted, #888)" stroke-width="2"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="var(--text-muted, #888)" stroke-width="2"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="var(--text-muted, #888)" stroke-width="2"/>
    
    <line x1="0" y1="100" x2="400" y2="100" stroke="var(--text-muted, #888)" stroke-width="2"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="var(--text-muted, #888)" stroke-width="2"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="var(--text-muted, #888)" stroke-width="2"/>
    
    <!-- Headers -->
    <text x="-50" y="60" font-family="sans-serif" font-size="20" fill="var(--text-accent, #4a90e2)" text-anchor="middle">AB</text>
    <text x="-50" y="160" font-family="sans-serif" font-size="20" fill="var(--text-accent, #4a90e2)" text-anchor="middle">Ab</text>
    <text x="-50" y="260" font-family="sans-serif" font-size="20" fill="var(--text-accent, #4a90e2)" text-anchor="middle">aB</text>
    <text x="-50" y="360" font-family="sans-serif" font-size="20" fill="var(--text-accent, #4a90e2)" text-anchor="middle">ab</text>
    
    <text x="50" y="-20" font-family="sans-serif" font-size="20" fill="var(--interactive-accent, #f39c12)" text-anchor="middle">AB</text>
    <text x="150" y="-20" font-family="sans-serif" font-size="20" fill="var(--interactive-accent, #f39c12)" text-anchor="middle">Ab</text>
    <text x="250" y="-20" font-family="sans-serif" font-size="20" fill="var(--interactive-accent, #f39c12)" text-anchor="middle">aB</text>
    <text x="350" y="-20" font-family="sans-serif" font-size="20" fill="var(--interactive-accent, #f39c12)" text-anchor="middle">ab</text>

    <!-- Cells row 1 -->
    <text x="50" y="60" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AABB</text>
    <text x="150" y="60" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AABb</text>
    <text x="250" y="60" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AaBB</text>
    <text x="350" y="60" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AaBb</text>
    
    <!-- Cells row 2 -->
    <text x="50" y="160" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AABb</text>
    <text x="150" y="160" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AAbb</text>
    <text x="250" y="160" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AaBb</text>
    <text x="350" y="160" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">Aabb</text>
    
    <!-- Cells row 3 -->
    <text x="50" y="260" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AaBB</text>
    <text x="150" y="260" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AaBb</text>
    <text x="250" y="260" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">aaBB</text>
    <text x="350" y="260" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">aaBb</text>
    
    <!-- Cells row 4 -->
    <text x="50" y="360" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">AaBb</text>
    <text x="150" y="360" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">Aabb</text>
    <text x="250" y="360" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">aaBb</text>
    <text x="350" y="360" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">aabb</text>

    <!-- Animated highlighting -->
    <rect x="0" y="0" width="100" height="100" fill="var(--interactive-accent, #9b59b6)" opacity="0">
      <animate attributeName="opacity" values="0; 0.4; 0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="300" width="100" height="100" fill="var(--interactive-success, #2ecc71)" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.4; 0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="400" y="550" font-family="sans-serif" font-size="18" fill="var(--text-normal, #ddd)" text-anchor="middle">Phenotypic Ratio: 9 : 3 : 3 : 1</text>
</svg>
