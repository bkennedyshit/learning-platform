<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <defs>
    <marker id="tower-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <style>
    .box   { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.8; rx: 8; }
    .arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#tower-arr); }
    .lab   { font-family: Inter,system-ui,sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .math  { font-family: 'Latin Modern Math',serif; font-style: italic; font-size: 15px; fill: var(--interactive-accent, #58a6ff); text-anchor: middle; }
    .op    { font-family: 'Latin Modern Math',serif; font-style: italic; font-size: 13px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .sub   { font-family: Inter,system-ui,sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Box 0: 0-forms -->
  <rect x="20" y="60" width="130" height="80" rx="8" class="box"/>
  <text x="85" y="88" class="math">Ω⁰(M)</text>
  <text x="85" y="108" class="lab">0-forms</text>
  <text x="85" y="125" class="sub">scalar functions f</text>
  <!-- Arrow 1 -->
  <line x1="150" y1="100" x2="210" y2="100" class="arrow"/>
  <text x="180" y="90" class="op">d = grad</text>
  <!-- Box 1: 1-forms -->
  <rect x="210" y="60" width="130" height="80" rx="8" class="box"/>
  <text x="275" y="88" class="math">Ω¹(M)</text>
  <text x="275" y="108" class="lab">1-forms</text>
  <text x="275" y="125" class="sub">P dx + Q dy + R dz</text>
  <!-- Arrow 2 -->
  <line x1="340" y1="100" x2="400" y2="100" class="arrow"/>
  <text x="370" y="90" class="op">d = curl</text>
  <!-- Box 2: 2-forms -->
  <rect x="400" y="60" width="130" height="80" rx="8" class="box"/>
  <text x="465" y="88" class="math">Ω²(M)</text>
  <text x="465" y="108" class="lab">2-forms</text>
  <text x="465" y="125" class="sub">P dy∧dz + Q dz∧dx + R dx∧dy</text>
  <!-- Arrow 3 -->
  <line x1="530" y1="100" x2="590" y2="100" class="arrow"/>
  <text x="560" y="90" class="op">d = div</text>
  <!-- Box 3: 3-forms -->
  <rect x="590" y="60" width="110" height="80" rx="8" class="box"/>
  <text x="645" y="88" class="math">Ω³(M)</text>
  <text x="645" y="108" class="lab">3-forms</text>
  <text x="645" y="125" class="sub">f dx∧dy∧dz</text>
  <!-- d² = 0 annotations -->
  <text x="275" y="170" class="sub" style="fill:var(--text-muted, #8b949e)">d∘d = 0 everywhere along the chain</text>
</svg>