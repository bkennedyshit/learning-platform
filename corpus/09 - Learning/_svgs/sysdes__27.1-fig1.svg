<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    .arrow { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .cap-edge { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .vertex-c { fill: #51cf66; opacity: 0.9; }
    .vertex-a { fill: #4dabf7; opacity: 0.9; }
    .vertex-p { fill: var(--interactive-accent, #58a6ff); opacity: 1; stroke: #ffd93d; stroke-width: 2.5; }
    .pacelc { fill: var(--interactive-accent, #58a6ff); opacity: 0.18; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 4; }
    .latency { fill: #ffd93d; opacity: 0.12; stroke: #ffd93d; stroke-width: 1.2; rx: 4; }
    .tower { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; rx: 4; }
    .split { stroke: #ff6b6b; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="sd-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
    <marker id="sd-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">System Design Foundations — CAP, PACELC, Latency Numbers &amp; the Tower of Scale</text>

  <!-- LEFT: CAP triangle -->
  <rect x="20" y="44" width="270" height="200" class="box"/>
  <text x="155" y="64" class="label" text-anchor="middle" font-weight="bold">CAP Theorem</text>

  <!-- triangle vertices -->
  <polygon points="155,82 75,210 235,210" class="cap-edge" fill="none"/>
  <circle cx="155" cy="82" r="9" class="vertex-c"/>
  <text x="155" y="78" class="sublabel" text-anchor="middle">C</text>
  <text x="155" y="100" class="label" text-anchor="middle">Consistency</text>

  <circle cx="75" cy="210" r="9" class="vertex-a"/>
  <text x="55" y="225" class="label" text-anchor="middle">Availability</text>

  <circle cx="235" cy="210" r="11" class="vertex-p"/>
  <text x="255" y="225" class="label" text-anchor="middle">Partition</text>
  <text x="255" y="237" class="sublabel" text-anchor="middle">tolerance (must-have)</text>

  <text x="155" y="158" class="sublabel" text-anchor="middle">Pick 2 — but the network</text>
  <text x="155" y="170" class="sublabel" text-anchor="middle">eventually partitions, so</text>
  <text x="155" y="182" class="sublabel" text-anchor="middle">CP or AP is the real choice.</text>

  <!-- MIDDLE: PACELC extension -->
  <rect x="305" y="44" width="200" height="200" class="box"/>
  <text x="405" y="64" class="label" text-anchor="middle" font-weight="bold">PACELC Extension</text>

  <rect x="320" y="80" width="170" height="60" class="pacelc"/>
  <text x="405" y="100" class="label" text-anchor="middle">If Partitioned (P)</text>
  <text x="405" y="118" class="sublabel" text-anchor="middle">choose Availability</text>
  <text x="405" y="132" class="sublabel" text-anchor="middle">vs Consistency  (A | C)</text>

  <rect x="320" y="150" width="170" height="80" class="latency"/>
  <text x="405" y="170" class="label" text-anchor="middle">Else (E) — normal ops</text>
  <text x="405" y="188" class="sublabel" text-anchor="middle">choose Latency vs</text>
  <text x="405" y="202" class="sublabel" text-anchor="middle">Consistency  (L | C)</text>
  <text x="405" y="220" class="sublabel" text-anchor="middle">Spanner = PC/EC · Dynamo = PA/EL</text>

  <!-- RIGHT: Latency numbers panel -->
  <rect x="520" y="44" width="180" height="200" class="box"/>
  <text x="610" y="64" class="label" text-anchor="middle" font-weight="bold">Latency Numbers</text>
  <text x="610" y="78" class="sublabel" text-anchor="middle">(Jeff Dean — every dev)</text>

  <text x="535" y="100" class="mono">L1 cache         0.5 ns</text>
  <text x="535" y="118" class="mono">Branch mispredict  5 ns</text>
  <text x="535" y="136" class="mono">L2 cache           7 ns</text>
  <text x="535" y="154" class="mono">Mutex lock/unlock 25 ns</text>
  <text x="535" y="172" class="mono">RAM access      100 ns</text>
  <text x="535" y="190" class="mono">SSD random      150 us</text>
  <text x="535" y="208" class="mono">RTT in DC       500 us</text>
  <text x="535" y="226" class="mono">RTT inter-cont  150 ms</text>

  <!-- BOTTOM: Tower of Scale -->
  <rect x="20" y="262" width="680" height="138" class="box"/>
  <text x="360" y="282" class="label" text-anchor="middle" font-weight="bold">The Tower of Scale — Scale Up Each Step BEFORE Building the Next</text>

  <rect x="35"  y="305" width="92" height="40" class="tower"/>
  <text x="81"  y="325" class="label" text-anchor="middle">Single</text>
  <text x="81"  y="338" class="sublabel" text-anchor="middle">Server</text>

  <rect x="142" y="305" width="92" height="40" class="tower"/>
  <text x="188" y="325" class="label" text-anchor="middle">Replicate</text>
  <text x="188" y="338" class="sublabel" text-anchor="middle">read replicas</text>

  <rect x="249" y="305" width="92" height="40" class="tower"/>
  <text x="295" y="325" class="label" text-anchor="middle">Cache</text>
  <text x="295" y="338" class="sublabel" text-anchor="middle">Redis · CDN</text>

  <rect x="356" y="305" width="92" height="40" class="tower"/>
  <text x="402" y="325" class="label" text-anchor="middle">Shard</text>
  <text x="402" y="338" class="sublabel" text-anchor="middle">hash · range</text>

  <rect x="463" y="305" width="100" height="40" class="tower"/>
  <text x="513" y="325" class="label" text-anchor="middle">Async Queue</text>
  <text x="513" y="338" class="sublabel" text-anchor="middle">Kafka · NATS</text>

  <rect x="578" y="305" width="108" height="40" class="tower"/>
  <text x="632" y="325" class="label" text-anchor="middle">Microservices</text>
  <text x="632" y="338" class="sublabel" text-anchor="middle">only when forced</text>

  <line x1="127" y1="325" x2="142" y2="325" class="arrow" marker-end="url(#sd-arr)"/>
  <line x1="234" y1="325" x2="249" y2="325" class="arrow" marker-end="url(#sd-arr)"/>
  <line x1="341" y1="325" x2="356" y2="325" class="arrow" marker-end="url(#sd-arr)"/>
  <line x1="448" y1="325" x2="463" y2="325" class="arrow" marker-end="url(#sd-arr)"/>
  <line x1="563" y1="325" x2="578" y2="325" class="arrow" marker-end="url(#sd-arr)"/>

  <!-- Failure-domain split marker between Shard and Microservice -->
  <line x1="455" y1="295" x2="455" y2="358" class="split"/>
  <text x="455" y="372" class="sublabel" text-anchor="middle" fill="#ff6b6b">↑ failure-domain split point ↑</text>
  <text x="360" y="392" class="sublabel" text-anchor="middle">"Don't decompose until ONE failure must NOT take down ANOTHER." — the only honest reason to go micro.</text>
</svg>
