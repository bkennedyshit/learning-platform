<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:620px;height:auto;">
  <defs>
    <marker id="cv-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .cv-heart{fill:#ff6b6b;opacity:0.35;stroke:#ff6b6b;stroke-width:2;transform-origin: 310px 200px}
    .cv-flow{stroke:var(--interactive-accent, #58a6ff);stroke-width:2.5;fill:none;stroke-dasharray:12,6;animation:cvFlow 3s linear infinite}
    .cv-lbl{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal, #c9d1d9)}
    .cv-acc{font-family:Inter,system-ui,sans-serif;font-size:13px;fill:var(--interactive-accent, #58a6ff);font-weight:bold}
    .cv-box{fill:var(--background-secondary, #161b22);stroke:var(--text-muted, #8b949e);stroke-width:1;rx:6;transition:all 0.3s}
    .cv-box:hover{fill:var(--background-secondary, #161b22);stroke:var(--interactive-accent, #58a6ff);filter:drop-shadow(0 0 3px var(--interactive-accent, #58a6ff))}
    
    .cv-pulse{animation:heartbeat 1.4s ease-in-out infinite}

    @keyframes cvFlow{to{stroke-dashoffset:-36}}
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.10); filter: drop-shadow(0 0 5px rgba(255, 107, 107, 0.6)); }
      28% { transform: scale(1); }
      42% { transform: scale(1.14); filter: drop-shadow(0 0 7px rgba(255, 107, 107, 0.7)); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }
  </style>
  <!-- Heart (simplified) -->
  <ellipse cx="310" cy="200" rx="50" ry="55" class="cv-heart cv-pulse"/>
  <text x="310" y="195" class="cv-acc" text-anchor="middle">Heart</text>
  <text x="310" y="215" class="cv-lbl" text-anchor="middle">SV × HR = Q̇</text>
  <!-- Arterial flow (right) -->
  <path d="M360 185 C420 185 420 120 500 120" class="cv-flow"/>
  <text x="430" y="140" class="cv-lbl" fill="var(--interactive-accent, #58a6ff)">Arterial O₂</text>
  <!-- Muscle box -->
  <rect x="470" y="90" width="130" height="70" class="cv-box"/>
  <text x="535" y="115" class="cv-acc" text-anchor="middle">Muscle</text>
  <text x="535" y="135" class="cv-lbl" text-anchor="middle">Mitochondria → ATP</text>
  <text x="535" y="150" class="cv-lbl" text-anchor="middle">O₂ → CO₂ + H₂O</text>
  <!-- Venous return -->
  <path d="M500 160 C420 230 420 250 360 220" class="cv-flow" style="stroke:var(--text-muted, #8b949e)"/>
  <text x="430" y="260" class="cv-lbl">Venous return</text>
  <!-- Lungs -->
  <rect x="80" y="90" width="120" height="70" class="cv-box"/>
  <text x="140" y="115" class="cv-acc" text-anchor="middle">Lungs</text>
  <text x="140" y="135" class="cv-lbl" text-anchor="middle">Gas Exchange</text>
  <text x="140" y="150" class="cv-lbl" text-anchor="middle">V̇O₂ measured here</text>
  <!-- Pulmonary circuit -->
  <path d="M260 185 C200 185 200 125 200 125" class="cv-flow"/>
  <path d="M140 160 C200 220 240 220 260 210" class="cv-flow" style="stroke:var(--text-muted, #8b949e)"/>
  <!-- Fick equation box -->
  <rect x="180" y="300" width="260" height="70" class="cv-box"/>
  <text x="310" y="325" class="cv-acc" text-anchor="middle">Fick Equation</text>
  <text x="310" y="350" class="cv-lbl" text-anchor="middle">V̇O₂ = Q̇ × (CaO₂ - CvO₂)</text>
  <text x="310" y="365" class="cv-lbl" text-anchor="middle">= HR × SV × a-vO₂ diff</text>
</svg>