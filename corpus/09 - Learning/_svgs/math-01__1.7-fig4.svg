<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <defs>
    <marker id="dv-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    .vol   { fill: var(--interactive-accent, #58a6ff); opacity:0.10; stroke: var(--interactive-accent, #58a6ff); stroke-width:2; }
    .flux  { stroke: var(--text-muted, #8b949e); stroke-width:1.5; fill:none; }
    .lab   { font-family: Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); }
    .math  { font-family:'Latin Modern Math',serif; font-style:italic; font-size:15px; fill:var(--interactive-accent, #58a6ff); }
    .muted { font-family: Inter,system-ui,sans-serif; font-size:11px; fill:var(--text-muted, #8b949e); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Volume V as a sphere-like closed shape -->
  <ellipse cx="250" cy="165" rx="155" ry="115" class="vol"/>
  <!-- Outward flux arrows in many directions -->
  <line x1="250" y1="50"  x2="250" y2="10"  class="flux" marker-end="url(#dv-arr)"/>
  <line x1="250" y1="280" x2="250" y2="315" class="flux" marker-end="url(#dv-arr)"/>
  <line x1="95"  y1="165" x2="55"  y2="165" class="flux" marker-end="url(#dv-arr)"/>
  <line x1="405" y1="165" x2="445" y2="165" class="flux" marker-end="url(#dv-arr)"/>
  <line x1="150" y1="80"  x2="118" y2="50"  class="flux" marker-end="url(#dv-arr)"/>
  <line x1="350" y1="80"  x2="382" y2="50"  class="flux" marker-end="url(#dv-arr)"/>
  <line x1="150" y1="250" x2="118" y2="278" class="flux" marker-end="url(#dv-arr)"/>
  <line x1="350" y1="250" x2="382" y2="278" class="flux" marker-end="url(#dv-arr)"/>
  <!-- Labels -->
  <text x="250" y="162" class="math" text-anchor="middle">V</text>
  <text x="420" y="80" class="math">∂V</text>
  <text x="420" y="96" class="muted">n̂ outward</text>
  <text x="250" y="310" class="muted" text-anchor="middle">Total outward flux ∯_∂V F·dS = ∭_V ∇·F dV</text>
</svg>