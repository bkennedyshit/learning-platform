<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 800px; height: auto;">
  <style>
    .title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-size: 22px; fill: var(--text-normal, #c9d1d9); font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: var(--text-muted, #8b949e); }
    .header-text { font-family: 'Outfit', sans-serif; font-size: 15px; fill: var(--text-accent, #58a6ff); font-weight: 800; letter-spacing: 0.5px; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); }
    .code-font { font-family: 'Fira Code', monospace; font-size: 11px; }
    .glass-panel { stroke: var(--text-muted, #8b949e); stroke-opacity: 0.2; stroke-width: 1.5; fill: var(--background-secondary, #161b22); rx: 8; }
    .glass-panel:hover { stroke: var(--interactive-accent, #58a6ff); stroke-opacity: 0.6; filter: drop-shadow(0 0 6px var(--interactive-accent, #58a6ff)); }
    .active-color { fill: var(--interactive-accent, #58a6ff); }
    .passive-color { fill: var(--text-muted, #8b949e); }
    .surgery-before { stroke: #ff7b72; stroke-width: 1.5; rx: 6; fill: var(--background-secondary-alt, #0d1117); }
    .surgery-after { stroke: #56d364; stroke-width: 2; rx: 6; fill: var(--background-secondary, #161b22); filter: drop-shadow(0 0 4px rgba(86, 211, 100, 0.2)); }
    .arrow-line { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; }
    .arrow-active { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .arrow-passive { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; opacity: 0.5; }
    .pulse-dot { fill: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .pulse-dot-slow { fill: var(--text-muted, #8b949e); opacity: 0.6; }
    .hover-grow { transition: all 0.3s ease; cursor: pointer; }
    .hover-grow:hover { transform: translateY(-2px); }
  </style>

  <defs>
    <!-- Markers -->
    <marker id="arrow-act" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--interactive-accent, #58a6ff)" />
    </marker>
    <marker id="arrow-pas" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-muted, #8b949e)" opacity="0.6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#56d364" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="var(--background-primary, #0d1117)" rx="12"/>

  <!-- Title -->
  <text x="40" y="45" class="title">The Style Matrix: Active Voice &amp; Concision</text>
  <text x="40" y="65" class="subtitle">Direct syntactic flow vs. heavy passive structure and zombie nominalizations</text>

  <!-- Section 1: Active vs. Passive Voice (Top Half) -->
  <g transform="translate(40, 95)">
    <!-- Active Panel -->
    <g class="glass-panel hover-grow" transform="translate(0, 0)">
      <rect width="345" height="175" class="glass-panel"/>
      <text x="20" y="25" class="header-text" fill="var(--interactive-accent)">ACTIVE VOICE • High Velocity</text>
      
      <!-- Flow Diagram -->
      <!-- Subject -->
      <rect x="20" y="45" width="70" height="30" rx="4" fill="var(--background-primary, #0d1117)" stroke="var(--interactive-accent)" stroke-width="1"/>
      <text x="55" y="64" class="label" text-anchor="middle">Subject</text>
      <text x="55" y="90" class="sublabel" text-anchor="middle" font-weight="bold">ACTOR</text>

      <!-- Action -->
      <rect x="135" y="45" width="70" height="30" rx="4" fill="var(--background-primary, #0d1117)" stroke="var(--interactive-accent)" stroke-width="1"/>
      <text x="170" y="64" class="label" text-anchor="middle">Verb</text>
      <text x="170" y="90" class="sublabel" text-anchor="middle" font-weight="bold" fill="var(--text-accent)">ACTION</text>

      <!-- Object -->
      <rect x="255" y="45" width="70" height="30" rx="4" fill="var(--background-primary, #0d1117)" stroke="var(--interactive-accent)" stroke-width="1"/>
      <text x="290" y="64" class="label" text-anchor="middle">Object</text>
      <text x="290" y="90" class="sublabel" text-anchor="middle" font-weight="bold">RECEIVER</text>

      <!-- Arrows -->
      <path d="M 95 60 L 130 60" class="arrow-active" marker-end="url(#arrow-act)"/>
      <path d="M 210 60 L 250 60" class="arrow-active" marker-end="url(#arrow-act)"/>

      <!-- Pulse dot (Fast) -->
      <circle r="4" class="pulse-dot">
        <animateMotion dur="1.5s" repeatCount="indefinite" path="M 55 60 L 170 60 L 290 60" />
      </circle>

      <!-- Example -->
      <rect x="20" y="115" width="305" height="40" rx="4" fill="var(--background-primary, #0d1117)" opacity="0.6"/>
      <text x="30" y="138" class="code-font" fill="var(--text-normal, #c9d1d9)">The <tspan font-weight="bold" fill="var(--interactive-accent)">engineer</tspan> deployed the <tspan font-weight="bold" fill="var(--text-accent)">hotfix</tspan>.</text>
    </g>

    <!-- Passive Panel -->
    <g class="glass-panel hover-grow" transform="translate(375, 0)">
      <rect width="345" height="175" class="glass-panel"/>
      <text x="20" y="25" class="header-text" fill="var(--text-muted)">PASSIVE VOICE • Low Velocity</text>

      <!-- Flow Diagram -->
      <!-- Subject (Receiver) -->
      <rect x="20" y="45" width="70" height="30" rx="4" fill="var(--background-primary, #0d1117)" stroke="var(--text-muted)" stroke-width="1"/>
      <text x="55" y="64" class="label" text-anchor="middle" fill="var(--text-muted)">Subject</text>
      <text x="55" y="90" class="sublabel" text-anchor="middle" font-weight="bold">RECEIVER</text>

      <!-- Action (heavy link) -->
      <rect x="135" y="45" width="80" height="30" rx="4" fill="var(--background-primary, #0d1117)" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="175" y="64" class="label" text-anchor="middle" fill="var(--text-muted)">To Be + PP</text>
      <text x="175" y="90" class="sublabel" text-anchor="middle" font-weight="bold">PASSIVE ACTION</text>

      <!-- Actor -->
      <rect x="255" y="45" width="70" height="30" rx="4" fill="var(--background-primary, #0d1117)" stroke="var(--text-muted)" stroke-width="0.5"/>
      <text x="290" y="64" class="label" text-anchor="middle" fill="var(--text-muted)">Preposition</text>
      <text x="290" y="90" class="sublabel" text-anchor="middle" font-weight="bold">[BY ACTOR]</text>

      <!-- Arrows -->
      <path d="M 95 60 L 130 60" class="arrow-passive" marker-end="url(#arrow-pas)"/>
      <path d="M 220 60 L 250 60" class="arrow-passive" marker-end="url(#arrow-pas)"/>

      <!-- Pulse dot (Slow/Faded) -->
      <circle r="3.5" class="pulse-dot pulse-dot-slow">
        <animateMotion dur="3.5s" repeatCount="indefinite" path="M 55 60 L 175 60 L 290 60" />
      </circle>

      <!-- Example -->
      <rect x="20" y="115" width="305" height="40" rx="4" fill="var(--background-primary, #0d1117)" opacity="0.6"/>
      <text x="30" y="138" class="code-font" fill="var(--text-muted, #8b949e)">The <tspan font-weight="bold">hotfix</tspan> was deployed <tspan font-style="italic">by the engineer</tspan>.</text>
    </g>
  </g>

  <!-- Section 2: Nominalization Surgery / Zombie Nouns (Bottom Half) -->
  <g transform="translate(40, 290)">
    <g class="glass-panel" transform="translate(0, 0)">
      <rect width="720" height="140" class="glass-panel"/>
      <text x="20" y="25" class="header-text" fill="#56d364">NOMINALIZATION SURGERY • Reviving Zombie Nouns</text>

      <!-- Before (Zombified) -->
      <g transform="translate(20, 45)" class="hover-grow">
        <rect width="280" height="70" class="surgery-before"/>
        <text x="15" y="20" class="label" fill="#ff7b72" font-weight="bold">HEAVY PROSE (Nominalized Zombie)</text>
        
        <circle cx="20" cy="45" r="3" fill="#ff7b72">
          <animate attributeName="r" values="3; 5; 3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="35" y="49" class="code-font" fill="#ff7b72">make a decision</text>
        <text x="175" y="49" class="sublabel" fill="var(--text-muted)">[Weak Verb + Abstract Noun]</text>
      </g>

      <!-- Surgery Knife/Transition Symbol -->
      <g transform="translate(325, 60)">
        <path d="M 0 20 L 40 20" stroke="#56d364" stroke-width="2.5" marker-end="url(#arrow-green)"/>
        <!-- Knife Blade -->
        <path d="M 15 5 L 25 15 M 25 5 L 15 15" stroke="#ff7b72" stroke-width="1.5"/>
        <text x="20" y="-3" class="sublabel" text-anchor="middle" fill="#56d364" font-weight="bold">CUT DEV</text>
      </g>

      <!-- After (Active/Revived) -->
      <g transform="translate(390, 45)" class="hover-grow">
        <rect width="310" height="70" class="surgery-after"/>
        <!-- Shining laser scan sweep -->
        <line x1="10" y1="5" x2="10" y2="65" stroke="#56d364" stroke-width="3" opacity="0.3">
          <animate attributeName="x1" values="10; 300; 10" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="10; 300; 10" dur="4s" repeatCount="indefinite"/>
        </line>
        <text x="15" y="20" class="label" fill="#56d364" font-weight="bold">VIBRANT PROSE (Strong Active Verb)</text>
        <text x="35" y="49" class="code-font" fill="#56d364" font-weight="bold">decide</text>
        <text x="120" y="49" class="sublabel" fill="var(--text-accent)">[Direct Action • Saves 2 Words]</text>
      </g>
    </g>
  </g>

  <!-- Side Legend / Footer -->
  <rect x="40" y="445" width="720" height="35" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-opacity="0.3"/>
  <text x="400" y="467" font-family="'Inter', sans-serif" font-size="12" fill="var(--text-normal, #c9d1d9)" text-anchor="middle">
    Zinsser's Rule: <tspan font-weight="bold">"Ruthlessly prune the clutter."</tspan> Active verbs inject momentum and clarity into technical prose.
  </text>

  <!-- Interactive Instruction -->
  <text x="760" y="45" font-family="'Inter', sans-serif" font-size="10" fill="var(--text-muted, #8b949e)" text-anchor="end">Hover over panels to highlight structures • Pulse speeds indicate sentence cognitive velocity</text>
</svg>
