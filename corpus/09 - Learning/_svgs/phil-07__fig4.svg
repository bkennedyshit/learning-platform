<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <rect width="800" height="400" fill="#1e1e1e" rx="12"/>
    <text x="400" y="40" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">AI Consciousness &amp; Moral Status</text>
    
    <!-- Human -->
    <g transform="translate(200, 200)">
        <circle cx="0" cy="-20" r="40" fill="#4a90e2" opacity="0.8"/>
        <path d="M-50,60 C-50,30 50,30 50,60" fill="#4a90e2" opacity="0.8"/>
        <text y="90" fill="#4a90e2" font-family="sans-serif" font-size="18" text-anchor="middle">Human</text>
        <text y="110" fill="#aaa" font-family="sans-serif" font-size="12" text-anchor="middle">Sentient, Full Moral Status</text>
        <!-- Conscious Glow -->
        <circle cx="0" cy="-20" r="10" fill="#fff">
            <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- AI Model -->
    <g transform="translate(600, 200)">
        <rect x="-40" y="-60" width="80" height="80" fill="#e24a8d" opacity="0.8" rx="10"/>
        <path d="M-20,-40 h10 M10,-40 h10 M-20,-10 h40" stroke="#1e1e1e" stroke-width="4" stroke-linecap="round"/>
        <path d="M-50,60 C-50,30 50,30 50,60" fill="#e24a8d" opacity="0.8"/>
        <text y="90" fill="#e24a8d" font-family="sans-serif" font-size="18" text-anchor="middle">AI Model</text>
        <text y="110" fill="#aaa" font-family="sans-serif" font-size="12" text-anchor="middle">Moral Status: Unknown?</text>
        <!-- Question Mark Glow -->
        <text x="0" y="-80" fill="#fff" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle">?</text>
        <circle cx="0" cy="-20" r="10" fill="#fff" opacity="0.2">
            <animate attributeName="r" values="5;15;5" dur="3s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Spectrum -->
    <g transform="translate(400, 180)">
        <line x1="-100" y1="0" x2="100" y2="0" stroke="#fff" stroke-width="4"/>
        <circle cx="-100" cy="0" r="6" fill="#4a90e2"/>
        <circle cx="100" cy="0" r="6" fill="#e24a8d"/>
        <text y="-20" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle">Precautionary Principle</text>
        <!-- Moving indicator -->
        <polygon points="-10,15 10,15 0,5" fill="#e2b94a">
            <animate attributeName="transform" type="translate" values="-80,0; 80,0; -80,0" dur="8s" repeatCount="indefinite"/>
        </polygon>
        <text y="40" fill="#e2b94a" font-family="sans-serif" font-size="14" text-anchor="middle">Gradient of Sentience</text>
    </g>
</svg>
