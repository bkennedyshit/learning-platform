<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:560px;height:auto;">
  <defs>
    <marker id="arr24" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="arr24b" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <style>
    .ax24  { stroke: var(--text-muted, #8b949e); stroke-width:1.2; fill:none; }
    .vec24 { stroke: var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none;
             marker-end: url(#arr24); }
    .vec24b{ stroke: var(--text-normal, #c9d1d9); stroke-width:2.5; fill:none;
             marker-end: url(#arr24b); }
    .arc24 { stroke: var(--interactive-accent, #58a6ff); stroke-width:1.5;
             fill:none; stroke-dasharray:4 3; }
    .lab24 { font-family:Inter,system-ui,sans-serif; font-size:13px;
             fill:var(--text-normal, #c9d1d9); }
    .labacc{ font-family:Inter,system-ui,sans-serif; font-size:13px;
             fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    .unit  { fill:none; stroke:var(--text-muted, #8b949e); stroke-width:0.5;
             stroke-dasharray:2 3; opacity:0.5; }
  </style>
  <!-- Unit circle -->
  <circle cx="200" cy="170" r="100" class="unit"/>
  <!-- Axes (left panel) -->
  <line x1="80" y1="170" x2="330" y2="170" class="ax24"/>
  <line x1="200" y1="290" x2="200" y2="50"  class="ax24"/>
  <text x="335" y="174" class="lab24">x</text>
  <text x="192" y="44"  class="lab24">y</text>
  <!-- Original vector v = (1,0) -->
  <line x1="200" y1="170" x2="300" y2="170" class="vec24b"/>
  <text x="305" y="167" class="lab24">v</text>
  <!-- Rotated vector T(v) = (cos θ, sin θ), θ ≈ 50° → (64, -77) from center -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 200 170; -50 200 170; 0 200 170" dur="4s" repeatCount="indefinite" />
    <line x1="200" y1="170" x2="300" y2="170" class="vec24"/>
    <text x="305" y="165" class="labacc">T(v)</text>
  </g>
  <!-- Arc showing angle θ -->
  <path d="M 300 170 A 100 100 0 0 0 264 94" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="none" stroke-dasharray="90" stroke-dashoffset="90">
    <animate attributeName="stroke-dashoffset" values="90; 0; 90" dur="4s" repeatCount="indefinite" />
  </path>
  <text x="315" y="152" class="labacc">θ</text>
  <!-- Right panel: matrix formula -->
  <rect x="360" y="60" width="185" height="110" rx="7"
        fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="452" y="85"  class="lab24" text-anchor="middle" font-weight="bold">Rotation by θ</text>
  <text x="380" y="110" class="lab24" font-family="monospace">⎡ cos θ  −sin θ ⎤</text>
  <text x="380" y="130" class="lab24" font-family="monospace">⎣ sin θ   cos θ ⎦</text>
  <text x="452" y="155" class="lab24" text-anchor="middle">det = 1, preserves area</text>
  <!-- Caption -->
  <text x="280" y="310" class="lab24" text-anchor="middle">
    Active rotation: v moves, basis stays fixed
  </text>
</svg>