<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    .axis-x { stroke: #ff6b6b; stroke-width: 1.4; fill: none; }
    .axis-y { stroke: #51cf66; stroke-width: 1.4; fill: none; }
    .link { fill: none; stroke-linecap: round; }
    .joint { fill: var(--background-secondary, #161b22); stroke-width: 2.2; }
    .flow-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; stroke-dasharray: 4, 3; animation: flow 2s linear infinite; }
    .math-text { font-family: Fira Code, Courier New, monospace; font-size: 11px; fill: #ffd93d; }
    @keyframes flow { to { stroke-dashoffset: -7; } }
  </style>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#51cf66"/>
    </marker>
    <grid id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="1"/>
    </grid>
  </defs>

  <text x="360" y="24" class="title" text-anchor="middle">Robotics Ch. 2 — Forward &amp; Inverse Kinematics Mapping</text>

  <!-- LEFT: Manipulator Workspace -->
  <rect x="20" y="50" width="330" height="360" class="box"/>
  <text x="185" y="75" class="label" text-anchor="middle" font-weight="bold">Manipulator Workspace &amp; Trajectory Tracking</text>

  <!-- Workspace bounds representation -->
  <path d="M 185,270 M 235,120 A 180,180 0 0,1 335,270 A 180,180 0 0,1 185,390" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="2,5" opacity="0.3"/>
  <path d="M 185,270 M 265,160 A 120,120 0 0,1 305,270" fill="none" stroke="#51cf66" stroke-width="1" stroke-dasharray="2,5" opacity="0.3"/>

  <!-- Desired Trajectory (IK Input) -->
  <path d="M 240,150 C 290,130 330,170 310,210 C 290,250 250,220 240,150 Z" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="315" y="145" class="sublabel" fill="#ff6b6b">x_des(t) Desired Path</text>

  <!-- Desired Target Marker -->
  <g>
    <animateMotion path="M 240,150 C 290,130 330,170 310,210 C 290,250 250,220 240,150 Z" dur="10s" repeatCount="indefinite"/>
    <circle r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <circle r="2" fill="#ff6b6b"/>
  </g>

  <!-- 3-DOF Kinematic Chain (Analytical/Numerical FK Demonstration) -->
  <g transform="translate(185, 270)">
    <!-- Base Joint 1 -->
    <circle cx="0" cy="0" r="8" class="joint" stroke="#58a6ff"/>
    <text x="-35" y="18" class="sublabel">{0} Base</text>

    <!-- Link 1 (revolute joint θ1) -->
    <g transform="rotate(-15)">
      <animateTransform attributeName="transform" type="rotate" values="-25; 10; -25" dur="10s" repeatCount="indefinite" additive="sum"/>
      <line x1="0" y1="0" x2="85" y2="0" class="link" stroke="#58a6ff" stroke-width="5"/>
      
      <!-- Joint 2 -->
      <g transform="translate(85, 0)">
        <circle cx="0" cy="0" r="6" class="joint" stroke="#51cf66"/>
        <text x="-8" y="-12" class="sublabel">θ₁</text>

        <!-- Link 2 (revolute joint θ2) -->
        <g transform="rotate(35)">
          <animateTransform attributeName="transform" type="rotate" values="15; 75; 15" dur="8s" repeatCount="indefinite" additive="sum"/>
          <line x1="0" y1="0" x2="70" y2="0" class="link" stroke="#51cf66" stroke-width="4"/>
          
          <!-- Joint 3 -->
          <g transform="translate(70, 0)">
            <circle cx="0" cy="0" r="5" class="joint" stroke="#ffd93d"/>
            <text x="-8" y="-10" class="sublabel">θ₂</text>

            <!-- Link 3 (revolute joint θ3) -->
            <g transform="rotate(-20)">
              <animateTransform attributeName="transform" type="rotate" values="-40; 10; -40" dur="6s" repeatCount="indefinite" additive="sum"/>
              <line x1="0" y1="0" x2="50" y2="0" class="link" stroke="#ffd93d" stroke-width="3"/>
              
              <!-- End Effector -->
              <g transform="translate(50, 0)">
                <circle cx="0" cy="0" r="5" fill="#ff6b6b"/>
                <text x="12" y="-12" class="label" fill="#ff6b6b" font-weight="bold">EE</text>
                
                <!-- Coordinate Frame -->
                <line x1="0" y1="0" x2="25" y2="0" class="axis-x" marker-end="url(#arrR)"/>
                <line x1="0" y1="0" x2="0" y2="-25" class="axis-y" marker-end="url(#arrR)"/>
                <text x="28" y="3" class="sublabel" fill="#ff6b6b">x</text>
                <text x="3" y="-28" class="sublabel" fill="#51cf66">y</text>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Joint velocity arrows (Jacobian mapping) -->
  <path d="M 130,230 A 25,25 0 0,1 150,210" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="110" y="215" class="sublabel" fill="#58a6ff">q, q_dot</text>

  <!-- RIGHT: Mapping Spaces & Math -->
  <rect x="370" y="50" width="330" height="360" class="box"/>
  <text x="535" y="75" class="label" text-anchor="middle" font-weight="bold">Kinematic Mapping Spaces</text>

  <!-- Joint Space Manifold -->
  <g transform="translate(390, 95)">
    <rect width="110" height="110" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Mock grid -->
    <path d="M 0,22 H 110 M 0,44 H 110 M 0,66 H 110 M 0,88 H 110 M 22,0 V 110 M 44,0 V 110 M 66,0 V 110 M 88,0 V 110" fill="none" stroke="#21262d" stroke-width="0.5"/>
    <text x="5" y="-5" class="sublabel" font-weight="bold">Joint Space Q (θ₁, θ₂)</text>
    <line x1="0" y1="110" x2="115" y2="110" stroke="#8b949e" stroke-width="1" marker-end="url(#arrR)"/>
    <line x1="0" y1="110" x2="0" y2="-5" stroke="#8b949e" stroke-width="1" marker-end="url(#arrR)"/>
    
    <!-- Joint state trajectory trajectory -->
    <ellipse cx="55" cy="55" rx="35" ry="25" fill="none" stroke="#51cf66" stroke-width="1.5" stroke-dasharray="2,3"/>
    <circle r="4" fill="#51cf66">
      <animateMotion path="M 20,55 A 35,25 0 1 0 90,55 A 35,25 0 1 0 20,55" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Task Space Manifold -->
  <g transform="translate(560, 95)">
    <rect width="110" height="110" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <path d="M 0,22 H 110 M 0,44 H 110 M 0,66 H 110 M 0,88 H 110 M 22,0 V 110 M 44,0 V 110 M 66,0 V 110 M 88,0 V 110" fill="none" stroke="#21262d" stroke-width="0.5"/>
    <text x="5" y="-5" class="sublabel" font-weight="bold">Task Space X (x, y)</text>
    <line x1="0" y1="110" x2="115" y2="110" stroke="#8b949e" stroke-width="1" marker-end="url(#arrR)"/>
    <line x1="0" y1="110" x2="0" y2="-5" stroke="#8b949e" stroke-width="1" marker-end="url(#arrR)"/>

    <!-- Task state trajectory -->
    <path d="M 25,35 C 45,20 85,60 65,70 C 45,80 25,50 25,35 Z" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="2,3"/>
    <circle r="4" fill="#58a6ff">
      <animateMotion path="M 25,35 C 45,20 85,60 65,70 C 45,80 25,50 25,35 Z" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mapping Arrows -->
  <!-- Forward Kinematics (FK) -->
  <path d="M 505,125 Q 535,115 555,125" class="flow-arrow" marker-end="url(#arrG)" stroke="#51cf66"/>
  <text x="535" y="110" class="sublabel" fill="#51cf66" text-anchor="middle" font-weight="bold">FK: x = f(q)</text>

  <!-- Inverse Kinematics (IK) -->
  <path d="M 555,175 Q 535,185 505,175" class="flow-arrow" marker-end="url(#arrB)" stroke="#58a6ff"/>
  <text x="535" y="200" class="sublabel" fill="#58a6ff" text-anchor="middle" font-weight="bold">IK: q = f⁻¹(x)</text>

  <!-- Jacobian and Differential Kinematics Box -->
  <rect x="390" y="235" width="290" height="155" class="box" fill="#0d1117" stroke="#30363d"/>
  <text x="405" y="255" class="label" font-weight="bold" fill="#ffd93d">Differential Relationships &amp; Solvers</text>

  <!-- Jacobian Equation -->
  <text x="535" y="285" class="math-text" font-size="14px" text-anchor="middle" fill="#c9d1d9">
    ẋ = J(q) q̇  <tspan fill="#8b949e">  ⇒  </tspan>  q̇ = J⁺(q) ẋ_err
  </text>
  
  <text x="405" y="315" class="sublabel" font-weight="bold">Numerical Inverse Kinematics (Damped LS):</text>
  <text x="405" y="335" class="math-text" fill="#ffd93d">
    q_next = q_k + Jᵀ(JJᵀ + λ²I)⁻¹ e_k
  </text>
  
  <!-- Flow diagram of Jacobian update -->
  <g transform="translate(405, 355)">
    <!-- Task Error Box -->
    <rect x="0" y="0" width="40" height="20" rx="3" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="1"/>
    <text x="20" y="13" class="sublabel" fill="#ff6b6b" text-anchor="middle" font-weight="bold">e_k</text>
    
    <line x1="40" y1="10" x2="65" y2="10" stroke="#8b949e" stroke-width="1" marker-end="url(#arrR)"/>
    
    <!-- Jacobian block -->
    <rect x="65" y="-5" width="70" height="30" rx="4" fill="#58a6ff" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="100" y="14" class="sublabel" fill="#58a6ff" text-anchor="middle" font-weight="bold">J⁺(q)</text>
    
    <line x1="135" y1="10" x2="160" y2="10" stroke="#8b949e" stroke-width="1" marker-end="url(#arrR)"/>

    <!-- Joint update -->
    <rect x="160" y="0" width="40" height="20" rx="3" fill="#51cf66" fill-opacity="0.2" stroke="#51cf66" stroke-width="1"/>
    <text x="180" y="13" class="sublabel" fill="#51cf66" text-anchor="middle" font-weight="bold">Δq</text>

    <!-- Feedback arrow -->
    <path d="M 180,20 V 30 H 20 V 20" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="100" y="38" class="sublabel" fill="#8b949e" text-anchor="middle">Closed-loop Convergence</text>
  </g>
</svg>
