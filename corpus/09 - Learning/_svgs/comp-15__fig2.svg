<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .node { fill: #1e293b; stroke-width: 2; rx: 30; ry: 30; }
      .node-text { font-family: 'Courier New', Courier, monospace; font-size: 18px; fill: #f8fafc; font-weight: bold; }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100; }
      .node-type { font-family: sans-serif; font-size: 10px; fill: #94a3b8; font-weight: bold; }
    </style>
  </defs>

  <rect width="800" height="400" fill="#0f172a" rx="12" />

  <text x="400" y="40" font-family="sans-serif" font-size="20" fill="#f8fafc" text-anchor="middle" font-weight="bold" letter-spacing="2">ABSTRACT SYNTAX TREE</text>

  <g transform="translate(400, 100)">
    <!-- Edges -->
    <path d="M 0 30 L -150 100" class="edge">
      <animate attributeName="stroke-dashoffset" values="100;0;0" dur="3s" repeatCount="indefinite" keyTimes="0; 0.4; 1"/>
    </path>
    <path d="M 0 30 L 150 100" class="edge">
      <animate attributeName="stroke-dashoffset" values="100;0;0" dur="3s" repeatCount="indefinite" keyTimes="0; 0.4; 1"/>
    </path>
    
    <path d="M 150 130 L 50 200" class="edge">
      <animate attributeName="stroke-dashoffset" values="100;100;0" dur="3s" repeatCount="indefinite" keyTimes="0; 0.4; 1"/>
    </path>
    <path d="M 150 130 L 250 200" class="edge">
      <animate attributeName="stroke-dashoffset" values="100;100;0" dur="3s" repeatCount="indefinite" keyTimes="0; 0.4; 1"/>
    </path>

    <!-- Nodes -->
    <!-- Root: VarDecl -->
    <g>
      <circle cx="0" cy="0" r="40" class="node" stroke="#8b5cf6" />
      <text x="0" y="-5" class="node-text" text-anchor="middle">Decl</text>
      <text x="0" y="15" class="node-type" text-anchor="middle">Var</text>
      <animate attributeName="opacity" values="0;1;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.2;1" />
    </g>

    <!-- Left Child: Type -->
    <g transform="translate(-150, 100)">
      <circle cx="0" cy="0" r="40" class="node" stroke="#3b82f6" />
      <text x="0" y="-5" class="node-text" text-anchor="middle">Type</text>
      <text x="0" y="15" class="node-type" text-anchor="middle">int</text>
      <animate attributeName="opacity" values="0;0;1;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.3;0.5;1" />
    </g>

    <!-- Right Child: Assign -->
    <g transform="translate(150, 100)">
      <circle cx="0" cy="0" r="40" class="node" stroke="#f59e0b" />
      <text x="0" y="-5" class="node-text" text-anchor="middle">=</text>
      <text x="0" y="15" class="node-type" text-anchor="middle">Assign</text>
      <animate attributeName="opacity" values="0;0;1;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.3;0.5;1" />
    </g>

    <!-- Assign Left: Ident -->
    <g transform="translate(50, 200)">
      <circle cx="0" cy="0" r="40" class="node" stroke="#10b981" />
      <text x="0" y="-5" class="node-text" text-anchor="middle">x</text>
      <text x="0" y="15" class="node-type" text-anchor="middle">Ident</text>
      <animate attributeName="opacity" values="0;0;0;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;0.8;1" />
    </g>

    <!-- Assign Right: Literal -->
    <g transform="translate(250, 200)">
      <circle cx="0" cy="0" r="40" class="node" stroke="#ec4899" />
      <text x="0" y="-5" class="node-text" text-anchor="middle">42</text>
      <text x="0" y="15" class="node-type" text-anchor="middle">Literal</text>
      <animate attributeName="opacity" values="0;0;0;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;0.8;1" />
    </g>

  </g>

  <!-- Animated Scanner line -->
  <path d="M 0 0 L 800 0" stroke="#3b82f6" stroke-width="1" opacity="0.5">
     <animate attributeName="d" values="M 0 0 L 800 0; M 0 400 L 800 400" dur="3s" repeatCount="indefinite" />
  </path>

</svg>
