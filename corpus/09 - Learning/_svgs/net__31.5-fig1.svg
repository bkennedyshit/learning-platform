<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sub    { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .box    { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .h1box  { fill: #3d1a1a; stroke: #ff6b6b; stroke-width: 1.5; }
    .h2box  { fill: #1a3a3d; stroke: #4dabf7; stroke-width: 1.5; }
    .h3box  { fill: #1a3d1a; stroke: #51cf66; stroke-width: 1.5; }
    .stream { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; }
    .req    { stroke: #ffd93d; stroke-width: 1.5; fill: none; marker-end: url(#ya); }
    .res    { stroke: #51cf66; stroke-width: 1.5; fill: none; marker-end: url(#ga); }
    .quic   { stroke: #ffa94d; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ya" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffd93d"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#51cf66"/></marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">HTTP/1.1 Keep-Alive · HTTP/2 Multiplexing / HPACK / Push · HTTP/3 QUIC 0-RTT / Connection Migration</text>

  <!-- HTTP/1.1 panel -->
  <text x="110" y="44" class="label" text-anchor="middle" font-weight="bold">HTTP/1.1</text>
  <rect x="20" y="52" width="200" height="200" rx="3" class="h1box"/>
  <text x="120" y="70" class="sub" text-anchor="middle">1 request at a time per TCP conn</text>
  <text x="120" y="84" class="sub" text-anchor="middle">keep-alive reuses connection</text>
  <!-- Sequential requests -->
  <text x="35"  y="106" class="sub" fill="#ffd93d">Req 1 ────────►</text>
  <text x="35"  y="120" class="sub" fill="#51cf66">◄──────── Res 1</text>
  <text x="35"  y="136" class="sub" fill="#ffd93d">Req 2 ────────►</text>
  <text x="35"  y="150" class="sub" fill="#51cf66">◄──────── Res 2</text>
  <text x="35"  y="164" class="sub" fill="#ffd93d">Req 3 ────────►</text>
  <text x="35"  y="178" class="sub" fill="#51cf66">◄──────── Res 3</text>
  <text x="35"  y="196" class="sub" fill="#ff6b6b">↑ Head-of-Line Blocking</text>
  <text x="35"  y="208" class="sub">Pipelining: requests in flight but</text>
  <text x="35"  y="220" class="sub">responses must arrive in order</text>
  <text x="35"  y="236" class="sub">Browsers open 6 conns per origin</text>

  <!-- HTTP/2 panel -->
  <text x="370" y="44" class="label" text-anchor="middle" font-weight="bold">HTTP/2 (RFC 7540)</text>
  <rect x="240" y="52" width="260" height="200" rx="3" class="h2box"/>
  <text x="370" y="70" class="sub" text-anchor="middle">Binary framing · 1 TCP conn · multiplexed streams</text>
  <!-- Streams visualization -->
  <text x="252" y="90" class="sub">Stream 1:</text>
  <rect x="252" y="96" width="60" height="12" rx="2" fill="#4dabf7" opacity="0.7"/>
  <rect x="314" y="96" width="80" height="12" rx="2" fill="#4dabf7" opacity="0.5"/>
  <text x="252" y="122" class="sub">Stream 3:</text>
  <rect x="252" y="128" width="90" height="12" rx="2" fill="#51cf66" opacity="0.7"/>
  <rect x="344" y="128" width="50" height="12" rx="2" fill="#51cf66" opacity="0.5"/>
  <text x="252" y="154" class="sub">Stream 5:</text>
  <rect x="252" y="160" width="40" height="12" rx="2" fill="#ffd93d" opacity="0.7"/>
  <rect x="294" y="160" width="100" height="12" rx="2" fill="#ffd93d" opacity="0.5"/>
  <text x="370" y="192" class="sub" text-anchor="middle">DATA + HEADERS frames interleaved on one conn</text>
  <text x="370" y="206" class="sub" text-anchor="middle">HPACK: header compression (static + dynamic tables)</text>
  <text x="370" y="220" class="sub" text-anchor="middle">PRIORITY / WINDOW_UPDATE frames</text>
  <text x="370" y="234" class="sub" text-anchor="middle">Server Push: push CSS/JS before client asks</text>
  <text x="370" y="246" class="sub" text-anchor="middle">⚠ TCP HOL blocking still exists at L4</text>

  <!-- HTTP/3 / QUIC panel -->
  <text x="615" y="44" class="label" text-anchor="middle" font-weight="bold">HTTP/3 / QUIC (RFC 9000/9114)</text>
  <rect x="510" y="52" width="200" height="200" rx="3" class="h3box"/>
  <text x="610" y="70" class="sub" text-anchor="middle">QUIC over UDP · built-in TLS 1.3</text>
  <text x="610" y="84" class="sub" text-anchor="middle">Streams independent — no L4 HOL</text>
  <!-- QUIC connection ID migration -->
  <text x="520" y="100" class="sub" font-weight="bold" fill="#51cf66">0-RTT resumption:</text>
  <text x="520" y="114" class="sub">ClientHello + early data in 1st pkt</text>
  <text x="520" y="128" class="sub">session ticket from prev connection</text>
  <text x="520" y="146" class="sub" font-weight="bold" fill="#51cf66">Connection migration:</text>
  <text x="520" y="160" class="sub">Connection ID ≠ IP+port tuple</text>
  <text x="520" y="174" class="sub">Switch WiFi→5G without new handshake</text>
  <text x="520" y="192" class="sub" font-weight="bold" fill="#51cf66">Packet structure:</text>
  <text x="520" y="206" class="sub">Header: flags+ConnID+pkt# (encrypted)</text>
  <text x="520" y="220" class="sub">Payload: STREAM / ACK / CRYPTO frames</text>
  <text x="520" y="238" class="sub">ACK ranges: avoids spurious retransmit</text>
  <text x="520" y="252" class="sub">Loss recovery per-stream: no head-block</text>

  <!-- Bottom comparison table -->
  <rect x="20" y="264" width="680" height="140" rx="3" class="box"/>
  <text x="360" y="282" class="label" text-anchor="middle" font-weight="bold">Protocol Comparison</text>

  <!-- Headers -->
  <text x="50"  y="300" class="sub" font-weight="bold">Feature</text>
  <text x="200" y="300" class="sub" font-weight="bold" fill="#ff6b6b">HTTP/1.1</text>
  <text x="360" y="300" class="sub" font-weight="bold" fill="#4dabf7">HTTP/2</text>
  <text x="540" y="300" class="sub" font-weight="bold" fill="#51cf66">HTTP/3 (QUIC)</text>

  <text x="50"  y="316" class="sub">Transport</text>
  <text x="200" y="316" class="mono">TCP</text>
  <text x="360" y="316" class="mono">TCP</text>
  <text x="540" y="316" class="mono">UDP (QUIC)</text>

  <text x="50"  y="330" class="sub">HOL blocking</text>
  <text x="200" y="330" class="mono">L5–L7 (request)</text>
  <text x="360" y="330" class="mono">L4 (TCP segment)</text>
  <text x="540" y="330" class="mono">None</text>

  <text x="50"  y="344" class="sub">TLS</text>
  <text x="200" y="344" class="mono">Optional (upgrade)</text>
  <text x="360" y="344" class="mono">Optional (ALPN)</text>
  <text x="540" y="344" class="mono">Mandatory (built-in)</text>

  <text x="50"  y="358" class="sub">0-RTT</text>
  <text x="200" y="358" class="mono">No</text>
  <text x="360" y="358" class="mono">No (TLS 1.3 can)</text>
  <text x="540" y="358" class="mono">Yes (PSK early data)</text>

  <text x="50"  y="372" class="sub">Header compression</text>
  <text x="200" y="372" class="mono">None</text>
  <text x="360" y="372" class="mono">HPACK</text>
  <text x="540" y="372" class="mono">QPACK</text>

  <text x="50"  y="388" class="sub">Conn migration</text>
  <text x="200" y="388" class="mono">No</text>
  <text x="360" y="388" class="mono">No</text>
  <text x="540" y="388" class="mono">Yes (Connection ID)</text>

  <text x="50"  y="400" class="sub">Server push</text>
  <text x="200" y="400" class="mono">No</text>
  <text x="360" y="400" class="mono">Yes (deprecated in practice)</text>
  <text x="540" y="400" class="mono">Removed (RFC 9114)</text>
</svg>
