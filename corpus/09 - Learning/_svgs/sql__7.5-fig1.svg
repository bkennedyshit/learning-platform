<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .node { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 4; transition: all 0.3s; cursor: pointer; }
    .node:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .root-node { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; rx: 4; }
    .leaf-node { fill: var(--background-secondary, #161b22); stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; rx: 4; }
    .key { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .edge { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; }
    .leaf-link { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrow-bt); }
    .search-path { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; opacity: 0.7; }
  </style>
  <defs>
    <marker id="arrow-bt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>

  <text x="350" y="25" class="title">B-tree Index Structure — O(log n) Lookup</text>

  <!-- Root node -->
  <text x="350" y="50" class="section-label">root (depth 0)</text>
  <rect x="280" y="55" width="140" height="30" class="root-node"/>
  <text x="320" y="75" class="key">25</text>
  <text x="380" y="75" class="key">50</text>

  <!-- Internal nodes -->
  <text x="150" y="115" class="section-label">internal (depth 1)</text>
  <rect x="80" y="120" width="140" height="30" class="node"/>
  <text x="120" y="140" class="key">10</text>
  <text x="170" y="140" class="key">18</text>

  <rect x="280" y="120" width="140" height="30" class="node"/>
  <text x="320" y="140" class="key">30</text>
  <text x="380" y="140" class="key">42</text>

  <rect x="480" y="120" width="140" height="30" class="node"/>
  <text x="520" y="140" class="key">55</text>
  <text x="570" y="140" class="key">72</text>

  <!-- Leaf nodes -->
  <text x="80" y="195" class="section-label">leaves (depth 2) — linked list for range scans</text>
  <rect x="20" y="205" width="95" height="30" class="leaf-node"/>
  <text x="45" y="224" class="key">3,7,9</text>

  <rect x="125" y="205" width="95" height="30" class="leaf-node"/>
  <text x="155" y="224" class="key">10,14,18</text>

  <rect x="230" y="205" width="95" height="30" class="leaf-node"/>
  <text x="262" y="224" class="key">20,22,25</text>

  <rect x="335" y="205" width="95" height="30" class="leaf-node"/>
  <text x="367" y="224" class="key">30,35,42</text>

  <rect x="440" y="205" width="95" height="30" class="leaf-node"/>
  <text x="472" y="224" class="key">45,48,50</text>

  <rect x="545" y="205" width="95" height="30" class="leaf-node"/>
  <text x="577" y="224" class="key">55,60,72</text>

  <!-- Edges: root to internal -->
  <line x1="310" y1="85" x2="150" y2="120" class="edge"/>
  <line x1="350" y1="85" x2="350" y2="120" class="edge"/>
  <line x1="390" y1="85" x2="550" y2="120" class="edge"/>

  <!-- Edges: internal to leaf -->
  <line x1="110" y1="150" x2="67" y2="205" class="edge"/>
  <line x1="150" y1="150" x2="172" y2="205" class="edge"/>
  <line x1="190" y1="150" x2="262" y2="205" class="edge"/>
  <line x1="310" y1="150" x2="367" y2="205" class="edge"/>
  <line x1="390" y1="150" x2="472" y2="205" class="edge"/>
  <line x1="510" y1="150" x2="472" y2="205" class="edge"/>
  <line x1="570" y1="150" x2="577" y2="205" class="edge"/>

  <!-- Leaf links (doubly-linked list) -->
  <line x1="115" y1="220" x2="125" y2="220" class="leaf-link"/>
  <line x1="220" y1="220" x2="230" y2="220" class="leaf-link"/>
  <line x1="325" y1="220" x2="335" y2="220" class="leaf-link"/>
  <line x1="430" y1="220" x2="440" y2="220" class="leaf-link"/>
  <line x1="535" y1="220" x2="545" y2="220" class="leaf-link"/>

  <!-- Search path highlight -->
  <path d="M 350 85 L 350 120 L 367 150 L 367 205" class="search-path"/>

  <!-- Annotations -->
  <rect x="40" y="270" width="620" height="90" rx="6" style="fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1;"/>
  <text x="60" y="290" class="key">Lookup: WHERE id = 35</text>
  <text x="60" y="308" class="key">Path: root(50→left) → internal(42→left) → leaf(30,35,42) → found!</text>
  <text x="60" y="326" class="key">Depth: 3 levels = 3 page reads for millions of rows</text>
  <text x="60" y="344" class="key">Range: WHERE id BETWEEN 30 AND 50 → follow leaf links →</text>
</svg>
