<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <defs>
    <marker id="a-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="a-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    @keyframes flow-a { to { stroke-dashoffset: -10; } }
    @keyframes pulse-zone { 0%, 100% { opacity: 0.05; } 50% { opacity: 0.15; } }
    .a-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 6; }
    .a-box-hi { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 6; filter: drop-shadow(0 0 2px var(--interactive-accent, #58a6ff)); }
    .a-label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .a-title { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .a-link { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .a-link-hi { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; stroke-dasharray: 4; animation: flow-a 1s linear infinite; }
    .a-phase { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .a-zone { fill: var(--interactive-accent, #58a6ff); opacity: 0.07; rx: 8; animation: pulse-zone 3s ease-in-out infinite; }
  </style>
  <!-- Zone.js Layer -->
  <rect x="10" y="10" width="700" height="80" class="a-zone"/>
  <text x="360" y="30" class="a-title">Zone.js — Async Event Interception Layer</text>
  <rect x="30" y="40" width="90" height="35" class="a-box"/>
  <text x="75" y="62" class="a-label">setTimeout</text>
  <rect x="140" y="40" width="90" height="35" class="a-box"/>
  <text x="185" y="62" class="a-label">Promise.then</text>
  <rect x="250" y="40" width="90" height="35" class="a-box"/>
  <text x="295" y="62" class="a-label">addEventListener</text>
  <rect x="360" y="40" width="90" height="35" class="a-box"/>
  <text x="405" y="62" class="a-label">XHR/fetch</text>
  <rect x="470" y="40" width="100" height="35" class="a-box"/>
  <text x="520" y="62" class="a-label">requestAnimFrame</text>
  <rect x="590" y="40" width="100" height="35" class="a-box"/>
  <text x="640" y="62" class="a-label">WebSocket</text>
  <!-- Arrow from Zone to CD -->
  <line x1="360" y1="90" x2="360" y2="115" class="a-link-hi" marker-end="url(#a-arrow)"/>
  <text x="420" y="108" class="a-phase">triggers</text>
  <!-- Change Detection -->
  <rect x="200" y="115" width="320" height="45" class="a-box-hi"/>
  <text x="360" y="135" class="a-title">Change Detection Cycle</text>
  <text x="360" y="152" class="a-label">Top-down dirty check: Root → every component</text>
  <!-- Component Tree -->
  <text x="360" y="185" class="a-title">Component Tree (DI Hierarchy)</text>
  <rect x="290" y="195" width="140" height="32" class="a-box-hi"/>
  <text x="360" y="215" class="a-label">AppComponent (Root)</text>
  <line x1="330" y1="227" x2="200" y2="250" class="a-link"/>
  <line x1="390" y1="227" x2="520" y2="250" class="a-link"/>
  <rect x="120" y="250" width="160" height="32" class="a-box"/>
  <text x="200" y="270" class="a-label">HeaderComponent</text>
  <rect x="440" y="250" width="160" height="32" class="a-box"/>
  <text x="520" y="270" class="a-label">DashboardComponent</text>
  <line x1="480" y1="282" x2="430" y2="305" class="a-link"/>
  <line x1="560" y1="282" x2="610" y2="305" class="a-link"/>
  <rect x="360" y="305" width="140" height="32" class="a-box"/>
  <text x="430" y="325" class="a-label">ChartComponent</text>
  <rect x="540" y="305" width="140" height="32" class="a-box"/>
  <text x="610" y="325" class="a-label">TableComponent</text>
  <!-- DI Container -->
  <rect x="20" y="195" width="90" height="150" class="a-box-hi"/>
  <text x="65" y="215" class="a-title" font-size="10px">Injector</text>
  <text x="65" y="235" class="a-label" font-size="9px">HttpClient</text>
  <text x="65" y="255" class="a-label" font-size="9px">Router</text>
  <text x="65" y="275" class="a-label" font-size="9px">AuthService</text>
  <text x="65" y="295" class="a-label" font-size="9px">DataService</text>
  <text x="65" y="315" class="a-label" font-size="9px">FormBuilder</text>
  <text x="65" y="335" class="a-label" font-size="9px">Store</text>
  <line x1="110" y1="270" x2="120" y2="270" class="a-link" stroke-dasharray="3 2"/>
  <!-- RxJS Stream -->
  <rect x="20" y="370" width="680" height="65" class="a-box"/>
  <text x="360" y="390" class="a-title">RxJS Observable Streams</text>
  <text x="120" y="415" class="a-label">HTTP responses</text>
  <text x="280" y="415" class="a-label">Router events</text>
  <text x="440" y="415" class="a-label">Form valueChanges</text>
  <text x="600" y="415" class="a-label">WebSocket messages</text>
  <line x1="360" y1="337" x2="360" y2="370" class="a-link-hi" marker-end="url(#a-arrow)"/>
  <text x="400" y="358" class="a-phase">subscribe</text>
</svg>