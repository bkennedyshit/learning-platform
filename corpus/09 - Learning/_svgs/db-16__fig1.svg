<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a24" rx="8"/>
  <text x="400" y="40" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">LSM-Tree Write Path &amp; Compaction</text>

  <!-- Components -->
  <g transform="translate(50, 100)">
    <!-- WAL -->
    <rect x="0" y="0" width="120" height="300" fill="#2d2d3d" stroke="#5c5c7d" stroke-width="2" rx="4"/>
    <text x="60" y="30" fill="#a8a8c0" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">WAL</text>
    <path d="M 20 60 L 100 60 M 20 100 L 100 100 M 20 140 L 100 140 M 20 180 L 100 180 M 20 220 L 100 220" stroke="#4a4a6a" stroke-width="8" stroke-dasharray="10,5"/>
    <text x="60" y="280" fill="#7a7a9a" font-family="sans-serif" font-size="12" text-anchor="middle">Append-only</text>

    <!-- MemTable -->
    <rect x="180" y="0" width="480" height="80" fill="#312a42" stroke="#845ec2" stroke-width="2" rx="4"/>
    <text x="420" y="30" fill="#d0b4ff" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">MemTable (In-Memory SkipList)</text>
    <rect x="200" y="45" width="440" height="20" fill="#4d3b6e" rx="2"/>
    <rect x="200" y="45" width="300" height="20" fill="#845ec2" rx="2">
      <animate attributeName="width" values="0; 440; 0" dur="6s" repeatCount="indefinite" begin="0s" keyTimes="0; 0.8; 1"/>
    </rect>
    <text x="420" y="60" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Mutable Buffer</text>

    <!-- SSTables L0 -->
    <text x="160" y="145" fill="#a8a8c0" font-family="sans-serif" font-size="14" font-weight="bold">L0 (Overlapping)</text>
    <rect x="240" y="120" width="100" height="40" fill="#1f405c" stroke="#2980b9" stroke-width="2" rx="4"/>
    <rect x="360" y="120" width="100" height="40" fill="#1f405c" stroke="#2980b9" stroke-width="2" rx="4"/>
    <rect x="480" y="120" width="100" height="40" fill="#1f405c" stroke="#2980b9" stroke-width="2" rx="4"/>
    <text x="290" y="145" fill="#a0c8e0" font-family="sans-serif" font-size="12" text-anchor="middle">SSTable</text>
    <text x="410" y="145" fill="#a0c8e0" font-family="sans-serif" font-size="12" text-anchor="middle">SSTable</text>
    <text x="530" y="145" fill="#a0c8e0" font-family="sans-serif" font-size="12" text-anchor="middle">SSTable</text>

    <!-- SSTables L1 -->
    <text x="160" y="215" fill="#a8a8c0" font-family="sans-serif" font-size="14" font-weight="bold">L1 (Non-Overlapping)</text>
    <rect x="210" y="190" width="140" height="40" fill="#1e4d41" stroke="#27ae60" stroke-width="2" rx="4"/>
    <rect x="370" y="190" width="140" height="40" fill="#1e4d41" stroke="#27ae60" stroke-width="2" rx="4"/>
    <rect x="530" y="190" width="140" height="40" fill="#1e4d41" stroke="#27ae60" stroke-width="2" rx="4"/>
    <text x="280" y="215" fill="#9de0b9" font-family="sans-serif" font-size="12" text-anchor="middle">[A - M]</text>
    <text x="440" y="215" fill="#9de0b9" font-family="sans-serif" font-size="12" text-anchor="middle">[N - S]</text>
    <text x="600" y="215" fill="#9de0b9" font-family="sans-serif" font-size="12" text-anchor="middle">[T - Z]</text>

    <!-- SSTables L2 -->
    <text x="160" y="285" fill="#a8a8c0" font-family="sans-serif" font-size="14" font-weight="bold">L2 (10x L1)</text>
    <rect x="210" y="260" width="460" height="40" fill="#4d3e23" stroke="#f39c12" stroke-width="2" rx="4"/>
    <text x="440" y="285" fill="#e0cba0" font-family="sans-serif" font-size="12" text-anchor="middle">Multiple SSTables (10x capacity of L1)</text>

    <!-- Arrows & Animation paths -->
    <!-- Write to WAL & MemTable -->
    <path id="writePath1" d="M -20 40 L 0 40" stroke="none"/>
    <path id="writePath2" d="M 60 -20 L 60 0" stroke="none"/>
    
    <path d="M 120 40 L 170 40" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="145" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">1. Log</text>
    <text x="210" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">2. Write</text>

    <!-- Flush MemTable to L0 -->
    <path d="M 420 80 L 420 110" stroke="#845ec2" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="460" y="102" fill="#845ec2" font-family="sans-serif" font-size="12" text-anchor="middle">3. Flush</text>

    <!-- Compaction L0 to L1 -->
    <path d="M 410 160 L 410 180" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 290 160 L 290 180" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 530 160 L 530 180" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="350" y="175" fill="#2980b9" font-family="sans-serif" font-size="10" text-anchor="middle">4. Compaction</text>

    <!-- Compaction L1 to L2 -->
    <path d="M 440 230 L 440 250" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Moving Packets -->
    <circle r="4" fill="#ff5252">
      <animateMotion dur="6s" repeatCount="indefinite" path="M -10 40 L 60 40 L 60 80" keyTimes="0; 0.1; 1" keyPoints="0; 1; 1"/>
    </circle>
    <circle r="4" fill="#44ff44">
      <animateMotion dur="6s" repeatCount="indefinite" path="M -10 40 L 120 40 L 200 40" keyTimes="0; 0.1; 1" keyPoints="0; 1; 1"/>
    </circle>
    <!-- Flush packet -->
    <rect width="440" height="20" fill="#845ec2" rx="2" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 200 45 L 200 120" keyTimes="0; 0.8; 0.9; 1"/>
      <animate attributeName="opacity" values="0; 0; 0.6; 0" dur="6s" repeatCount="indefinite" keyTimes="0; 0.79; 0.8; 1"/>
      <animate attributeName="width" values="440; 440; 100; 100" dur="6s" repeatCount="indefinite" keyTimes="0; 0.79; 0.85; 1"/>
    </rect>

  </g>

  <!-- Defs for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="700" height="50" fill="#2d2d3d" stroke="#5c5c7d" stroke-width="1" rx="4"/>
    <text x="350" y="30" fill="#a8a8c0" font-family="sans-serif" font-size="14" text-anchor="middle">Writes go to WAL + MemTable. Background flush creates L0 SSTables. Background compaction merges L0 → L1 → L2.</text>
  </g>

</svg>
