<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <defs>
    <marker id="arrow-ts63" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .ts63-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.3s; }
    .ts63-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); transform: translateY(-2px); }
    .ts63-accent { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 8; animation: pulseGlow 2.5s infinite alternate; }
    .ts63-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .ts63-title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .ts63-note { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .ts63-section { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .ts63-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; marker-end: url(#arrow-ts63); stroke-dasharray: 6 4; animation: flow 1s linear infinite; }
    .ts63-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: start; }

    @keyframes flow { to { stroke-dashoffset: -10; } }
    @keyframes pulseGlow {
      from { filter: drop-shadow(0 0 2px var(--interactive-accent, #58a6ff)); stroke-width: 1.5; }
      to { filter: drop-shadow(0 0 6px var(--interactive-accent, #58a6ff)); stroke-width: 2.5; }
    }
  </style>

  <text x="350" y="22" class="ts63-title">Type-Level Programming Toolkit</text>

  <!-- Conditional Types -->
  <text x="120" y="50" class="ts63-section">conditional types</text>
  <rect x="20" y="58" width="200" height="70" class="ts63-accent"/>
  <text x="120" y="78" class="ts63-label">T extends U ? A : B</text>
  <text x="120" y="95" class="ts63-note">if-statement for types</text>
  <text x="30" y="115" class="ts63-code">+ infer: pattern matching</text>

  <!-- Mapped Types -->
  <text x="400" y="50" class="ts63-section">mapped types</text>
  <rect x="280" y="58" width="240" height="70" class="ts63-accent"/>
  <text x="400" y="78" class="ts63-label">{ [K in keyof T]: V }</text>
  <text x="400" y="95" class="ts63-note">for-loop over object keys</text>
  <text x="290" y="115" class="ts63-code">+ as clause: key remapping</text>

  <!-- Template Literals -->
  <text x="620" y="50" class="ts63-section">template literals</text>
  <rect x="540" y="58" width="150" height="70" class="ts63-accent"/>
  <text x="615" y="78" class="ts63-label">`${A}:${B}`</text>
  <text x="615" y="95" class="ts63-note">string manipulation</text>
  <text x="550" y="115" class="ts63-code">+ Capitalize, etc.</text>

  <!-- Arrows to combinations -->
  <path d="M 120 128 L 200 165" class="ts63-arrow"/>
  <path d="M 400 128 L 350 165" class="ts63-arrow"/>
  <path d="M 615 128 L 500 165" class="ts63-arrow"/>

  <!-- Combination: Utility Types -->
  <text x="350" y="160" class="ts63-section">combine to build</text>
  <rect x="150" y="170" width="400" height="55" class="ts63-box"/>
  <text x="350" y="192" class="ts63-label">Utility Types: Partial, Pick, Omit, Record, DeepPartial...</text>
  <text x="350" y="210" class="ts63-note">Built from conditional + mapped types</text>

  <!-- Advanced patterns row -->
  <path d="M 200 225 L 100 260" class="ts63-arrow"/>
  <path d="M 350 225 L 350 260" class="ts63-arrow"/>
  <path d="M 500 225 L 600 260" class="ts63-arrow"/>

  <rect x="20" y="260" width="160" height="50" class="ts63-box"/>
  <text x="100" y="282" class="ts63-label">Recursive Types</text>
  <text x="100" y="298" class="ts63-note">DeepReadonly, JSON, Trees</text>

  <rect x="270" y="260" width="160" height="50" class="ts63-box"/>
  <text x="350" y="282" class="ts63-label">Branded Types</text>
  <text x="350" y="298" class="ts63-note">Nominal typing in TS</text>

  <rect x="520" y="260" width="160" height="50" class="ts63-box"/>
  <text x="600" y="282" class="ts63-label">Distributive Types</text>
  <text x="600" y="298" class="ts63-note">Union distribution</text>

  <!-- Bottom insight -->
  <rect x="100" y="335" width="500" height="35" class="ts63-accent"/>
  <text x="350" y="352" class="ts63-label">Type System = Turing-Complete Language (runs at compile time)</text>
  <text x="350" y="365" class="ts63-note">Conditional = if | Mapped = loop | Recursive = recursion | infer = destructuring</text>
</svg>
