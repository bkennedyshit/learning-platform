<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <rect width="800" height="400" fill="#1e1e1e" rx="12"/>
    <text x="400" y="40" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Computational Theories (IIT &amp; GWT)</text>
    
    <!-- Left side: Integrated Information Theory (Φ) -->
    <g transform="translate(200, 200)">
        <text y="-130" fill="#e2b94a" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">IIT: High Φ (Integrated)</text>
        
        <!-- Nodes -->
        <circle cx="0" cy="-60" r="15" fill="#e2b94a"/>
        <circle cx="-60" cy="20" r="15" fill="#e2b94a"/>
        <circle cx="60" cy="20" r="15" fill="#e2b94a"/>
        <circle cx="0" cy="80" r="15" fill="#e2b94a"/>
        
        <!-- Edges -->
        <path d="M0,-60 L-60,20 L60,20 Z M0,-60 L60,20 L0,80 Z M-60,20 L0,80" stroke="#e2b94a" stroke-width="2" fill="none" opacity="0.6"/>
        
        <!-- Animated pulses on edges -->
        <circle r="4" fill="#fff">
            <animateMotion path="M0,-60 L-60,20 L60,20 Z M0,-60 L60,20 L0,80 Z M-60,20 L0,80" dur="3s" repeatCount="indefinite"/>
        </circle>
        
        <circle cx="0" cy="0" r="110" fill="none" stroke="#e2b94a" stroke-width="2" stroke-dasharray="5 5">
            <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1s" repeatCount="indefinite"/>
        </circle>
        
        <text y="140" fill="#aaa" font-family="sans-serif" font-size="14" text-anchor="middle">Complex, recurrent integration</text>
    </g>

    <!-- Divider -->
    <line x1="400" y1="80" x2="400" y2="320" stroke="#555" stroke-width="2" stroke-dasharray="10 10"/>

    <!-- Right side: Global Workspace Theory -->
    <g transform="translate(600, 200)">
        <text y="-130" fill="#4ae29c" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">GWT: Global Broadcast</text>
        
        <!-- Central Workspace -->
        <circle cx="0" cy="0" r="40" fill="#4ae29c" fill-opacity="0.2" stroke="#4ae29c" stroke-width="3">
            <animate attributeName="r" values="35;45;35" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text y="5" fill="#4ae29c" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Workspace</text>

        <!-- Modules -->
        <g transform="translate(0, -90)">
            <rect x="-20" y="-15" width="40" height="30" fill="#333" stroke="#aaa"/>
            <line x1="0" y1="15" x2="0" y2="40" stroke="#4ae29c" stroke-width="2" stroke-dasharray="4 2">
                <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
            </line>
        </g>
        <g transform="translate(0, 90)">
            <rect x="-20" y="-15" width="40" height="30" fill="#333" stroke="#aaa"/>
            <line x1="0" y1="-15" x2="0" y2="-40" stroke="#4ae29c" stroke-width="2" stroke-dasharray="4 2">
                <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
            </line>
        </g>
        <g transform="translate(-90, 0)">
            <rect x="-15" y="-20" width="30" height="40" fill="#333" stroke="#aaa"/>
            <line x1="15" y1="0" x2="40" y2="0" stroke="#4ae29c" stroke-width="2" stroke-dasharray="4 2">
                <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
            </line>
        </g>
        <g transform="translate(90, 0)">
            <rect x="-15" y="-20" width="30" height="40" fill="#333" stroke="#aaa"/>
            <line x1="-15" y1="0" x2="-40" y2="0" stroke="#4ae29c" stroke-width="2" stroke-dasharray="4 2">
                <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
            </line>
        </g>
        
        <text y="140" fill="#aaa" font-family="sans-serif" font-size="14" text-anchor="middle">Specialist modules share data</text>
    </g>
</svg>
