<svg viewBox="0 0 650 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <defs>
    <marker id="efe-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .efe-box { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 8; }
    .efe-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .efe-math { font-family: 'Latin Modern Math', serif; font-size: 16px; fill: var(--interactive-accent, #58a6ff); font-style: italic; text-anchor: middle; }
    .efe-title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .efe-horizon { stroke: #ff6b6b; stroke-width: 2.5; fill: none; }
    .efe-singularity { stroke: var(--text-accent, #79c0ff); stroke-width: 3; stroke-dasharray: 4,3; }
    .efe-geodesic { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; }
    .efe-lightcone { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; }
    .efe-sub { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    
    /* Animations */
    .efe-horizon { animation: pulseHorizon 3s infinite alternate ease-in-out; }
    @keyframes pulseHorizon { 
      from { filter: drop-shadow(0 0 4px #ff6b6b); } 
      to { filter: drop-shadow(0 0 12px #ff6b6b); stroke-width: 3.5; } 
    }
    .efe-singularity-dot { animation: pulseSingularity 0.5s infinite alternate ease-in-out; }
    @keyframes pulseSingularity { 
      from { filter: drop-shadow(0 0 2px var(--text-accent, #79c0ff)); r: 5; } 
      to { filter: drop-shadow(0 0 8px var(--text-accent, #79c0ff)); r: 7; } 
    }
    .efe-photon-orbit { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; fill: none; stroke-dasharray: 10 5; animation: rotateOrbit 4s linear infinite; }
    @keyframes rotateOrbit { to { stroke-dashoffset: -30; } }
    .efe-geodesic { stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawGeodesic 3s infinite ease-in; }
    @keyframes drawGeodesic { 0% { stroke-dashoffset: 200; opacity: 1; } 80% { stroke-dashoffset: 0; opacity: 1; } 85%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  </style>

  <!-- EFE equation box -->
  <rect x="50" y="10" width="550" height="70" class="efe-box"/>
  <text x="325" y="35" class="efe-title" font-size="15">Einstein Field Equations</text>
  <text x="325" y="60" class="efe-math" font-size="18">G_μν + Λg_μν = (8πG/c⁴) T_μν</text>

  <!-- Left side: Geometry -->
  <rect x="30" y="100" width="200" height="80" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="130" y="125" class="efe-title">GEOMETRY</text>
  <text x="130" y="145" class="efe-label">G_μν = R_μν − ½gR</text>
  <text x="130" y="165" class="efe-sub">Curvature of spacetime</text>

  <!-- Right side: Matter -->
  <rect x="420" y="100" width="200" height="80" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="520" y="125" class="efe-title">MATTER</text>
  <text x="520" y="145" class="efe-label">T_μν = energy-momentum</text>
  <text x="520" y="165" class="efe-sub">Distribution of mass-energy</text>

  <!-- Equals/arrow -->
  <text x="325" y="145" class="efe-math" font-size="20">=</text>

  <!-- Schwarzschild black hole diagram -->
  <text x="325" y="210" class="efe-title">Schwarzschild Black Hole</text>
  
  <!-- Event horizon circle -->
  <circle cx="325" cy="320" r="70" class="efe-horizon"/>
  <text x="325" y="250" class="efe-label" fill="#ff6b6b">Event Horizon (r = r_s)</text>
  
  <!-- Singularity -->
  <circle cx="325" cy="320" r="5" fill="var(--text-accent, #79c0ff)" class="efe-singularity-dot"/>
  <text x="325" y="340" class="efe-sub">r = 0 (singularity)</text>

  <!-- Infalling geodesic -->
  <path d="M 500 230 Q 450 270 400 300 Q 370 315 345 320" class="efe-geodesic" marker-end="url(#efe-arrow)"/>
  <text x="470" y="225" class="efe-label">Infalling particle</text>

  <!-- Photon orbit -->
  <circle cx="325" cy="320" r="105" class="efe-photon-orbit"/>
  <text x="210" y="240" class="efe-sub">Photon sphere (r = 3M)</text>

  <!-- Light cones tilting -->
  <g transform="translate(450, 320)">
    <line x1="-10" y1="10" x2="0" y2="-15" class="efe-lightcone"/>
    <line x1="10" y1="10" x2="0" y2="-15" class="efe-lightcone"/>
  </g>
  <g transform="translate(395, 320) rotate(20)">
    <line x1="-10" y1="10" x2="0" y2="-15" class="efe-lightcone"/>
    <line x1="10" y1="10" x2="0" y2="-15" class="efe-lightcone"/>
  </g>
  <g transform="translate(360, 320) rotate(45)">
    <line x1="-10" y1="10" x2="0" y2="-15" class="efe-lightcone"/>
    <line x1="10" y1="10" x2="0" y2="-15" class="efe-lightcone"/>
  </g>
  <text x="460" y="345" class="efe-sub">Light cones tilt inward</text>

  <!-- Key parameters -->
  <rect x="30" y="280" width="160" height="120" rx="6" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="110" y="300" class="efe-title" font-size="11">Key Radii</text>
  <text x="110" y="320" class="efe-sub">r_s = 2GM/c² (horizon)</text>
  <text x="110" y="340" class="efe-sub">r = 3GM/c² (photon sphere)</text>
  <text x="110" y="360" class="efe-sub">r = 6GM/c² (ISCO)</text>
  <text x="110" y="380" class="efe-sub">r = 0 (singularity)</text>
</svg>