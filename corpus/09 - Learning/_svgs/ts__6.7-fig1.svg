<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .ts67-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.3s ease; }
    .ts67-box:hover { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); transform: translateY(-2px); }
    .ts67-accent { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 8; animation: pulseGlow 2.5s infinite alternate; }
    .ts67-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .ts67-title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .ts67-note { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .ts67-section { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

    @keyframes pulseGlow {
      from { filter: drop-shadow(0 0 2px var(--interactive-accent, #58a6ff)); }
      to { filter: drop-shadow(0 0 8px var(--interactive-accent, #58a6ff)); stroke-width: 2.5; }
    }
  </style>

  <text x="350" y="22" class="ts67-title">Frontend Frameworks — TypeScript Integration Patterns</text>

  <!-- Shared layer -->
  <text x="350" y="50" class="ts67-section">shared typescript patterns (all frameworks)</text>
  <rect x="50" y="58" width="600" height="40" class="ts67-accent"/>
  <text x="350" y="78" class="ts67-label">Typed Props | Typed Events | Typed State | Generic Components | Typed Stores</text>
  <text x="350" y="92" class="ts67-note">These patterns are universal — learn once, apply everywhere</text>

  <!-- React -->
  <rect x="20" y="120" width="155" height="100" class="ts67-box"/>
  <text x="97" y="140" class="ts67-label">React + TSX</text>
  <text x="97" y="158" class="ts67-note">• FC&lt;Props&gt; / Props destructure</text>
  <text x="97" y="171" class="ts67-note">• useState&lt;T&gt;, useRef&lt;T&gt;</text>
  <text x="97" y="184" class="ts67-note">• Server Components</text>
  <text x="97" y="197" class="ts67-note">• Generic components</text>
  <text x="97" y="212" class="ts67-note">Market: #1 (jobs)</text>

  <!-- Vue -->
  <rect x="185" y="120" width="155" height="100" class="ts67-box"/>
  <text x="262" y="140" class="ts67-label">Vue 3 + TS</text>
  <text x="262" y="158" class="ts67-note">• &lt;script setup lang="ts"&gt;</text>
  <text x="262" y="171" class="ts67-note">• defineProps&lt;T&gt;()</text>
  <text x="262" y="184" class="ts67-note">• defineEmits&lt;T&gt;()</text>
  <text x="262" y="197" class="ts67-note">• Composables (typed)</text>
  <text x="262" y="212" class="ts67-note">Market: #2</text>

  <!-- Svelte -->
  <rect x="350" y="120" width="155" height="100" class="ts67-box"/>
  <text x="427" y="140" class="ts67-label">Svelte 5 + TS</text>
  <text x="427" y="158" class="ts67-note">• $props() typed</text>
  <text x="427" y="171" class="ts67-note">• $state&lt;T&gt;()</text>
  <text x="427" y="184" class="ts67-note">• $derived()</text>
  <text x="427" y="197" class="ts67-note">• Runes (new in v5)</text>
  <text x="427" y="212" class="ts67-note">Market: growing</text>

  <!-- SolidJS -->
  <rect x="515" y="120" width="165" height="100" class="ts67-box"/>
  <text x="597" y="140" class="ts67-label">SolidJS + TS</text>
  <text x="597" y="158" class="ts67-note">• createSignal&lt;T&gt;()</text>
  <text x="597" y="171" class="ts67-note">• createMemo&lt;T&gt;()</text>
  <text x="597" y="184" class="ts67-note">• No VDOM (fine-grained)</text>
  <text x="597" y="197" class="ts67-note">• React-like JSX syntax</text>
  <text x="597" y="212" class="ts67-note">Market: niche</text>

  <!-- Reactivity model comparison -->
  <text x="350" y="245" class="ts67-section">reactivity model</text>
  <rect x="20" y="253" width="155" height="35" class="ts67-box"/>
  <text x="97" y="268" class="ts67-label">VDOM + Reconciler</text>
  <text x="97" y="282" class="ts67-note">Re-renders entire subtree</text>

  <rect x="185" y="253" width="155" height="35" class="ts67-box"/>
  <text x="262" y="268" class="ts67-label">Proxy-based Refs</text>
  <text x="262" y="282" class="ts67-note">Fine-grained tracking</text>

  <rect x="350" y="253" width="155" height="35" class="ts67-box"/>
  <text x="427" y="268" class="ts67-label">Compiler Runes</text>
  <text x="427" y="282" class="ts67-note">Compile-time reactivity</text>

  <rect x="515" y="253" width="165" height="35" class="ts67-box"/>
  <text x="597" y="268" class="ts67-label">Signals (no VDOM)</text>
  <text x="597" y="282" class="ts67-note">Surgical DOM updates</text>
</svg>
