<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sub    { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .box    { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .client { fill: #1a3d1a; stroke: #51cf66; stroke-width: 1.5; }
    .server { fill: #1a3a3d; stroke: #4dabf7; stroke-width: 1.5; }
    .seg    { fill: #2d1a3d; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.2; }
    .flag   { fill: #3d1a1a; stroke: #ff6b6b; stroke-width: 1; }
    .cc     { fill: #3d3a1a; stroke: #ffd93d; stroke-width: 1.2; }
    .arrow  { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; marker-end: url(#ta); }
    .sync   { stroke: #51cf66; stroke-width: 1.8; fill: none; marker-end: url(#ga); }
    .ack    { stroke: #4dabf7; stroke-width: 1.8; fill: none; marker-end: url(#ba); }
    .fin    { stroke: #ff6b6b; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; marker-end: url(#ra); }
  </style>
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/></marker>
    <marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#51cf66"/></marker>
    <marker id="ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4dabf7"/></marker>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff6b6b"/></marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">TCP: Segment Structure · 3-Way Handshake · Sliding Window · Congestion Control (CUBIC vs BBR)</text>

  <!-- TCP Segment structure top-left -->
  <text x="175" y="44" class="label" text-anchor="middle" font-weight="bold">TCP Segment Header</text>
  <rect x="20" y="52" width="310" height="132" rx="3" class="box"/>
  <!-- Row 1 -->
  <rect x="24" y="58" width="148" height="20" class="seg"/>
  <text x="98" y="71" class="sub" text-anchor="middle">Source Port (16 bits)</text>
  <rect x="172" y="58" width="154" height="20" class="seg"/>
  <text x="249" y="71" class="sub" text-anchor="middle">Destination Port (16 bits)</text>
  <!-- Row 2 -->
  <rect x="24" y="80" width="302" height="20" fill="#2d3a1a" stroke="#51cf66" stroke-width="1.2"/>
  <text x="175" y="93" class="sub" text-anchor="middle">Sequence Number (32 bits)</text>
  <!-- Row 3 -->
  <rect x="24" y="102" width="302" height="20" fill="#2d3a1a" stroke="#51cf66" stroke-width="1.2"/>
  <text x="175" y="115" class="sub" text-anchor="middle">Acknowledgment Number (32 bits)</text>
  <!-- Row 4 — flags -->
  <rect x="24" y="124" width="50" height="20" fill="#3d3a1a" stroke="#ffd93d" stroke-width="1"/>
  <text x="49" y="137" class="sub" text-anchor="middle">DOffset</text>
  <rect x="74" y="124" width="100" height="20" class="flag"/>
  <text x="124" y="137" class="sub" text-anchor="middle">Flags: SYN ACK FIN RST PSH URG</text>
  <rect x="174" y="124" width="78" height="20" class="seg"/>
  <text x="213" y="137" class="sub" text-anchor="middle">Window (16b)</text>
  <rect x="252" y="124" width="74" height="20" fill="#3d2a1a" stroke="#ffa94d" stroke-width="1"/>
  <text x="289" y="137" class="sub" text-anchor="middle">Checksum (16b)</text>
  <!-- Row 5 -->
  <rect x="24" y="146" width="302" height="20" fill="#1a1a2a" stroke="var(--text-muted,#8b949e)" stroke-width="0.8"/>
  <text x="175" y="159" class="sub" text-anchor="middle">Options (0–40 bytes) + Payload follows…</text>

  <!-- Flags legend -->
  <text x="24" y="192" class="mono">SYN=connection start · ACK=ack valid · FIN=graceful close · RST=abrupt reset · PSH=flush · URG=urgent ptr</text>

  <!-- 3-way handshake -->
  <text x="360" y="44" class="label" text-anchor="middle" font-weight="bold">3-Way Handshake + 4-Way FIN</text>
  <rect x="340" y="52" width="360" height="180" rx="3" class="box"/>

  <rect x="352" y="62" width="56" height="24" rx="4" class="client"/>
  <text x="380" y="78" class="label" text-anchor="middle">Client</text>
  <rect x="632" y="62" width="56" height="24" rx="4" class="server"/>
  <text x="660" y="78" class="label" text-anchor="middle">Server</text>

  <!-- SYN -->
  <line x1="408" y1="96" x2="632" y2="110" stroke="#51cf66" stroke-width="1.8" marker-end="url(#ga)"/>
  <text x="520" y="102" class="sub" text-anchor="middle" fill="#51cf66">SYN  seq=x</text>
  <!-- SYN-ACK -->
  <line x1="632" y1="120" x2="408" y2="134" stroke="#ffd93d" stroke-width="1.8" marker-end="url(#ta)"/>
  <text x="520" y="125" class="sub" text-anchor="middle" fill="#ffd93d">SYN-ACK  seq=y ack=x+1</text>
  <!-- ACK -->
  <line x1="408" y1="142" x2="632" y2="156" stroke="#4dabf7" stroke-width="1.8" marker-end="url(#ba)"/>
  <text x="520" y="149" class="sub" text-anchor="middle" fill="#4dabf7">ACK  seq=x+1 ack=y+1  ← connection ESTABLISHED</text>

  <!-- FIN teardown -->
  <line x1="408" y1="168" x2="632" y2="182" class="fin"/>
  <text x="520" y="174" class="sub" text-anchor="middle" fill="#ff6b6b">FIN</text>
  <line x1="632" y1="190" x2="408" y2="204" class="fin"/>
  <text x="520" y="196" class="sub" text-anchor="middle" fill="#ff6b6b">ACK / FIN</text>
  <line x1="408" y1="212" x2="632" y2="220" class="fin"/>
  <text x="520" y="216" class="sub" text-anchor="middle" fill="#ff6b6b">ACK  → TIME_WAIT (2×MSL)</text>

  <!-- Sliding Window + Congestion Control bottom -->
  <rect x="20" y="210" width="680" height="196" rx="3" class="box"/>
  <text x="360" y="230" class="label" text-anchor="middle" font-weight="bold">Sliding Window · Congestion Control State Machine</text>

  <!-- Window formula -->
  <text x="30" y="250" class="mono">Effective window = min(rwnd, cwnd)  ·  rwnd=receiver advertised  ·  cwnd=sender's congestion estimate</text>
  <text x="30" y="265" class="mono">Max throughput ≈ window_size / RTT    e.g. 1 MB / 0.1 s = 80 Mbit/s</text>

  <!-- CC state diagram boxes -->
  <rect x="30"  y="278" width="120" height="36" rx="4" class="cc"/>
  <text x="90"  y="295" class="label" text-anchor="middle">Slow Start</text>
  <text x="90"  y="308" class="sub" text-anchor="middle">cwnd += 1 MSS/ACK (exp)</text>

  <rect x="188" y="278" width="140" height="36" rx="4" class="cc"/>
  <text x="258" y="295" class="label" text-anchor="middle">Congestion Avoidance</text>
  <text x="258" y="308" class="sub" text-anchor="middle">cwnd += 1 MSS/RTT (linear)</text>

  <rect x="366" y="278" width="130" height="36" rx="4" class="flag"/>
  <text x="431" y="295" class="label" text-anchor="middle">Fast Retransmit</text>
  <text x="431" y="308" class="sub" text-anchor="middle">3 dup ACKs → retransmit</text>

  <rect x="532" y="278" width="130" height="36" rx="4" fill="#2d3a1a" stroke="#51cf66" stroke-width="1.2"/>
  <text x="597" y="295" class="label" text-anchor="middle">Fast Recovery</text>
  <text x="597" y="308" class="sub" text-anchor="middle">ssthresh=cwnd/2; no SS</text>

  <!-- Arrows between CC states -->
  <line x1="150" y1="296" x2="188" y2="296" class="arrow"/>
  <text x="169" y="291" class="sub" text-anchor="middle">cwnd≥ssthresh</text>
  <line x1="328" y1="296" x2="366" y2="296" class="arrow"/>
  <text x="347" y="291" class="sub" text-anchor="middle">3 dup ACK</text>
  <line x1="496" y1="296" x2="532" y2="296" class="arrow"/>

  <!-- CUBIC vs BBR -->
  <text x="30"  y="338" class="label" font-weight="bold">CUBIC (default Linux)</text>
  <text x="30"  y="352" class="sub">Loss-based: grow cwnd as cubic function of time since last loss · ssthresh = 0.7 × cwnd on loss</text>
  <text x="30"  y="365" class="sub">Works well in high-BDP links but over-fills buffers ("buffer bloat")</text>

  <text x="380" y="338" class="label" font-weight="bold">BBR (Google 2016 · v3 2023)</text>
  <text x="380" y="352" class="sub">Model-based: estimates bottleneck bandwidth (BtlBw) and min RTT · fills pipe without queue</text>
  <text x="380" y="365" class="sub">BDP probe: cwnd ≈ BtlBw × RTprop · not triggered by loss alone</text>

  <text x="30"  y="392" class="mono">TIME_WAIT: client holds closed socket for 2×MSL (≈60–240 s) to absorb late segments · causes port exhaustion under high connection churn</text>
  <text x="30"  y="404" class="mono">Fix: SO_REUSEADDR, tcp_tw_reuse sysctl, or persistent connections (HTTP/2 keep-alive)</text>
</svg>
