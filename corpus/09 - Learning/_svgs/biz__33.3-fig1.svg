<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .bold { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .vb-bar { fill: var(--interactive-accent, #58a6ff); opacity: 0.7; animation: barPulse 3s infinite ease-in-out; }
    .cp-bar { fill: #ff6b6b; opacity: 0.6; }
    .comp-bar { fill: #ffd93d; opacity: 0.6; }
    .tier-solo { fill: #2d3748; stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .tier-builder { fill: #1a3a5c; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; animation: builderPulse 3s infinite ease-in-out; }
    .tier-studio { fill: #1a3a5c; stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .highlight { fill: #ffd93d; opacity: 0.15; stroke: #ffd93d; stroke-width: 1.5; }
    .arrow { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; }
    .psm-line { stroke-width: 1.5; fill: none; stroke-dasharray: 8 4; animation: dash 2s linear infinite; }

    @keyframes dash {
      to {
        stroke-dashoffset: -20;
      }
    }
    @keyframes builderPulse {
      0%, 100% { stroke-width: 2; stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 1px #ffd93d); }
      50% { stroke-width: 3; stroke: #ffd93d; filter: drop-shadow(0 0 6px #ffd93d); }
    }
    @keyframes barPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.95; }
    }
  </style>
  <defs>
    <marker id="biz3-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
    <marker id="biz3-arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">Pricing Strategy Matrix — Cost-Plus vs Value-Based + 3-Tier Design</text>

  <!-- LEFT: Pricing Strategy Comparison -->
  <rect x="10" y="30" width="240" height="170" class="box" rx="4"/>
  <text x="130" y="48" class="bold" text-anchor="middle">Pricing Strategy Comparison</text>
  <text x="130" y="62" class="sublabel" text-anchor="middle">Developer Tool Example</text>

  <!-- Axis labels -->
  <text x="30" y="78" class="sublabel">Method</text>
  <text x="115" y="78" class="sublabel">Price/mo</text>
  <text x="170" y="78" class="sublabel">Margin</text>
  <text x="215" y="78" class="sublabel">Verdict</text>
  <line x1="18" y1="82" x2="242" y2="82" stroke="var(--text-muted, #8b949e)" stroke-width="0.5"/>

  <!-- Cost-plus row -->
  <rect x="18" y="85" width="222" height="22" class="cp-bar" rx="2"/>
  <text x="30" y="100" class="label">Cost-plus</text>
  <text x="115" y="100" class="label" text-anchor="middle">$9–$19</text>
  <text x="175" y="100" class="sublabel" text-anchor="middle">Low</text>
  <text x="215" y="100" class="sublabel" text-anchor="middle">❌ Wrong</text>

  <!-- Competitor row -->
  <rect x="18" y="110" width="222" height="22" class="comp-bar" rx="2"/>
  <text x="30" y="125" class="label">Competitor-based</text>
  <text x="115" y="125" class="label" text-anchor="middle">$19–$39</text>
  <text x="175" y="125" class="sublabel" text-anchor="middle">Med</text>
  <text x="215" y="125" class="sublabel" text-anchor="middle">⚠️ Weak</text>

  <!-- Value-based row -->
  <rect x="18" y="135" width="222" height="22" class="vb-bar" rx="2"/>
  <text x="30" y="150" class="label">Value-based</text>
  <text x="115" y="150" class="label" text-anchor="middle">$49–$199</text>
  <text x="175" y="150" class="sublabel" text-anchor="middle">High</text>
  <text x="215" y="150" class="sublabel" text-anchor="middle">✅ Right</text>

  <text x="18" y="175" class="sublabel">Value = 10–20% of economic value delivered.</text>
  <text x="18" y="187" class="sublabel">Dev saves 8 hrs/mo @ $40/hr = $320 value.</text>
  <text x="18" y="199" class="sublabel">10% capture = $32–64/mo is fair and rational.</text>

  <!-- MIDDLE: van Westendorp PSM -->
  <rect x="260" y="30" width="195" height="170" class="box" rx="4"/>
  <text x="357" y="48" class="bold" text-anchor="middle">van Westendorp PSM</text>
  <text x="357" y="60" class="sublabel" text-anchor="middle">Acceptable Price Range Discovery</text>

  <!-- Price axis -->
  <line x1="275" y1="145" x2="445" y2="145" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="275" y="158" class="sublabel">$0</text>
  <text x="340" y="158" class="sublabel">$25</text>
  <text x="400" y="158" class="sublabel">$75</text>
  <text x="430" y="158" class="sublabel">$150</text>

  <!-- Curves (simplified stylized) -->
  <!-- Too cheap line (rises) -->
  <polyline points="275,140 295,138 315,130 335,118 360,98 390,78 420,65 445,55" class="psm-line" stroke="#ff6b6b"/>
  <!-- Too expensive line (rises) -->
  <polyline points="275,65 295,72 315,82 335,95 360,110 390,125 420,135 445,142" class="psm-line" stroke="#51cf66"/>
  <!-- APR shaded zone -->
  <polygon points="315,82 360,98 360,110 315,130" fill="#ffd93d" opacity="0.2"/>

  <!-- Markers -->
  <circle cx="315" cy="106" r="4" fill="#ffd93d"/>
  <text x="310" y="118" class="sublabel" fill="#ffd93d">PMC</text>
  <circle cx="390" cy="102" r="4" fill="#51cf66"/>
  <text x="385" y="114" class="sublabel" fill="#51cf66">IDP</text>
  <circle cx="420" cy="100" r="4" fill="#ff6b6b"/>
  <text x="415" y="88" class="sublabel" fill="#ff6b6b">PME</text>

  <text x="275" y="175" class="sublabel">PMC: too-cheap/expensive cross</text>
  <text x="275" y="186" class="sublabel">IDP: bargain/expensive cross (sweet spot)</text>
  <text x="275" y="197" class="sublabel">APR: zone between PMC and PME</text>

  <!-- RIGHT: 3-Tier Design -->
  <rect x="465" y="30" width="245" height="170" class="box" rx="4"/>
  <text x="587" y="48" class="bold" text-anchor="middle">3-Tier SaaS Pricing</text>
  <text x="587" y="60" class="sublabel" text-anchor="middle">Outcome-named tiers · Decoy structure</text>

  <!-- Tier 1 — Solo -->
  <rect x="474" y="66" width="70" height="120" rx="4" class="tier-solo"/>
  <text x="509" y="82" class="label" text-anchor="middle">Solo</text>
  <text x="509" y="96" class="bold" text-anchor="middle">$29/mo</text>
  <line x1="480" y1="102" x2="538" y2="102" stroke="var(--text-muted, #8b949e)" stroke-width="0.5"/>
  <text x="509" y="115" class="sublabel" text-anchor="middle">100 AI gen/mo</text>
  <text x="509" y="127" class="sublabel" text-anchor="middle">1 project</text>
  <text x="509" y="139" class="sublabel" text-anchor="middle">Core features</text>
  <text x="509" y="178" class="sublabel" text-anchor="middle">Entry tier</text>

  <!-- Tier 2 — Builder (highlighted) -->
  <rect x="552" y="58" width="78" height="128" rx="4" class="tier-builder"/>
  <rect x="552" y="58" width="78" height="18" rx="4" fill="#ffd93d" opacity="0.7"/>
  <text x="591" y="71" class="sublabel" text-anchor="middle" fill="#1a1a1a" font-weight="bold">⭐ POPULAR</text>
  <text x="591" y="88" class="label" text-anchor="middle">Builder</text>
  <text x="591" y="102" class="bold" text-anchor="middle">$79/mo</text>
  <line x1="558" y1="108" x2="624" y2="108" stroke="var(--interactive-accent, #58a6ff)" stroke-width="0.5"/>
  <text x="591" y="121" class="sublabel" text-anchor="middle">Unlimited gen</text>
  <text x="591" y="133" class="sublabel" text-anchor="middle">10 projects</text>
  <text x="591" y="145" class="sublabel" text-anchor="middle">All features</text>
  <text x="591" y="157" class="sublabel" text-anchor="middle">Priority email</text>
  <text x="591" y="178" class="sublabel" text-anchor="middle">Target tier →</text>

  <!-- Tier 3 — Studio -->
  <rect x="638" y="66" width="65" height="120" rx="4" class="tier-studio"/>
  <text x="670" y="82" class="label" text-anchor="middle">Studio</text>
  <text x="670" y="96" class="bold" text-anchor="middle">$179/mo</text>
  <line x1="644" y1="102" x2="697" y2="102" stroke="var(--text-muted, #8b949e)" stroke-width="0.5"/>
  <text x="670" y="115" class="sublabel" text-anchor="middle">Everything+</text>
  <text x="670" y="127" class="sublabel" text-anchor="middle">5 seats</text>
  <text x="670" y="139" class="sublabel" text-anchor="middle">Priority support</text>
  <text x="670" y="151" class="sublabel" text-anchor="middle">Team mgmt</text>
  <text x="670" y="178" class="sublabel" text-anchor="middle">Anchor tier</text>

  <!-- BOTTOM: Freemium Math -->
  <rect x="10" y="215" width="340" height="95" class="box" rx="4"/>
  <text x="180" y="233" class="bold" text-anchor="middle">Freemium Break-Even Math</text>
  <text x="20" y="250" class="sublabel">Scenario: $50/mo product · 3% freemium-to-paid conversion · $0.50/mo per free user cost</text>
  <text x="20" y="264" class="label">Goal: $1,000 MRR → need 20 paid customers</text>
  <text x="20" y="278" class="label">At 3% conversion: need 667 free users ($333/mo cost)</text>
  <text x="20" y="292" class="label">Net: $1,000 − $333 = $667 net from 667 free users</text>
  <text x="20" y="304" class="sublabel">⚠ AI inference makes free-tier cost much higher — gate AI usage aggressively</text>

  <!-- RIGHT BOTTOM: Annual vs Monthly -->
  <rect x="360" y="215" width="350" height="95" class="box" rx="4"/>
  <text x="535" y="233" class="bold" text-anchor="middle">Annual vs Monthly — The Churn Math</text>
  <text x="368" y="250" class="sublabel">Monthly subscriber at $79/mo with 3% monthly churn: Avg LTV = $79/0.03 = $2,633</text>
  <text x="368" y="264" class="sublabel">Annual subscriber at $699/yr (≈11.7mo): churn 5× less likely; LTV ~3–4× higher</text>
  <text x="368" y="278" class="label">Rule: offer annual at 2 months free (83% of monthly × 12). Always show both.</text>
  <text x="368" y="292" class="label">Annual plan upfront cash improves runway. Locked-in customer reduces churn risk.</text>
  <text x="368" y="304" class="sublabel">Annual customers are retained customers — they have to actively decide to cancel</text>

  <!-- Bottom axis: the 5–10× undercharge insight -->
  <text x="360" y="328" class="bold" text-anchor="middle">The Undercharging Gap</text>
  <!-- Bar chart showing undercharge -->
  <rect x="60" y="335" width="30" height="55" fill="#ff6b6b" opacity="0.7" rx="2"/>
  <text x="75" y="400" class="sublabel" text-anchor="middle">Cost-plus</text>
  <text x="75" y="333" class="sublabel" text-anchor="middle">$9</text>

  <rect x="135" y="320" width="30" height="70" fill="#ffd93d" opacity="0.6" rx="2"/>
  <text x="150" y="400" class="sublabel" text-anchor="middle">Competitor</text>
  <text x="150" y="318" class="sublabel" text-anchor="middle">$29</text>

  <rect x="210" y="295" width="30" height="95" fill="var(--interactive-accent, #58a6ff)" opacity="0.7" rx="2"/>
  <text x="225" y="400" class="sublabel" text-anchor="middle">Value-based</text>
  <text x="225" y="293" class="sublabel" text-anchor="middle">$79</text>

  <rect x="285" y="270" width="30" height="120" fill="#51cf66" opacity="0.6" rx="2"/>
  <text x="300" y="400" class="sublabel" text-anchor="middle">Max WTP</text>
  <text x="300" y="268" class="sublabel" text-anchor="middle">$149</text>

  <text x="500" y="360" class="sublabel">Most developers charge at cost-plus or</text>
  <text x="500" y="374" class="sublabel">competitor level. Value-based pricing</text>
  <text x="500" y="388" class="sublabel">captures 5–10× more revenue for the</text>
  <text x="500" y="402" class="sublabel">exact same product — just reframed.</text>
</svg>
