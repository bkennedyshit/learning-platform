<svg viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <style>
    .nax { stroke:var(--text-muted, #8b949e); stroke-width:1.5; fill:none; }
    .ncv { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none; }
    .npt { fill:var(--interactive-accent, #58a6ff); }
    .nzr { fill:none; stroke:var(--interactive-accent, #58a6ff); stroke-width:2; }
    .nlb { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--text-normal, #c9d1d9); }
    .nla { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
  </style>
  <!-- Number line -->
  <line x1="30" y1="80" x2="490" y2="80" class="nax"/>
  <!-- p(λ) parabola crossing at λ₁=1 and λ₂=4 -->
  <!-- Scale: 0 at x=100, 1 unit = 80px -->
  <!-- λ=0→x=100, λ=1→x=180, λ=2→x=260, λ=3→x=340, λ=4→x=420 -->
  <path d="M 100 30 Q 300 160 420 30" class="ncv" stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" values="600;0;0;600;600" keyTimes="0;0.4;0.8;0.9;1" dur="6s" repeatCount="indefinite" />
  </path>
  <!-- Roots -->
  <circle cx="180" cy="80" r="6" class="npt" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.8;0.9;1" dur="6s" repeatCount="indefinite" />
  </circle>
  <text x="180" y="100" class="nla" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.8;0.9;1" dur="6s" repeatCount="indefinite" />λ₁ = 1</text>
  <circle cx="420" cy="80" r="6" class="npt" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.4;0.8;0.9;1" dur="6s" repeatCount="indefinite" />
  </circle>
  <text x="420" y="100" class="nla" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.4;0.8;0.9;1" dur="6s" repeatCount="indefinite" />λ₂ = 4</text>
  <!-- Axis label -->
  <text x="494" y="84" class="nlb">λ</text>
  <!-- p(λ) label -->
  <text x="300" y="155" class="nlb" text-anchor="middle">Characteristic polynomial p(λ) — roots are eigenvalues</text>
  <!-- Tick marks -->
  <line x1="100" y1="76" x2="100" y2="84" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="100" y="99" class="nlb" text-anchor="middle">0</text>
  <line x1="260" y1="76" x2="260" y2="84" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="260" y="99" class="nlb" text-anchor="middle">2</text>
</svg>