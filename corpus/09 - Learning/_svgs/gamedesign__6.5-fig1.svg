<svg viewBox="0 0 650 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <style>
    .node { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 2; rx: 8; transition: all 0.2s; cursor: pointer; }
    .node:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .branch { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#narr-arrow); }
    .branch-alt { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; marker-end: url(#narr-arrow-muted); }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; font-weight: bold; }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .type-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-accent, #79c0ff); text-anchor: start; font-weight: bold; }
    
    /* Unique Story emergence glow */
    @keyframes story-emerge {
      0%, 100% { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 2px var(--interactive-accent, #58a6ff)); }
      50% { stroke: var(--text-accent, #79c0ff); filter: drop-shadow(0 0 8px var(--text-accent, #79c0ff)); }
    }
    .node-story {
      stroke: var(--interactive-accent, #58a6ff);
      stroke-width: 2.5;
      animation: story-emerge 2s ease-in-out infinite;
    }
    
    .node-group { transition: transform 0.2s ease; }
    .node-group:hover { transform: translateY(-1px); }
  </style>
  <defs>
    <marker id="narr-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="narr-arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>

  <text x="325" y="25" class="title">Narrative Structures in Games</text>

  <!-- Linear -->
  <text x="60" y="70" class="type-label">Linear</text>
  <g class="node-group"><rect x="100" y="55" width="60" height="30" class="node"/><text x="130" y="74" class="label">A</text></g>
  <g class="node-group"><rect x="200" y="55" width="60" height="30" class="node"/><text x="230" y="74" class="label">B</text></g>
  <g class="node-group"><rect x="300" y="55" width="60" height="30" class="node"/><text x="330" y="74" class="label">C</text></g>
  <g class="node-group"><rect x="400" y="55" width="60" height="30" class="node"/><text x="430" y="74" class="label">End</text></g>
  <line x1="160" y1="70" x2="195" y2="70" class="branch"/>
  <line x1="260" y1="70" x2="295" y2="70" class="branch"/>
  <line x1="360" y1="70" x2="395" y2="70" class="branch"/>
  
  <!-- Linear Flow Particles -->
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="160" to="195" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="70" to="70" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="260" to="295" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" from="70" to="70" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="360" to="395" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" from="70" to="70" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="560" y="74" class="sublabel">Ex: Uncharted, Last of Us</text>

  <!-- Branching -->
  <text x="60" y="150" class="type-label">Branching</text>
  <g class="node-group"><rect x="100" y="135" width="60" height="30" class="node"/><text x="130" y="154" class="label">Start</text></g>
  <g class="node-group"><rect x="220" y="115" width="60" height="30" class="node"/><text x="250" y="134" class="label">B1</text></g>
  <g class="node-group"><rect x="220" y="155" width="60" height="30" class="node"/><text x="250" y="174" class="label">B2</text></g>
  <g class="node-group"><rect x="340" y="100" width="60" height="30" class="node"/><text x="370" y="119" class="label">End A</text></g>
  <g class="node-group"><rect x="340" y="155" width="60" height="30" class="node"/><text x="370" y="174" class="label">End B</text></g>
  <line x1="160" y1="145" x2="215" y2="130" class="branch"/>
  <line x1="160" y1="155" x2="215" y2="170" class="branch"/>
  <line x1="280" y1="130" x2="335" y2="115" class="branch"/>
  <line x1="280" y1="170" x2="335" y2="170" class="branch"/>
  
  <!-- Branching Flow Particles -->
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="160" to="215" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="145" to="130" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="160" to="215" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" from="155" to="170" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="280" to="335" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" from="130" to="115" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="2" fill="var(--interactive-accent, #58a6ff)">
    <animate attributeName="cx" from="280" to="335" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" from="170" to="170" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <text x="560" y="150" class="sublabel">Ex: Witcher 3, Detroit</text>

  <!-- Hub and Spoke -->
  <text x="60" y="240" class="type-label">Hub+Spoke</text>
  <g class="node-group"><rect x="200" y="225" width="60" height="30" class="node"/><text x="230" y="244" class="label">Hub</text></g>
  <g class="node-group"><rect x="100" y="215" width="50" height="25" class="node"/><text x="125" y="231" class="sublabel">Quest</text></g>
  <g class="node-group"><rect x="100" y="245" width="50" height="25" class="node"/><text x="125" y="261" class="sublabel">Quest</text></g>
  <g class="node-group"><rect x="300" y="215" width="50" height="25" class="node"/><text x="325" y="231" class="sublabel">Quest</text></g>
  <g class="node-group"><rect x="300" y="245" width="50" height="25" class="node"/><text x="325" y="261" class="sublabel">Quest</text></g>
  <line x1="155" y1="227" x2="195" y2="237" class="branch-alt"/>
  <line x1="155" y1="258" x2="195" y2="248" class="branch-alt"/>
  <line x1="265" y1="237" x2="295" y2="227" class="branch-alt"/>
  <line x1="265" y1="248" x2="295" y2="258" class="branch-alt"/>
  
  <!-- Hub & Spoke Back-and-Forth Particles -->
  <circle r="1.5" fill="var(--text-muted, #8b949e)">
    <animate attributeName="cx" values="155;195;155" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="227;237;227" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="var(--text-muted, #8b949e)">
    <animate attributeName="cx" values="155;195;155" dur="3s" repeatCount="indefinite" begin="0.75s"/>
    <animate attributeName="cy" values="258;248;258" dur="3s" repeatCount="indefinite" begin="0.75s"/>
  </circle>
  <circle r="1.5" fill="var(--text-muted, #8b949e)">
    <animate attributeName="cx" values="265;295;265" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="237;227;237" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle r="1.5" fill="var(--text-muted, #8b949e)">
    <animate attributeName="cx" values="265;295;265" dur="3s" repeatCount="indefinite" begin="2.25s"/>
    <animate attributeName="cy" values="248;258;248" dur="3s" repeatCount="indefinite" begin="2.25s"/>
  </circle>
  <text x="560" y="240" class="sublabel">Ex: Zelda BotW, Stardew</text>

  <!-- Emergent -->
  <text x="60" y="330" class="type-label">Emergent</text>
  <g class="node-group"><rect x="110" y="310" width="45" height="30" class="node"/><text x="132" y="329" class="sublabel">Sys</text></g>
  <g class="node-group"><rect x="175" y="300" width="45" height="30" class="node"/><text x="197" y="319" class="sublabel">Sys</text></g>
  <g class="node-group"><rect x="175" y="335" width="45" height="30" class="node"/><text x="197" y="354" class="sublabel">Sys</text></g>
  <g class="node-group"><rect x="240" y="310" width="45" height="30" class="node"/><text x="262" y="329" class="sublabel">Sys</text></g>
  
  <!-- Pulse active Emergent Story block -->
  <g class="node-group"><rect x="310" y="315" width="60" height="30" class="node node-story"/><text x="340" y="334" class="label">Story!</text></g>
  
  <line x1="155" y1="320" x2="170" y2="315" class="branch-alt"/>
  <line x1="155" y1="330" x2="170" y2="345" class="branch-alt"/>
  <line x1="220" y1="315" x2="235" y2="320" class="branch-alt"/>
  <line x1="220" y1="350" x2="235" y2="335" class="branch-alt"/>
  <line x1="285" y1="325" x2="305" y2="328" class="branch"/>
  
  <!-- Emergent Network firing signals -->
  <circle r="1.5" fill="var(--text-accent, #79c0ff)">
    <animate attributeName="cx" from="155" to="170" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="320" to="315" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="var(--text-accent, #79c0ff)">
    <animate attributeName="cx" from="155" to="170" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="cy" from="330" to="345" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle r="1.5" fill="var(--text-accent, #79c0ff)">
    <animate attributeName="cx" from="220" to="235" dur="0.8s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="cy" from="315" to="320" dur="0.8s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  <circle r="1.5" fill="var(--text-accent, #79c0ff)">
    <animate attributeName="cx" from="220" to="235" dur="1.1s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="cy" from="350" to="335" dur="1.1s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <!-- Emergent Story Output Flow (rapid, intense) -->
  <circle r="2.5" fill="var(--interactive-accent, #58a6ff)" filter="drop-shadow(0 0 3px var(--interactive-accent, #58a6ff))">
    <animate attributeName="cx" from="285" to="305" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="325" to="328" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  
  <text x="560" y="330" class="sublabel">Ex: Dwarf Fortress, Minecraft</text>
</svg>
