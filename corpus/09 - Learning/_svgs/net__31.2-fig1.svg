<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sub    { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .box    { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .router { fill: #1a3a3d; stroke: #4dabf7; stroke-width: 1.5; }
    .as     { fill: #2d1a3d; stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.5; }
    .net    { fill: #3d3a1a; stroke: #ffd93d; stroke-width: 1.2; }
    .path   { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#b-arr); }
    .alt    { stroke: #ffa94d; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; marker-end: url(#o-arr); }
  </style>
  <defs>
    <marker id="b-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="o-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffa94d"/>
    </marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">IPv4/IPv6 Subnetting · CIDR · Routing Algorithms · BGP AS-Path</text>

  <!-- IPv4 header mini diagram -->
  <text x="140" y="44" class="label" text-anchor="middle" font-weight="bold">IPv4 Header (key fields)</text>
  <rect x="20" y="52" width="240" height="130" rx="3" class="box"/>

  <!-- Row 1 -->
  <rect x="24" y="58" width="30" height="22" fill="#3d3a1a" stroke="#ffd93d" stroke-width="1"/>
  <text x="39" y="70" class="sub" text-anchor="middle">Ver 4b</text>
  <rect x="54" y="58" width="30" height="22" fill="#3d3a1a" stroke="#ffd93d" stroke-width="1"/>
  <text x="69" y="70" class="sub" text-anchor="middle">IHL 4b</text>
  <rect x="84" y="58" width="40" height="22" fill="#2d1a3d" stroke="#748ffc" stroke-width="1"/>
  <text x="104" y="70" class="sub" text-anchor="middle">DSCP/ECN</text>
  <rect x="124" y="58" width="60" height="22" fill="#1a3d1a" stroke="#51cf66" stroke-width="1"/>
  <text x="154" y="70" class="sub" text-anchor="middle">Total Length 16b</text>
  <rect x="184" y="58" width="72" height="22" fill="#3d2a1a" stroke="#ffa94d" stroke-width="1"/>
  <text x="220" y="70" class="sub" text-anchor="middle">Identification 16b</text>
  <!-- Row 2 -->
  <rect x="24" y="82" width="50" height="22" fill="#3d2a1a" stroke="#ffa94d" stroke-width="1"/>
  <text x="49" y="94" class="sub" text-anchor="middle">Flags 3b</text>
  <rect x="74" y="82" width="60" height="22" fill="#3d2a1a" stroke="#ffa94d" stroke-width="1"/>
  <text x="104" y="94" class="sub" text-anchor="middle">Frag Offset 13b</text>
  <rect x="134" y="82" width="30" height="22" fill="#3d1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="149" y="94" class="sub" text-anchor="middle">TTL 8b</text>
  <rect x="164" y="82" width="40" height="22" fill="#1a3a3d" stroke="#4dabf7" stroke-width="1"/>
  <text x="184" y="94" class="sub" text-anchor="middle">Proto 8b</text>
  <rect x="204" y="82" width="52" height="22" fill="#1a3d1a" stroke="#51cf66" stroke-width="1"/>
  <text x="230" y="94" class="sub" text-anchor="middle">Header CRC</text>
  <!-- Row 3 — Source IP -->
  <rect x="24" y="106" width="232" height="22" fill="#1a3a3d" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="140" y="120" class="sub" text-anchor="middle">Source IP Address (32 bits)</text>
  <!-- Row 4 — Dst IP -->
  <rect x="24" y="130" width="232" height="22" fill="#1a3a3d" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="140" y="144" class="sub" text-anchor="middle">Destination IP Address (32 bits)</text>
  <!-- Options + notes -->
  <text x="30" y="168" class="mono">Protocol field: 6=TCP 17=UDP 1=ICMP 89=OSPF</text>
  <text x="30" y="180" class="mono">TTL decremented each hop; 0 → ICMP "Time Exceeded"</text>

  <!-- CIDR / subnetting panel -->
  <text x="450" y="44" class="label" text-anchor="middle" font-weight="bold">CIDR Subnetting</text>
  <rect x="278" y="52" width="342" height="160" rx="3" class="box"/>
  <text x="290" y="72" class="mono">10.0.0.0/24  →  256 addresses  (10.0.0.0–10.0.0.255)</text>
  <text x="290" y="88" class="mono">10.0.0.0/25  →  128 addresses  (two subnets)</text>
  <text x="290" y="104" class="mono">10.0.0.0/26  →   64 addresses  (four subnets)</text>
  <text x="290" y="120" class="label" text-anchor="left">VLSM — Variable-Length Subnet Masking</text>
  <text x="290" y="136" class="mono">10.0.0.0/8    Class A  (RFC 1918 private)</text>
  <text x="290" y="150" class="mono">172.16.0.0/12  Class B  (RFC 1918)</text>
  <text x="290" y="164" class="mono">192.168.0.0/16 Class C  (RFC 1918)</text>
  <text x="290" y="178" class="mono">IPv6: 128-bit  →  2001:db8::/32 = documentation prefix</text>
  <text x="290" y="194" class="mono">Longest-prefix match: /24 beats /16 for same traffic</text>

  <!-- BGP AS-path diagram -->
  <text x="360" y="234" class="label" text-anchor="middle" font-weight="bold">BGP Autonomous System Path</text>
  <rect x="20" y="242" width="680" height="158" rx="3" class="box"/>

  <!-- AS boxes -->
  <rect x="30"  y="256" width="80" height="50" rx="6" class="as"/>
  <text x="70"  y="276" class="label" text-anchor="middle" font-weight="bold">AS 64496</text>
  <text x="70"  y="290" class="sub" text-anchor="middle">Origin ISP</text>
  <text x="70"  y="302" class="mono" text-anchor="middle">10.1.0.0/24</text>

  <rect x="170" y="256" width="80" height="50" rx="6" class="router"/>
  <text x="210" y="276" class="label" text-anchor="middle" font-weight="bold">AS 1239</text>
  <text x="210" y="290" class="sub" text-anchor="middle">Transit ISP A</text>

  <rect x="320" y="256" width="80" height="50" rx="6" class="router"/>
  <text x="360" y="276" class="label" text-anchor="middle" font-weight="bold">AS 3356</text>
  <text x="360" y="290" class="sub" text-anchor="middle">Transit ISP B</text>
  <text x="360" y="302" class="sub" text-anchor="middle">Lumen/Level3</text>

  <rect x="470" y="256" width="80" height="50" rx="6" class="router"/>
  <text x="510" y="276" class="label" text-anchor="middle" font-weight="bold">AS 15169</text>
  <text x="510" y="290" class="sub" text-anchor="middle">Google LLC</text>

  <rect x="600" y="256" width="90" height="50" rx="6" class="as"/>
  <text x="645" y="276" class="label" text-anchor="middle" font-weight="bold">AS 13335</text>
  <text x="645" y="290" class="sub" text-anchor="middle">Cloudflare</text>
  <text x="645" y="302" class="mono" text-anchor="middle">1.1.1.0/24</text>

  <!-- BGP paths -->
  <line x1="110" y1="281" x2="170" y2="281" class="path"/>
  <line x1="250" y1="281" x2="320" y2="281" class="path"/>
  <line x1="400" y1="281" x2="470" y2="281" class="path"/>
  <line x1="550" y1="281" x2="600" y2="281" class="path"/>

  <!-- alternate path -->
  <path d="M 250,290 Q 310,340 470,290" class="alt"/>
  <text x="360" y="352" class="sub" text-anchor="middle" fill="#ffa94d">Alternate path (higher AS-path length — lower preference)</text>

  <!-- BGP attributes legend -->
  <text x="30"  y="382" class="mono">BGP decision order: Weight → Local-Pref → Originate → AS-path length → Origin → MED → eBGP&gt;iBGP → IGP metric</text>
  <text x="30"  y="396" class="sub">UPDATE: NLRI (prefixes) + path attributes (AS_PATH, NEXT_HOP, ORIGIN, MED, LOCAL_PREF) · Anycast: same prefix announced from many ASes</text>
</svg>
