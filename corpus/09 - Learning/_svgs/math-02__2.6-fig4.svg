<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <style>
    .dbox { fill:var(--background-secondary, #161b22); stroke:var(--text-muted, #8b949e); stroke-width:1.2; }
    .darr { stroke:var(--interactive-accent, #58a6ff); stroke-width:2; fill:none; }
    .dlab { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); text-anchor:middle; }
    .dlac { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--interactive-accent, #58a6ff); text-anchor:middle; font-weight:bold; }
  </style>
  <defs>
    <marker id="dcd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Top left: ℝⁿ standard -->
  <rect x="30"  y="30"  width="100" height="50" rx="5" class="dbox"/>
  <text x="80"  y="60"  class="dlab">ℝⁿ (std basis)</text>
  <!-- Top right: ℝⁿ standard -->
  <rect x="370" y="30"  width="100" height="50" rx="5" class="dbox"/>
  <text x="420" y="60"  class="dlab">ℝⁿ (std basis)</text>
  <!-- Bottom left: ℝⁿ eigenbasis -->
  <rect x="30"  y="130" width="100" height="50" rx="5" class="dbox"/>
  <text x="80"  y="160" class="dlab">ℝⁿ (eigenbasis)</text>
  <!-- Bottom right: ℝⁿ eigenbasis -->
  <rect x="370" y="130" width="100" height="50" rx="5" class="dbox"/>
  <text x="420" y="160" class="dlab">ℝⁿ (eigenbasis)</text>
  <!-- Top arrow: A -->
  <line x1="130" y1="55" x2="370" y2="55" class="darr" marker-end="url(#dcd)">
    <animate attributeName="x2" values="130;370;370;130;130" keyTimes="0;0.3;0.8;0.9;1" dur="6s" repeatCount="indefinite" />
  </line>
  <text x="250" y="45" class="dlac" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.8;0.9;1" dur="6s" repeatCount="indefinite" />A</text>
  <!-- Bottom arrow: D (diagonal) -->
  <line x1="130" y1="155" x2="370" y2="155" class="darr" marker-end="url(#dcd)">
    <animate attributeName="x2" values="130;130;370;370;130" keyTimes="0;0.3;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
  </line>
  <text x="250" y="170" class="dlac" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.45;0.9;1" dur="6s" repeatCount="indefinite" />D = diag(λ₁,…,λₙ)</text>
  <!-- Left arrow down: S⁻¹ -->
  <line x1="80" y1="80" x2="80" y2="130" class="darr" marker-end="url(#dcd)">
    <animate attributeName="y2" values="80;130;130;80;80" keyTimes="0;0.3;0.8;0.9;1" dur="6s" repeatCount="indefinite" />
  </line>
  <text x="55" y="110" class="dlac" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.8;0.9;1" dur="6s" repeatCount="indefinite" />S⁻¹</text>
  <!-- Right arrow down: S⁻¹ -->
  <line x1="420" y1="80" x2="420" y2="130" class="darr" marker-end="url(#dcd)">
    <animate attributeName="y2" values="80;80;130;130;80" keyTimes="0;0.3;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
  </line>
  <text x="445" y="110" class="dlac" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.45;0.9;1" dur="6s" repeatCount="indefinite" />S⁻¹</text>
</svg>