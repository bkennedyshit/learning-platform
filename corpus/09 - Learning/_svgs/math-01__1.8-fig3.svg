<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:700px;height:auto;">
  <defs>
    <marker id="unif-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <style>
    .ubox  { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1.4; }
    .ucent { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.2; }
    .uarr  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.8; fill: none; marker-end: url(#unif-arr); }
    .ulab  { font-family: Inter,system-ui,sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .umath { font-family: 'Latin Modern Math',serif; font-style: italic; font-size: 13px; fill: var(--interactive-accent, #58a6ff); text-anchor: middle; }
    .usub  { font-family: Inter,system-ui,sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Central theorem box -->
  <rect x="230" y="10" width="240" height="60" rx="8" class="ucent"/>
  <text x="350" y="33" class="umath">∫_∂M ω = ∫_M dω</text>
  <text x="350" y="52" class="ulab">Generalized Stokes' Theorem</text>
  <!-- FTC box -->
  <rect x="10" y="150" width="160" height="60" rx="6" class="ubox"/>
  <text x="90" y="172" class="umath">∫_a^b f'(x)dx = f(b)−f(a)</text>
  <text x="90" y="190" class="usub">k=0, M=[a,b], ω=f</text>
  <text x="90" y="202" class="usub">Fundamental Theorem of Calculus</text>
  <!-- Green's box -->
  <rect x="190" y="150" width="170" height="60" rx="6" class="ubox"/>
  <text x="275" y="172" class="umath">∮_∂D P dx + Q dy</text>
  <text x="275" y="188" class="umath">= ∬_D dω</text>
  <text x="275" y="202" class="usub">k=1, M=2D region — Green's</text>
  <!-- Stokes box -->
  <rect x="375" y="150" width="150" height="60" rx="6" class="ubox"/>
  <text x="450" y="172" class="umath">∮_∂S F·dr = ∬_S (∇×F)·dS</text>
  <text x="450" y="190" class="usub">k=1, M=surface — Stokes'</text>
  <!-- Div box -->
  <rect x="538" y="150" width="150" height="60" rx="6" class="ubox"/>
  <text x="613" y="172" class="umath">∯_∂V F·dS = ∭_V ∇·F dV</text>
  <text x="613" y="190" class="usub">k=2, M=3D solid — Divergence</text>
  <!-- Arrows -->
  <line x1="290" y1="70" x2="90"  y2="148" class="uarr"/>
  <line x1="330" y1="70" x2="275" y2="148" class="uarr"/>
  <line x1="370" y1="70" x2="450" y2="148" class="uarr"/>
  <line x1="410" y1="70" x2="613" y2="148" class="uarr"/>
</svg>