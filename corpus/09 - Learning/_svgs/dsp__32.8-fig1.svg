<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .math   { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: var(--interactive-accent, #58a6ff); }
    .box    { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .panel  { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.3; }
    .axis   { stroke: var(--text-muted, #8b949e); stroke-width: 1; fill: none; }
    .sig    { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; }
    .env    { stroke: #51cf66; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .harm   { stroke: #ffd93d; stroke-width: 1.5; fill: none; }
    .arrow  { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .spike  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted,#8b949e)"/>
    </marker>
  </defs>

  <text x="360" y="22" class="title" text-anchor="middle">Spectral Analysis &amp; Applications in AI — Features for Deep Learning</text>

  <!-- ===== TOP LEFT: Feature hierarchy ===== -->
  <rect x="16" y="36" width="220" height="200" rx="5" class="panel"/>
  <text x="126" y="56" class="label" text-anchor="middle" font-weight="bold">Audio Feature Hierarchy</text>

  <text x="26" y="76" class="small" font-weight="bold">Raw waveform → DL encoder</text>
  <text x="26" y="90" class="math">wav2vec2, HuBERT, EnCodec</text>
  <text x="26" y="104" class="small">→ CNN/transformer on raw samples</text>

  <text x="26" y="122" class="small" font-weight="bold">Log-Mel spectrogram → Transformer</text>
  <text x="26" y="136" class="math">Whisper, VALL-E, AudioLM</text>
  <text x="26" y="150" class="small">→ 80-bin mel, 25 ms frame, 10 ms hop</text>

  <text x="26" y="168" class="small" font-weight="bold">MFCCs → Classical ML</text>
  <text x="26" y="182" class="math">GMM-HMM, old Kaldi pipelines</text>
  <text x="26" y="196" class="small">→ 13 coefficients (+ Δ + ΔΔ = 39)</text>

  <text x="26" y="214" class="small" font-weight="bold">Spectral features:</text>
  <text x="26" y="228" class="small">centroid, rolloff, ZCR, chroma, contrast</text>

  <!-- ===== TOP RIGHT: Modern AI applications ===== -->
  <rect x="250" y="36" width="454" height="200" rx="5" class="panel"/>
  <text x="477" y="56" class="label" text-anchor="middle" font-weight="bold">Spectral DSP in Modern AI Systems (2026)</text>

  <text x="262" y="76" class="small" font-weight="bold" fill="#51cf66">Whisper (OpenAI):</text>
  <text x="262" y="90" class="small">Log-mel (80 bins) → Conv stem → Transformer Enc → Transformer Dec</text>
  <text x="262" y="104" class="small">Input: 30-sec chunks, padded/truncated → mel (80 × 3000)</text>

  <text x="262" y="120" class="small" font-weight="bold" fill="#ffd93d">XTTS / VITS (TTS):</text>
  <text x="262" y="134" class="small">Text → phonemes → duration predictor → mel spec → HiFi-GAN vocoder</text>
  <text x="262" y="148" class="small">Speaker conditioning via mel-speaker-embedding lookup</text>

  <text x="262" y="164" class="small" font-weight="bold" fill="var(--interactive-accent,#58a6ff)">Holographic wavefront (Track 23):</text>
  <text x="262" y="178" class="small">2D FFT of hologram aperture → propagation = phase multiply in freq domain</text>
  <text x="262" y="192" class="small">Angular spectrum method: H(u,v) = e^{jkz√(1−λ²u²−λ²v²)}</text>

  <text x="262" y="210" class="small" font-weight="bold" fill="#51cf66">Electronics (Track 21):</text>
  <text x="262" y="224" class="small">Oscilloscope FFT, impedance analysis, ADC noise floor = −6.02N dBFS</text>

  <!-- ===== BOTTOM: Harmonic analysis diagram ===== -->
  <rect x="16" y="252" width="688" height="158" rx="4" class="box"/>
  <text x="360" y="270" class="label" text-anchor="middle" font-weight="bold">Harmonic Analysis: Fundamental + Overtone Series</text>

  <!-- Time domain waveform (complex, rich overtones) -->
  <g transform="translate(24, 282)">
    <text x="80" y="-4" class="small" text-anchor="middle">Time domain (rich timbre)</text>
    <line x1="0"   y1="60" x2="160" y2="60" class="axis" marker-end="url(#a8)"/>
    <line x1="10"  y1="90" x2="10"  y2="20" class="axis"/>
    <path d="M 10 60
      C 22 30, 32 90, 42 60
      C 48 42, 55 38, 62 60
      C 70 82, 75 90, 82 60
      C 88 38, 95 32, 102 60
      C 108 80, 115 88, 122 60
      C 128 38, 135 32, 142 60
      C 148 80, 155 88, 160 60" class="sig"/>
  </g>

  <line x1="192" y1="342" x2="224" y2="342" class="arrow" marker-end="url(#a8)"/>
  <text x="208" y="334" class="small" text-anchor="middle">FFT</text>

  <!-- Frequency domain with harmonics -->
  <g transform="translate(232, 282)">
    <text x="130" y="-4" class="small" text-anchor="middle">Frequency domain — harmonic series</text>
    <line x1="0"   y1="80" x2="260" y2="80" class="axis" marker-end="url(#a8)"/>
    <line x1="10"  y1="90" x2="10"  y2="20" class="axis"/>
    <text x="264" y="84" class="small">f</text>
    <!-- f0 fundamental (tallest) -->
    <line x1="40"  y1="80" x2="40"  y2="25" class="spike" stroke-width="4"/>
    <circle cx="40" cy="23" r="4" fill="var(--interactive-accent,#58a6ff)"/>
    <text x="40" y="16" class="small" text-anchor="middle">f₀</text>
    <!-- 2nd harmonic -->
    <line x1="80"  y1="80" x2="80"  y2="38" class="harm" stroke-width="3"/>
    <circle cx="80" cy="36" r="3" fill="#ffd93d"/>
    <text x="80" y="28" class="small" text-anchor="middle">2f₀</text>
    <!-- 3rd harmonic -->
    <line x1="120" y1="80" x2="120" y2="50" class="harm" stroke-width="2.5"/>
    <circle cx="120" cy="48" r="3" fill="#ffd93d"/>
    <text x="120" y="40" class="small" text-anchor="middle">3f₀</text>
    <!-- 4th harmonic -->
    <line x1="160" y1="80" x2="160" y2="58" class="harm" stroke-width="2"/>
    <circle cx="160" cy="56" r="2.5" fill="#ffd93d" opacity="0.8"/>
    <text x="160" y="48" class="small" text-anchor="middle">4f₀</text>
    <!-- 5th harmonic -->
    <line x1="200" y1="80" x2="200" y2="64" class="harm" stroke-width="1.5" opacity="0.7"/>
    <circle cx="200" cy="62" r="2" fill="#ffd93d" opacity="0.6"/>
    <!-- Envelope -->
    <path d="M 10 25 C 40 22, 80 34, 120 48, 160 56, 200 62, 250 75" class="env"/>
    <text x="240" y="70" class="small" fill="#51cf66">spectral envelope</text>
  </g>

  <line x1="500" y1="342" x2="532" y2="342" class="arrow" marker-end="url(#a8)"/>
  <text x="516" y="334" class="small" text-anchor="middle">cepstrum</text>

  <!-- Cepstrum / quefrency domain -->
  <g transform="translate(540, 282)">
    <text x="82" y="-4" class="small" text-anchor="middle">Cepstrum (quefrency domain)</text>
    <line x1="0"   y1="80" x2="164" y2="80" class="axis" marker-end="url(#a8)"/>
    <line x1="10"  y1="90" x2="10"  y2="20" class="axis"/>
    <text x="168" y="84" class="small">q</text>
    <!-- Strong pitch peak at 1/f0 + smaller envelope at low q -->
    <path d="M 10 70 C 20 60, 30 70, 40 72 C 50 74, 55 72, 60 71 C 65 70, 70 72, 75 70" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.5" fill="none"/>
    <line x1="100" y1="80" x2="100" y2="28" class="spike" stroke-width="3"/>
    <circle cx="100" cy="26" r="3" fill="var(--interactive-accent,#58a6ff)"/>
    <text x="100" y="18" class="small" text-anchor="middle">1/f₀</text>
    <text x="82" y="98" class="small" text-anchor="middle" fill="var(--text-muted,#8b949e)">low-q = envelope / timbre</text>
  </g>
</svg>
