<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">CI/CD PIPELINE</text>

  <g font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">
    <!-- Boxes -->
    <rect x="40" y="75" width="110" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="95" y="105">Commit</text>
    
    <rect x="190" y="75" width="110" height="50" rx="6" fill="#1e293b" stroke="#a3e635" stroke-width="2" />
    <text x="245" y="105">Test &amp; Scan</text>
    
    <rect x="340" y="75" width="110" height="50" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
    <text x="395" y="105">Build</text>

    <rect x="490" y="75" width="110" height="50" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="2" />
    <text x="545" y="105">Sign &amp; Attest</text>
    
    <rect x="640" y="75" width="110" height="50" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
    <text x="695" y="105">Deploy</text>
  </g>

  <!-- Edges -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 150 100 L 180 100" marker-end="url(#arrow)" />
    <path d="M 300 100 L 330 100" marker-end="url(#arrow)" />
    <path d="M 450 100 L 480 100" marker-end="url(#arrow)" />
    <path d="M 600 100 L 630 100" marker-end="url(#arrow)" />
  </g>

  <!-- Animated Particles -->
  <circle cx="0" cy="100" r="4" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" values="150; 185; 150" keyTimes="0; 0.5; 1" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="100" r="4" fill="#a3e635" filter="url(#glow)">
    <animate attributeName="cx" values="300; 335; 300" keyTimes="0; 0.5; 1" dur="2s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="2s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="100" r="4" fill="#fbbf24" filter="url(#glow)">
    <animate attributeName="cx" values="450; 485; 450" keyTimes="0; 0.5; 1" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="0" cy="100" r="4" fill="#f87171" filter="url(#glow)">
    <animate attributeName="cx" values="600; 635; 600" keyTimes="0; 0.5; 1" dur="2s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.5; 1" dur="2s" begin="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Supply Chain Lock Icon on Sign & Attest -->
  <g transform="translate(535, 135)" stroke="#f87171" stroke-width="1.5" fill="none">
    <rect x="0" y="8" width="16" height="12" rx="2" />
    <path d="M 4 8 v -3 a 4 4 0 0 1 8 0 v 3" />
    <circle cx="8" cy="14" r="1" fill="#f87171" />
  </g>
</svg>
