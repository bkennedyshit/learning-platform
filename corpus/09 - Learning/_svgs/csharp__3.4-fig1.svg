<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 700px; height: auto;">
  <style>
    .box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; }
    .async-box { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 6; }
    .thread-line { stroke: var(--text-muted, #8b949e); stroke-width: 3; stroke-linecap: round; }
    .active-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; stroke-linecap: round; }
    .wait-line { stroke: var(--text-muted, #8b949e); stroke-width: 2; stroke-dasharray: 4,4; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .section-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .note { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--text-muted, #8b949e); }
    .event-dot { fill: var(--interactive-accent, #58a6ff); }
  </style>

  <text x="350" y="22" class="title">async/await Execution Flow — Thread Not Blocked</text>

  <!-- Timeline labels -->
  <text x="50" y="60" class="section-label">Main Thread</text>
  <text x="50" y="160" class="section-label">I/O (OS)</text>
  <text x="50" y="260" class="section-label">Thread Pool</text>

  <!-- Time axis -->
  <text x="150" y="45" class="note">t=0</text>
  <text x="300" y="45" class="note">t=1 (await)</text>
  <text x="450" y="45" class="note">t=2 (I/O done)</text>
  <text x="600" y="45" class="note">t=3 (resume)</text>

  <!-- Main thread timeline -->
  <line x1="130" y1="70" x2="290" y2="70" class="active-line"/>
  <circle cx="130" cy="70" r="4" class="event-dot"/>
  <text x="210" y="85" class="label">Execute sync code</text>

  <!-- await point -->
  <circle cx="290" cy="70" r="5" class="event-dot"/>
  <text x="290" y="95" class="note">await (suspend)</text>

  <!-- Main thread free -->
  <line x1="290" y1="70" x2="580" y2="70" class="wait-line"/>
  <text x="435" y="85" class="label">Thread FREE (handles other work)</text>

  <!-- Resume -->
  <line x1="580" y1="70" x2="670" y2="70" class="active-line"/>
  <circle cx="580" cy="70" r="5" class="event-dot"/>
  <text x="625" y="85" class="label">Resume</text>

  <!-- I/O operation -->
  <line x1="290" y1="160" x2="450" y2="160" class="active-line"/>
  <circle cx="290" cy="160" r="4" class="event-dot"/>
  <circle cx="450" cy="160" r="4" class="event-dot"/>
  <text x="370" y="175" class="label">File.ReadAllTextAsync</text>
  <text x="370" y="190" class="note">(no thread needed — OS handles I/O)</text>

  <!-- Completion callback -->
  <line x1="450" y1="160" x2="580" y2="70" class="wait-line"/>
  <text x="530" y="125" class="note">completion</text>

  <!-- Comparison box -->
  <rect x="100" y="220" width="250" height="55" class="box"/>
  <text x="225" y="238" class="label">❌ Synchronous (blocking)</text>
  <text x="130" y="255" class="note">Thread sits idle during I/O</text>
  <text x="130" y="268" class="note">60fps game → frame freeze!</text>

  <rect x="380" y="220" width="250" height="55" class="async-box"/>
  <text x="505" y="238" class="label">✓ Async (non-blocking)</text>
  <text x="410" y="255" class="note">Thread freed during I/O</text>
  <text x="410" y="268" class="note">Game keeps rendering frames</text>

  <!-- Key insight -->
  <rect x="130" y="295" width="440" height="40" class="box"/>
  <text x="350" y="312" class="label">await ≠ "wait on a new thread"</text>
  <text x="350" y="328" class="note">await = "release this thread, resume me when the result is ready"</text>
</svg>
