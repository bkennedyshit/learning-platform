<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:560px;height:auto;">
  <defs>
    <marker id="da" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-accent, #79c0ff)"/>
    </marker>
  </defs>
  <style>
    .dax { stroke:var(--text-muted, #8b949e); stroke-width:1.2; fill:none; }
    .dv1 { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.8; fill:none; }
    .dv2 { stroke:var(--text-accent, #79c0ff); stroke-width:2.8; fill:none; }
    .dpg { fill:var(--interactive-accent, #58a6ff); opacity:0.15; stroke:var(--interactive-accent, #58a6ff); stroke-width:1.2; }
    .dlb { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--text-normal, #c9d1d9); }
    .dlc { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
  </style>
  <!-- Axes (left panel) -->
  <line x1="40"  y1="260" x2="280" y2="260" class="dax"/>
  <line x1="60"  y1="290" x2="60"  y2="40"  class="dax"/>
  <!-- Parallelogram spanned by col1=(3,1) and col2=(1,2): scale 60px/unit, origin (60,260) -->
  <!-- col1 → (240,200), col2 → (120,140), sum → (300,80) but clip... use scaled(50) -->
  <!-- col1=(3,1)×50=(150,-50), col2=(1,2)×50=(50,-100) from origin (60,260) -->
  <polygon points="60,260 210,210 260,110 110,160" class="dpg">
    <animate attributeName="points" values="60,260 210,210 210,210 60,260; 60,260 210,210 260,110 110,160; 60,260 210,210 260,110 110,160; 60,260 210,210 210,210 60,260" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
  </polygon>
  <!-- Vector a = col1 -->
  <line x1="60" y1="260" x2="210" y2="210" class="dv1" marker-end="url(#da)"/>
  <text x="218" y="207" class="dlc">a = (3,1)</text>
  <!-- Vector b = col2 -->
  <line x1="60" y1="260" x2="110" y2="160" class="dv2" marker-end="url(#db)">
    <animate attributeName="x2" values="60; 110; 110; 60" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="260; 160; 160; 260" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
  </line>
  <text x="60"  y="152" fill="var(--text-accent, #79c0ff)" class="dlb">
    <animate attributeName="x" values="10; 60; 60; 10" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y" values="252; 152; 152; 252" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    b = (1,2)
  </text>
  <!-- det label inside parallelogram -->
  <text x="145" y="210" class="dlc" text-anchor="middle">
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    Area = |det A|
  </text>
  <text x="145" y="228" class="dlc" text-anchor="middle">
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.7; 1" dur="4s" repeatCount="indefinite" />
    = |3·2 − 1·1| = 5
  </text>
  <!-- Right panel: formula box -->
  <rect x="310" y="60" width="230" height="130" rx="7" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="425" y="86"  class="dlb" text-anchor="middle" font-weight="bold">2×2 Determinant</text>
  <text x="425" y="112" class="dlb" text-anchor="middle" font-family="monospace">det⎡a  b⎤ = ad − bc</text>
  <text x="425" y="132" class="dlb" text-anchor="middle" font-family="monospace">   ⎣c  d⎦</text>
  <text x="425" y="160" class="dlc" text-anchor="middle">Positive = CCW orientation</text>
  <text x="425" y="178" class="dlc" text-anchor="middle">Negative = CW orientation</text>
  <text x="280" y="298" class="dlb" text-anchor="middle">det = 0 iff vectors are parallel (area collapses)</text>
</svg>