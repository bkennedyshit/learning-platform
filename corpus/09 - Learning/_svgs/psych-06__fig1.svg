<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#181825" rx="15" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cba6f7" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94e2d5" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <text x="300" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Operant Conditioning Loop (ABC)</text>

  <!-- Paths -->
  <path id="pathAB" d="M 180 220 Q 240 130 275 140" fill="none" stroke="#cba6f7" stroke-width="3" marker-end="url(#arrow)"/>
  <path id="pathBC" d="M 325 140 Q 360 130 420 220" fill="none" stroke="#cba6f7" stroke-width="3" marker-end="url(#arrow)"/>
  <path id="pathCA" d="M 410 270 Q 300 350 190 270" fill="none" stroke="#94e2d5" stroke-width="3" stroke-dasharray="8,8" marker-end="url(#arrow-dash)"/>

  <!-- Animated Pulses -->
  <circle r="6" fill="#f9e2af">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 180 220 Q 240 130 275 140" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle r="6" fill="#f9e2af">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1s" path="M 325 140 Q 360 130 420 220" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite" begin="1s" />
  </circle>
  <circle r="6" fill="#f9e2af">
    <animateMotion dur="3s" repeatCount="indefinite" begin="2s" path="M 410 270 Q 300 350 190 270" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite" begin="2s" />
  </circle>

  <!-- Nodes -->
  <g transform="translate(150, 250)">
    <circle r="50" fill="#89b4fa" filter="url(#glow)"/>
    <text y="-5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#11111b" text-anchor="middle">Antecedent</text>
    <text y="15" font-family="sans-serif" font-size="12" fill="#11111b" text-anchor="middle">(Stimulus)</text>
  </g>
  <g transform="translate(300, 120)">
    <circle r="50" fill="#f38ba8" filter="url(#glow)"/>
    <text y="-5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#11111b" text-anchor="middle">Behavior</text>
    <text y="15" font-family="sans-serif" font-size="12" fill="#11111b" text-anchor="middle">(Response)</text>
  </g>
  <g transform="translate(450, 250)">
    <circle r="50" fill="#a6e3a1" filter="url(#glow)"/>
    <text y="-5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#11111b" text-anchor="middle">Consequence</text>
    <text y="15" font-family="sans-serif" font-size="12" fill="#11111b" text-anchor="middle">(Reward/Punish)</text>
  </g>
  
  <text x="300" y="330" font-family="sans-serif" font-size="14" font-style="italic" fill="#94e2d5" text-anchor="middle">Modifies future probability</text>
</svg>
