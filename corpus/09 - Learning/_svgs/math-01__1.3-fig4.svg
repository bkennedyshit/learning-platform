<svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 300px; height: auto;">
  <style>
    .tri  { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.8; fill: none; }
    .hyp  { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.4; fill: none; }
    .lab  { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 14px; fill: var(--text-normal, #c9d1d9); }
    .lab-acc { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 14px; fill: var(--interactive-accent, #58a6ff); }
    .ang  { stroke: var(--text-accent, #79c0ff); stroke-width: 1.2; fill: var(--text-accent, #79c0ff); opacity: 0.15; }
    .ang-outline { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; fill: none; }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <!-- Right-angle triangle: base (adj) = sqrt(a^2-x^2), height (opp) = x, hyp = a -->
  <!-- Vertices: A=(40,220), B=(240,220), C=(40,60) -->
  <path class="ang" d="M 40 220 L 40 196 L 64 196 L 64 220 Z"/>
  <line x1="40" y1="220" x2="240" y2="220" class="tri"/>
  <line x1="40" y1="220" x2="40"  y2="60"  class="tri"/>
  <line x1="40" y1="60"  x2="240" y2="220" class="hyp"/>
  <!-- Right angle marker -->
  <line x1="40" y1="196" x2="64"  y2="196" stroke="var(--text-normal, #c9d1d9)" stroke-width="1.4"/>
  <line x1="64" y1="196" x2="64"  y2="220" stroke="var(--text-normal, #c9d1d9)" stroke-width="1.4"/>
  <!-- Angle arc at A=(240,220) -->
  <path class="ang-outline" d="M 218 220 A 22 22 0 0 0 240 198"/>
  <!-- Labels -->
  <text x="130" y="245" class="lab" text-anchor="middle">√(a²−x²)</text>
  <text x="18"  y="145" class="lab" text-anchor="middle">x</text>
  <text x="152" y="128" class="lab-acc" text-anchor="middle">a</text>
  <text x="216" y="210" class="lab">θ</text>
  <!-- Substitution label -->
  <text x="150" y="30"  class="lab-acc" text-anchor="middle">x = a sin θ</text>
  <text x="150" y="48"  class="lab" text-anchor="middle">opposite = x, hypotenuse = a</text>
</svg>