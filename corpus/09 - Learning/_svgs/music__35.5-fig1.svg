<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;}
    .freq-band {
      transition: fill-opacity 0.3s, stroke-opacity 0.3s;
    }
    .band-1 { animation: band-pulse 3s infinite ease-in-out; }
    .band-2 { animation: band-pulse 2.4s infinite ease-in-out; animation-delay: 0.3s; }
    .band-3 { animation: band-pulse 3.8s infinite ease-in-out; animation-delay: 0.7s; }
    .band-4 { animation: band-pulse 2.1s infinite ease-in-out; animation-delay: 0.1s; }
    .band-5 { animation: band-pulse 3.2s infinite ease-in-out; animation-delay: 0.5s; }
    .band-6 { animation: band-pulse 2.7s infinite ease-in-out; animation-delay: 0.9s; }
    .band-7 { animation: band-pulse 4.1s infinite ease-in-out; animation-delay: 0.2s; }
    .band-8 { animation: band-pulse 3.5s infinite ease-in-out; animation-delay: 0.6s; }

    @keyframes band-pulse {
      0%, 100% { fill-opacity: 0.65; stroke-opacity: 0.7; }
      50% { fill-opacity: 0.95; stroke-opacity: 1.0; }
    }
  </style>
  <text x="360" y="22" class="title" text-anchor="middle">35.5 — Mixing Fundamentals: EQ, Compression, Stereo Field &amp; Frequency Balance</text>
  <!-- EQ frequency map -->
  <rect x="20" y="35" width="680" height="100" class="box" rx="4"/>
  
  <!-- Dynamic Spectrum Waves -->
  <path d="M30 125 Q 115 125 200 125 T 370 125 T 540 125 T 690 125" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.5" stroke-opacity="0.3">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M30 125 Q 115 75 200 105 T 370 60 T 540 90 T 690 125;
              M30 125 Q 115 110 200 60 T 370 100 T 540 70 T 690 125;
              M30 125 Q 115 75 200 105 T 370 60 T 540 90 T 690 125" />
  </path>
  <path d="M30 125 Q 115 125 200 125 T 370 125 T 540 125 T 690 125" fill="none" stroke="#51cf66" stroke-width="1.2" stroke-opacity="0.25">
    <animate attributeName="d" dur="8.5s" repeatCount="indefinite"
      values="M30 125 Q 115 100 200 75 T 370 95 T 540 65 T 690 125;
              M30 125 Q 115 65 200 110 T 370 55 T 540 100 T 690 125;
              M30 125 Q 115 100 200 75 T 370 95 T 540 65 T 690 125" />
  </path>

  <text x="360" y="52" class="label" text-anchor="middle" font-weight="bold">Frequency Spectrum Map: What Lives Where</text>
  <!-- Frequency bands spectrum bar -->
  <rect x="30" y="60" width="80" height="30" fill="#1a3a5c" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="2" class="freq-band band-1"/>
  <text x="70" y="78" class="mono" text-anchor="middle">Sub Bass</text>
  <text x="70" y="96" class="mono" text-anchor="middle">20–80 Hz</text>
  <text x="70" y="108" class="sub" text-anchor="middle">kick body, 808</text>
  <rect x="115" y="60" width="80" height="30" fill="#1a3a2a" stroke="#51cf66" stroke-width="1" rx="2" class="freq-band band-2"/>
  <text x="155" y="78" class="mono" text-anchor="middle">Bass</text>
  <text x="155" y="96" class="mono" text-anchor="middle">80–250 Hz</text>
  <text x="155" y="108" class="sub" text-anchor="middle">bass warmth</text>
  <rect x="200" y="60" width="80" height="30" fill="#2a2a1a" stroke="#ffd93d" stroke-width="1" rx="2" class="freq-band band-3"/>
  <text x="240" y="78" class="mono" text-anchor="middle">Low-Mid</text>
  <text x="240" y="96" class="mono" text-anchor="middle">250 Hz–1 kHz</text>
  <text x="240" y="108" class="sub" text-anchor="middle">body, muddiness</text>
  <rect x="285" y="60" width="80" height="30" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1" rx="2" class="freq-band band-4"/>
  <text x="325" y="78" class="mono" text-anchor="middle">Midrange</text>
  <text x="325" y="96" class="mono" text-anchor="middle">1–4 kHz</text>
  <text x="325" y="108" class="sub" text-anchor="middle">presence, vocals</text>
  <rect x="370" y="60" width="80" height="30" fill="#1a2a3a" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1" rx="2" class="freq-band band-5"/>
  <text x="410" y="78" class="mono" text-anchor="middle">Upper-Mid</text>
  <text x="410" y="96" class="mono" text-anchor="middle">4–8 kHz</text>
  <text x="410" y="108" class="sub" text-anchor="middle">attack, sibilance</text>
  <rect x="455" y="60" width="80" height="30" fill="#1a3a2a" stroke="#51cf66" stroke-width="1" rx="2" class="freq-band band-6"/>
  <text x="495" y="78" class="mono" text-anchor="middle">Presence</text>
  <text x="495" y="96" class="mono" text-anchor="middle">8–12 kHz</text>
  <text x="495" y="108" class="sub" text-anchor="middle">clarity, air start</text>
  <rect x="540" y="60" width="75" height="30" fill="#2a1a2a" stroke="#ff6b6b" stroke-width="1" rx="2" class="freq-band band-7"/>
  <text x="577" y="78" class="mono" text-anchor="middle">Air</text>
  <text x="577" y="96" class="mono" text-anchor="middle">12–20 kHz</text>
  <text x="577" y="108" class="sub" text-anchor="middle">sheen, brilliance</text>
  <rect x="620" y="60" width="70" height="30" fill="#1a2a1a" stroke="var(--text-muted,#8b949e)" stroke-width="0.8" rx="2" class="freq-band band-8"/>
  <text x="655" y="78" class="mono" text-anchor="middle">Ultra</text>
  <text x="655" y="96" class="mono" text-anchor="middle">&gt;20 kHz</text>
  <text x="655" y="108" class="sub" text-anchor="middle">cut all</text>
  <!-- EQ types and compressor -->
  <rect x="20" y="148" width="330" height="165" class="box" rx="4"/>
  <text x="185" y="165" class="label" text-anchor="middle" font-weight="bold">EQ Techniques</text>
  <text x="30" y="182" class="sub" font-weight="bold">Subtractive (surgical first):</text>
  <text x="30" y="194" class="sub">Find resonances: boost narrow Q, sweep, then cut 3–6 dB</text>
  <text x="30" y="208" class="sub" font-weight="bold">Additive (broad, gentle):</text>
  <text x="30" y="220" class="sub">Shelf: low-shelf boost bass warmth · hi-shelf boost air</text>
  <text x="30" y="232" class="sub">Bell: +2–4 dB, wide Q (0.5–1.0) for pleasant boosts</text>
  <text x="30" y="248" class="sub" font-weight="bold">High-pass filter (HPF):</text>
  <text x="30" y="260" class="sub">EVERY track: HPF at 20 Hz minimum</text>
  <text x="30" y="272" class="sub">Kick: HPF 30–40 Hz · Snare: HPF 80 Hz</text>
  <text x="30" y="284" class="sub">Guitar: HPF 100–120 Hz · Vocal: HPF 80–100 Hz</text>
  <text x="30" y="296" class="sub" font-weight="bold">Mid/Side EQ:</text>
  <text x="30" y="308" class="sub">Cut lows from Side channel = cleaner stereo bass</text>
  <!-- Compressor -->
  <rect x="365" y="148" width="335" height="165" class="box" rx="4"/>
  <text x="532" y="165" class="label" text-anchor="middle" font-weight="bold">Compression: Parameters &amp; Uses</text>
  <text x="375" y="182" class="sub" font-weight="bold">Parameters:</text>
  <text x="375" y="194" class="mono">Threshold: level where comp engages</text>
  <text x="375" y="208" class="mono">Ratio: 2:1 gentle · 4:1 punch · 8:1+ limiting</text>
  <text x="375" y="222" class="mono">Attack: fast (1ms) = kill transient · slow = keep it</text>
  <text x="375" y="236" class="mono">Release: short = pumping · long = invisible</text>
  <text x="375" y="250" class="mono">Make-up gain: bring level back up after compression</text>
  <text x="375" y="268" class="sub" font-weight="bold">Typical settings by instrument:</text>
  <text x="375" y="282" class="mono">Kick: 4:1, fast A (1ms), 50ms R, -4 dB GR</text>
  <text x="375" y="296" class="mono">Snare: 4:1, 5ms A, 80ms R, -3 dB GR</text>
  <text x="375" y="310" class="mono">Vocal: 3:1, 10ms A, auto R, -3–6 dB GR</text>
  <!-- Stereo field -->
  <rect x="20" y="328" width="680" height="77" class="box" rx="4"/>
  <text x="360" y="345" class="label" text-anchor="middle" font-weight="bold">Stereo Field &amp; Mix Placement</text>
  <text x="360" y="362" class="sub" text-anchor="middle">Center (mono): kick, bass (LP to mono below 150 Hz), lead vocal, snare, lead synth. Keep low frequencies mono — phase issues on playback systems.</text>
  <text x="360" y="378" class="sub" text-anchor="middle">Wide (L–R): hi-hats (alt L/R or 30%), pads, backing vocals (L/R pair), FX returns, room reverb. Use Haas effect sparingly (&gt;30ms = flamming).</text>
  <text x="360" y="394" class="sub" text-anchor="middle">Check mono! Every mix must work on single speaker. Phase correlation meter: stay positive. Use a spectrum analyzer (free: SPAN by Voxengo) to visualize balance.</text>
</svg>
