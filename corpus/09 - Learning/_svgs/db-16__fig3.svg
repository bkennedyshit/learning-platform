<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a24" rx="8"/>
  <text x="400" y="40" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Write-Ahead Logging (WAL) &amp; ARIES Recovery</text>

  <!-- Layout -->
  <g transform="translate(50, 80)">
    
    <!-- Buffer Pool -->
    <rect x="0" y="0" width="250" height="200" fill="#232e3a" stroke="#3498db" stroke-width="2" rx="4"/>
    <text x="125" y="30" fill="#3498db" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Buffer Pool (Memory)</text>
    
    <rect x="20" y="50" width="210" height="60" fill="#1c252e" stroke="#2980b9" stroke-width="1" rx="2"/>
    <text x="125" y="70" fill="#a9cce3" font-family="sans-serif" font-size="12" text-anchor="middle">WAL Buffer</text>
    <rect x="40" y="80" width="15" height="15" fill="#e74c3c">
      <animate attributeName="opacity" values="0;1;1;0;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.1;0.4;0.5;1"/>
    </rect>
    <rect x="65" y="80" width="15" height="15" fill="#f39c12">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.2;0.3;0.5;1"/>
    </rect>
    
    <rect x="20" y="120" width="210" height="60" fill="#1c252e" stroke="#2980b9" stroke-width="1" rx="2"/>
    <text x="125" y="140" fill="#a9cce3" font-family="sans-serif" font-size="12" text-anchor="middle">Data Pages (Dirty)</text>
    <rect x="40" y="150" width="30" height="20" fill="#2ecc71" opacity="0.6"/>
    <text x="55" y="164" fill="#fff" font-size="10" text-anchor="middle">P1</text>

    <!-- WAL File -->
    <rect x="450" y="0" width="250" height="100" fill="#3a2e2d" stroke="#e74c3c" stroke-width="2" rx="4"/>
    <text x="575" y="30" fill="#e74c3c" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">WAL File (Disk)</text>
    <rect x="470" y="50" width="210" height="30" fill="#2c2222" stroke="#c0392b" stroke-width="1" rx="2"/>
    <rect x="475" y="55" width="15" height="20" fill="#e74c3c" opacity="0.8"/>
    <rect x="495" y="55" width="15" height="20" fill="#f39c12" opacity="0.8"/>
    <rect x="515" y="55" width="15" height="20" fill="#e74c3c">
      <animate attributeName="opacity" values="0;0;0;1;1" dur="4s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.6;1"/>
    </rect>
    
    <!-- Data File -->
    <rect x="450" y="140" width="250" height="100" fill="#273a2f" stroke="#2ecc71" stroke-width="2" rx="4"/>
    <text x="575" y="170" fill="#2ecc71" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Data Files (Disk)</text>
    <rect x="470" y="190" width="210" height="30" fill="#1d2b23" stroke="#27ae60" stroke-width="1" rx="2"/>
    <rect x="475" y="195" width="30" height="20" fill="#2ecc71" opacity="0.3"/>
    
    <!-- Arrows -->
    <path d="M 230 80 L 440 65" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)">
       <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <text x="340" y="60" fill="#f5b7b1" font-family="sans-serif" font-size="12" text-anchor="middle">1. fsync on commit</text>

    <path d="M 230 150 L 440 205" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-green)">
       <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <text x="340" y="170" fill="#a9dfbf" font-family="sans-serif" font-size="12" text-anchor="middle">2. lazy flush</text>

  </g>

  <!-- ARIES Phases -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="700" height="120" fill="#2d2d3d" stroke="#5c5c7d" stroke-width="2" rx="6"/>
    <text x="350" y="25" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ARIES 3-Phase Recovery (Crash Restart)</text>

    <rect x="50" y="45" width="160" height="50" fill="#8e44ad" rx="4"/>
    <text x="130" y="75" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Analysis</text>
    <text x="130" y="90" fill="#d2b4de" font-family="sans-serif" font-size="10" text-anchor="middle">Find Dirty Pages &amp; Txns</text>

    <rect x="270" y="45" width="160" height="50" fill="#2980b9" rx="4"/>
    <text x="350" y="75" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Redo</text>
    <text x="350" y="90" fill="#a9cce3" font-family="sans-serif" font-size="10" text-anchor="middle">Repeat History exactly</text>

    <rect x="490" y="45" width="160" height="50" fill="#c0392b" rx="4"/>
    <text x="570" y="75" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Undo</text>
    <text x="570" y="90" fill="#f5b7b1" font-family="sans-serif" font-size="10" text-anchor="middle">Rollback uncommitted (CLRs)</text>

    <!-- Animation highlighter -->
    <rect x="45" y="40" width="170" height="60" fill="none" stroke="#f1c40f" stroke-width="3" rx="6">
      <animate attributeName="x" values="45; 265; 485; 485" dur="6s" repeatCount="indefinite" keyTimes="0; 0.33; 0.66; 1"/>
    </rect>
  </g>

  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71" />
    </marker>
  </defs>

</svg>
