<svg viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <defs>
    <marker id="ep-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .ep-box { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 2; rx: 4; }
    .ep-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .ep-title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .ep-arrow-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; marker-end: url(#ep-arrow); }
    .ep-gravity { stroke: #ff6b6b; stroke-width: 2; fill: none; marker-end: url(#ep-arrow); }
    .ep-tidal { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; fill: none; marker-end: url(#ep-arrow); }
    .ep-person { fill: var(--text-muted, #8b949e); }
    .ep-floor { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; }
    .ep-equals { font-family: 'Latin Modern Math', serif; font-size: 24px; fill: var(--interactive-accent, #58a6ff); text-anchor: middle; }
    .ep-sub { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    
    /* Animations */
    .ep-ball-drop { animation: ballDrop 2s infinite cubic-bezier(0.5, 0, 1, 1); }
    @keyframes ballDrop { 0% { transform: translateY(0); opacity: 1; } 40% { transform: translateY(120px); opacity: 1; } 41%, 100% { transform: translateY(120px); opacity: 0; } }
    .ep-tidal-h1 { animation: tidalH1 2s infinite alternate ease-in-out; }
    .ep-tidal-h2 { animation: tidalH2 2s infinite alternate ease-in-out; }
    .ep-tidal-v1 { animation: tidalV1 2s infinite alternate ease-in-out; }
    .ep-tidal-v2 { animation: tidalV2 2s infinite alternate ease-in-out; }
    @keyframes tidalH1 { to { transform: translateX(8px); } }
    @keyframes tidalH2 { to { transform: translateX(-8px); } }
    @keyframes tidalV1 { to { transform: translateY(-8px); } }
    @keyframes tidalV2 { to { transform: translateY(8px); } }
  </style>

  <!-- Scene 1: Accelerating elevator in space -->
  <text x="120" y="25" class="ep-title">Accelerating in Space</text>
  <rect x="50" y="40" width="140" height="200" class="ep-box"/>
  <!-- Person -->
  <circle cx="120" cy="140" r="12" class="ep-person"/>
  <line x1="120" y1="152" x2="120" y2="190" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <line x1="120" y1="190" x2="108" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <line x1="120" y1="190" x2="132" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <!-- Floor -->
  <line x1="50" y1="230" x2="190" y2="230" class="ep-floor"/>
  <!-- Acceleration arrow -->
  <line x1="120" y1="40" x2="120" y2="10" class="ep-arrow-line"/>
  <text x="120" y="5" class="ep-label">a = g ↑</text>
  <!-- Ball dropping -->
  <circle cx="155" cy="100" r="5" fill="var(--text-accent, #79c0ff)" class="ep-ball-drop"/>
  <line x1="155" y1="105" x2="155" y2="135" class="ep-gravity"/>
  <text x="120" y="260" class="ep-sub">No gravity, rocket accelerates at g</text>

  <!-- Equals sign -->
  <text x="240" y="140" class="ep-equals">≡</text>
  <text x="240" y="160" class="ep-label">Locally</text>
  <text x="240" y="175" class="ep-label">indistinguishable</text>

  <!-- Scene 2: Stationary on Earth -->
  <text x="370" y="25" class="ep-title">Stationary on Earth</text>
  <rect x="300" y="40" width="140" height="200" class="ep-box"/>
  <!-- Person -->
  <circle cx="370" cy="140" r="12" class="ep-person"/>
  <line x1="370" y1="152" x2="370" y2="190" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <line x1="370" y1="190" x2="358" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <line x1="370" y1="190" x2="382" y2="220" stroke="var(--text-muted, #8b949e)" stroke-width="2"/>
  <!-- Floor -->
  <line x1="300" y1="230" x2="440" y2="230" class="ep-floor"/>
  <!-- Gravity arrow -->
  <line x1="370" y1="250" x2="370" y2="280" class="ep-gravity"/>
  <text x="370" y="295" class="ep-label" fill="#ff6b6b">g ↓ (gravity)</text>
  <!-- Ball dropping -->
  <circle cx="405" cy="100" r="5" fill="var(--text-accent, #79c0ff)" class="ep-ball-drop"/>
  <line x1="405" y1="105" x2="405" y2="135" class="ep-gravity"/>
  <text x="370" y="260" class="ep-sub">Gravitational field g</text>

  <!-- Scene 3: Tidal forces (NOT equivalent) -->
  <text x="555" y="25" class="ep-title">Tidal Forces</text>
  <rect x="485" y="40" width="140" height="200" class="ep-box"/>
  <!-- Two particles -->
  <circle cx="520" cy="130" r="5" fill="var(--text-accent, #79c0ff)" class="ep-tidal-h1"/>
  <circle cx="610" cy="130" r="5" fill="var(--text-accent, #79c0ff)" class="ep-tidal-h2"/>
  <!-- Converging tidal arrows -->
  <line x1="520" y1="140" x2="530" y2="170" class="ep-tidal"/>
  <line x1="610" y1="140" x2="600" y2="170" class="ep-tidal"/>
  <!-- Vertical tidal -->
  <circle cx="565" cy="80" r="5" fill="var(--text-accent, #79c0ff)" class="ep-tidal-v1"/>
  <circle cx="565" cy="180" r="5" fill="var(--text-accent, #79c0ff)" class="ep-tidal-v2"/>
  <line x1="565" y1="70" x2="565" y2="55" class="ep-tidal"/>
  <line x1="565" y1="190" x2="565" y2="205" class="ep-tidal"/>
  <text x="555" y="260" class="ep-sub">Cannot be eliminated!</text>
  <text x="555" y="275" class="ep-sub">= Intrinsic CURVATURE</text>

  <!-- Bottom formula box -->
  <rect x="50" y="320" width="560" height="110" rx="8" fill="var(--background-secondary, #161b22)" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5"/>
  <text x="330" y="345" class="ep-title">Key Insight</text>
  <text x="330" y="370" class="ep-label">Uniform gravity = acceleration (eliminable by free fall)</text>
  <text x="330" y="390" class="ep-label">Tidal gravity = curvature (NOT eliminable — intrinsic geometry)</text>
  <text x="330" y="415" class="ep-label" fill="var(--interactive-accent, #58a6ff)">Gravity is not a force — it is the curvature of spacetime</text>
</svg>