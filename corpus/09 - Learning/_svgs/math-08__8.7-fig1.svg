<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="curv-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .curv-geo { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .curv-dev { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
    .curv-sep { stroke: #ff6b6b; stroke-width: 2; fill: none; marker-end: url(#curv-arrow); }
    .curv-label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .curv-math { font-family: 'Latin Modern Math', serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-style: italic; }
    .curv-title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .curv-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 6; }
    
    /* Animations */
    .curv-geo-anim { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawGeo 4s infinite ease-in-out; }
    @keyframes drawGeo { 0% { stroke-dashoffset: 400; } 60%, 100% { stroke-dashoffset: 0; } }
    .curv-sep { animation: pulseSep 2s infinite alternate ease-in-out; }
    @keyframes pulseSep { 
      from { filter: drop-shadow(0 0 1px #ff6b6b); } 
      to { filter: drop-shadow(0 0 6px #ff6b6b); } 
    }
  </style>

  <!-- Title -->
  <text x="200" y="25" class="curv-title">Geodesic Deviation = Curvature</text>

  <!-- Two geodesics converging (positive curvature) -->
  <path d="M 50 350 Q 100 250 150 150 Q 180 80 200 40" class="curv-geo-anim"/>
  <path d="M 120 350 Q 150 260 170 170 Q 185 100 195 60" class="curv-geo-anim"/>
  
  <!-- Separation vectors -->
  <line x1="50" y1="350" x2="120" y2="350" class="curv-sep"/>
  <line x1="100" y1="250" x2="150" y2="255" class="curv-sep"/>
  <line x1="150" y1="150" x2="170" y2="155" class="curv-sep"/>
  
  <!-- Labels -->
  <text x="85" y="365" class="curv-label" fill="#ff6b6b">ξ^μ (separation)</text>
  <text x="30" y="200" class="curv-label">Geodesic 1</text>
  <text x="130" y="200" class="curv-label">Geodesic 2</text>
  <text x="80" y="130" class="curv-math">Converging → R > 0</text>

  <!-- Flat space comparison -->
  <text x="380" y="25" class="curv-title">Flat: Parallel Lines</text>
  <line x1="320" y1="350" x2="320" y2="50" class="curv-geo" stroke-dasharray="6,3"/>
  <line x1="390" y1="350" x2="390" y2="50" class="curv-geo" stroke-dasharray="6,3"/>
  <line x1="320" y1="300" x2="390" y2="300" class="curv-sep"/>
  <line x1="320" y1="150" x2="390" y2="150" class="curv-sep"/>
  <text x="355" y="130" class="curv-math">Constant ξ → R = 0</text>

  <!-- Formula box -->
  <rect x="420" y="100" width="170" height="160" class="curv-box"/>
  <text x="505" y="125" class="curv-title">Geodesic Deviation</text>
  <text x="435" y="150" class="curv-math">D²ξ^μ/Dτ² =</text>
  <text x="435" y="172" class="curv-math">  R^μ_ναβ U^ν U^β ξ^α</text>
  <text x="435" y="200" class="curv-label">R^μ_ναβ = Riemann tensor</text>
  <text x="435" y="220" class="curv-label">U^μ = tangent to geodesic</text>
  <text x="435" y="240" class="curv-label">ξ^μ = separation vector</text>
</svg>