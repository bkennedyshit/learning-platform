<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;height:auto;">
  <style>
    .fd-axis { stroke:var(--text-normal, #c9d1d9); stroke-width:1.5; fill:none; }
    .fd-t0 { stroke:var(--interactive-accent, #58a6ff); stroke-width:3; fill:none; }
    .fd-t1 { stroke:#ff6b6b; stroke-width:2.5; fill:none; }
    .fd-t2 { stroke:#4dabf7; stroke-width:2.5; fill:none; stroke-dasharray:6 3; }
    .fd-mu { stroke:var(--text-muted, #8b949e); stroke-width:1; stroke-dasharray:4 3; }
    .fd-lbl { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--text-normal, #c9d1d9); }
    .fd-acc { font-family:Inter,system-ui,sans-serif; font-size:13px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    @keyframes fd-draw { from{stroke-dashoffset:400} to{stroke-dashoffset:0} }
    .fd-anim { stroke-dasharray:400; animation: fd-draw 4s ease-out infinite alternate; }
  </style>
  <defs>
    <marker id="fda" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="60" y1="280" x2="480" y2="280" class="fd-axis" marker-end="url(#fda)"/>
  <line x1="60" y1="280" x2="60" y2="30" class="fd-axis" marker-end="url(#fda)"/>
  <text x="490" y="285" class="fd-lbl">ε (energy)</text>
  <text x="55" y="20" class="fd-lbl" text-anchor="end">⟨n⟩</text>
  <!-- y-axis labels -->
  <text x="50" y="80" class="fd-lbl" text-anchor="end">1</text>
  <line x1="55" y1="80" x2="65" y2="80" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="50" y="180" class="fd-lbl" text-anchor="end">½</text>
  <line x1="55" y1="180" x2="65" y2="180" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <!-- Chemical potential line -->
  <line x1="260" y1="30" x2="260" y2="280" class="fd-mu"/>
  <text x="265" y="295" class="fd-lbl">μ = ε_F</text>
  <!-- T=0: step function -->
  <path d="M 60 80 L 258 80 L 260 80 L 260 280 L 480 280" class="fd-t0 fd-anim"/>
  <text x="150" y="65" class="fd-acc">T = 0</text>
  <!-- T > 0 (moderate): smooth step -->
  <path d="M 60 82 Q 150 82 200 85 Q 230 90 245 120 Q 260 180 275 220 Q 290 250 320 265 Q 380 278 480 280" class="fd-t1"/>
  <text x="320" y="230" class="fd-lbl" fill="#ff6b6b" font-weight="bold">T > 0</text>
  <!-- T >> 0 (high): gradual decay -->
  <path d="M 60 100 Q 150 120 200 150 Q 260 180 300 220 Q 350 250 400 268 Q 450 276 480 280" class="fd-t2 fd-anim" style="animation-delay:2s"/>
  <text x="400" y="245" class="fd-lbl" fill="#4dabf7" font-weight="bold">T ≫ 0</text>
  
  <!-- Particles filling energy states at T=0 -->
  <circle r="4" fill="var(--interactive-accent, #58a6ff)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 60 80 L 255 80" />
  </circle>
  <circle r="4" fill="var(--interactive-accent, #58a6ff)">
    <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 60 80 L 255 80" />
  </circle>
  <circle r="4" fill="var(--interactive-accent, #58a6ff)">
    <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M 60 80 L 255 80" />
  </circle>
  <!-- Formula box -->
  <rect x="320" y="40" width="180" height="60" rx="5" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="410" y="62" class="fd-acc" text-anchor="middle">Fermi-Dirac:</text>
  <text x="410" y="85" class="fd-lbl" text-anchor="middle" font-family="serif" font-size="14">⟨n⟩ = 1/(e^(ε−μ)/k_BT + 1)</text>
</svg>