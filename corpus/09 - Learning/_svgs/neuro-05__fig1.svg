<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #888; stroke-width: 2; }
      .grid { stroke: #333; stroke-width: 1; stroke-dasharray: 4,4; }
      .text { font-family: sans-serif; font-size: 14px; fill: #ccc; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #fff; }
      .ap-curve { fill: none; stroke: #4dabf7; stroke-width: 4; stroke-linecap: round; }
      .phase-label { font-family: sans-serif; font-size: 12px; fill: #4dabf7; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="620" height="400" fill="#1e1e1e" rx="10"/>
  
  <text x="310" y="30" text-anchor="middle" class="title">Action Potential Phases</text>

  <!-- Grid lines -->
  <line x1="80" y1="50" x2="580" y2="50" class="grid"/>
  <text x="70" y="55" text-anchor="end" class="text">+40 mV</text>
  
  <line x1="80" y1="200" x2="580" y2="200" class="grid"/>
  <text x="70" y="205" text-anchor="end" class="text">0 mV</text>

  <line x1="80" y1="260" x2="580" y2="260" class="grid" stroke="#ff6b6b"/>
  <text x="70" y="265" text-anchor="end" class="text" fill="#ff6b6b">-55 mV</text>

  <line x1="80" y1="300" x2="580" y2="300" class="grid"/>
  <text x="70" y="305" text-anchor="end" class="text">-70 mV</text>
  
  <line x1="80" y1="350" x2="580" y2="350" class="grid"/>
  <text x="70" y="355" text-anchor="end" class="text">-90 mV</text>

  <!-- Axes -->
  <line x1="80" y1="40" x2="80" y2="360" class="axis"/>
  <line x1="80" y1="360" x2="580" y2="360" class="axis"/>
  <text x="330" y="390" text-anchor="middle" class="text">Time (ms)</text>

  <!-- The Action Potential Curve -->
  <path id="apPath" class="ap-curve" d="M 80 300 L 150 300 C 180 300, 190 260, 210 260 C 230 260, 240 50, 260 50 C 280 50, 300 350, 340 350 C 380 350, 400 300, 450 300 L 550 300" filter="url(#glow)"/>

  <!-- Phase Labels -->
  <text x="110" y="285" class="phase-label">Resting State</text>
  <text x="150" y="240" class="phase-label" fill="#ff6b6b">Threshold</text>
  <text x="210" y="150" class="phase-label" transform="rotate(-65 210 150)">Depolarization</text>
  <text x="300" y="150" class="phase-label" transform="rotate(65 300 150)">Repolarization</text>
  <text x="340" y="375" class="phase-label" text-anchor="middle">Hyperpolarization</text>
  <text x="470" y="285" class="phase-label">Recovery</text>

  <!-- Animated dot traveling along path -->
  <circle r="6" fill="#fff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#apPath"/>
    </animateMotion>
  </circle>
  
  <!-- Stimulus indicator -->
  <path d="M 150 340 L 150 310 L 145 315 M 150 310 L 155 315" stroke="#ffcc00" stroke-width="2" fill="none">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.2;0.3;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="150" y="355" text-anchor="middle" font-size="12" fill="#ffcc00">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.2;0.3;1" dur="4s" repeatCount="indefinite"/>
    Stimulus
  </text>
</svg>
