<svg viewBox="0 0 650 380" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <style>
    .os-layer { fill: var(--background-secondary, #161b22); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; rx: 6; transition: all 0.2s; cursor: pointer; }
    .os-layer:hover { stroke: var(--interactive-accent, #58a6ff); filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .kernel-layer { fill: var(--interactive-accent, #58a6ff); opacity: 0.12; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 6; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .detail { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
  </style>

  <text x="325" y="20" class="title">Operating System Layer Architecture — User Space to Hardware</text>

  <!-- User space -->
  <rect x="50" y="40" width="550" height="55" class="os-layer"/>
  <text x="325" y="60" class="label" font-weight="bold">User Space Applications</text>
  <text x="325" y="80" class="detail">Python interpreter • VS Code • Docker • Web browsers • Your scripts</text>

  <!-- System libraries -->
  <rect x="50" y="105" width="550" height="45" class="os-layer"/>
  <text x="325" y="125" class="label" font-weight="bold">System Libraries &amp; Runtime</text>
  <text x="325" y="140" class="detail">libc (glibc/musl) • libpthread • libm • dynamic linker (ld.so)</text>

  <!-- System call interface -->
  <rect x="50" y="160" width="550" height="35" class="os-layer"/>
  <text x="325" y="182" class="label">System Call Interface (syscalls: open, read, write, mmap, fork, exec)</text>

  <!-- Kernel -->
  <rect x="50" y="205" width="550" height="90" class="kernel-layer"/>
  <text x="325" y="225" class="label" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">Kernel Space</text>
  <text x="150" y="250" class="detail">Process Scheduler</text>
  <text x="325" y="250" class="detail">Memory Manager (VMM)</text>
  <text x="500" y="250" class="detail">File Systems (VFS)</text>
  <text x="150" y="275" class="detail">Network Stack (TCP/IP)</text>
  <text x="325" y="275" class="detail">Device Drivers</text>
  <text x="500" y="275" class="detail">IPC (pipes, sockets)</text>

  <!-- Hardware -->
  <rect x="50" y="310" width="550" height="55" class="os-layer"/>
  <text x="325" y="330" class="label" font-weight="bold">Hardware</text>
  <text x="325" y="350" class="detail">CPU (cores, caches, TLB) • RAM (DRAM) • Storage (NVMe/SSD) • GPU • NIC</text>
</svg>
