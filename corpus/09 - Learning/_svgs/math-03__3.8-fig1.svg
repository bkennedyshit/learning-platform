<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:600px;height:auto;">
  <style>
    .sol-axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1; }
    .sol-wave1 { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .sol-wave2 { stroke: var(--text-accent, #79c0ff); stroke-width: 2.5; fill: none; }
    .sol-merged { stroke: var(--interactive-accent, #58a6ff); stroke-width: 3; fill: none; stroke-dasharray: 6 3; }
    .sol-label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sol-accent { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .sol-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 5; }
    .sol-particle { fill: var(--interactive-accent, #58a6ff); }
  </style>
  <defs>
    <marker id="sol-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- t=0: two solitons approaching -->
  <text x="300" y="15" class="sol-accent" text-anchor="middle">Soliton Collision (KdV)</text>
  <!-- Panel: before collision -->
  <line x1="30" y1="80" x2="280" y2="80" class="sol-axis"/>
  <text x="155" y="95" class="sol-label" text-anchor="middle">t = 0 (before)</text>
  <!-- Tall soliton -->
  <path d="M 50 80 Q 70 80 90 80 Q 100 30 110 80 Q 130 80 150 80" class="sol-wave1" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Short soliton -->
  <path d="M 170 80 Q 190 80 210 80 Q 218 55 226 80 Q 240 80 260 80" class="sol-wave2" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Panel: during collision -->
  <line x1="30" y1="160" x2="280" y2="160" class="sol-axis"/>
  <text x="155" y="175" class="sol-label" text-anchor="middle">t = t₁ (during)</text>
  <path d="M 50 160 Q 100 160 130 160 Q 150 90 170 160 Q 200 160 260 160" class="sol-merged" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Panel: after collision -->
  <line x1="30" y1="240" x2="280" y2="240" class="sol-axis"/>
  <text x="155" y="255" class="sol-label" text-anchor="middle">t = t₂ (after)</text>
  <!-- Tall soliton passed through, now ahead -->
  <path d="M 50 240 Q 80 240 100 240 Q 108 215 116 240 Q 130 240 150 240" class="sol-wave2" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M 180 240 Q 200 240 220 240 Q 230 190 240 240 Q 260 240 280 240" class="sol-wave1" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Right panel: key properties -->
  <rect x="310" y="30" width="270" height="120" class="sol-box"/>
  <text x="445" y="52" class="sol-accent" text-anchor="middle">Soliton Properties</text>
  <text x="320" y="72" class="sol-label">• Shape preserved after collision</text>
  <text x="320" y="92" class="sol-label">• Taller = faster (amplitude ∝ speed)</text>
  <text x="320" y="112" class="sol-label">• Only phase shift after interaction</text>
  <text x="320" y="132" class="sol-label">• Balance: nonlinearity ↔ dispersion</text>
  <!-- Animated particle -->
  <circle r="3" class="sol-particle">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 90 30 Q 150 90 230 190 L 240 240"/>
  </circle>
</svg>