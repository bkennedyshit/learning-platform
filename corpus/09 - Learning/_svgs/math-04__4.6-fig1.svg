<svg viewBox="0 0 580 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:580px;height:auto;">
  <style>
    .pb-box{fill:var(--background-secondary, #161b22);stroke:var(--text-muted, #8b949e);stroke-width:1.5;rx:8}
    .pb-arr{stroke:var(--interactive-accent, #58a6ff);stroke-width:2.5;fill:none;marker-end:url(#pb-a)}
    .pb-lbl{font-family:Inter,system-ui,sans-serif;font-size:13px;fill:var(--text-normal, #c9d1d9)}
    .pb-acc{font-family:Inter,system-ui,sans-serif;font-size:14px;fill:var(--interactive-accent, #58a6ff);font-weight:bold}
    .pb-eq{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-accent, #79c0ff)}
    .pb-glow{transition:all .2s;cursor:pointer}
    .pb-glow:hover{filter:drop-shadow(0 0 5px var(--interactive-accent, #58a6ff))}
  </style>
  <defs>
    <marker id="pb-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Old phase space -->
  <rect x="20" y="40" width="180" height="200" class="pb-box pb-glow"/>
  <text x="110" y="30" class="pb-acc" text-anchor="middle">Old: (q, p)</text>
  <text x="110" y="80" class="pb-lbl" text-anchor="middle">H(q, p, t)</text>
  <text x="110" y="110" class="pb-eq" text-anchor="middle">{qᵢ, pⱼ} = δᵢⱼ</text>
  <text x="110" y="135" class="pb-eq" text-anchor="middle">{qᵢ, qⱼ} = 0</text>
  <text x="110" y="160" class="pb-eq" text-anchor="middle">{pᵢ, pⱼ} = 0</text>
  <ellipse cx="110" cy="200" rx="50" ry="25" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5" fill="none"/>
  <circle r="4" fill="var(--text-accent, #79c0ff)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M160 200 A50 25 0 1 1 160 199.9"/>
  </circle>
  <text x="110" y="205" class="pb-lbl" text-anchor="middle">orbit</text>
  <!-- Arrow -->
  <line x1="210" y1="140" x2="350" y2="140" class="pb-arr">
    <animate attributeName="x2" values="350; 360; 350" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="280" y="125" class="pb-acc" text-anchor="middle">Canonical</text>
  <text x="280" y="165" class="pb-acc" text-anchor="middle">Transform</text>
  <!-- New phase space -->
  <rect x="360" y="40" width="200" height="200" class="pb-box pb-glow"/>
  <text x="460" y="30" class="pb-acc" text-anchor="middle">New: (Q, P)</text>
  <text x="460" y="80" class="pb-lbl" text-anchor="middle">K(Q, P, t)</text>
  <text x="460" y="110" class="pb-eq" text-anchor="middle">{Qᵢ, Pⱼ} = δᵢⱼ</text>
  <text x="460" y="135" class="pb-eq" text-anchor="middle">{Qᵢ, Qⱼ} = 0</text>
  <text x="460" y="160" class="pb-eq" text-anchor="middle">{Pᵢ, Pⱼ} = 0</text>
  <circle cx="460" cy="200" r="4" fill="var(--interactive-accent, #58a6ff)"/>
  <text x="460" y="225" class="pb-lbl" text-anchor="middle">fixed point (if K=0)</text>
</svg>