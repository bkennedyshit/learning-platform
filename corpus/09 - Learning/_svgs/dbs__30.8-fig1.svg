<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <style>
    .title  { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .small  { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .mono   { font-family: ui-monospace, monospace; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .box    { fill: var(--background-secondary,#161b22); stroke: var(--text-muted,#8b949e); stroke-width:1.2; }
    .leader { fill: #1a2a3a; stroke: var(--interactive-accent,#58a6ff); stroke-width: 2; }
    .follower{ fill: var(--background-secondary,#161b22); stroke: var(--interactive-accent,#58a6ff); stroke-width:1.2; }
    .raft   { fill: #1a3a1a; stroke: #51cf66; stroke-width:1.8; }
    .warn   { fill: #3a2a1a; stroke: #ffd93d; stroke-width: 1.5; }
    .arr    { stroke: var(--text-muted,#8b949e); stroke-width: 1.2; fill: none; }
    .replar { stroke: var(--interactive-accent,#58a6ff); stroke-width: 1.5; fill: none; }
    .raftarr{ stroke: #51cf66; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="dbs8-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted,#8b949e)"/>
    </marker>
    <marker id="dbs8-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent,#58a6ff)"/>
    </marker>
    <marker id="dbs8-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#51cf66"/>
    </marker>
  </defs>

  <text x="360" y="20" class="title" text-anchor="middle">Distributed Databases — Leader-Follower Replication &amp; Raft Consensus</text>

  <!-- LEFT: leader-follower replication -->
  <rect x="18" y="30" width="328" height="196" class="box" rx="6"/>
  <text x="182" y="50" class="label" text-anchor="middle" font-weight="bold">Leader-Follower (Single-Master) Replication</text>

  <!-- Leader node -->
  <rect x="130" y="60" width="104" height="40" class="leader" rx="6"/>
  <text x="182" y="78" class="label" text-anchor="middle" fill="#58a6ff">Leader</text>
  <text x="182" y="92" class="small" text-anchor="middle">all writes go here</text>

  <!-- Followers -->
  <rect x="28"  y="134" width="104" height="40" class="follower" rx="4"/>
  <text x="80"  y="152" class="label" text-anchor="middle" fill="#58a6ff">Follower 1</text>
  <text x="80"  y="165" class="small" text-anchor="middle">read replica</text>

  <rect x="232" y="134" width="104" height="40" class="follower" rx="4"/>
  <text x="284" y="152" class="label" text-anchor="middle" fill="#58a6ff">Follower 2</text>
  <text x="284" y="165" class="small" text-anchor="middle">read replica</text>

  <!-- WAL shipping arrows -->
  <line x1="150" y1="100" x2="90"  y2="134" class="replar" marker-end="url(#dbs8-b)"/>
  <line x1="214" y1="100" x2="274" y2="134" class="replar" marker-end="url(#dbs8-b)"/>
  <text x="182" y="118" class="small" text-anchor="middle" fill="#58a6ff">WAL stream (async / sync)</text>

  <text x="28"  y="192" class="small">Sync replication: leader waits for ≥1 follower ACK before</text>
  <text x="28"  y="204" class="small">returning commit. Durability ↑, latency ↑.</text>
  <text x="28"  y="216" class="small">Async: lower latency, risk of data loss on leader crash.</text>

  <!-- RIGHT: Raft -->
  <rect x="360" y="30" width="342" height="196" class="box" rx="6"/>
  <text x="531" y="50" class="label" text-anchor="middle" font-weight="bold">Raft Consensus — Tolerate f Failures with 2f+1 Nodes</text>

  <rect x="452" y="60" width="104" height="40" class="raft" rx="6"/>
  <text x="504" y="78" class="label" text-anchor="middle" fill="#51cf66">Leader</text>
  <text x="504" y="92" class="small" text-anchor="middle">elected by vote</text>

  <rect x="370" y="140" width="90" height="36" fill="var(--background-secondary,#161b22)" stroke="#51cf66" stroke-width="1" rx="4"/>
  <text x="415" y="157" class="small" text-anchor="middle" fill="#51cf66">Follower A</text>
  <text x="415" y="169" class="small" text-anchor="middle">log replicated</text>

  <rect x="480" y="140" width="90" height="36" fill="var(--background-secondary,#161b22)" stroke="#51cf66" stroke-width="1" rx="4"/>
  <text x="525" y="157" class="small" text-anchor="middle" fill="#51cf66">Follower B</text>
  <text x="525" y="169" class="small" text-anchor="middle">log replicated</text>

  <rect x="590" y="140" width="100" height="36" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1" rx="4"/>
  <text x="640" y="157" class="small" text-anchor="middle" fill="#ff6b6b">Follower C</text>
  <text x="640" y="169" class="small" text-anchor="middle">(partitioned)</text>

  <line x1="490" y1="100" x2="435" y2="140" class="raftarr" marker-end="url(#dbs8-g)"/>
  <line x1="518" y1="100" x2="522" y2="140" class="raftarr" marker-end="url(#dbs8-g)"/>
  <line x1="545" y1="100" x2="610" y2="140" class="raftarr" stroke="#ff6b6b" stroke-dasharray="4 3" marker-end="url(#dbs8-a)"/>

  <text x="370" y="192" class="small">Commit = quorum (3/3 or 2/3 here). C partitioned → 2 of 3 ACK → still commits.</text>
  <text x="370" y="204" class="small">Leader election: candidate with highest term + longest log wins majority vote.</text>
  <text x="370" y="216" class="small">etcd (Kubernetes), CockroachDB, TiKV, RethinkDB all use Raft.</text>

  <!-- BOTTOM: replication lag + CAP reminder + sharding -->
  <rect x="18" y="240" width="330" height="164" class="box" rx="6"/>
  <text x="183" y="258" class="label" text-anchor="middle" font-weight="bold">Replication Lag &amp; Consistency Anomalies</text>
  <text x="28"  y="276" class="small" fill="#ffd93d">Read-your-writes: user writes, then reads from a stale replica</text>
  <text x="28"  y="292" class="small">and sees their old value. Fix: route user's own reads to leader.</text>
  <text x="28"  y="310" class="small" fill="#ffd93d">Monotonic reads: user reads T=50, then T=30 from another replica.</text>
  <text x="28"  y="326" class="small">Fix: sticky routing to same replica per user session.</text>
  <text x="28"  y="344" class="small" fill="#ffd93d">Consistent prefix: causally related writes seen out of order.</text>
  <text x="28"  y="360" class="small">Fix: causal consistency tokens or single shard routing.</text>
  <text x="28"  y="378" class="small">Measuring lag: pg_stat_replication.write_lag / replay_lag.</text>
  <text x="28"  y="394" class="small">pg_replication_slots — guaranteed WAL retention until replica ACKs.</text>

  <rect x="362" y="240" width="340" height="164" class="box" rx="6"/>
  <text x="532" y="258" class="label" text-anchor="middle" font-weight="bold">Partitioning (Sharding) Strategies</text>
  <text x="372" y="276" class="small" font-weight="bold">Range partitioning:</text>
  <text x="372" y="290" class="small">user_id 1–1M → shard A, 1M–2M → shard B.</text>
  <text x="372" y="304" class="small">Pro: range queries efficient. Con: hot spot on sequential inserts.</text>
  <text x="372" y="322" class="small" font-weight="bold">Hash partitioning:</text>
  <text x="372" y="336" class="small">shard = hash(user_id) mod N.</text>
  <text x="372" y="350" class="small">Pro: even distribution. Con: range queries hit all shards.</text>
  <text x="372" y="368" class="small" font-weight="bold">Consistent hashing (DHT):</text>
  <text x="372" y="382" class="small">Add/remove node: only K/N keys remapped. Used by Cassandra,</text>
  <text x="372" y="396" class="small">DynamoDB, Redis Cluster. Virtual nodes for uniform spread.</text>
</svg>
