<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:600px;height:auto;">
  <style>
    .lt-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 8; }
    .lt-arrow { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .lt-label { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .lt-accent { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .lt-eq { font-family: serif; font-size: 12px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .lt-particle { fill: var(--interactive-accent, #58a6ff); }
  </style>
  <defs>
    <marker id="lt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Box 1: Time domain ODE -->
  <rect x="20" y="50" width="150" height="80" class="lt-box"/>
  <text x="95" y="78" class="lt-accent">Time Domain</text>
  <text x="95" y="98" class="lt-label">ay'' + by' + cy = g(t)</text>
  <text x="95" y="118" class="lt-eq">Calculus (hard)</text>
  <!-- Arrow: L{} -->
  <line x1="170" y1="90" x2="230" y2="90" class="lt-arrow" marker-end="url(#lt-arr)" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="200" y="80" class="lt-accent">ℒ</text>
  <!-- Box 2: s-domain algebra -->
  <rect x="230" y="50" width="150" height="80" class="lt-box"/>
  <text x="305" y="78" class="lt-accent">s-Domain</text>
  <text x="305" y="98" class="lt-label">(as²+bs+c)Y = ...</text>
  <text x="305" y="118" class="lt-eq">Algebra (easy)</text>
  <!-- Arrow: solve -->
  <line x1="305" y1="130" x2="305" y2="160" class="lt-arrow" marker-end="url(#lt-arr)" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="330" y="150" class="lt-label">Solve for Y(s)</text>
  <!-- Box 3: Y(s) partial fractions -->
  <rect x="230" y="160" width="150" height="50" class="lt-box"/>
  <text x="305" y="190" class="lt-label">Y(s) = partial fractions</text>
  <!-- Arrow: L^{-1} -->
  <line x1="230" y1="185" x2="170" y2="185" class="lt-arrow" marker-end="url(#lt-arr)" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </line>
  <text x="200" y="175" class="lt-accent">ℒ⁻¹</text>
  <!-- Box 4: Solution -->
  <rect x="20" y="160" width="150" height="50" class="lt-box"/>
  <text x="95" y="190" class="lt-accent">y(t) = solution!</text>
  <!-- Animated particle along pipeline -->
  <circle r="4" class="lt-particle">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 95 90 L 200 90 L 305 90 L 305 185 L 200 185 L 95 185"/>
  </circle>
</svg>