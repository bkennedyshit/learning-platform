<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      .text { font-family: sans-serif; fill: #333; }
      .line { fill: none; stroke: #333; stroke-width: 2; }
      .axis { stroke: #888; stroke-width: 1.5; }
      .signal1 { fill: none; stroke: #3498db; stroke-width: 2; }
      .signal2 { fill: none; stroke: #e74c3c; stroke-width: 2; }
      .signalSum { fill: none; stroke: #9b59b6; stroke-width: 3; }
      .spike { stroke: #9b59b6; stroke-width: 4; }
      .spike-cap { fill: #9b59b6; }
    </style>
  </defs>

  <text x="400" y="30" class="text" font-size="22" font-weight="bold" text-anchor="middle">Fourier Transform: Time Domain to Frequency Domain</text>

  <!-- Time Domain -->
  <g transform="translate(50, 100)">
    <text x="150" y="-20" class="text" font-size="16" font-weight="bold" text-anchor="middle">Time Domain: f(t)</text>
    
    <!-- Axes -->
    <line x1="0" y1="100" x2="300" y2="100" class="axis" />
    <line x1="0" y1="0" x2="0" y2="200" class="axis" />
    <text x="310" y="105" class="text" font-size="12">t</text>

    <!-- Component 1 (low freq) -->
    <path d="M 0 100 Q 37.5 20 75 100 T 150 100 T 225 100 T 300 100" class="signal1" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Component 2 (high freq) -->
    <path d="M 0 100 Q 18.75 60 37.5 100 T 75 100 T 112.5 100 T 150 100 T 187.5 100 T 225 100 T 262.5 100 T 300 100" class="signal2" opacity="0.6" />
    
    <!-- Sum -->
    <path d="M 0 100 C 20 20, 30 80, 50 100 C 70 120, 80 40, 100 100 C 120 160, 130 80, 150 100 C 170 120, 180 180, 200 100 C 220 20, 230 80, 250 100 C 270 120, 280 40, 300 100" class="signalSum" />
    
    <text x="20" y="20" fill="#3498db" font-weight="bold">440 Hz</text>
    <text x="20" y="40" fill="#e74c3c" font-weight="bold">880 Hz</text>
    <text x="20" y="180" fill="#9b59b6" font-weight="bold">Complex Waveform</text>
  </g>

  <!-- Transform Arrow -->
  <g transform="translate(380, 190)">
    <line x1="0" y1="0" x2="40" y2="0" class="line" marker-end="url(#arrow)" />
    <text x="20" y="-10" class="text" font-size="14" text-anchor="middle" font-weight="bold">FFT</text>
  </g>

  <!-- Frequency Domain -->
  <g transform="translate(480, 100)">
    <text x="150" y="-20" class="text" font-size="16" font-weight="bold" text-anchor="middle">Frequency Domain: |F(f)|</text>
    
    <!-- Axes -->
    <line x1="0" y1="180" x2="300" y2="180" class="axis" />
    <line x1="0" y1="0" x2="0" y2="180" class="axis" />
    <text x="310" y="185" class="text" font-size="12">f (Hz)</text>
    
    <!-- Spike 1: 440Hz -->
    <line x1="80" y1="180" x2="80" y2="60" class="spike">
      <animate attributeName="y2" values="180;60;60;180" dur="2s" repeatCount="indefinite" />
    </line>
    <circle cx="80" cy="60" r="4" class="spike-cap">
      <animate attributeName="cy" values="180;60;60;180" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="200" class="text" font-size="12" text-anchor="middle">440</text>
    <text x="80" y="45" class="text" font-size="12" text-anchor="middle" fill="#3498db">A₁</text>

    <!-- Spike 2: 880Hz -->
    <line x1="160" y1="180" x2="160" y2="120" class="spike">
      <animate attributeName="y2" values="180;120;120;180" dur="2s" begin="0.2s" repeatCount="indefinite" />
    </line>
    <circle cx="160" cy="120" r="4" class="spike-cap">
      <animate attributeName="cy" values="180;120;120;180" dur="2s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <text x="160" y="200" class="text" font-size="12" text-anchor="middle">880</text>
    <text x="160" y="105" class="text" font-size="12" text-anchor="middle" fill="#e74c3c">A₂</text>
    
  </g>
</svg>
