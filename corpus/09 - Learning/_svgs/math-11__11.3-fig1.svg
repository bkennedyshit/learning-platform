<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;height:auto;">
  <defs>
    <marker id="tr-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .tr-ax { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; fill: none; }
    .tr-grid { stroke: var(--text-muted, #8b949e); stroke-width: 0.5; opacity: 0.3; }
    .tr-ss { stroke: var(--text-accent, #79c0ff); stroke-width: 1.5; stroke-dasharray: 6 3; }
    .tr-ud { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; stroke-dasharray: 800; stroke-dashoffset: 800; animation: drawCurve 4s ease-in-out infinite; }
    .tr-cd { stroke: #4dabf7; stroke-width: 2.5; fill: none; stroke-dasharray: 800; stroke-dashoffset: 800; animation: drawCurve 4s ease-in-out infinite 0.2s; }
    .tr-od { stroke: #ff6b6b; stroke-width: 2.5; fill: none; stroke-dasharray: 800; stroke-dashoffset: 800; animation: drawCurve 4s ease-in-out infinite 0.4s; }
    @keyframes drawCurve { 0% { stroke-dashoffset: 800; } 50%, 100% { stroke-dashoffset: 0; } }
    .tr-lbl { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .tr-acc { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .tr-dim { stroke: var(--text-muted, #8b949e); stroke-width: 1; stroke-dasharray: 3 2; }
    .tr-env { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.5; fill: none; }
  </style>

  <!-- Grid -->
  <path class="tr-grid" d="M 80 40 V 320 M 160 40 V 320 M 240 40 V 320 M 320 40 V 320 M 400 40 V 320 M 480 40 V 320 M 560 40 V 320"/>
  <path class="tr-grid" d="M 60 80 H 620 M 60 140 H 620 M 60 200 H 620 M 60 260 H 620"/>

  <!-- Axes -->
  <line x1="60" y1="320" x2="640" y2="320" class="tr-ax" marker-end="url(#tr-arr)"/>
  <line x1="60" y1="340" x2="60" y2="30" class="tr-ax" marker-end="url(#tr-arr)"/>
  <text x="650" y="325" class="tr-lbl">t</text>
  <text x="55" y="25" class="tr-lbl">y(t)</text>

  <!-- Steady-state line at y=1 -->
  <line x1="60" y1="140" x2="620" y2="140" class="tr-ss"/>
  <text x="630" y="145" class="tr-lbl" fill="var(--text-accent, #79c0ff)">y_ss=1</text>

  <!-- Underdamped (ζ=0.3) -->
  <path d="M 60 320 C 100 320 120 60 160 60 C 200 60 210 170 240 170 C 270 170 280 115 310 115 C 340 115 350 150 380 150 C 410 150 415 135 440 135 C 465 135 470 142 500 142 C 530 142 535 139 560 140 L 620 140" class="tr-ud"/>
  <text x="180" y="50" class="tr-acc">ζ = 0.3 (underdamped)</text>

  <!-- Critically damped (ζ=1.0) -->
  <path d="M 60 320 C 120 320 180 160 240 145 C 300 135 360 140 420 140 L 620 140" class="tr-cd"/>
  <text x="280" y="165" class="tr-lbl" fill="#4dabf7" font-weight="bold">ζ = 1.0 (critical)</text>

  <!-- Overdamped (ζ=2.0) -->
  <path d="M 60 320 C 140 320 240 200 320 165 C 400 145 480 141 560 140 L 620 140" class="tr-od"/>
  <text x="380" y="185" class="tr-lbl" fill="#ff6b6b" font-weight="bold">ζ = 2.0 (overdamped)</text>

  <!-- Exponential envelope for underdamped -->
  <path d="M 60 320 C 100 200 200 145 300 141 L 620 140" class="tr-env"/>
  <path d="M 60 320 C 100 320 200 135 300 139 L 620 140" class="tr-env"/>

  <!-- Overshoot annotation -->
  <line x1="160" y1="60" x2="160" y2="140" class="tr-dim"/>
  <text x="170" y="100" class="tr-lbl" fill="var(--text-accent, #79c0ff)">M_p</text>

  <!-- Peak time annotation -->
  <line x1="160" y1="320" x2="160" y2="330" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="160" y="345" class="tr-lbl" text-anchor="middle">t_p</text>

  <!-- Settling time annotation -->
  <line x1="440" y1="320" x2="440" y2="330" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="440" y="345" class="tr-lbl" text-anchor="middle">t_s</text>
</svg>