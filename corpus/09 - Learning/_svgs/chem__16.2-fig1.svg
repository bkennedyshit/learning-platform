<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .bonding { fill: var(--interactive-accent, #58a6ff); opacity: 0.3; stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; }
    .antibonding { fill: #ff6b6b; opacity: 0.2; stroke: #ff6b6b; stroke-width: 2; stroke-dasharray: 4,3; }
    .energy-line { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; }
    .electron { fill: var(--interactive-accent, #58a6ff); }
    .axis { stroke: var(--text-muted, #8b949e); stroke-width: 1; }
    .ao-line { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; stroke-dasharray: 5,3; }
  </style>
  <text x="300" y="22" class="title" text-anchor="middle">Molecular Orbital Formation: H₂ (LCAO Method)</text>
  <!-- Energy axis -->
  <line x1="300" y1="45" x2="300" y2="320" class="axis"/>
  <text x="300" y="340" class="sublabel" text-anchor="middle">← Energy →</text>
  <!-- Left atom (H_A) -->
  <text x="80" y="55" class="label" text-anchor="middle">Atom A (1s)</text>
  <line x1="40" y1="180" x2="130" y2="180" class="ao-line"/>
  <circle cx="70" cy="175" r="4" class="electron"/><text x="70" y="172" class="sublabel" text-anchor="middle">↑</text>
  <!-- Right atom (H_B) -->
  <text x="520" y="55" class="label" text-anchor="middle">Atom B (1s)</text>
  <line x1="470" y1="180" x2="560" y2="180" class="ao-line"/>
  <circle cx="500" cy="175" r="4" class="electron"/><text x="500" y="172" class="sublabel" text-anchor="middle">↑</text>
  <!-- Bonding MO (lower energy) -->
  <line x1="230" y1="240" x2="370" y2="240" class="energy-line"/>
  <circle cx="280" cy="235" r="4" class="electron"/><text x="280" y="232" class="sublabel" text-anchor="middle">↑</text>
  <circle cx="320" cy="235" r="4" class="electron"/><text x="320" y="232" class="sublabel" text-anchor="middle">↓</text>
  <text x="300" y="260" class="label" text-anchor="middle">σ (bonding)</text>
  <text x="300" y="275" class="sublabel" text-anchor="middle">ψ₊ = φ_A + φ_B</text>
  <!-- Antibonding MO (higher energy) -->
  <line x1="230" y1="100" x2="370" y2="100" class="energy-line"/>
  <text x="300" y="90" class="label" text-anchor="middle">σ* (antibonding)</text>
  <text x="300" y="78" class="sublabel" text-anchor="middle">ψ₋ = φ_A − φ_B</text>
  <!-- Correlation lines -->
  <line x1="130" y1="180" x2="230" y2="240" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="180" x2="230" y2="100" stroke="#ff6b6b" stroke-width="1" opacity="0.5"/>
  <line x1="470" y1="180" x2="370" y2="240" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1" opacity="0.5"/>
  <line x1="470" y1="180" x2="370" y2="100" stroke="#ff6b6b" stroke-width="1" opacity="0.5"/>
  <!-- Orbital shapes -->
  <ellipse cx="300" cy="300" rx="50" ry="20" class="bonding"/>
  <text x="300" y="320" class="sublabel" text-anchor="middle">constructive interference</text>
  <!-- Bond order -->
  <rect x="420" y="280" width="160" height="50" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="4"/>
  <text x="500" y="300" class="label" text-anchor="middle">Bond Order = (2-0)/2 = 1</text>
  <text x="500" y="318" class="sublabel" text-anchor="middle">Single bond, diamagnetic</text>
</svg>
