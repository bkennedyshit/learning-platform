<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:600px;height:auto;">
  <style>
    .pp-axis { stroke: var(--text-muted, #8b949e); stroke-width: 0.8; }
    .pp-traj { stroke: var(--interactive-accent, #58a6ff); stroke-width: 1.8; fill: none; }
    .pp-traj2 { stroke: var(--text-accent, #79c0ff); stroke-width: 1.8; fill: none; }
    .pp-eigen { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.2; stroke-dasharray: 4 2; }
    .pp-label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .pp-title { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .pp-dot { fill: var(--interactive-accent, #58a6ff); }
    .pp-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 0.8; rx: 4; }
  </style>
  <!-- Panel 1: Stable Node (λ1,λ2 < 0 real distinct) -->
  <rect x="5" y="5" width="190" height="185" class="pp-box"/>
  <text x="100" y="22" class="pp-title">Stable Node</text>
  <text x="100" y="36" class="pp-label">λ₁,λ₂ &lt; 0 real</text>
  <line x1="100" y1="50" x2="100" y2="180" class="pp-axis"/>
  <line x1="20" y1="115" x2="180" y2="115" class="pp-axis"/>
  <circle cx="100" cy="115" r="3" class="pp-dot"/>
  <path d="M 30 60 Q 70 90 100 115" class="pp-traj" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 170 170 Q 130 140 100 115" class="pp-traj" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 40 160 Q 75 135 100 115" class="pp-traj2" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 160 70 Q 125 95 100 115" class="pp-traj2" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </path>
  <!-- Panel 2: Saddle Point (λ1 < 0 < λ2) -->
  <rect x="205" y="5" width="190" height="185" class="pp-box"/>
  <text x="300" y="22" class="pp-title">Saddle Point</text>
  <text x="300" y="36" class="pp-label">λ₁ &lt; 0 &lt; λ₂</text>
  <line x1="300" y1="50" x2="300" y2="180" class="pp-axis"/>
  <line x1="220" y1="115" x2="380" y2="115" class="pp-axis"/>
  <circle cx="300" cy="115" r="3" class="pp-dot"/>
  <line x1="230" y1="55" x2="370" y2="175" class="pp-eigen"/>
  <line x1="230" y1="175" x2="370" y2="55" class="pp-eigen"/>
  <path d="M 230 80 Q 270 100 300 115 Q 330 130 370 150" class="pp-traj" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 370 80 Q 330 100 300 115 Q 270 130 230 150" class="pp-traj2" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </path>
  <!-- Panel 3: Spiral (complex λ with Re < 0) -->
  <rect x="405" y="5" width="190" height="185" class="pp-box"/>
  <text x="500" y="22" class="pp-title">Stable Spiral</text>
  <text x="500" y="36" class="pp-label">λ = α±iβ, α&lt;0</text>
  <line x1="500" y1="50" x2="500" y2="180" class="pp-axis"/>
  <line x1="420" y1="115" x2="580" y2="115" class="pp-axis"/>
  <circle cx="500" cy="115" r="3" class="pp-dot"/>
  <path d="M 560 80 Q 540 95 530 115 Q 520 135 500 140 Q 480 135 475 115 Q 478 100 500 105 Q 510 110 500 115" class="pp-traj" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Panel 4: Center (pure imaginary) -->
  <rect x="5" y="200" width="190" height="185" class="pp-box"/>
  <text x="100" y="217" class="pp-title">Center</text>
  <text x="100" y="231" class="pp-label">λ = ±iβ (pure imag)</text>
  <line x1="100" y1="245" x2="100" y2="375" class="pp-axis"/>
  <line x1="20" y1="310" x2="180" y2="310" class="pp-axis"/>
  <circle cx="100" cy="310" r="3" class="pp-dot"/>
  <ellipse cx="100" cy="310" rx="50" ry="30" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.8" fill="none" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="100" cy="310" rx="30" ry="18" stroke="var(--text-accent, #79c0ff)" stroke-width="1.5" fill="none" pathLength="100">
    <animate attributeName="stroke-dasharray" values="0 100; 100 0" dur="2s" repeatCount="indefinite" />
  </ellipse>
  <!-- Animated particle on spiral -->
  <circle r="3" class="pp-dot">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 560 80 Q 540 95 530 115 Q 520 135 500 140 Q 480 135 475 115 Q 478 100 500 105 Q 510 110 500 115"/>
  </circle>
</svg>