<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:700px;height:auto;">
  <defs>
    <marker id="q-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="q-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    @keyframes flow-q { to { stroke-dashoffset: -10; } }
    @keyframes pulse-q { 0%, 100% { transform: scale(1); opacity: 0.06; } 50% { transform: scale(1.02); opacity: 0.1; } }
    .q-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1.5; rx: 6; }
    .q-box-hi { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; rx: 6; filter: drop-shadow(0 0 2px var(--interactive-accent, #58a6ff)); }
    .q-label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); text-anchor: middle; }
    .q-title { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .q-link { stroke: var(--text-muted, #8b949e); stroke-width: 1.2; fill: none; }
    .q-link-hi { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2; fill: none; stroke-dasharray: 4; animation: flow-q 1s linear infinite; }
    .q-phase { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); text-anchor: middle; }
    .q-loop { fill: var(--interactive-accent, #58a6ff); opacity: 0.06; transform-origin: 180px 200px; animation: pulse-q 3s ease-in-out infinite; }
  </style>
  <!-- Event Loop -->
  <ellipse cx="180" cy="200" rx="160" ry="160" class="q-loop"/>
  <text x="180" y="55" class="q-title">Qt Main Event Loop</text>
  <!-- Event sources -->
  <rect x="20" y="80" width="90" height="30" class="q-box"/>
  <text x="65" y="99" class="q-label">Mouse/Key</text>
  <rect x="20" y="120" width="90" height="30" class="q-box"/>
  <text x="65" y="139" class="q-label">Timer Events</text>
  <rect x="20" y="160" width="90" height="30" class="q-box"/>
  <text x="65" y="179" class="q-label">Socket I/O</text>
  <rect x="20" y="200" width="90" height="30" class="q-box"/>
  <text x="65" y="219" class="q-label">Paint Events</text>
  <rect x="20" y="240" width="90" height="30" class="q-box"/>
  <text x="65" y="259" class="q-label">Custom Events</text>
  <!-- Event queue -->
  <rect x="130" y="130" width="100" height="140" class="q-box-hi"/>
  <text x="180" y="150" class="q-title" font-size="11px">Event Queue</text>
  <text x="180" y="170" class="q-phase">FIFO processing</text>
  <text x="180" y="190" class="q-phase">processEvents()</text>
  <text x="180" y="210" class="q-phase">dispatch to target</text>
  <text x="180" y="230" class="q-phase">QObject::event()</text>
  <text x="180" y="250" class="q-phase">→ signal emission</text>
  <!-- Arrows from sources to queue -->
  <line x1="110" y1="95" x2="130" y2="160" class="q-link" marker-end="url(#q-arrow-m)"/>
  <line x1="110" y1="135" x2="130" y2="175" class="q-link" marker-end="url(#q-arrow-m)"/>
  <line x1="110" y1="175" x2="130" y2="195" class="q-link" marker-end="url(#q-arrow-m)"/>
  <line x1="110" y1="215" x2="130" y2="215" class="q-link" marker-end="url(#q-arrow-m)"/>
  <line x1="110" y1="255" x2="130" y2="235" class="q-link" marker-end="url(#q-arrow-m)"/>
  <!-- Signal/Slot System -->
  <rect x="370" y="40" width="310" height="170" rx="8" fill="var(--background-secondary, #161b22)" stroke="var(--interactive-accent, #58a6ff)" stroke-width="1.5"/>
  <text x="525" y="62" class="q-title">Signal / Slot Connections</text>
  <!-- Emitter -->
  <rect x="390" y="80" width="120" height="50" class="q-box-hi"/>
  <text x="450" y="100" class="q-label" font-weight="bold">QPushButton</text>
  <text x="450" y="118" class="q-phase">signal: clicked()</text>
  <!-- Connection arrow -->
  <line x1="510" y1="105" x2="540" y2="105" class="q-link-hi" marker-end="url(#q-arrow)"/>
  <text x="525" y="95" class="q-phase">connect</text>
  <!-- Receiver -->
  <rect x="540" y="80" width="120" height="50" class="q-box"/>
  <text x="600" y="100" class="q-label" font-weight="bold">MyWidget</text>
  <text x="600" y="118" class="q-phase">slot: on_click()</text>
  <!-- Second connection -->
  <rect x="390" y="145" width="120" height="50" class="q-box-hi"/>
  <text x="450" y="165" class="q-label" font-weight="bold">QLineEdit</text>
  <text x="450" y="183" class="q-phase">signal: textChanged(str)</text>
  <line x1="510" y1="170" x2="540" y2="170" class="q-link-hi" marker-end="url(#q-arrow)"/>
  <rect x="540" y="145" width="120" height="50" class="q-box"/>
  <text x="600" y="165" class="q-label" font-weight="bold">Validator</text>
  <text x="600" y="183" class="q-phase">slot: validate(str)</text>
  <!-- Arrow from event loop to signals -->
  <line x1="230" y1="180" x2="370" y2="105" class="q-link-hi" marker-end="url(#q-arrow)"/>
  <text x="300" y="130" class="q-phase">event triggers signal</text>
  <!-- Widget Tree -->
  <rect x="370" y="240" width="310" height="160" rx="8" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="525" y="262" class="q-title">Widget Hierarchy (Ownership Tree)</text>
  <rect x="460" y="275" width="130" height="28" class="q-box-hi"/>
  <text x="525" y="293" class="q-label">QMainWindow (parent)</text>
  <line x1="490" y1="303" x2="430" y2="320" class="q-link"/>
  <line x1="560" y1="303" x2="620" y2="320" class="q-link"/>
  <rect x="380" y="320" width="100" height="25" class="q-box"/>
  <text x="430" y="337" class="q-label">QMenuBar</text>
  <rect x="570" y="320" width="100" height="25" class="q-box"/>
  <text x="620" y="337" class="q-label">QWidget</text>
  <line x1="600" y1="345" x2="570" y2="360" class="q-link"/>
  <line x1="640" y1="345" x2="670" y2="360" class="q-link"/>
  <rect x="520" y="360" width="90" height="25" class="q-box"/>
  <text x="565" y="377" class="q-label">QLabel</text>
  <rect x="625" y="360" width="90" height="25" class="q-box"/>
  <text x="670" y="377" class="q-label">QPushButton</text>
</svg>