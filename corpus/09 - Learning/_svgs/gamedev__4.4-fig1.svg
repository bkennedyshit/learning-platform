<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .axis-x { stroke: #e74c3c; stroke-width: 2; color: #e74c3c; }
    .axis-y { stroke: #2ecc71; stroke-width: 2; color: #2ecc71; }
    .axis-z { stroke: #3498db; stroke-width: 2; color: #3498db; }
    .bone { stroke: var(--text-normal, #c9d1d9); stroke-width: 3; stroke-linecap: round; }
    .joint { fill: var(--interactive-accent, #58a6ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; cursor: pointer; transition: all 0.2s; }
    .joint:hover { r: 7; filter: drop-shadow(0 0 4px var(--interactive-accent, #58a6ff)); }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .matrix-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 4; }
    .math { font-family: serif; font-size: 11px; fill: var(--text-normal, #c9d1d9); }
    
    /* Animations */
    @keyframes rot-only {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(15deg) scale(1.08); }
    }
    .child-rot {
      transform-origin: 0 0;
      animation: rot-only 4s infinite ease-in-out;
    }
    
    /* Skeletal Animation Keyframes */
    @keyframes sway-chest {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes sway-left-arm {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes sway-left-forearm {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes sway-right-arm {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-12deg); }
    }
    @keyframes sway-right-forearm {
      0%, 100% { transform: rotate(12deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes sway-left-leg {
      0%, 100% { transform: rotate(4deg); }
      50% { transform: rotate(-4deg); }
    }
    @keyframes sway-right-leg {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    
    .upper-body-group { animation: sway-chest 3.5s infinite ease-in-out; }
    .left-arm { animation: sway-left-arm 3.5s infinite ease-in-out; }
    .left-forearm { animation: sway-left-forearm 3.5s infinite ease-in-out; }
    .right-arm { animation: sway-right-arm 3.5s infinite ease-in-out; }
    .right-forearm { animation: sway-right-forearm 3.5s infinite ease-in-out; }
    .left-leg { animation: sway-left-leg 3.5s infinite ease-in-out; }
    .right-leg { animation: sway-right-leg 3.5s infinite ease-in-out; }
  </style>
  
  <!-- Transform hierarchy section -->
  <text x="150" y="20" class="title" text-anchor="middle">Transform Hierarchy (TRS)</text>
  <!-- Local coordinate system -->
  <g transform="translate(80, 80)">
    <line x1="0" y1="0" x2="60" y2="0" class="axis-x" marker-end="url(#axis-arrow)"/>
    <line x1="0" y1="0" x2="0" y2="-60" class="axis-y" marker-end="url(#axis-arrow)"/>
    <line x1="0" y1="0" x2="-30" y2="30" class="axis-z" marker-end="url(#axis-arrow)"/>
    <text x="65" y="5" class="label" fill="#e74c3c" font-size="11">X</text>
    <text x="5" y="-62" class="label" fill="#2ecc71" font-size="11">Y</text>
    <text x="-40" y="35" class="label" fill="#3498db" font-size="11">Z</text>
    <circle cx="0" cy="0" r="3" fill="var(--text-normal, #c9d1d9)"/>
    <text x="5" y="15" class="label" font-size="10">World Origin</text>
  </g>
  
  <!-- Child transform with nested rotation animation -->
  <g transform="translate(200, 60)">
    <g class="child-rot">
      <line x1="0" y1="0" x2="40" y2="-10" class="axis-x" marker-end="url(#axis-arrow)" opacity="0.7"/>
      <line x1="0" y1="0" x2="10" y2="-40" class="axis-y" marker-end="url(#axis-arrow)" opacity="0.7"/>
      <circle cx="0" cy="0" r="3" fill="var(--interactive-accent, #58a6ff)"/>
      <text x="5" y="15" class="label" font-size="10">Child (local space)</text>
    </g>
  </g>
  
  <!-- Connection -->
  <line x1="80" y1="80" x2="200" y2="60" stroke="var(--text-muted, #8b949e)" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- TRS Matrix -->
  <rect x="30" y="160" width="250" height="70" class="matrix-box"/>
  <text x="155" y="180" class="math" text-anchor="middle">M = T · R · S</text>
  <text x="155" y="198" class="math" text-anchor="middle">WorldPos = Parent.M × Local.M × vertex</text>
  <text x="155" y="216" class="math" text-anchor="middle">| R·S  R·S  R·S  Tx |</text>
  <text x="155" y="225" class="math" text-anchor="middle" fill="var(--text-muted, #8b949e)">4×4 homogeneous matrix</text>
  
  <!-- Skeleton section -->
  <text x="450" y="20" class="title" text-anchor="middle">Skeletal Animation</text>
  <!-- Skeleton figure with parented groups -->
  <g transform="translate(400, 40)">
    
    <!-- Hip Joint (Root of upper and lower body) -->
    <circle cx="50" cy="120" r="4" class="joint"/>
    
    <!-- Upper Body Group (origin hip at 50, 120) -->
    <g class="upper-body-group" style="transform-origin: 50px 120px;">
      <!-- Spine -->
      <line x1="50" y1="40" x2="50" y2="120" class="bone"/>
      <!-- Head -->
      <circle cx="50" cy="30" r="12" fill="none" stroke="var(--text-normal, #c9d1d9)" stroke-width="2"/>
      
      <!-- Shoulder / Neck Joints -->
      <circle cx="50" cy="40" r="4" class="joint"/>
      <circle cx="50" cy="60" r="4" class="joint"/>
      
      <!-- Left Arm Group (origin shoulder at 50, 60) -->
      <g class="left-arm" style="transform-origin: 50px 60px;">
        <line x1="50" y1="60" x2="20" y2="100" class="bone"/>
        <circle cx="20" cy="100" r="4" class="joint"/>
        <!-- Left Forearm Group (origin elbow at 20, 100) -->
        <g class="left-forearm" style="transform-origin: 20px 100px;">
          <line x1="20" y1="100" x2="5" y2="130" class="bone"/>
        </g>
      </g>
      
      <!-- Right Arm Group (origin shoulder at 50, 60) -->
      <g class="right-arm" style="transform-origin: 50px 60px;">
        <line x1="50" y1="60" x2="80" y2="100" class="bone"/>
        <circle cx="80" cy="100" r="4" class="joint"/>
        <!-- Right Forearm Group (origin elbow at 80, 100) -->
        <g class="right-forearm" style="transform-origin: 80px 100px;">
          <line x1="80" y1="100" x2="95" y2="130" class="bone"/>
        </g>
      </g>
    </g>
    
    <!-- Left Leg Group (origin hip at 50, 120) -->
    <g class="left-leg" style="transform-origin: 50px 120px;">
      <line x1="50" y1="120" x2="30" y2="170" class="bone"/>
      <circle cx="30" cy="170" r="4" class="joint"/>
      <!-- Lower leg (origin knee at 30, 170) -->
      <g style="transform-origin: 30px 170px;">
        <line x1="30" y1="170" x2="25" y2="220" class="bone"/>
      </g>
    </g>
    
    <!-- Right Leg Group (origin hip at 50, 120) -->
    <g class="right-leg" style="transform-origin: 50px 120px;">
      <line x1="50" y1="120" x2="70" y2="170" class="bone"/>
      <circle cx="70" cy="170" r="4" class="joint"/>
      <!-- Lower leg (origin knee at 70, 170) -->
      <g style="transform-origin: 70px 170px;">
        <line x1="70" y1="170" x2="75" y2="220" class="bone"/>
      </g>
    </g>
  </g>
  
  <!-- Animation blend info -->
  <rect x="340" y="280" width="240" height="100" rx="6" class="matrix-box"/>
  <text x="460" y="300" class="label" text-anchor="middle" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">Animation Blending</text>
  <text x="460" y="318" class="math" text-anchor="middle">pose = lerp(idle, run, weight)</text>
  <text x="460" y="336" class="math" text-anchor="middle">bone.rot = slerp(A.rot, B.rot, t)</text>
  <text x="460" y="354" class="math" text-anchor="middle">Blend Tree: 1D/2D parameter space</text>
  <text x="460" y="372" class="label" text-anchor="middle" font-size="10" fill="var(--text-muted, #8b949e)">Additive layers for upper/lower body</text>
  
  <!-- Physics section -->
  <rect x="30" y="260" width="270" height="110" rx="6" class="matrix-box"/>
  <text x="165" y="280" class="label" text-anchor="middle" font-weight="bold" fill="var(--interactive-accent, #58a6ff)">3D Physics Pipeline</text>
  <text x="165" y="300" class="math" text-anchor="middle">1. Broad Phase (AABB tree / sweep-and-prune)</text>
  <text x="165" y="318" class="math" text-anchor="middle">2. Narrow Phase (GJK / SAT)</text>
  <text x="165" y="336" class="math" text-anchor="middle">3. Contact Generation (manifold)</text>
  <text x="165" y="354" class="math" text-anchor="middle">4. Constraint Solver (sequential impulse)</text>
  <text x="165" y="368" class="label" text-anchor="middle" font-size="10" fill="var(--text-muted, #8b949e)">PhysX / Chaos / Jolt / Rapier</text>
</svg>
