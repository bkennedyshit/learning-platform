<svg viewBox="0 0 440 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:440px;height:auto;">
  <style>
    .ax   { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.4; fill: none; }
    .arc  { stroke: var(--text-muted, #8b949e); stroke-width: 0.8; fill: none; opacity: 0.6; }
    .ray  { stroke: var(--text-muted, #8b949e); stroke-width: 0.8; opacity: 0.6; }
    .cell { fill: var(--interactive-accent, #58a6ff); opacity: 0.18; stroke: var(--interactive-accent, #58a6ff); stroke-width: 0.9; }
    .hl   { fill: var(--text-accent, #79c0ff); opacity: 0.28; stroke: var(--text-accent, #79c0ff); stroke-width: 1.2; }
    .lab  { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .math { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 13px; fill: var(--text-normal, #c9d1d9); }
    .ann  { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--text-muted, #8b949e); }
    /* Animations */
    @keyframes drawPath { from { stroke-dashoffset: 1500; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInDraw { 0% { opacity: 0; stroke-dashoffset: 1500; } 1% { opacity: 1; stroke-dashoffset: 1500; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    
    .curve, .true, .surf, .surface { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawPath 1.5s ease-in-out forwards; }
    .tangent, .tan-1, .tan-2, .tan-3, .arrow, .vf-vec { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: fadeInDraw 1.5s ease-out 1s forwards; }
    .secant, .secant-1, .secant-2, .secant-3, .level, .drop, .proj, .vf-circle { animation: fadeIn 1s ease-out 1s both; }
    .secant-3 { animation-delay: 1s; } .secant-2 { animation-delay: 2s; } .secant-1 { animation-delay: 3s; } .tangent { animation-delay: 2s; }
    .errfill, .fill, .area, .prism-face-top, .prism-face-side, .base-rect, .box { animation: fadeIn 1s ease-out 0.5s both; }
    .rect-L, .rect-R { transform-origin: bottom; animation: growUp 1s ease-out both; }
    .rect-L:nth-child(even) { animation-delay: 0.2s; } .rect-L:nth-child(odd) { animation-delay: 0.4s; }
    .rect-R:nth-child(even) { animation-delay: 1.2s; } .rect-R:nth-child(odd) { animation-delay: 1.4s; }
    .pt, .pt-mov, .root, .vf-origin { animation: fadeInScale 0.5s ease-out 1s both; }
    .t1 { animation: fadeIn 1s 1s both; } .t2 { animation: fadeIn 1s 2.5s both; } .t3 { animation: fadeIn 1s 4s both; } .t5 { animation: fadeIn 1s 5.5s both; }
    .box { animation: fadeInScale 0.8s ease-out both; }
    .box:nth-of-type(1) { animation-delay: 0.2s; } .box:nth-of-type(2) { animation-delay: 0.6s; }
    .box:nth-of-type(3) { animation-delay: 1.0s; } .box:nth-of-type(4) { animation-delay: 1.4s; }
  </style>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal, #c9d1d9)"/>
    </marker>
  </defs>
  <!-- Center at (220,220) -->
  <line x1="60"  y1="220" x2="400" y2="220" class="ax" marker-end="url(#pa)"/>
  <line x1="220" y1="390" x2="220" y2="50"  class="ax" marker-end="url(#pa)"/>
  <text x="404" y="224" class="math">x</text>
  <text x="208" y="48" class="math">y</text>
  <!-- Radial lines: angles 20,40,60,80 degrees -->
  <line x1="220" y1="220" x2="390" y2="162" class="ray"/>
  <line x1="220" y1="220" x2="345" y2="80"  class="ray"/>
  <line x1="220" y1="220" x2="264" y2="65"  class="ray"/>
  <line x1="220" y1="220" x2="220" y2="60"  class="ray"/>
  <line x1="220" y1="220" x2="395" y2="220" class="ray"/>
  <!-- Concentric arcs: r = 60, 100, 140, 180 (px) -->
  <path class="arc" d="M 280 220 A 60 60 0 0 0 276 164"/>
  <path class="arc" d="M 320 220 A 100 100 0 0 0 313 123"/>
  <path class="arc" d="M 360 220 A 140 140 0 0 0 350 82"/>
  <path class="arc" d="M 400 220 A 180 180 0 0 0 387 42"/>
  <!-- Highlight one polar cell at r in [100,140], theta in [40,60] degrees -->
  <path class="hl" d="M 281 157 A 100 100 0 0 0 264 156 L 256 134 A 140 140 0 0 1 277 133 Z"/>
  <!-- Labels -->
  <text x="310" y="215" class="math">r</text>
  <text x="270" y="195" class="ann">dr</text>
  <text x="295" y="150" class="ann">r dθ</text>
  <text x="232" y="215" class="math">O</text>
  <text x="280" y="260" class="ann">Area ≈ r dr dθ</text>
  <!-- angle arc indicator -->
  <path d="M 260 220 A 40 40 0 0 0 257 202" stroke="var(--text-accent, #79c0ff)" stroke-width="1.2" fill="none"/>
  <text x="263" y="210" class="math" font-size="12">θ</text>
</svg>