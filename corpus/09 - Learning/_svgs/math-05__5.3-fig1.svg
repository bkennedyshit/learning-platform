<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;height:auto;">
  <style>
    .ts-box { fill:var(--background-secondary, #161b22); stroke:var(--text-muted, #8b949e); stroke-width:1.5; rx:8; cursor:pointer; transition:all 0.3s; }
    .ts-box:hover { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; filter:drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); }
    .ts-pot { font-family:Inter,system-ui,sans-serif; font-size:18px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; text-anchor:middle; }
    .ts-var { font-family:serif; font-size:15px; fill:var(--text-accent, #79c0ff); text-anchor:middle; }
    .ts-lbl { font-family:Inter,system-ui,sans-serif; font-size:11px; fill:var(--text-normal, #c9d1d9); text-anchor:middle; }
    @keyframes rotate-square { 0%{opacity:0.7} 50%{opacity:1} 100%{opacity:0.7} }
    .ts-glow { animation: rotate-square 4s ease-in-out infinite; }
    @keyframes flow-dash { from{stroke-dashoffset: 12} to{stroke-dashoffset: 0} }
    .ts-arr { stroke:var(--interactive-accent, #58a6ff); stroke-width:2; fill:none; stroke-dasharray: 6; animation: flow-dash 1s linear infinite; }
  </style>
  <defs>
    <marker id="tsa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
  </defs>
  <!-- Central square connecting potentials -->
  <!-- Corners: U(top-left), H(top-right), F(bottom-left), G(bottom-right) -->
  <rect x="80" y="80" width="120" height="80" class="ts-box ts-glow"/>
  <text x="140" y="115" class="ts-pot">U</text>
  <text x="140" y="140" class="ts-lbl">dU = TdS − PdV</text>
  <text x="140" y="155" class="ts-var">nat: S, V</text>

  <rect x="300" y="80" width="120" height="80" class="ts-box ts-glow" style="animation-delay:1s"/>
  <text x="360" y="115" class="ts-pot">H</text>
  <text x="360" y="140" class="ts-lbl">dH = TdS + VdP</text>
  <text x="360" y="155" class="ts-var">nat: S, P</text>

  <rect x="80" y="260" width="120" height="80" class="ts-box ts-glow" style="animation-delay:2s"/>
  <text x="140" y="295" class="ts-pot">F</text>
  <text x="140" y="320" class="ts-lbl">dF = −SdT − PdV</text>
  <text x="140" y="335" class="ts-var">nat: T, V</text>

  <rect x="300" y="260" width="120" height="80" class="ts-box ts-glow" style="animation-delay:3s"/>
  <text x="360" y="295" class="ts-pot">G</text>
  <text x="360" y="320" class="ts-lbl">dG = −SdT + VdP</text>
  <text x="360" y="335" class="ts-var">nat: T, P</text>

  <!-- Arrows: Legendre transforms -->
  <line x1="200" y1="120" x2="300" y2="120" class="ts-arr" marker-end="url(#tsa)"/>
  <text x="250" y="110" class="ts-mx">+PV</text>
  <line x1="140" y1="160" x2="140" y2="260" class="ts-arr" marker-end="url(#tsa)"/>
  <text x="120" y="215" class="ts-mx">−TS</text>
  <line x1="360" y1="160" x2="360" y2="260" class="ts-arr" marker-end="url(#tsa)"/>
  <text x="385" y="215" class="ts-mx">−TS</text>
  <line x1="200" y1="300" x2="300" y2="300" class="ts-arr" marker-end="url(#tsa)"/>
  <text x="250" y="290" class="ts-mx">+PV</text>

  <!-- Maxwell relations on edges -->
  <text x="250" y="70" class="ts-mx">Maxwell: (∂T/∂V)_S = −(∂P/∂S)_V</text>
  <text x="250" y="365" class="ts-mx">Maxwell: (∂S/∂V)_T = (∂P/∂T)_V</text>
  <text x="55" y="215" class="ts-mx" transform="rotate(-90,55,215)">(∂T/∂P)_S = (∂V/∂S)_P</text>
  <text x="445" y="215" class="ts-mx" transform="rotate(90,445,215)">−(∂S/∂P)_T = (∂V/∂T)_P</text>
</svg>