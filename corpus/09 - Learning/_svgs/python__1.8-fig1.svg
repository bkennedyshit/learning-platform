<svg viewBox="0 0 650 320" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 650px; height: auto;">
  <style>
    .commit { fill: var(--interactive-accent, #58a6ff); stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; transition: all 0.2s; cursor: pointer; }
    .commit:hover { r: 14; filter: drop-shadow(0 0 5px var(--interactive-accent, #58a6ff)); }
    .branch-line { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; fill: none; }
    .main-line { stroke: var(--text-normal, #c9d1d9); stroke-width: 2.5; fill: none; }
    .merge-line { stroke: #e5c07b; stroke-width: 2; fill: none; stroke-dasharray: 5,3; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-normal, #c9d1d9); }
    .branch-tag { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; text-anchor: middle; }
    .area-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .area-box { fill: var(--background-secondary, #161b22); stroke: var(--text-muted, #8b949e); stroke-width: 1; rx: 4; }
  </style>

  <text x="325" y="20" class="title">Git Object Model — Commits as a Directed Acyclic Graph (DAG)</text>

  <!-- Main branch -->
  <line x1="60" y1="100" x2="550" y2="100" class="main-line"/>
  <circle cx="80" cy="100" r="10" class="commit"/><text x="72" y="85" class="label">c1</text>
  <circle cx="160" cy="100" r="10" class="commit"/><text x="152" y="85" class="label">c2</text>
  <circle cx="240" cy="100" r="10" class="commit"/><text x="232" y="85" class="label">c3</text>
  <circle cx="400" cy="100" r="10" class="commit"/><text x="392" y="85" class="label">c6</text>
  <circle cx="500" cy="100" r="10" class="commit"/><text x="492" y="85" class="label">c7</text>
  <text x="520" y="95" class="branch-tag">← main (HEAD)</text>

  <!-- Feature branch -->
  <path d="M 240 100 Q 280 140 300 170" class="branch-line"/>
  <line x1="300" y1="170" x2="420" y2="170" class="branch-line"/>
  <circle cx="300" cy="170" r="10" class="commit"/><text x="292" y="195" class="label">c4</text>
  <circle cx="370" cy="170" r="10" class="commit"/><text x="362" y="195" class="label">c5</text>
  <text x="390" y="165" class="branch-tag">feature/auth</text>

  <!-- Merge -->
  <path d="M 370 170 Q 385 135 400 100" class="merge-line"/>

  <!-- Working areas -->
  <rect x="40" y="230" width="130" height="60" class="area-box"/>
  <text x="105" y="250" class="label" text-anchor="middle">Working Dir</text>
  <text x="105" y="270" class="area-label" text-anchor="middle">Your files on disk</text>

  <rect x="200" y="230" width="130" height="60" class="area-box"/>
  <text x="265" y="250" class="label" text-anchor="middle">Staging (Index)</text>
  <text x="265" y="270" class="area-label" text-anchor="middle">git add → here</text>

  <rect x="360" y="230" width="130" height="60" class="area-box"/>
  <text x="425" y="250" class="label" text-anchor="middle">Local Repo</text>
  <text x="425" y="270" class="area-label" text-anchor="middle">git commit → here</text>

  <rect x="520" y="230" width="110" height="60" class="area-box"/>
  <text x="575" y="250" class="label" text-anchor="middle">Remote</text>
  <text x="575" y="270" class="area-label" text-anchor="middle">git push → here</text>

  <!-- Arrows between areas -->
  <line x1="170" y1="260" x2="195" y2="260" stroke="var(--text-muted, #8b949e)" stroke-width="1" marker-end="url(#git-arr)"/>
  <line x1="330" y1="260" x2="355" y2="260" stroke="var(--text-muted, #8b949e)" stroke-width="1" marker-end="url(#git-arr)"/>
  <line x1="490" y1="260" x2="515" y2="260" stroke="var(--text-muted, #8b949e)" stroke-width="1" marker-end="url(#git-arr)"/>

  <defs><marker id="git-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 2 L 7 5 L 0 8 z" fill="var(--text-muted, #8b949e)"/></marker></defs>
</svg>
