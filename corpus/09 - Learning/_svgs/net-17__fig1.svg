<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#b4befe" />
    </linearGradient>
    <linearGradient id="gradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>
    <linearGradient id="gradNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
    <linearGradient id="gradLink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af" />
      <stop offset="100%" stop-color="#fab387" />
    </linearGradient>
    <linearGradient id="gradPhys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8" />
      <stop offset="100%" stop-color="#eba0ac" />
    </linearGradient>
    <style>
      .bg { fill: #1e1e2e; }
      .text-light { fill: #cdd6f4; font-family: 'Inter', sans-serif; font-size: 14px; }
      .title { fill: #cdd6f4; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: bold; }
      .box { rx: 8px; stroke: #1e1e2e; stroke-width: 2px; }
      .label-dark { fill: #11111b; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .link-line { stroke: #585b70; stroke-width: 2px; stroke-dasharray: 4; }
      .proto-text { fill: #bac2de; font-family: 'Inter', monospace; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="800" height="500" class="bg" />
  
  <text x="400" y="40" class="title" text-anchor="middle">OSI Model vs TCP/IP Architecture</text>
  
  <text x="200" y="80" class="title" style="font-size:18px;" text-anchor="middle">OSI 7-Layer</text>
  <text x="600" y="80" class="title" style="font-size:18px;" text-anchor="middle">TCP/IP 4-Layer</text>

  <!-- Connecting dashed lines to show mappings -->
  <path d="M 300 120 L 500 170" class="link-line" />
  <path d="M 300 170 L 500 170" class="link-line" />
  <path d="M 300 220 L 500 170" class="link-line" />
  
  <path d="M 300 270 L 500 270" class="link-line" />
  <path d="M 300 320 L 500 320" class="link-line" />
  
  <path d="M 300 370 L 500 395" class="link-line" />
  <path d="M 300 420 L 500 395" class="link-line" />

  <!-- OSI Model -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="40" class="box" fill="url(#gradApp)" />
    <text x="100" y="25" class="label-dark">7. Application</text>
    
    <rect x="0" y="50" width="200" height="40" class="box" fill="url(#gradApp)" />
    <text x="100" y="75" class="label-dark">6. Presentation</text>
    
    <rect x="0" y="100" width="200" height="40" class="box" fill="url(#gradApp)" />
    <text x="100" y="125" class="label-dark">5. Session</text>
    
    <rect x="0" y="150" width="200" height="40" class="box" fill="url(#gradTrans)" />
    <text x="100" y="175" class="label-dark">4. Transport</text>
    
    <rect x="0" y="200" width="200" height="40" class="box" fill="url(#gradNet)" />
    <text x="100" y="225" class="label-dark">3. Network</text>
    
    <rect x="0" y="250" width="200" height="40" class="box" fill="url(#gradLink)" />
    <text x="100" y="275" class="label-dark">2. Data Link</text>
    
    <rect x="0" y="300" width="200" height="40" class="box" fill="url(#gradPhys)" />
    <text x="100" y="325" class="label-dark">1. Physical</text>
  </g>
  
  <!-- TCP/IP Model -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="200" height="140" class="box" fill="url(#gradApp)" />
    <text x="100" y="75" class="label-dark">Application</text>
    
    <rect x="0" y="150" width="200" height="40" class="box" fill="url(#gradTrans)" />
    <text x="100" y="175" class="label-dark">Transport</text>
    
    <rect x="0" y="200" width="200" height="40" class="box" fill="url(#gradNet)" />
    <text x="100" y="225" class="label-dark">Internet</text>
    
    <rect x="0" y="250" width="200" height="90" class="box" fill="url(#gradLink)" />
    <text x="100" y="300" class="label-dark">Link / Network Access</text>
  </g>
  
  <!-- Example Protocols -->
  <text x="400" y="145" class="proto-text">HTTP, SMTP, DNS, TLS, SSH</text>
  <text x="400" y="265" class="proto-text">TCP, UDP, QUIC</text>
  <text x="400" y="315" class="proto-text">IPv4, IPv6, ICMP, IPSec</text>
  <text x="400" y="390" class="proto-text">Ethernet, Wi-Fi, MAC, ARP</text>
  
  <!-- Animation elements -->
  <g opacity="0.8">
    <circle r="4" fill="#89dceb">
      <animateMotion path="M 300 120 L 500 170 L 500 270 L 300 270" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#a6e3a1">
      <animateMotion path="M 500 320 L 300 320 L 300 220 L 500 170" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
