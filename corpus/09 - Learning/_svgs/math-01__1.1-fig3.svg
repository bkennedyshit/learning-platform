<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <defs>
    <marker id="ed-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    .axis { stroke: var(--text-normal, #c9d1d9); stroke-width: 1.5; fill: none; }
    .grid { stroke: var(--text-muted, #8b949e); stroke-width: 0.4; opacity: 0.35; }
    .envelope { stroke: var(--text-muted, #8b949e); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .curve { stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.2; fill: none; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal, #c9d1d9); }
    .math { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 16px; fill: var(--text-normal, #c9d1d9); }
    .math-env { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 16px; fill: var(--text-muted, #8b949e); }
    .math-func { font-family: 'Latin Modern Math', serif; font-style: italic; font-size: 16px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
  </style>

  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="40" x2="60" y2="360"/>
    <line x1="180" y1="40" x2="180" y2="360"/>
    <line x1="420" y1="40" x2="420" y2="360"/>
    <line x1="540" y1="40" x2="540" y2="360"/>
    <line x1="60" y1="80" x2="540" y2="80"/>
    <line x1="60" y1="320" x2="540" y2="320"/>
  </g>

  <!-- Axes -->
  <line x1="40" y1="200" x2="560" y2="200" class="axis" marker-end="url(#ed-arrow)"/>
  <line x1="300" y1="380" x2="300" y2="20" class="axis" marker-end="url(#ed-arrow)"/>
  <text x="565" y="204" class="label">x</text>
  <text x="285" y="18" class="label">y</text>

  <!-- Envelopes y = x^2 and y = -x^2 -->
  <g transform="translate(0, 200)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1; 1 0.1; 1 1" dur="5s" repeatCount="indefinite" />
      <path class="envelope" d="M 60 -160 Q 180 0, 300 0 T 540 -160"/>
      <path class="envelope" d="M 60 160 Q 180 0, 300 0 T 540 160"/>
      
      <!-- The oscillating function x^2 sin(1/x) -->
      <path class="curve" d="
        M 60 -160 
        Q 100 -220, 140 0 
        T 180 120 T 210 -80 T 230 50 T 250 -40 T 265 30 T 280 -20 T 290 10 T 295 -5 T 300 0
        T 305 5 T 310 -10 T 320 20 T 335 -30 T 350 40 T 370 -50 T 390 80 T 420 -120 T 460 180 T 540 -160
      "/>
    </g>
  </g>

  <!-- Labels -->
  <text x="180" y="60" class="math-env">y = x²</text>
  <text x="170" y="350" class="math-env">y = -x²</text>
  <text x="400" y="130" class="math-func">y = x² sin(1/x)</text>
  
  <rect x="360" y="30" width="200" height="40" rx="4" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1"/>
  <text x="460" y="55" class="math" text-anchor="middle">lim_{x → 0} x² sin(1/x) = 0</text>
</svg>
