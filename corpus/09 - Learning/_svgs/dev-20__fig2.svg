<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">KUBERNETES ORCHESTRATION &amp; GITOPS</text>

  <!-- Git Repo -->
  <g transform="translate(100, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="-10" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Git Repo</text>
    <text x="0" y="10" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">(Manifests)</text>
    <circle cx="0" cy="25" r="4" fill="#94a3b8" />
    <path d="M -15 25 L 15 25 M 0 25 L 0 15" stroke="#94a3b8" stroke-width="2" fill="none" />
  </g>

  <!-- Argo CD / Flux -->
  <g transform="translate(300, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">GitOps Controller</text>
    <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">(Argo CD / Flux)</text>
  </g>

  <!-- Kubernetes Cluster -->
  <g transform="translate(600, 200)">
    <rect x="-140" y="-120" width="280" height="240" rx="12" fill="none" stroke="#a3e635" stroke-width="2" stroke-dasharray="8 4" />
    <text x="0" y="-95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3e635" text-anchor="middle">Kubernetes Cluster</text>
    
    <!-- Nodes -->
    <rect x="-120" y="-70" width="100" height="150" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="-70" y="-50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Node 1</text>
    
    <rect x="-100" y="-30" width="60" height="30" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="-70" y="-10" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Pod A</text>

    <rect x="-100" y="15" width="60" height="30" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="-70" y="35" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Pod B</text>

    <rect x="20" y="-70" width="100" height="150" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="70" y="-50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Node 2</text>
    
    <rect x="40" y="-30" width="60" height="30" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="70" y="-10" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Pod C</text>
  </g>

  <!-- Connectors -->
  <path d="M 160 150 L 230 150" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 360 150 L 450 150" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Animation: Sync Pulses -->
  <circle cx="0" cy="150" r="5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" values="370; 440; 370" keyTimes="0; 0.5; 1" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Rotating Gear for Controller -->
  <g transform="translate(300, 180)">
    <path d="M-8,-2 L-4,-2 L-3,-5 L-5,-7 L-4,-8 L-2,-6 L0,-7 L0,-11 L2,-11 L2,-7 L4,-6 L6,-8 L7,-7 L5,-5 L6,-2 L10,-2 L10,0 L6,0 L5,3 L7,5 L6,6 L4,4 L2,5 L2,9 L0,9 L0,5 L-2,4 L-4,6 L-5,5 L-3,3 L-4,0 L-8,0 Z" fill="#38bdf8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="1" cy="-1" r="2" fill="#334155" />
  </g>
</svg>
