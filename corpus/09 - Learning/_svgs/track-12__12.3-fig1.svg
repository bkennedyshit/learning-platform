<svg viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:620px;height:auto;">
  <defs>
    <marker id="q-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 2 L7 5 L0 8z" fill="var(--interactive-accent, #58a6ff)"/>
    </marker>
    <marker id="q-arr-dim" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 2 L7 5 L0 8z" fill="var(--text-muted, #8b949e)"/>
    </marker>
  </defs>
  <style>
    .q-cell { fill:none; stroke:var(--text-muted, #8b949e); stroke-width:1.5; transition: fill 0.3s; }
    .q-cell:hover { fill: rgba(139, 148, 158, 0.1); }
    .q-goal { fill:var(--interactive-accent, #58a6ff); opacity:0.2; stroke:var(--interactive-accent, #58a6ff); stroke-width:2; animation: pulseGoal 2s infinite alternate; }
    .q-trap { fill:#e74c3c; opacity:0.15; stroke:#e74c3c; stroke-width:2; }
    .q-wall { fill:var(--text-muted, #8b949e); opacity:0.4; stroke:var(--text-normal, #c9d1d9); stroke-width:1; }
    .q-arrow { stroke:var(--interactive-accent, #58a6ff); stroke-width:2.5; fill:none; stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawArrow 2s infinite alternate; }
    .q-label { font-family:Inter,system-ui,sans-serif; font-size:11px; fill:var(--text-normal, #c9d1d9); }
    .q-val { font-family:Inter,system-ui,sans-serif; font-size:10px; fill:var(--text-muted, #8b949e); }
    .q-title { font-family:Inter,system-ui,sans-serif; font-size:14px; fill:var(--text-normal, #c9d1d9); font-weight:bold; }
    .q-accent { font-family:Inter,system-ui,sans-serif; font-size:12px; fill:var(--interactive-accent, #58a6ff); font-weight:bold; }
    .q-box { fill:var(--background-secondary, #161b22); stroke:var(--text-muted, #8b949e); stroke-width:1; rx:5; }
    @keyframes drawArrow { to { stroke-dashoffset: 0; } }
    @keyframes pulseGoal { from { opacity: 0.1; } to { opacity: 0.4; } }
  </style>
  <!-- Grid 4x4 -->
  <rect x="30" y="30" width="80" height="80" class="q-cell"/><text x="70" y="75" class="q-val" text-anchor="middle">V=4.1</text>
  <rect x="110" y="30" width="80" height="80" class="q-cell"/><text x="150" y="75" class="q-val" text-anchor="middle">V=4.6</text>
  <rect x="190" y="30" width="80" height="80" class="q-cell"/><text x="230" y="75" class="q-val" text-anchor="middle">V=5.1</text>
  <rect x="270" y="30" width="80" height="80" class="q-goal"/><text x="310" y="65" class="q-accent" text-anchor="middle">GOAL</text><text x="310" y="80" class="q-accent" text-anchor="middle">r=+10</text>
  <rect x="30" y="110" width="80" height="80" class="q-cell"/><text x="70" y="155" class="q-val" text-anchor="middle">V=3.7</text>
  <rect x="110" y="110" width="80" height="80" class="q-wall"/><text x="150" y="155" class="q-label" text-anchor="middle">WALL</text>
  <rect x="190" y="110" width="80" height="80" class="q-cell"/><text x="230" y="155" class="q-val" text-anchor="middle">V=3.8</text>
  <rect x="270" y="110" width="80" height="80" class="q-cell"/><text x="310" y="155" class="q-val" text-anchor="middle">V=7.2</text>
  <rect x="30" y="190" width="80" height="80" class="q-cell"/><text x="70" y="235" class="q-val" text-anchor="middle">V=3.3</text>
  <rect x="110" y="190" width="80" height="80" class="q-cell"/><text x="150" y="235" class="q-val" text-anchor="middle">V=2.9</text>
  <rect x="190" y="190" width="80" height="80" class="q-trap"/><text x="230" y="225" class="q-label" text-anchor="middle" fill="#e74c3c">TRAP</text><text x="230" y="240" class="q-label" text-anchor="middle" fill="#e74c3c">r=−5</text>
  <rect x="270" y="190" width="80" height="80" class="q-cell"/><text x="310" y="235" class="q-val" text-anchor="middle">V=5.4</text>
  <!-- Optimal policy arrows -->
  <line x1="70" y1="55" x2="105" y2="55" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="150" y1="55" x2="185" y2="55" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="230" y1="55" x2="265" y2="55" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="70" y1="135" x2="70" y2="50" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="230" y1="135" x2="230" y2="50" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="310" y1="135" x2="310" y2="50" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="70" y1="215" x2="70" y2="135" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="150" y1="215" x2="105" y2="215" class="q-arrow" marker-end="url(#q-arr)"/>
  <line x1="310" y1="215" x2="310" y2="135" class="q-arrow" marker-end="url(#q-arr)"/>
  <!-- Legend / Equation box -->
  <rect x="380" y="30" width="230" height="240" class="q-box"/>
  <text x="495" y="55" class="q-title" text-anchor="middle">Bellman Optimality</text>
  <text x="395" y="85" class="q-accent">Q*(s,a) = E[r + γ max Q*(s',a')]</text>
  <text x="395" y="115" class="q-label">Update rule:</text>
  <text x="395" y="135" class="q-label">Q(s,a) ← Q(s,a) + α[r + γ max Q(s',·) − Q(s,a)]</text>
  <text x="395" y="170" class="q-label">Parameters:</text>
  <text x="395" y="190" class="q-label">γ = 0.9 (discount)</text>
  <text x="395" y="208" class="q-label">α = 0.1 (learning rate)</text>
  <text x="395" y="226" class="q-label">ε = 0.1 (exploration)</text>
  <text x="395" y="255" class="q-accent">Off-policy: learns π* while following π_ε</text>
  <!-- Start marker -->
  <circle cx="70" cy="230" r="8" fill="none" stroke="var(--interactive-accent, #58a6ff)" stroke-width="2"/>
  <text x="70" y="260" class="q-accent" text-anchor="middle">START</text>
</svg>