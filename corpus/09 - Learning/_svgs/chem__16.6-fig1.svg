<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 500px; height: auto;">
  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal, #c9d1d9); font-weight: bold; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-normal, #c9d1d9); }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 10px; fill: var(--text-muted, #8b949e); }
    .node { fill: var(--background-secondary, #161b22); stroke: var(--interactive-accent, #58a6ff); stroke-width: 2.5; }
    .edge { stroke: var(--text-normal, #c9d1d9); stroke-width: 2; fill: none; }
    .formula { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: var(--interactive-accent, #58a6ff); font-weight: bold; }
  </style>
  <text x="250" y="25" class="title" text-anchor="middle">The Thermodynamic Triangle</text>
  <!-- Triangle nodes -->
  <!-- ΔG° (top) -->
  <circle cx="250" cy="80" r="40" class="node"/>
  <text x="250" y="78" class="label" text-anchor="middle">ΔG°</text>
  <text x="250" y="95" class="sublabel" text-anchor="middle">(kJ/mol)</text>
  <!-- E° (bottom left) -->
  <circle cx="100" cy="300" r="40" class="node"/>
  <text x="100" y="298" class="label" text-anchor="middle">E°cell</text>
  <text x="100" y="315" class="sublabel" text-anchor="middle">(Volts)</text>
  <!-- K (bottom right) -->
  <circle cx="400" cy="300" r="40" class="node"/>
  <text x="400" y="298" class="label" text-anchor="middle">K</text>
  <text x="400" y="315" class="sublabel" text-anchor="middle">(unitless)</text>
  <!-- Edges with formulas -->
  <!-- ΔG° ↔ E° -->
  <line x1="215" y1="110" x2="130" y2="265" class="edge"/>
  <text x="145" y="175" class="formula" text-anchor="middle">ΔG° = −nFE°</text>
  <text x="145" y="190" class="formula" text-anchor="middle">E° = −ΔG°/(nF)</text>
  <!-- ΔG° ↔ K -->
  <line x1="285" y1="110" x2="370" y2="265" class="edge"/>
  <text x="355" y="175" class="formula" text-anchor="middle">ΔG° = −RT ln K</text>
  <text x="355" y="190" class="formula" text-anchor="middle">K = e^(−ΔG°/RT)</text>
  <!-- E° ↔ K -->
  <line x1="140" y1="300" x2="360" y2="300" class="edge"/>
  <text x="250" y="290" class="formula" text-anchor="middle">E° = (RT/nF) ln K</text>
  <text x="250" y="330" class="formula" text-anchor="middle">ln K = nFE°/(RT)</text>
  <!-- Spontaneity indicators -->
  <rect x="30" y="350" width="130" height="35" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="3"/>
  <text x="95" y="365" class="sublabel" text-anchor="middle">E° &gt; 0 → spontaneous</text>
  <text x="95" y="378" class="sublabel" text-anchor="middle">E° &lt; 0 → non-spontaneous</text>
  <rect x="185" y="350" width="130" height="35" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="3"/>
  <text x="250" y="365" class="sublabel" text-anchor="middle">ΔG° &lt; 0 → spontaneous</text>
  <text x="250" y="378" class="sublabel" text-anchor="middle">ΔG° &gt; 0 → non-spontaneous</text>
  <rect x="340" y="350" width="130" height="35" fill="var(--background-secondary, #161b22)" stroke="var(--text-muted, #8b949e)" stroke-width="1" rx="3"/>
  <text x="405" y="365" class="sublabel" text-anchor="middle">K &gt; 1 → products favored</text>
  <text x="405" y="378" class="sublabel" text-anchor="middle">K &lt; 1 → reactants favored</text>
</svg>
