<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .text { fill: var(--text-normal, #e0e0e0); font-family: sans-serif; font-size: 14px;}
      .title { font-size: 24px; font-weight: bold; }
      .axis { stroke: var(--text-normal, #e0e0e0); stroke-width: 2; }
      .curve-strong { fill: none; stroke: var(--color-red, #e74c3c); stroke-width: 3; }
      .curve-weak { fill: none; stroke: var(--interactive-accent, #4a90e2); stroke-width: 3; }
      .grid { stroke: var(--background-modifier-border, #444); stroke-width: 1; stroke-dasharray: 4 4; }
      .dot { fill: var(--text-normal, #e0e0e0); }
      .label-bg { fill: var(--background-primary, #1e1e1e); opacity: 0.8; rx: 4; }
    </style>
  </defs>

  <text x="400" y="40" text-anchor="middle" class="text title">Titration Curves</text>

  <!-- Axes -->
  <line x1="100" y1="350" x2="700" y2="350" class="axis" />
  <line x1="100" y1="350" x2="100" y2="80" class="axis" />
  
  <text x="400" y="385" text-anchor="middle" class="text">Volume of NaOH added (mL)</text>
  <text x="60" y="215" text-anchor="middle" transform="rotate(-90 60 215)" class="text">pH</text>

  <!-- Y-axis ticks & Grid -->
  <g class="grid">
    <line x1="95" y1="330" x2="700" y2="330" /> <!-- pH 1 -->
    <line x1="95" y1="180" x2="700" y2="180" /> <!-- pH 7 -->
    <line x1="95" y1="100" x2="700" y2="100" /> <!-- pH 13 -->
  </g>
  <text x="85" y="335" text-anchor="end" class="text">1</text>
  <text x="85" y="185" text-anchor="end" class="text">7</text>
  <text x="85" y="105" text-anchor="end" class="text">13</text>

  <!-- X-axis ticks -->
  <line x1="400" y1="350" x2="400" y2="355" class="axis" />
  <text x="400" y="370" text-anchor="middle" class="text">50 (Equivalence)</text>

  <!-- Strong Acid (HCl) Curve -->
  <!-- Starts at pH ~1 (y=330), equivalence at 50mL (x=400, y=180), ends at pH ~13 (y=100) -->
  <path d="M 100 330 C 350 330, 390 330, 400 180 C 410 30, 450 100, 700 100" class="curve-strong">
    <animate attributeName="stroke-dasharray" values="0, 2000; 2000, 0" dur="3s" fill="freeze" />
  </path>

  <!-- Weak Acid (CH3COOH) Curve -->
  <!-- Starts at pH ~3 (y=280), half-equiv at 25mL pH=pKa~4.7 (y=240), equiv at 50mL pH~8.5 (y=150), ends at pH ~13 -->
  <path d="M 100 280 Q 150 240, 250 240 T 380 200 C 400 150, 410 100, 700 100" class="curve-weak">
    <animate attributeName="stroke-dasharray" values="0, 2000; 2000, 0" dur="3s" fill="freeze" />
  </path>

  <!-- Labels -->
  <circle cx="400" cy="180" r="5" class="dot" />
  <text x="415" y="185" class="text">Equivalence Pt (Strong)</text>

  <circle cx="400" cy="150" r="5" class="dot" />
  <text x="415" y="145" class="text">Equivalence Pt (Weak)</text>

  <circle cx="250" cy="240" r="5" class="dot" />
  <text x="250" y="225" text-anchor="middle" class="text">Half-equivalence (pH = pKa)</text>
  
  <rect x="550" y="120" width="130" height="60" class="label-bg" />
  <line x1="560" y1="135" x2="590" y2="135" class="curve-strong" />
  <text x="600" y="140" class="text">Strong Acid</text>
  <line x1="560" y1="160" x2="590" y2="160" class="curve-weak" />
  <text x="600" y="165" class="text">Weak Acid</text>
</svg>
