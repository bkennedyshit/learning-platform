<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:720px;height:auto;">
  <style>
    .title{font-family:Inter,system-ui,sans-serif;font-size:15px;fill:var(--text-normal,#c9d1d9);font-weight:bold;}
    .label{font-family:Inter,system-ui,sans-serif;font-size:12px;fill:var(--text-normal,#c9d1d9);}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:var(--text-muted,#8b949e);}
    .mono{font-family:ui-monospace,monospace;font-size:9px;fill:var(--text-muted,#8b949e);}
    .code{font-family:ui-monospace,monospace;font-size:8.5px;fill:var(--interactive-accent,#58a6ff);}
    .box{fill:var(--background-secondary,#161b22);stroke:var(--text-muted,#8b949e);stroke-width:1;transition:all 0.3s ease;}
    .box:hover{stroke:var(--interactive-accent,#58a6ff);fill:rgba(88,166,255,0.02);filter:drop-shadow(0 0 4px rgba(88,166,255,0.15));}
    .codebox{fill:#0d1117;stroke:var(--interactive-accent,#58a6ff);stroke-width:1.2;position:relative;}
    
    /* Hover effects for bottom cards */
    .c-card {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .c-card:hover {
      fill: rgba(88,166,255,0.04) !important;
      stroke-width: 1.8px !important;
      filter: drop-shadow(0 0 5px var(--interactive-accent,#58a6ff));
    }
  </style>
  <text x="360" y="22" class="title" text-anchor="middle">34.4 — CNC Machining &amp; G-Code: Toolpaths, Coordinates &amp; Speeds/Feeds</text>
  
  <!-- Machine axes -->
  <rect x="20" y="35" width="170" height="175" class="box" rx="4"/>
  <text x="105" y="52" class="label" text-anchor="middle" font-weight="bold">Machine Axes</text>
  <!-- 3-axis coordinate cross -->
  <line x1="105" y1="130" x2="105" y2="70" stroke="var(--interactive-accent,#58a6ff)" stroke-width="2"/>
  <line x1="65" y1="130" x2="155" y2="130" stroke="var(--interactive-accent,#58a6ff)" stroke-width="2"/>
  <line x1="105" y1="130" x2="75" y2="160" stroke="var(--text-muted,#8b949e)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="107" y="68" class="label" fill="var(--interactive-accent,#58a6ff)">Z+</text>
  <text x="158" y="134" class="label" fill="var(--interactive-accent,#58a6ff)">X+</text>
  <text x="60" y="170" class="label" fill="var(--text-muted,#8b949e)">Y+</text>
  
  <!-- Interactive CNC cutting tool traveling along 3D toolpath (glowing dot) -->
  <circle r="4" fill="#ffd93d" filter="drop-shadow(0 0 3px #ffd93d)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M105,130 L145,130 L105,90 L85,145 L105,130" />
  </circle>
  <circle r="6" fill="#ffd93d" opacity="0.3" pointer-events="none">
    <animateMotion dur="5s" repeatCount="indefinite" path="M105,130 L145,130 L105,90 L85,145 L105,130" />
  </circle>
  
  <text x="105" y="178" class="sub" text-anchor="middle">Right-hand rule applies</text>
  <text x="105" y="190" class="sub" text-anchor="middle">+A rotates around X axis</text>
  <text x="105" y="202" class="sub" text-anchor="middle">G-code: absolute (G90)</text>
  <text x="105" y="214" class="sub" text-anchor="middle">or incremental (G91)</text>
  
  <!-- G-code cheatsheet -->
  <rect x="205" y="35" width="230" height="175" class="box" rx="4"/>
  <text x="320" y="52" class="label" text-anchor="middle" font-weight="bold">G-Code Reference</text>
  <rect x="215" y="60" width="210" height="140" class="codebox" rx="3"/>
  
  <!-- Discrete line-by-line G-code execution highlighter -->
  <rect x="217" y="66" width="206" height="13" fill="var(--interactive-accent,#58a6ff)" opacity="0.2" rx="2">
    <animate attributeName="y" values="66;80;94;108;122;136;150;164;178;66" dur="9s" repeatCount="indefinite" calcMode="discrete" />
  </rect>
  
  <text x="225" y="74" class="code">G00 X10 Y20       ; rapid move</text>
  <text x="225" y="88" class="code">G01 X30 F200      ; linear at 200mm/min</text>
  <text x="225" y="102" class="code">G02 X50 Y0 R10    ; arc CW radius 10</text>
  <text x="225" y="116" class="code">G03 X50 Y0 R10    ; arc CCW</text>
  <text x="225" y="130" class="code">G17               ; XY plane select</text>
  <text x="225" y="144" class="code">G20/G21           ; inches / mm</text>
  <text x="225" y="158" class="code">M03 S1200         ; spindle on 1200 RPM</text>
  <text x="225" y="172" class="code">M08/M09           ; coolant on/off</text>
  <text x="225" y="186" class="code">M30               ; end program</text>
  
  <!-- Speeds and feeds -->
  <rect x="450" y="35" width="250" height="175" class="box" rx="4"/>
  <text x="575" y="52" class="label" text-anchor="middle" font-weight="bold">Speeds &amp; Feeds</text>
  <text x="460" y="68" class="sub" font-weight="bold">Cutting Speed (SFM → RPM):</text>
  <text x="460" y="82" class="mono">RPM = (CS × 3.82) / dia_inch</text>
  <text x="460" y="94" class="mono">CS: Al=700, SS=100, mild=300 SFM</text>
  <text x="460" y="108" class="sub" font-weight="bold">Feed Rate:</text>
  <text x="460" y="120" class="mono">F = RPM × flutes × chip_load</text>
  <text x="460" y="132" class="mono">Chip load Al: 0.003–0.005"</text>
  <text x="460" y="144" class="mono">Chip load SS: 0.001–0.002"</text>
  <text x="460" y="158" class="sub" font-weight="bold">Depth of Cut:</text>
  <text x="460" y="170" class="mono">Roughing: 50% dia · Finish: 10% dia</text>
  <text x="460" y="182" class="mono">Step-down Al: up to 1× dia</text>
  <text x="460" y="198" class="sub" text-anchor="start">Free calc: FSWizard (carbide-depot.com/fsw)</text>
  
  <!-- Bottom: Toolpath types + CAM workflow -->
  <rect x="20" y="225" width="680" height="175" class="box" rx="4"/>
  <text x="360" y="243" class="label" text-anchor="middle" font-weight="bold">CAM Toolpath Types &amp; CAD→CAM→Machine Workflow</text>
  
  <!-- Toolpath panels (Interactive & Animated) -->
  <!-- 1. Contour -->
  <g class="c-card">
    <rect x="30" y="252" width="130" height="55" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.2" rx="3"/>
    <rect x="42" y="260" width="106" height="40" fill="none" stroke="rgba(88,166,255,0.15)" stroke-width="1" rx="2" stroke-dasharray="2 2"/>
    <circle r="3" fill="#ff6b6b" filter="drop-shadow(0 0 2px #ff6b6b)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M42,260 L148,260 L148,300 L42,300 Z" />
    </circle>
    <text x="95" y="268" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">Contour / Profile</text>
    <text x="95" y="281" class="sub" text-anchor="middle">Follow part boundary</text>
    <text x="95" y="293" class="sub" text-anchor="middle">Climb vs. conventional</text>
  </g>
  
  <!-- 2. Pocket / Adaptive -->
  <g class="c-card">
    <rect x="175" y="252" width="130" height="55" fill="none" stroke="#51cf66" stroke-width="1.2" rx="3"/>
    <path d="M190 290 Q200 262 215 290 T240 290 T265 290 T290 290" fill="none" stroke="rgba(81,207,162,0.15)" stroke-width="1" stroke-dasharray="2 2"/>
    <circle r="2.5" fill="#51cf66" filter="drop-shadow(0 0 2px #51cf66)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M190 290 Q200 262 215 290 T240 290 T265 290 T290 290" />
    </circle>
    <text x="240" y="268" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">Pocket / Adaptive</text>
    <text x="240" y="281" class="sub" text-anchor="middle">Trochoidal: high MRR</text>
    <text x="240" y="293" class="sub" text-anchor="middle">Constant chip load</text>
  </g>
  
  <!-- 3. Drill Cycles -->
  <g class="c-card">
    <rect x="320" y="252" width="130" height="55" fill="none" stroke="#ffd93d" stroke-width="1.2" rx="3"/>
    <!-- Animated Drill plunge -->
    <g transform="translate(385, 276)">
      <path d="M-3,-12 L3,-12 L3,-2 L0,2 L-3,-2 Z" fill="#ffd93d" filter="drop-shadow(0 0 1px #ffd93d)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,18; 0,5; 0,18; 0,0" dur="2s" repeatCount="indefinite" additive="sum"/>
    </g>
    <!-- Hole bottom -->
    <line x1="385" y1="288" x2="385" y2="296" stroke="rgba(255,217,61,0.2)" stroke-width="6" stroke-linecap="round"/>
    
    <text x="385" y="268" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">Drill Cycles</text>
    <text x="385" y="281" class="sub" text-anchor="middle">G81 (simple) G83 (peck)</text>
    <text x="385" y="293" class="sub" text-anchor="middle">G84 (tap) G73 (chip break)</text>
  </g>
  
  <!-- 4. 3D Surface -->
  <g class="c-card">
    <rect x="465" y="252" width="130" height="55" fill="none" stroke="var(--interactive-accent,#58a6ff)" stroke-width="1.2" rx="3"/>
    <path d="M475 285 L490 290 L505 285 L520 290 L535 285 L550 290 L565 285 L580 290" fill="none" stroke="rgba(88,166,255,0.15)" stroke-width="1"/>
    <circle r="2.5" fill="#58a6ff">
      <animateMotion dur="4s" repeatCount="indefinite" path="M475 285 L490 290 L505 285 L520 290 L535 285 L550 290 L565 285 L580 290" />
    </circle>
    <text x="530" y="268" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">3D Surface</text>
    <text x="530" y="281" class="sub" text-anchor="middle">Scallop / parallel</text>
    <text x="530" y="293" class="sub" text-anchor="middle">Stepover controls Ra</text>
  </g>
  
  <!-- 5. Thread Mill -->
  <g class="c-card">
    <rect x="610" y="252" width="90" height="55" fill="none" stroke="#ff6b6b" stroke-width="1.2" rx="3"/>
    <circle cx="655" cy="285" r="9" fill="none" stroke="rgba(255,107,107,0.15)" stroke-width="1" stroke-dasharray="2 2" />
    <circle r="2.2" fill="#ff6b6b" filter="drop-shadow(0 0 1.5px #ff6b6b)">
      <animateMotion dur="2s" repeatCount="indefinite" path="M655 276 A9 9 0 1 1 654.9 276 Z" />
    </circle>
    <text x="655" y="268" class="sub" text-anchor="middle" font-weight="bold" style="fill:var(--text-normal,#c9d1d9);">Thread Mill</text>
    <text x="655" y="281" class="sub" text-anchor="middle">Helix interp</text>
    <text x="655" y="293" class="sub" text-anchor="middle">One tool all</text>
  </g>
  
  <!-- CAM workflow arrow flow -->
  <text x="360" y="326" class="sub" text-anchor="middle" font-weight="bold">CAD→CAM→Machine Workflow:</text>
  <text x="360" y="340" class="mono" text-anchor="middle">FreeCAD Path WB  →  Post-Processor (LinuxCNC/Fanuc/Grbl)  →  G-code file  →  CAM sender (CNCjs/bCNC)  →  Machine</text>
  <text x="360" y="356" class="sub" text-anchor="middle">Post processor translates toolpaths to machine-specific dialect. Always simulate before cutting — FreeCAD Path simulator or CAMotics (free, camotics.org).</text>
  <text x="360" y="372" class="sub" text-anchor="middle">Work offsets (G54–G59): zero the part on the machine table. Tool length offsets (G43 H01): compensate for tool stickout. Both set with probe or edge finder.</text>
  <text x="360" y="388" class="sub" text-anchor="middle">Free resources: NYC CNC YouTube (CAM tutorials, FreeCAD), Practical Machinist forum, HSMAdvisor speeds/feeds calculator.</text>
</svg>
