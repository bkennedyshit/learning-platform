<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 720px; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.3"/>
    </pattern>

    <!-- Arrow Marker -->
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    
    <marker id="arrActive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>

    <!-- Eye Pupil Gradient -->
    <radialGradient id="pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="70%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: #c9d1d9; font-weight: bold; }
    .header-label { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #58a6ff; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: #c9d1d9; font-weight: 500; }
    .sublabel { font-family: Inter, system-ui, sans-serif; font-size: 9px; fill: #8b949e; }
    
    /* Interactive Cards */
    .state-box { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 6; transition: all 0.3s ease; }
    .state-box:hover { fill: #21262d; stroke: #8b949e; }
    .active-box { fill: #0d2a4a; stroke: #58a6ff; stroke-width: 1.5; rx: 6; transition: all 0.3s ease; }
    .active-box:hover { fill: #0f355c; stroke: #79c0ff; stroke-width: 2px; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8; }

    /* Lines */
    .line-flow { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .line-active { stroke: #58a6ff; stroke-width: 1.5; fill: none; stroke-dasharray: 5, 4; animation: flow 2s linear infinite; }
    
    @keyframes flow {
      to {
        stroke-dashoffset: -18;
      }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="360" y="28" class="title" text-anchor="middle">Mixed Reality Passthrough &amp; Spatial Compositing Pipeline</text>

  <!-- ================= COLUMN 1: SENSOR CAPTURE ================= -->
  <text x="40" y="60" class="header-label">1. Capture</text>

  <!-- Stereo Camera Box -->
  <rect x="40" y="80" width="130" height="50" class="state-box"/>
  <text x="105" y="98" class="label" text-anchor="middle">Stereo Cameras</text>
  <text x="105" y="112" class="sublabel" text-anchor="middle">Real Color Passthrough</text>

  <!-- LiDAR Depth Box -->
  <rect x="40" y="150" width="130" height="50" class="state-box"/>
  <text x="105" y="168" class="label" text-anchor="middle">LiDAR / Depth Sensor</text>
  <text x="105" y="182" class="sublabel" text-anchor="middle">IR Time-of-Flight</text>

  <!-- IMU Tracking Box -->
  <rect x="40" y="220" width="130" height="50" class="state-box"/>
  <text x="105" y="238" class="label" text-anchor="middle">High-Hz IMU</text>
  <text x="105" y="252" class="sublabel" text-anchor="middle">Head Tracking &amp; VIO</text>

  <!-- ================= COLUMN 2: REPROJECTION / WARPING ================= -->
  <text x="210" y="60" class="header-label">2. Alignment</text>

  <!-- Spatial Warp Processing Box -->
  <rect x="210" y="80" width="120" height="190" class="active-box"/>
  <text x="270" y="105" class="label" text-anchor="middle" fill="#79c0ff" font-weight="bold">Spatial Reprojection</text>
  <text x="270" y="122" class="sublabel" text-anchor="middle" fill="#c9d1d9">Hardware DSP / Apple R1</text>
  
  <!-- Stylized warping grid -->
  <g transform="translate(230, 140)">
    <!-- Static warped grid lines -->
    <path d="M 0 0 Q 40 10 80 0 M 0 20 Q 40 30 80 20 M 0 40 Q 40 50 80 40 M 0 60 Q 40 70 80 60" fill="none" stroke="#234263" stroke-width="1" />
    <path d="M 0 0 Q 10 30 0 60 M 20 0 Q 30 30 20 60 M 40 0 Q 50 30 40 60 M 60 0 Q 70 30 60 60 M 80 0 Q 90 30 80 60" fill="none" stroke="#234263" stroke-width="1" />
    <!-- Dynamic correcting mesh lines -->
    <path d="M 0 0 Q 40 10 80 0 M 0 20 Q 40 30 80 20 M 0 40 Q 40 50 80 40 M 0 60 Q 40 70 80 60" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-opacity="0.3">
      <animate attributeName="stroke-dasharray" values="10, 50; 50, 10; 10, 50" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
  <text x="270" y="225" class="sublabel" text-anchor="middle">Corrects latency disparity</text>
  <text x="270" y="238" class="sublabel" text-anchor="middle">to match human IPD</text>

  <!-- ================= COLUMN 3: DEPTH OCCLUSION ================= -->
  <text x="370" y="60" class="header-label">3. Occlusion</text>

  <!-- Occlusion Box -->
  <rect x="370" y="80" width="120" height="190" class="panel"/>
  <text x="430" y="105" class="label" text-anchor="middle">Mesh Occlusion</text>
  <text x="430" y="118" class="sublabel" text-anchor="middle">Virtual behind Real</text>

  <!-- Depth Occlusion Simulation Zone -->
  <g transform="translate(370, 0)">
    <!-- Ground plane inside panel -->
    <line x1="10" y1="210" x2="110" y2="210" stroke="#30363d" stroke-width="2" />
    
    <!-- Moving Virtual Ball (Rendered underneath physical wall to demonstrate occlusion!) -->
    <!-- The ball moves left and right. When x matches the wall, it goes behind the wall and disappears. -->
    <circle cy="170" r="14" fill="#ffd93d">
      <animate attributeName="cx" values="25; 85; 25" dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#ffd93d; #ff922b; #ffd93d" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Physical Real-World Wall Mesh overlay -->
    <rect x="50" y="130" width="30" height="80" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="1.5" />
    <!-- Visual indicators on wall -->
    <line x1="55" y1="140" x2="75" y2="140" stroke="#8b949e" stroke-width="1" stroke-opacity="0.5" />
    <line x1="55" y1="160" x2="75" y2="160" stroke="#8b949e" stroke-width="1" stroke-opacity="0.5" />
    <line x1="55" y1="180" x2="75" y2="180" stroke="#8b949e" stroke-width="1" stroke-opacity="0.5" />
    <line x1="55" y1="200" x2="75" y2="200" stroke="#8b949e" stroke-width="1" stroke-opacity="0.5" />
  </g>
  <text x="430" y="235" class="sublabel" text-anchor="middle">Teapot/Ball hides</text>
  <text x="430" y="248" class="sublabel" text-anchor="middle">behind real physical wall</text>

  <!-- ================= COLUMN 4: COMPOSITION & DISPLAY ================= -->
  <text x="530" y="60" class="header-label">4. Output</text>

  <!-- Compositing Engine Box -->
  <rect x="530" y="80" width="150" height="100" class="active-box"/>
  <text x="605" y="98" class="label" text-anchor="middle" fill="#79c0ff">MR Compositor</text>
  <text x="605" y="112" class="sublabel" text-anchor="middle" fill="#c9d1d9">Layer composition</text>
  <text x="605" y="125" class="sublabel" text-anchor="middle" fill="#c9d1d9">Virtual + Corrected Real</text>
  <text x="605" y="138" class="sublabel" text-anchor="middle" fill="#8b949e">Late Warp Reprojection</text>
  <text x="605" y="152" class="sublabel" text-anchor="middle" fill="#8b949e">90Hz+ Display rate</text>

  <!-- Headset Display and Eye -->
  <rect x="530" y="200" width="150" height="150" class="state-box"/>
  
  <!-- Stylized Eye Inside Headset Display Panel -->
  <g transform="translate(605, 275)">
    <!-- Eye Sclera -->
    <path d="M -30 0 Q 0 -22 30 0 Q 0 22 -30 0 Z" fill="#21262d" stroke="#8b949e" stroke-width="1.5" />
    <!-- Pupil/Iris -->
    <circle cx="0" cy="0" r="13" fill="url(#pupil)" />
    <circle cx="0" cy="0" r="5" fill="#0d1117" />
    <circle cx="-4" cy="-4" r="2.5" fill="#ffffff" opacity="0.8" /> <!-- Reflection -->
  </g>
  <text x="605" y="222" class="label" text-anchor="middle">User Visual Reception</text>
  <text x="605" y="335" class="sublabel" text-anchor="middle">Photon Latency &lt; 12ms</text>

  <!-- ================= LINES & FLOW ANIMATIONS ================= -->
  <!-- Sensor Capture -> Spatial Warp Bus lines -->
  <path d="M 170 105 L 210 105" class="line-flow" marker-end="url(#arr)"/>
  <path d="M 170 175 L 190 175 L 190 135 L 210 135" class="line-flow" />
  <path d="M 170 245 L 190 245 L 190 165 L 210 165" class="line-flow" />

  <!-- Alignment -> Occlusion -->
  <path d="M 330 175 L 370 175" class="line-active" marker-end="url(#arrActive)"/>

  <!-- Occlusion -> Compositor -->
  <path d="M 490 175 L 505 175 L 505 130 L 530 130" class="line-active" marker-end="url(#arrActive)"/>

  <!-- Compositor -> Display -->
  <path d="M 605 180 L 605 200" class="line-active" marker-end="url(#arrActive)"/>

  <!-- ================= SMIL PIXEL FLOW DOTS ================= -->
  <!-- Raw camera frames (orange) -->
  <circle r="3" fill="#ff922b">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 170 105 L 210 105" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- LiDAR Depth frames (purple) -->
  <circle r="3" fill="#c084fc">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 170 175 L 190 175 L 190 135 L 210 135" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Processed/reprojected frames (blue, staggered) -->
  <circle r="3" fill="#58a6ff">
    <animateMotion dur="4s" begin="0.5s" repeatCount="indefinite" path="M 330 175 L 370 175" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Occluded & compiled frames (green, staggered) -->
  <circle r="3" fill="#51cf66">
    <animateMotion dur="4s" begin="1.5s" repeatCount="indefinite" path="M 490 175 L 505 175 L 505 130 L 530 130" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Composite video signal to displaying screen -->
  <circle r="3.5" fill="#58a6ff">
    <animateMotion dur="2s" begin="2s" repeatCount="indefinite" path="M 605 180 L 605 200" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer explanation -->
  <text x="360" y="415" class="sublabel" text-anchor="middle">Mixed reality relies on rapid pixel remapping to alignment coordinates, real-time depth mapping for occlusion, and low latency display projection.</text>
</svg>
