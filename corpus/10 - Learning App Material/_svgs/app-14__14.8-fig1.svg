<svg viewBox="-200 -200 400 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 400px; height: auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal)"/>
    </marker>
  </defs>
  
  <style>
    .grid { stroke: var(--text-muted); stroke-width: 0.5; opacity: 0.5; }
    .axis { stroke: var(--text-normal); stroke-width: 2; }
    .line1 { stroke: var(--interactive-accent); stroke-width: 3; fill: none; transition: stroke-width 0.2s; cursor: pointer; }
    .line2 { stroke: var(--text-accent); stroke-width: 3; fill: none; transition: stroke-width 0.2s; cursor: pointer; }
    .line1:hover, .line2:hover { stroke-width: 5; }
    .angle { stroke: var(--h1-color); stroke-width: 2; fill: none; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: bold; }
  </style>

  <path class="grid" d="M -150 -200 V 200 M -100 -200 V 200 M -50 -200 V 200 M 50 -200 V 200 M 100 -200 V 200 M 150 -200 V 200" />
  <path class="grid" d="M -200 -150 H 200 M -200 -100 H 200 M -200 -50 H 200 M -200 50 H 200 M -200 100 H 200 M -200 150 H 200" />

  <line x1="-190" y1="0" x2="190" y2="0" class="axis" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="0" y1="190" x2="0" y2="-190" class="axis" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Line 1: y = 2x (SVG y = -2x) -->
  <line x1="-100" y1="200" x2="100" y2="-200" class="line1" />
  
  <!-- Line 2: y = -1/2 x (SVG y = 0.5x) -->
  <line x1="-200" y1="-100" x2="200" y2="100" class="line2" />
  
  <!-- Right angle marker at origin -->
  <path class="angle" d="M 10 -20 L 30 -10 L 20 10" />

  <rect x="-180" y="-180" width="160" height="50" rx="4" fill="var(--background-secondary)" stroke="var(--text-muted)"/>
  <text x="-170" y="-160" class="label" fill="var(--interactive-accent)">m₁ = 2</text>
  <text x="-170" y="-140" class="label" fill="var(--text-accent)">m₂ = -1/2 (⊥)</text>
</svg>