<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .cell-membrane { fill: var(--background-secondary); stroke: var(--text-normal); stroke-width: 2.5; }
    .cell-wall { fill: none; stroke: var(--text-normal); stroke-width: 5; stroke-linejoin: round; }
    .organelle-nucleus { fill: var(--background-secondary); stroke: var(--interactive-accent); stroke-width: 2; transition: all 0.2s ease; cursor: pointer; }
    .organelle-nucleus:hover { fill: var(--interactive-accent); opacity: 0.3; }
    .organelle-chloroplast { fill: #40c057; stroke: #2b8a3e; stroke-width: 1.5; opacity: 0.8; transition: all 0.2s ease; cursor: pointer; }
    .organelle-chloroplast:hover { fill: #5c7cfa; opacity: 1; }
    .organelle-mitochondria { fill: #ff922b; stroke: #d9480f; stroke-width: 1.5; transition: all 0.2s ease; cursor: pointer; }
    .organelle-mitochondria:hover { fill: #e64980; }
    .organelle-vacuole { fill: #a5d8ff; stroke: #228be6; stroke-width: 1.5; opacity: 0.6; }
    .text-main { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: var(--text-normal); font-weight: bold; }
    .text-sub { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: var(--text-muted); font-weight: 600; }
  </style>

  <!-- ================= ANIMAL CELL (LEFT) ================= -->
  <!-- Membrane (Round) -->
  <ellipse cx="160" cy="150" rx="100" ry="80" class="cell-membrane"/>
  
  <!-- Nucleus -->
  <circle cx="160" cy="150" r="22" class="organelle-nucleus"/>
  <circle cx="160" cy="150" r="8" fill="var(--text-normal)" opacity="0.3"/> <!-- Nucleolus -->

  <!-- Mitochondria -->
  <ellipse cx="110" cy="120" rx="14" ry="8" class="organelle-mitochondria" transform="rotate(-15, 110, 120)"/>
  <ellipse cx="210" cy="170" rx="14" ry="8" class="organelle-mitochondria" transform="rotate(30, 210, 170)"/>

  <!-- Labels Left -->
  <text x="160" y="40" class="text-main" text-anchor="middle">Animal Cell (Flexible Membrane)</text>
  <text x="160" y="145" class="text-sub" text-anchor="middle" pointer-events="none">Nucleus</text>
  <text x="100" y="100" class="text-sub" text-anchor="middle">Mitochondria</text>

  <!-- ================= PLANT CELL (RIGHT) ================= -->
  <!-- Cell Wall (Rigid Hexagon) -->
  <polygon points="440,70 540,110 540,190 440,230 340,190 340,110" class="cell-wall"/>
  <!-- Cell Membrane Inner -->
  <polygon points="440,74 536,112 536,188 440,226 344,188 344,112" class="cell-membrane"/>

  <!-- Large Central Vacuole -->
  <ellipse cx="460" cy="160" rx="40" ry="30" class="organelle-vacuole"/>

  <!-- Nucleus (Pushed to Side) -->
  <circle cx="390" cy="120" r="18" class="organelle-nucleus"/>
  <circle cx="390" cy="120" r="6" fill="var(--text-normal)" opacity="0.3"/>

  <!-- Chloroplasts -->
  <ellipse cx="370" cy="170" rx="15" ry="9" class="organelle-chloroplast" transform="rotate(10, 370, 170)"/>
  <ellipse cx="490" cy="100" rx="15" ry="9" class="organelle-chloroplast" transform="rotate(-20, 490, 100)"/>

  <!-- Labels Right -->
  <text x="440" y="40" class="text-main" text-anchor="middle">Plant Cell (Rigid Cell Wall)</text>
  <text x="390" y="95" class="text-sub" text-anchor="middle">Nucleus</text>
  <text x="460" y="165" class="text-sub" text-anchor="middle" pointer-events="none" fill="#1864ab">Vacuole</text>
  <text x="490" y="80" class="text-sub" text-anchor="middle" fill="#2b8a3e">Chloroplast</text>
</svg>