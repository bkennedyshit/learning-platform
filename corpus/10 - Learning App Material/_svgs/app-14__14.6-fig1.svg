<svg viewBox="-200 -200 400 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 400px; height: auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal)"/>
    </marker>
  </defs>
  
  <style>
    .grid { stroke: var(--text-muted); stroke-width: 0.5; opacity: 0.5; }
    .axis { stroke: var(--text-normal); stroke-width: 2; }
    .line { stroke: var(--interactive-accent); stroke-width: 3; stroke-dasharray: 8 4; fill: none; }
    .shade { fill: var(--interactive-accent); opacity: 0.2; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-normal); }
    .eq-label { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--interactive-accent); font-weight: bold; }
  </style>

  <!-- Shaded region for y > x/2 - 1 -->
  <!-- SVG line: y = -0.5x + 50 -->
  <polygon points="-200,-200 200,-200 200,-50 -200,150" class="shade"/>

  <path class="grid" d="M -150 -200 V 200 M -100 -200 V 200 M -50 -200 V 200 M 50 -200 V 200 M 100 -200 V 200 M 150 -200 V 200" />
  <path class="grid" d="M -200 -150 H 200 M -200 -100 H 200 M -200 -50 H 200 M -200 50 H 200 M -200 100 H 200 M -200 150 H 200" />

  <line x1="-190" y1="0" x2="190" y2="0" class="axis" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="0" y1="190" x2="0" y2="-190" class="axis" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- y > 1/2 x - 1 (Dashed line) -->
  <line x1="-200" y1="150" x2="200" y2="-50" class="line" />
  
  <rect x="-180" y="-180" width="100" height="30" rx="4" fill="var(--background-secondary)" stroke="var(--text-muted)"/>
  <text x="-130" y="-160" class="eq-label" text-anchor="middle">y &gt; ½x - 1</text>
</svg>