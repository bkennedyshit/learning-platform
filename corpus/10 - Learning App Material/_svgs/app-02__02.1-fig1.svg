<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .grid-cell { fill: var(--background-secondary); stroke: var(--text-muted); stroke-width: 1.5; }
    .active-dot { fill: var(--interactive-accent); transition: all 0.2s ease; cursor: pointer; }
    .active-dot:hover { fill: var(--h1-color); r: 14; }
    .empty-dot { fill: none; }
    .bond-node { fill: var(--background-secondary); stroke: var(--text-normal); stroke-width: 2.5; }
    .bond-line { stroke: var(--text-normal); stroke-width: 2; fill: none; }
    .text-val { font-family: Inter, system-ui, sans-serif; font-size: 18px; fill: var(--text-normal); font-weight: bold; }
    .text-title { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--text-muted); font-weight: 600; }
  </style>

  <!-- Title Labels -->
  <text x="120" y="30" class="text-title" text-anchor="middle">Ten-Frame Subitizing (7 = 5 + 2)</text>
  <text x="440" y="30" class="text-title" text-anchor="middle">Number Bond Decomposition</text>

  <!-- ================= LEFT: TEN-FRAME ================= -->
  <!-- Row 1 cells -->
  <rect x="20" y="60" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="65" y="60" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="110" y="60" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="155" y="60" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="200" y="60" width="40" height="40" rx="4" class="grid-cell"/>
  
  <!-- Row 2 cells -->
  <rect x="20" y="110" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="65" y="110" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="110" y="110" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="155" y="110" width="40" height="40" rx="4" class="grid-cell"/>
  <rect x="200" y="110" width="40" height="40" rx="4" class="grid-cell"/>

  <!-- Row 1 active dots (5 dots) -->
  <circle cx="40" cy="80" r="11" class="active-dot"/>
  <circle cx="85" cy="80" r="11" class="active-dot"/>
  <circle cx="130" cy="80" r="11" class="active-dot"/>
  <circle cx="175" cy="80" r="11" class="active-dot"/>
  <circle cx="220" cy="80" r="11" class="active-dot"/>

  <!-- Row 2 active dots (2 dots, 3 empty) -->
  <circle cx="40" cy="130" r="11" class="active-dot"/>
  <circle cx="85" cy="130" r="11" class="active-dot"/>
  <circle cx="130" cy="130" r="11" class="empty-dot"/>
  <circle cx="175" cy="130" r="11" class="empty-dot"/>
  <circle cx="220" cy="130" r="11" class="empty-dot"/>

  <!-- ================= RIGHT: NUMBER BOND ================= -->
  <!-- Connecting Lines -->
  <line x1="440" y1="95" x2="390" y2="155" class="bond-line"/>
  <line x1="440" y1="95" x2="490" y2="155" class="bond-line"/>

  <!-- Whole Node -->
  <circle cx="440" cy="80" r="28" class="bond-node"/>
  <text x="440" y="86" class="text-val" text-anchor="middle">7</text>
  <text x="440" y="46" class="text-title" font-size="11" text-anchor="middle">Whole</text>

  <!-- Part Node 1 -->
  <circle cx="390" cy="170" r="24" class="bond-node"/>
  <text x="390" y="176" class="text-val" text-anchor="middle">5</text>
  <text x="335" y="174" class="text-title" font-size="11">Part</text>

  <!-- Part Node 2 -->
  <circle cx="490" cy="170" r="24" class="bond-node"/>
  <text x="490" y="176" class="text-val" text-anchor="middle">2</text>
  <text x="525" y="174" class="text-title" font-size="11">Part</text>
</svg>