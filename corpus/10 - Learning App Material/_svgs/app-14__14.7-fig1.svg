<svg viewBox="-200 -200 400 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 400px; height: auto;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-normal)"/>
    </marker>
  </defs>
  
  <style>
    .grid { stroke: var(--text-muted); stroke-width: 0.5; opacity: 0.5; }
    .axis { stroke: var(--text-normal); stroke-width: 2; }
    .line { stroke: var(--interactive-accent); stroke-width: 3; fill: none; transition: stroke-width 0.2s; cursor: pointer; }
    .line:hover { stroke-width: 5; }
    .label { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: var(--interactive-accent); font-weight: bold; }
  </style>

  <path class="grid" d="M -150 -200 V 200 M -100 -200 V 200 M -50 -200 V 200 M 50 -200 V 200 M 100 -200 V 200 M 150 -200 V 200" />
  <path class="grid" d="M -200 -150 H 200 M -200 -100 H 200 M -200 -50 H 200 M -200 50 H 200 M -200 100 H 200 M -200 150 H 200" />

  <line x1="-190" y1="0" x2="190" y2="0" class="axis" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="0" y1="190" x2="0" y2="-190" class="axis" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Line 1: y = x + 1 (SVG y = -x - 50) -->
  <line x1="-150" y1="100" x2="150" y2="-200" class="line" />
  
  <!-- Line 2: y = x - 2 (SVG y = -x + 100) -->
  <line x1="-100" y1="200" x2="200" y2="-100" class="line" />
  
  <rect x="-180" y="-180" width="130" height="50" rx="4" fill="var(--background-secondary)" stroke="var(--text-muted)"/>
  <text x="-170" y="-160" class="label">m₁ = 1</text>
  <text x="-170" y="-140" class="label">m₂ = 1 (Parallel)</text>
</svg>