<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: 600px; height: auto;">
  <style>
    .number-line { stroke: var(--text-normal); stroke-width: 3; fill: none; }
    .tick { stroke: var(--text-normal); stroke-width: 2.5; }
    .sub-tick { stroke: var(--text-muted); stroke-width: 2; }
    .interval-bar { stroke: var(--interactive-accent); stroke-width: 6; fill: none; stroke-linecap: round; opacity: 0.8; }
    .active-point { fill: var(--interactive-accent); stroke: var(--text-normal); stroke-width: 2; cursor: pointer; transition: all 0.2s ease; }
    .active-point:hover { fill: var(--h1-color); r: 9; }
    .fraction-text { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: var(--text-normal); font-weight: bold; }
    .label-muted { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: var(--text-muted); font-weight: 600; }
    .info-box { fill: var(--background-secondary); stroke: var(--interactive-accent); stroke-width: 1.5; }
  </style>

  <!-- Number Line Background Guide -->
  <line x1="50" y1="120" x2="550" y2="120" class="number-line"/>
  
  <!-- Shaded Interval from 0 to 3/4 -->
  <line x1="50" y1="120" x2="425" y2="120" class="interval-bar"/>

  <!-- Ticks (0, 1/4, 2/4, 3/4, 1) -->
  <!-- 0 Tick -->
  <line x1="50" y1="105" x2="50" y2="135" class="tick"/>
  <text x="50" y="160" class="fraction-text" text-anchor="middle">0</text>

  <!-- 1/4 Tick -->
  <line x1="175" y1="110" x2="175" y2="130" class="sub-tick"/>
  <text x="175" y="160" class="fraction-text" text-anchor="middle">1/4</text>
  <circle cx="175" cy="120" r="6" class="active-point"/>

  <!-- 2/4 (1/2) Tick -->
  <line x1="300" y1="105" x2="300" y2="135" class="tick"/>
  <text x="300" y="160" class="fraction-text" text-anchor="middle">1/2</text>
  <text x="300" y="180" class="label-muted" text-anchor="middle">(2/4)</text>
  <circle cx="300" cy="120" r="6" class="active-point"/>

  <!-- 3/4 Tick -->
  <line x1="425" y1="110" x2="425" y2="130" class="sub-tick"/>
  <text x="425" y="160" class="fraction-text" text-anchor="middle">3/4</text>
  <circle cx="425" cy="120" r="7.5" class="active-point" fill="var(--h1-color)"/>

  <!-- 1 Tick -->
  <line x1="550" y1="105" x2="550" y2="135" class="tick"/>
  <text x="550" y="160" class="fraction-text" text-anchor="middle">1</text>
  <text x="550" y="180" class="label-muted" text-anchor="middle">(4/4)</text>

  <!-- Visual Callout: 3/4 Point -->
  <rect x="360" y="25" width="130" height="45" rx="6" class="info-box"/>
  <text x="425" y="45" class="fraction-text" font-size="12" fill="var(--interactive-accent)" text-anchor="middle">3 out of 4 steps</text>
  <text x="425" y="60" class="label-muted" font-size="11" text-anchor="middle">Distance = 3/4 units</text>
</svg>